[package]
name = "rufplan-studio"
description = "Rufplan Studio desktop app: Tauri shell and IPC commands."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "rufplan_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ts-rs = "12"
studio-core.workspace = true
studio-io.workspace = true
studio-views.workspace = true
studio-regen.workspace = true
studio-geom.workspace = true
studio-sheets.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
