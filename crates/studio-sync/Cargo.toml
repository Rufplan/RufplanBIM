[package]
name = "studio-sync"
description = "Supabase auth, publishing to Rufplan and (later) worksharing."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.21"
ureq = { version = "3", features = ["platform-verifier"] }
uuid = { version = "1.26.1", features = ["v4"] }
