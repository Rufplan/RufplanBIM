# MEPT rules (ADR-082): rules of thumb for PRELIMINARY mechanical, electrical, plumbing and
# technology systems. Preliminary — not engineered. Requires review by a licensed engineer.
#
# Edit this file (the copy in the app's data folder) to tune the scoring, layouts and sizes
# without rebuilding. Areas are square feet, lengths feet, unless a key says otherwise.

[general]
# A room edge within this of an exterior wall's face opens to the outside.
exterior_tol_in = 12.0
# Assumed ceiling heights (commercial, residential), for plenum space above them.
ceiling_ft = 9.0
ceiling_ft_residential = 8.0

# Space types, matched on room names by whole words (the first match wins). Loads:
#   sf_per_ton    cooling, 0 for unconditioned spaces
#   light_w_sf    lighting power
#   recept_va_sf  receptacle load
#   sf_per_light  one light fixture per this much floor
#   data_drops    data outlets per room, plus data_per_1000sf
#   fixtures      plumbing fixtures in each room of the type
#   use           the building use it suggests
[[space]]
kind = "Bedroom"
keywords = ["bed", "bedroom", "master", "guest", "nursery", "bunk"]
sf_per_ton = 550.0
light_w_sf = 0.6
recept_va_sf = 1.5
sf_per_light = 120.0
data_drops = 2
use = "residential"

[[space]]
