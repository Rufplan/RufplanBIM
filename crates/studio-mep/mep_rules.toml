# ---------------------------------------------------------------------------------------
# Plumbing
# ---------------------------------------------------------------------------------------
[plumbing]
# Tank water heater: gallons for the first bathroom and each more.
tank_gallons_first_bath = 40.0
tank_gallons_per_bath = 10.0
# Hot water runs longer than this want a recirculation loop.
recirc_ft = 50.0
# Wet rooms within this of each other share a stack.
stack_cluster_ft = 15.0
# [max water supply fixture units, water service size]
service_sizes = [[15.0, "3/4\""], [30.0, "1\""], [60.0, "1-1/4\""], [120.0, "1-1/2\""], [250.0, "2\""], [1000.0, "3\""], [100000.0, "4\""]]
# [max drainage fixture units, stack/drain size]
stack_sizes = [[10.0, "3\""], [48.0, "4\""], [500.0, "6\""], [100000.0, "8\""]]
drain_sizes = [[20.0, "3\""], [160.0, "4\""], [700.0, "6\""], [100000.0, "8\""]]

[plumbing.systems.tank_heater]
label = "Tank Water Heater (Gas or Electric)"
