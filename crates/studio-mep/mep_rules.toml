# ---------------------------------------------------------------------------------------
# Mechanical
# ---------------------------------------------------------------------------------------
[mechanical]
supply_cfm_per_ton = 400.0
cfm_per_diffuser = 150.0
duct_velocity_fpm = 800.0
duct_depth_in = 10.0
max_split_tons = 5.0
max_rtu_tons = 25.0
max_vrf_tons = 20.0
heads_per_condenser = 4
# Ducted systems want at least this between the ceiling and the floor above.
min_plenum_ft = 1.5

# Each system: its size range (building sf, stories), uses, climate suitability, and how it
# works: ducted, exterior (units on outside walls), rooftop (equipment on the roof),
# central (a plant room), per_room (a unit in each room).
[mechanical.systems.furnace_split]
label = "Furnace + Split AC (Ducted)"
description = "A gas furnace or air handler with an outdoor condenser, ducted to each room."
max_area_sf = 6000.0
max_stories = 3
uses = { residential = 1.0, office = 0.5, retail = 0.4, assembly = 0.3, education = 0.4, parking = 0.2 }
climate = { hot = 0.85, mixed = 1.0, cold = 1.0 }
ducted = true

[mechanical.systems.ductless_minisplit]
label = "Ductless Mini-Split Heat Pumps"
description = "Wall heads in each room on refrigerant lines to outdoor condensers; no ducts."
max_area_sf = 5000.0
max_stories = 3
uses = { residential = 0.95, office = 0.6, retail = 0.4, assembly = 0.2, education = 0.4, parking = 0.1 }
climate = { hot = 1.0, mixed = 1.0, cold = 0.75 }
exterior = true
per_room = true

[mechanical.systems.packaged_rtu]
label = "Packaged Rooftop Units (RTU)"
description = "Rooftop units ducted down to the zones below: simple, common for low-rise commercial."
min_area_sf = 3000.0
max_area_sf = 80000.0
max_stories = 3
uses = { residential = 0.3, office = 0.9, retail = 1.0, assembly = 0.9, education = 0.8, parking = 0.3 }
climate = { hot = 1.0, mixed = 1.0, cold = 0.85 }
ducted = true
rooftop = true

[mechanical.systems.vrf_doas]
label = "VRF Heat Pumps + DOAS"
description = "Variable refrigerant flow units per zone with a dedicated outdoor air system: quiet, zoned, efficient."
min_area_sf = 4000.0
max_area_sf = 250000.0
max_stories = 20
uses = { residential = 0.85, office = 1.0, retail = 0.7, assembly = 0.5, education = 0.9, parking = 0.1 }
climate = { hot = 1.0, mixed = 1.0, cold = 0.85 }
rooftop = true

[mechanical.systems.central_vav]
label = "Central Plant + VAV (Chilled Water)"
description = "Chillers and boilers in a plant room, air handlers and VAV boxes per floor: for large buildings."
min_area_sf = 50000.0
max_area_sf = 2000000.0
max_stories = 100
uses = { residential = 0.4, office = 1.0, retail = 0.8, assembly = 0.9, education = 1.0, parking = 0.1 }
climate = { hot = 1.0, mixed = 1.0, cold = 1.0 }
ducted = true
central = true

[mechanical.systems.ptac]
label = "PTAC / PTHP Through-Wall Units"
description = "A packaged unit through the outside wall of each room: hotels, dorms, apartments."
max_area_sf = 200000.0
max_stories = 30
uses = { residential = 0.8, office = 0.3, retail = 0.2, assembly = 0.1, education = 0.5, parking = 0.0 }
climate = { hot = 0.9, mixed = 0.9, cold = 0.7 }
exterior = true
per_room = true

# ---------------------------------------------------------------------------------------
# Electrical
# ---------------------------------------------------------------------------------------
[electrical]
# Demand factor on the connected load; HVAC load per sf; each dwelling's appliances (VA).
demand_factor = 0.7
hvac_va_sf = 3.0
dwelling_appliances_va = 12000.0
service_sizes = [100.0, 150.0, 200.0, 225.0, 400.0, 600.0, 800.0, 1200.0, 1600.0, 2000.0, 3000.0, 4000.0]
# Receptacles along the walls of dwellings (and commercial) rooms, one per this length.
receptacle_spacing_ft = 12.0
commercial_receptacle_spacing_ft = 10.0
# Longer feeders are flagged for voltage drop.
max_feeder_ft = 150.0

[electrical.systems.res_single_phase]
label = "120/240 V Single-Phase Service"
description = "A utility meter and main panel, the usual service for a house or small building."
