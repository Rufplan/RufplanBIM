# Suggest Structure rules (ADR-080). Rules of thumb for a PRELIMINARY scheme only.
# Preliminary — not engineered. Requires review by a licensed structural engineer.
#
# Edit this file (the copy in the app's data folder) to tune the scoring, layout and
# sizing without rebuilding. Lengths are feet unless a key says inches (_in).

[general]
# Rooms that want long, column-free spans.
open_zone_keywords = ["assembly", "gym", "gymnasium", "auditorium", "theater", "theatre",
  "parking", "garage", "retail", "sanctuary", "ballroom", "multipurpose", "multi-purpose",
  "warehouse", "arena", "pool", "natatorium", "cafeteria", "showroom", "worship"]
# Of those, rooms that must be column-free (retail and parking take columns on a grid).
column_free_keywords = ["assembly", "gym", "gymnasium", "auditorium", "theater", "theatre",
  "sanctuary", "ballroom", "multipurpose", "multi-purpose", "arena", "pool", "natatorium",
  "worship"]
# Any room at least this big (sf) counts as an open zone too.
open_zone_min_area_sf = 1500.0
# Rooms that make a core.
stair_keywords = ["stair"]
elevator_keywords = ["elev", "elevator", "lift"]
shaft_keywords = ["shaft", "chase", "mech shaft", "trash"]
# A wall stacks when walls on the level below lie within this distance of its line and
# cover this share of its length.
stack_tolerance_in = 6.0
stack_overlap = 0.8
# A level with less than this share of the wall length of the level above may be soft.
soft_story_ratio = 0.7
# A level whose footprint is less than this share of the one below is set back.
setback_ratio = 0.85
# A level reaching past the one below by more than this cantilevers.
cantilever_ft = 2.0
# Re-entrant corners count when both legs exceed this share of the plan dimension.
reentrant_share = 0.15
# A column falling in a room moves onto a wall within this distance, when there is one.
column_snap_ft = 2.0
# Lateral elements: centre of rigidity further than this share of the plan dimension from
# the centre of mass is flagged.
torsion_share = 0.15

[occupancy]
residential = ["bed", "bath", "kitchen", "living", "unit", "apt", "apartment", "dwelling",
  "closet", "laundry", "family", "dining", "den"]
office = ["office", "conference", "meeting", "workstation", "open office", "work"]
retail = ["retail", "shop", "store", "sales", "showroom", "market"]
parking = ["parking", "garage", "car"]
assembly = ["assembly", "gym", "auditorium", "theater", "theatre", "sanctuary", "worship",
  "ballroom", "multipurpose", "multi-purpose", "arena", "event"]
education = ["classroom", "class", "lab", "library", "school"]

# Foundations (ADR-083). Assumed until a geotechnical report gives the real values.
[foundation]
# Allowable soil bearing, psf (1,500 is the IBC presumptive value for the weakest class).
soil_psf = 1500.0
# Frost depth: exterior footings bear at least this deep.
frost_depth_in = 30.0
# Floor and roof loads carried down (dead + live), psf: light frame and heavy (steel,
# concrete, mass timber).
floor_psf_light = 55.0
floor_psf_heavy = 150.0
roof_psf_light = 35.0
roof_psf_heavy = 90.0
# Wall self-weight per sf of wall.
wall_psf = 12.0
# Spread footings: the smallest and largest side, ft, and the least depth, in.
spread_min_ft = 2.0
spread_max_ft = 12.0
spread_depth_in = 12.0
# Strip footings: the least width (light frame, heavy) and depth, in.
strip_min_width_in = 16.0
strip_min_width_heavy_in = 24.0
strip_depth_in = 10.0
# When footings would cover more than this share of the footprint, a mat instead.
mat_share = 0.5
mat_depth_in = 24.0
# Deep foundations (piles or drilled piers) from this many stories, or when a spread
# footing would pass its largest side; the capacity of one pile, kips.
deep_stories = 12
pile_kips = 80.0
# A level this far below grade (elevation 0) has foundation walls around it.
basement_ft = 3.0
foundation_wall_in = 10.0

# Scoring weights (they need not add to 1).
[weights]
height = 3.0
span = 2.5
stacking = 2.0
occupancy = 2.0
discontinuities = 1.5
seismic = 1.0

# One table per scheme. uses: how well it suits each use (0-1). seismic: suitability by
# region. lateral_ratio: lateral element length each way as a share of the building's
# length that way, by seismic region.
[schemes.light_wood]
max_stories = 5
# Below this many stories the system is usually uneconomical (scored down, not ruled out).
economical_min_stories = 1
max_height_ft = 70.0
span_min_ft = 10.0
span_max_ft = 24.0
grid_ft = 16.0
bearing_walls = true
lateral = "WoodShearWalls"
material = "wood"
uses = { residential = 1.0, office = 0.5, retail = 0.3, parking = 0.0, assembly = 0.3, education = 0.6 }
seismic = { low = 1.0, moderate = 1.0, high = 0.9 }
lateral_ratio = { low = 0.25, moderate = 0.35, high = 0.5 }
# Shear walls need a height:length of at most this.
shear_aspect = 3.5

