  ">RCSC's \"Specification for Structural Joints Using High-Strength Bolts.\"",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Store materials to permit easy access for inspection and identification. Keep steel members off ground and spaced by using pallets, dunnage, or other supports and spacers. Protect steel members and packaged materials from corrosion and deterioration.",
  "Store fasteners in a protected place in sealed containers with manufacturer's labels intact. Clean and relubricate bolts and nuts that become dry or rusty before use.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Connections: Provide details of simple shear connections required by the Contract Documents to be selected or completed by structural-steel fabricator to withstand loads indicated and comply with other information and restrictions indicated.",
  ">Select and complete connections using schematic details indicated and AISC 360.",
  ">Use LRFD; data are given at factored-load level.",
  "Moment Connections: Type FR, fully restrained, where indicated.",
]

[[section.part2]]
title = "STRUCTURAL-STEEL MATERIALS"
items = [
  "W-Shapes: ASTM A992.",
  "Channels, Angles, M-Shapes, and S-Shapes: ASTM A36.",
  "Plate and Bar: ASTM A36.",
  "Cold-Formed Hollow Structural Sections: ASTM A500, Grade C, structural tubing.",
  "Steel Pipe: ASTM A53, Type E or Type S, Grade B.",
  "Welding Electrodes: Comply with AWS requirements, E70XX, with filler metal meeting Charpy V-notch toughness where required by AISC 341.",
