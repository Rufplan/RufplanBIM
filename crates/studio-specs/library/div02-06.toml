  ">Surfaces to receive sprayed fire-resistive materials (applied fireproofing).",
  ">Galvanized surfaces.",
  "Surface Preparation: Clean surfaces to be painted. Remove loose rust and mill scale and spatter, slag, or flux deposits. Prepare surfaces according to SSPC-SP 2 \"Hand Tool Cleaning,\" and SSPC-SP 6 \"Commercial Blast Cleaning\" for exposed steel.",
  "Priming: Immediately after surface preparation, apply primer according to manufacturer's written instructions and at rate recommended by SSPC to provide a minimum dry film thickness of 1.5 mils.",
]

[[section.part2]]
title = "SOURCE QUALITY CONTROL"
items = [
  "Testing Agency: The Owner will engage an independent testing and inspecting agency to perform shop tests and inspections and prepare test reports.",
