  "Minimum Thicknesses: Cabinet sides and bottoms, 3/4 inch; shelves, 3/4 inch up to 36 inches long and 1 inch for longer spans; backs, 1/4 inch with 3/4-inch hanging rails; drawer sides, 1/2 inch solid hardwood with dovetail joinery at Premium grade.",
