  "Testing Agency: The Owner will engage a qualified testing agency to perform tests and inspections.",
  "Bolted Connections: Bolted connections will be tested and inspected according to RCSC's \"Specification for Structural Joints Using High-Strength Bolts.\"",
  "Welded Connections: Field welds will be visually inspected according to AWS D1.1. In addition, complete-joint-penetration welds will be tested by ultrasonic inspection according to ASTM E164.",
  "Shear Stud Connectors: Shear connectors will be tested according to requirements in AWS D1.1, including bend tests.",
  "Correct deficiencies in Work that test reports and inspections indicate does not comply with the Contract Documents.",
