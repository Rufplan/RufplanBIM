  "Moisture-Retaining Cover: ASTM C171, polyethylene film or white burlap-polyethylene sheet.",
  "Curing Compound: ASTM C309, Type 1, Class B, dissipating, where floor finishes, coatings, or adhesives will be applied; verify compatibility with finish manufacturers.",
  "Curing and Sealing Compound: ASTM C1315, Type 1, Class A, where slabs remain exposed.",
  "Water: Potable.",
]

[[section.part2]]
title = "RELATED MATERIALS"
items = [
  "Expansion- and Isolation-Joint-Filler Strips: ASTM D1751, asphalt-saturated cellulosic fiber, or ASTM D1752, cork or self-expanding cork; 1/2 inch thick.",
  "Bonding Agent: ASTM C1059, Type II, non-redispersible, acrylic emulsion or styrene butadiene.",
  "Epoxy Bonding Adhesive: ASTM C881, two-component epoxy resin, capable of humid curing and bonding to damp surfaces, of class suitable for application temperature and of grade to suit requirements.",
  "Nonshrink Grout: ASTM C1107, factory-packaged, nonmetallic aggregate grout, noncorrosive and nonstaining, mixed with water to consistency suitable for application; minimum 5000 psi at 28 days.",
  "Waterstops: Flexible PVC or bentonite-type waterstops at construction joints in foundation walls enclosing below-grade occupied spaces.",
  "Dovetail Anchor Slots: Hot-dip galvanized steel sheet, 0.034 inch thick, with filler strips, where masonry veneer anchors to concrete.",
]

[[section.part2]]
title = "CONCRETE MIXTURES"
items = [
  "Prepare design mixtures for each type and strength of concrete, proportioned on the basis of laboratory trial mixture or field test data, or both, according to ACI 301.",
  ">Use a qualified testing agency for preparing and reporting proposed mixture designs based on laboratory trial mixtures.",
  "Cementitious Materials: Limit percentage by weight of cementitious materials other than portland cement in concrete as follows:",
  ">Fly Ash: 25 percent.",
  ">Slag Cement: 50 percent.",
  ">Combined Fly Ash and Slag Cement: 50 percent, portland cement minimum 50 percent.",
  "Footings and Foundation Walls: Normal-weight concrete.",
  ">Minimum Compressive Strength: 3000 psi at 28 days, or as indicated on structural Drawings.",
  ">Maximum W/C Ratio: 0.50.",
  ">Slump Limit: 4 inches, plus or minus 1 inch; 8 inches for concrete with verified slump of 2 to 4 inches before adding high-range water-reducing admixture.",
  ">Air Content: 6 percent, plus or minus 1.5 percent at point of delivery for 1-inch nominal maximum aggregate size, where exposed to freezing and thawing.",
  "Interior Slabs-on-Grade: Normal-weight concrete.",
  ">Minimum Compressive Strength: 4000 psi at 28 days.",
  ">Maximum W/C Ratio: 0.45.",
  ">Slump Limit: 5 inches, plus or minus 1 inch.",
  ">Air Content: Do not allow air content of trowel-finished floors to exceed 3 percent.",
  "Exterior Slabs, Stoops, and Steps: Normal-weight concrete.",
  ">Minimum Compressive Strength: 4500 psi at 28 days.",
  ">Maximum W/C Ratio: 0.45.",
  ">Air Content: 6 percent, plus or minus 1.5 percent at point of delivery.",
  "Ready-Mixed Concrete: Measure, batch, mix, and deliver concrete according to ASTM C94, and furnish batch ticket information. When air temperature is above 90 deg F, reduce mixing and delivery time from 1-1/2 hours to 75 minutes.",
]

[[section.part2]]
title = "FABRICATING REINFORCEMENT"
items = [
  "Fabricate steel reinforcement according to CRSI's \"Manual of Standard Practice\" and ACI SP-66 \"ACI Detailing Manual.\"",
]

[[section.part3]]
title = "FORMWORK INSTALLATION"
items = [
  "Design, erect, shore, brace, and maintain formwork, according to ACI 301, to support vertical, lateral, static, and dynamic loads, and construction loads that might be applied, until structure can support such loads.",
  "Construct formwork so concrete members and structures are of size, shape, alignment, elevation, and position indicated, within tolerance limits of ACI 117.",
  "Limit concrete surface irregularities, designated by ACI 347 as abrupt or gradual, as follows: Class A, 1/8 inch for smooth-formed finished surfaces; Class C, 1/2 inch for rough-formed finished surfaces.",
  "Earth-formed footings may be used where soil is stable and approved by the Architect; overpour footing dimensions by 2 inches on each side.",
  "Chamfer exterior corners and edges of permanently exposed concrete.",
  "Form openings, chases, offsets, sinkages, keyways, reglets, blocking, screeds, and bulkheads required in the Work. Determine sizes and locations from trades providing such items.",
  "Clean forms and adjacent surfaces to receive concrete. Remove chips, wood, sawdust, dirt, and other debris just before placing concrete.",
]

[[section.part3]]
title = "EMBEDDED ITEM INSTALLATION"
items = [
  "Place and secure anchorage devices and other embedded items required for adjoining work that is attached to or supported by cast-in-place concrete. Use setting drawings, templates, diagrams, instructions, and directions furnished with items to be embedded.",
  ">Install anchor rods, accurately located, to elevations required and complying with tolerances in Section 7.5 of AISC 303.",
  ">Install sill plate anchor bolts at spacing indicated and not more than 6 feet on center, within 12 inches of plate ends, per {building_code}.",
  ">Install reglets to receive waterproofing and to receive through-wall flashings in outer face of concrete frame at exterior walls, where flashing is shown at lintels, shelf angles, and other conditions.",
]

[[section.part3]]
title = "REMOVING AND REUSING FORMS"
items = [
  "General: Formwork for sides of beams, walls, columns, and similar parts of the Work that does not support weight of concrete may be removed after cumulatively curing at not less than 50 deg F for 24 hours after placing concrete, if concrete is hard enough to not be damaged by form-removal operations and curing and protection operations are maintained.",
  "Leave formwork for beam soffits, joists, slabs, and other structural elements that supports weight of concrete in place until concrete has achieved at least 70 percent of its 28-day design compressive strength.",
  "Clean and repair surfaces of forms to be reused in the Work. Split, frayed, delaminated, or otherwise damaged form-facing material will not be acceptable for exposed surfaces.",
]

[[section.part3]]
title = "VAPOR RETARDER INSTALLATION"
items = [
  "Sheet Vapor Retarders: Place, protect, and repair sheet vapor retarder according to ASTM E1643 and manufacturer's written instructions.",
  ">Lap joints 6 inches and seal with manufacturer's recommended tape.",
  ">Extend vapor retarder up foundation walls and grade beams to the top of the slab and seal to walls.",
  ">Seal penetrations with manufacturer's pipe boots or tape. Repair punctures and tears before placing concrete.",
  "Place vapor retarder directly beneath the slab over compacted granular base, unless otherwise indicated. Do not place a sand layer over the vapor retarder.",
  "Granular Base: Place and compact to minimum 4 inches thick over prepared subgrade, to 95 percent of maximum dry density per ASTM D1557.",
]

[[section.part3]]
title = "STEEL REINFORCEMENT INSTALLATION"
items = [
  "General: Comply with CRSI's \"Manual of Standard Practice\" for placing reinforcement.",
  "Clean reinforcement of loose rust and mill scale, earth, ice, and other foreign materials that would reduce bond to concrete.",
  "Accurately position, support, and secure reinforcement against displacement. Locate and support reinforcement with bar supports to maintain minimum concrete cover as required by ACI 318. Do not tack weld crossing reinforcing bars.",
  "Minimum Concrete Cover, unless otherwise indicated:",
  ">Concrete Cast Against and Permanently Exposed to Earth: 3 inches.",
  ">Concrete Exposed to Earth or Weather, No. 6 Bars and Larger: 2 inches.",
  ">Concrete Exposed to Earth or Weather, No. 5 Bars and Smaller: 1-1/2 inches.",
  ">Slabs-on-Grade: Reinforcement at mid-depth or as indicated, supported on chairs; do not place on grade and pull up.",
  "Splices: Lap splices as indicated; where not indicated, provide Class B tension lap splices per ACI 318.",
  "Install welded-wire reinforcement in longest practicable lengths on bar supports spaced to minimize sagging. Lap edges and ends of adjoining sheets at least one mesh spacing plus 2 inches. Offset laps of adjoining sheet widths to prevent continuous laps in either direction.",
  "Epoxy-Coated Reinforcement: Repair cut and damaged epoxy coatings with epoxy repair coating according to ASTM D3963.",
]

[[section.part3]]
title = "JOINTS"
items = [
  "General: Construct joints true to line, with faces perpendicular to surface plane of concrete.",
  "Construction Joints: Coordinate with floor slab pattern and concrete placement sequence. Install so strength and appearance of concrete are not impaired, at locations indicated or as approved by the Architect.",
  ">Place joints perpendicular to main reinforcement. Continue reinforcement across construction joints unless otherwise indicated.",
  ">Form keyed joints as indicated. Embed keys at least 1-1/2 inches into concrete.",
  ">Locate joints for beams, slabs, joists, and girders in the middle third of spans.",
  ">Locate horizontal joints in walls and columns at underside of floors, slabs, beams, and girders and at the top of footings or floor slabs.",
  "Contraction Joints in Slabs-on-Grade: Form weakened-plane contraction joints, sectioning concrete into areas as indicated. Construct contraction joints for a depth equal to at least one-fourth of concrete thickness.",
  ">Sawed Joints: Form contraction joints with early-entry saw or conventional saw as soon as the surface will not tear, abrade, or otherwise be damaged by saw blades, and within 12 hours of placement.",
  ">Unless otherwise indicated, space joints at not more than 24 times the slab thickness nor more than 15 feet in each direction, with panels as nearly square as practicable.",
  "Isolation Joints in Slabs-on-Grade: After removing formwork, install joint-filler strips at slab junctions with vertical surfaces, such as column pedestals, foundation walls, grade beams, and other locations, as indicated.",
  "Doweled Joints: Install dowel bars and support assemblies at joints where indicated. Lubricate or asphalt coat one-half of dowel length to prevent concrete bonding to one side of joint.",
]

[[section.part3]]
title = "CONCRETE PLACEMENT"
items = [
  "Before placing concrete, verify that installation of formwork, reinforcement, embedded items, and vapor retarder is complete and that required inspections have been performed.",
  "Do not add water to concrete during delivery, at Project site, or during placement unless approved by the Architect and within the amount withheld on the batch ticket.",
  "Deposit concrete continuously in one layer or in horizontal layers of such thickness that no new concrete is placed on concrete that has hardened enough to cause seams or planes of weakness. If a section cannot be placed continuously, provide construction joints as indicated.",
  ">Deposit concrete in horizontal layers of depth not to exceed formwork design pressures and in a manner to avoid inclined construction joints.",
  ">Do not allow concrete to free-fall more than 5 feet without chutes or tremies.",
  ">Consolidate placed concrete with mechanical vibrating equipment according to ACI 301. Do not use vibrators to transport concrete inside forms.",
  "Deposit and consolidate concrete for floors and slabs in a continuous operation, within limits of construction joints, until placement of a panel or section is complete.",
  ">Maintain reinforcement in position on chairs during concrete placement.",
  ">Screed slab surfaces with a straightedge and strike off to correct elevations.",
  ">Slope surfaces uniformly to drains where required.",
  ">Begin initial floating using bull floats or darbies to form a uniform and open-textured surface plane, before excess bleedwater appears on the surface. Do not further disturb slab surfaces before starting finishing operations.",
]

[[section.part3]]
title = "FINISHING FORMED SURFACES"
items = [
  "Rough-Formed Finish: As-cast concrete texture imparted by form-facing material with tie holes and defects repaired and patched. Remove fins and other projections that exceed 1/4 inch. Apply to concrete surfaces not exposed to public view.",
  "Smooth-Formed Finish: As-cast concrete texture imparted by form-facing material, arranged in an orderly and symmetrical manner with a minimum of seams. Repair and patch tie holes and defects. Remove fins and other projections that exceed 1/8 inch. Apply to concrete surfaces exposed to public view or to be covered with a coating or covering material applied directly to concrete.",
  "Related Unformed Surfaces: At tops of walls, horizontal offsets, and similar unformed surfaces adjacent to formed surfaces, strike off smooth and finish with a texture matching adjacent formed surfaces.",
]

[[section.part3]]
title = "FINISHING FLOORS AND SLABS"
items = [
  "General: Comply with ACI 302.1R recommendations for screeding, restraightening, and finishing operations for concrete surfaces. Do not wet concrete surfaces.",
  "Scratch Finish: While still plastic, texture concrete surface that has been screeded and bull-floated or darbied. Use stiff brushes, brooms, or rakes to produce a profile amplitude of 1/4 inch in one direction. Apply to surfaces to receive concrete floor toppings or mortar setting beds for ceramic or stone tile.",
  "Float Finish: Consolidate surface with power-driven floats or by hand floating if area is small or inaccessible to power-driven floats. Apply to surfaces to receive trowel finish and to be covered with fluid-applied or sheet waterproofing, built-up or membrane roofing, or sand-bed terrazzo.",
  "Trowel Finish: After applying float finish, apply first troweling and consolidate concrete by hand or power-driven trowel. Continue troweling passes and restraighten until surface is free of trowel marks and uniform in texture and appearance. Apply to surfaces exposed to view or to be covered with resilient flooring, carpet, ceramic or quarry tile set over a cleavage membrane, paint, or another thin-film-finish coating system.",
  ">Finish and measure surface so gap at any point between concrete surface and an unleveled, freestanding, 10-foot-long straightedge resting on two high spots and placed anywhere on the surface does not exceed 1/4 inch.",
  ">Finish surfaces to the following tolerances, according to ASTM E1155, for a randomly trafficked floor surface: specified overall values of flatness, F(F) 35; and of levelness, F(L) 25; with minimum local values of flatness, F(F) 24; and of levelness, F(L) 17.",
  ">For slabs to receive polished concrete finishing, finish to specified overall values of flatness, F(F) 50; and of levelness, F(L) 35.",
  "Trowel and Fine-Broom Finish: Apply a first trowel finish to surfaces where ceramic or quarry tile is to be installed by either thickset or thin-set method. While concrete is still plastic, slightly scarify surface with a fine broom.",
  "Broom Finish: Apply a broom finish to exterior concrete platforms, steps, ramps, and elsewhere as indicated. Immediately after float finishing, slightly roughen trafficked surface by brooming with fiber-bristle broom perpendicular to main traffic route.",
]

[[section.part3]]
title = "CONCRETE PROTECTING AND CURING"
items = [
  "General: Protect freshly placed concrete from premature drying and excessive cold or hot temperatures. Comply with ACI 306.1 for cold-weather protection and ACI 305.1 for hot-weather protection during curing.",
  "Evaporation Retarder: Apply evaporation retarder to unformed concrete surfaces if hot, dry, or windy conditions cause moisture loss approaching 0.2 lb/sq. ft. x h before and during finishing operations.",
  "Formed Surfaces: Cure formed concrete surfaces, including underside of beams, supported slabs, and other similar surfaces. If forms remain during curing period, moist cure after loosening forms.",
  "Unformed Surfaces: Begin curing immediately after finishing concrete. Cure unformed surfaces, including floors and slabs, concrete floor toppings, and other surfaces, for not less than seven days, by one or a combination of the following methods:",
  ">Moisture Curing: Keep surfaces continuously moist with water, continuous water-fog spray, or absorptive cover kept continuously wet.",
  ">Moisture-Retaining-Cover Curing: Cover concrete surfaces with moisture-retaining cover, placed in widest practicable width, with sides and ends lapped at least 12 inches, and sealed by waterproof tape or adhesive. Use this method for slabs to receive floor coverings and polished finishes.",
  ">Curing Compound: Apply uniformly in continuous operation by power spray or roller according to manufacturer's written instructions. Recoat areas subjected to heavy rainfall within three hours after initial application.",
]

[[section.part3]]
title = "CONCRETE SURFACE REPAIRS"
items = [
  "Defective Concrete: Repair and patch defective areas when approved by the Architect. Remove and replace concrete that cannot be repaired and patched to the Architect's approval.",
  "Patching Mortar: Mix dry-pack patching mortar, consisting of one part portland cement to two and one-half parts fine aggregate passing a No. 16 sieve, using only enough water for handling and placing.",
  "Repairing Unformed Surfaces: Test unformed surfaces, such as floors and slabs, for finish and verify surface tolerances specified for each surface. Correct low and high areas. Repair cracks wider than 0.01 inch with epoxy injection or as approved.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Special Inspections: The Owner will engage a special inspector to perform field tests and inspections and prepare test reports as required by {building_code} Chapter 17.",
  "Testing Agency: The Owner will engage a qualified testing agency to perform tests and inspections and to submit reports.",
  "Inspections:",
  ">Steel reinforcement placement.",
  ">Headed bolts and studs, and anchor rods.",
  ">Verification of use of required design mixture.",
  ">Concrete placement, including conveying and depositing.",
  ">Curing procedures and maintenance of curing temperature.",
  "Concrete Tests: Testing of composite samples of fresh concrete obtained according to ASTM C172 shall be performed according to the following requirements:",
  ">Testing Frequency: Obtain one composite sample for each day's pour of each concrete mixture exceeding 5 cu. yd., but less than 25 cu. yd., plus one set for each additional 50 cu. yd. or fraction thereof.",
  ">Slump: ASTM C143; one test at point of placement for each composite sample, but not less than one test for each day's pour of each concrete mixture.",
  ">Air Content: ASTM C231, pressure method, for normal-weight concrete; one test for each composite sample.",
  ">Concrete Temperature: ASTM C1064; one test hourly when air temperature is 40 deg F and below or 80 deg F and above, and one test for each composite sample.",
  ">Compression Test Specimens: ASTM C31; cast and laboratory cure one set of four standard cylinder specimens for each composite sample.",
  ">Compressive-Strength Tests: ASTM C39; test one specimen at 7 days and two specimens at 28 days; retain one specimen in reserve.",
  "Strength of each concrete mixture will be satisfactory if every average of any three consecutive compressive-strength tests equals or exceeds specified compressive strength and no compressive-strength test value falls below specified compressive strength by more than 500 psi.",
  "Measure floor and slab flatness and levelness according to ASTM E1155 within 24 hours of finishing.",
  "Additional Tests: The testing agency shall make additional tests of concrete when test results indicate that slump, air entrainment, compressive strengths, or other requirements have not been met. Correct deficiencies at the Contractor's expense.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Protect concrete surfaces as follows:",
  ">Protect from petroleum stains.",
  ">Diaper hydraulic equipment used over concrete surfaces.",
  ">Prohibit vehicles from interior concrete slabs.",
  ">Prohibit use of pipe-cutting machinery over concrete surfaces.",
  ">Prohibit placement of steel items on concrete surfaces.",
  ">Prohibit use of acids or acidic detergents over concrete surfaces.",
]

[[section]]
number = "03 35 43"
title = "POLISHED CONCRETE FINISHING"
when = ["optional"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Mechanically ground and polished concrete floor finishes on new cast-in-place slabs.",
  ">Penetrating densifier, dye or stain where indicated, and guard or protective treatment.",
  "Related Requirements:",
  ">Section 03 30 00 \"Cast-in-Place Concrete\" for slab placement, flatness tolerances, and curing.",
  ">Section 07 92 00 \"Joint Sealants\" for joint fillers in polished slabs.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Aggregate Exposure Class: As defined by the Concrete Polishing Council of the ASCC: Class A, cream (little or no aggregate exposure); Class B, salt and pepper (fine aggregate exposure); Class C, medium aggregate exposure; Class D, large aggregate exposure.",
  "Gloss Level: As defined by the Concrete Polishing Council: Level 1, ground (flat); Level 2, honed (satin); Level 3, semi-polished; Level 4, highly polished.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including densifier, dyes, grout or slurry fill, and guard.",
  "Samples: For each finish, 24 by 24 inches, prepared on a concrete substrate matching Project mix design, showing aggregate exposure class, color, and gloss level.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For Installer.",
  "Field quality-control reports, including gloss and slip-resistance readings.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Maintenance Data: For polished concrete finishes to include in maintenance manuals, including recommended cleaning products, burnishing frequency, and restoration procedures.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: An experienced installer who has completed polished concrete floors similar in material, design, and extent to those indicated for this Project, and who employs a craftsman certified by the Concrete Polishing Council of the ASCC or trained by the densifier manufacturer.",
  "Mockups: Prepare a mockup of 100 sq. ft. on the Project slab, in a location selected by the Architect, to demonstrate aggregate exposure, color, and gloss level. Approved mockup may become part of the completed Work.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Do not begin polishing until slab has cured a minimum of 28 days, building is enclosed, and permanent or temporary heat is maintained at 50 deg F minimum.",
  "Protect adjacent surfaces and construction from dust and slurry. Use wet-grinding methods or dry grinding with HEPA-filtered dust extraction.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Slip Resistance: Wet dynamic coefficient of friction not less than 0.42 when tested according to ANSI A326.3 for level interior spaces expected to be walked upon when wet.",
]

[[section.part2]]
title = "POLISHING SYSTEM"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Ameripolish, Inc.",
  ">Prosoco, Inc.",
  ">L&M Construction Chemicals, Inc.",
  ">Euclid Chemical Company (The); an RPM company.",
  "Penetrating Densifier: Lithium silicate or colloidal silica, water based, VOC content not more than 50 g/L.",
  "Dye: Solvent- or water-based penetrating dye, UV stable, in color selected by the Architect from manufacturer's full range, where indicated.",
  "Grout or Slurry Fill: Manufacturer's recommended cementitious or resin fill for surface pinholes and voids.",
  "Guard: Manufacturer's recommended penetrating stain-resistant treatment compatible with densifier.",
  "Joint Filler: Semirigid, two-component, 100 percent solids epoxy or polyurea, Shore A 80 or greater, color matched to polished floor.",
]

[[section.part2]]
title = "FINISH"
items = [
  "Aggregate Exposure: [Class A, cream] [Class B, salt and pepper] [Class C, medium aggregate].",
  "Gloss Level: [Level 2, honed] [Level 3, semi-polished], with reflectivity measured according to ASTM D523 at a 60-degree angle.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine slabs, with Installer present, for curing, flatness, cracks, and surface defects. Verify that curing compounds and sealers that would inhibit densifier penetration were not used.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "POLISHING"
items = [
  "Grind slab with progressively finer metal-bonded diamond tooling to achieve the specified aggregate exposure, removing trowel marks and surface laitance.",
  "Fill surface pinholes and voids with grout fill during grinding.",
  "Apply densifier at rate recommended by manufacturer after the initial grinding step, allow to cure, and remove excess before proceeding.",
  "Hone and polish with progressively finer resin-bonded diamond tooling to achieve specified gloss level. Do not skip more than one grit step.",
  "Apply dye, where indicated, after honing; apply guard after final polish, and burnish with high-speed burnisher.",
  "Clean and fill contraction joints with joint filler not less than 60 days after slab placement; shave flush after cure.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Measure gloss at not less than three locations per 1000 sq. ft. and verify compliance with approved mockup.",
  "Measure wet dynamic coefficient of friction at representative locations according to ANSI A326.3.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Protect finished floors from traffic, staining, and construction activities with breathable protective covering until Substantial Completion. Do not use tape directly on the polished surface.",
  "Clean floors with pH-neutral cleaner before Substantial Completion.",
]

