  ">Structural steel framing, including beams, girders, columns, and bracing.",
  ">Base plates, bearing plates, and leveling plates.",
  ">Shear stud connectors.",
  ">Anchor rods and grout.",
  "Related Requirements:",
  ">Section 03 30 00 \"Cast-in-Place Concrete\" for setting anchor rods.",
  ">Section 05 31 00 \"Steel Decking\" for field installation of shear stud connectors through deck.",
  ">Section 05 50 00 \"Metal Fabrications\" for miscellaneous steel items not defined as structural steel.",
  ">Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting\" for finish painting of exposed structural steel.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Structural Steel: Elements of the structural frame indicated on Drawings and as described in AISC 303 \"Code of Standard Practice for Steel Buildings and Bridges.\"",
  "Seismic-Load-Resisting System: Elements of structural-steel frame designated as \"SLRS\" or along grid lines designated as \"SLRS\" on Drawings, including columns, beams, and braces and their connections.",
