  ">Screw, bolt, or weld wall panels at horizontal and vertical junctures to produce flush, even, true-to-line joints with no variation in plane and true position between adjacent wall panels.",
  "Install cold-formed steel framing and accessories plumb, square, and true to line, and with connections securely fastened.",
  ">Fasten cold-formed steel framing members by welding, screw fastening, clinch fastening, or riveting. Wire tying of framing members is not permitted.",
  ">Comply with AWS D1.3 requirements and procedures for welding, appearance and quality of welds, and methods used in correcting welding work.",
  ">Locate mechanical fasteners and install according to Shop Drawings, with screw penetrating joined members by no fewer than three exposed screw threads.",
  "Install framing members in one-piece lengths unless splice connections are indicated for track or tension members.",
  "Install temporary bracing and supports to secure framing and support loads comparable in intensity to those for which structure was designed. Maintain braces and supports in place, undisturbed, until entire integrated supporting structure has been completed and permanent connections to framing are secured.",
  "Do not bridge building expansion joints with cold-formed steel framing. Independently frame both sides of joints.",
  "Install insulation, specified in Section 07 21 00 \"Thermal Insulation,\" in built-up exterior framing members, such as headers, sills, boxed joists, and multiple studs at openings, that are inaccessible on completion of framing work.",
  "Fasten hole reinforcing plate over web penetrations that exceed size of manufacturer's approved or standard punched openings.",
  "Erection Tolerances: Install cold-formed steel framing level, plumb, and true to line to a maximum allowable tolerance variation of 1/8 inch in 10 feet and as follows: spacing, space individual framing members no more than plus or minus 1/8 inch from plan location; cumulative error shall not exceed minimum fastening requirements of sheathing or other finishing materials.",
]

[[section.part3]]
title = "LOAD-BEARING WALL INSTALLATION"
items = [
  "Install continuous top and bottom tracks sized to match studs. Align tracks accurately and securely anchor at corners and ends, and at spacings as follows: anchor spacing, 24 inches o.c. unless otherwise indicated.",
  "Squarely seat studs against top and bottom tracks with gap not exceeding 1/16 inch between the end of wall framing member and the web of track. Fasten both flanges of studs to top and bottom tracks.",
  ">Stud Spacing: 16 inches o.c., unless otherwise indicated.",
  "Set studs plumb, except as needed for diagonal bracing or required for nonplumb walls or warped surfaces and similar requirements.",
  "Align studs vertically where floor framing interrupts wall-framing continuity. Where studs cannot be aligned, install continuous load-distribution tracks between wall and floor framing.",
  "Align floor and roof framing over studs according to AISI S240. Where framing cannot be aligned, continuously reinforce track to transfer loads.",
  "Anchor studs abutting structural columns or walls, including masonry walls, to supporting structure.",
  "Install headers over wall openings wider than stud spacing. Locate headers above openings. Fabricate headers of compound shapes indicated or required to transfer load to supporting studs, complete with clip-angle connectors, web stiffeners, or gusset plates.",
  ">Install jack and king studs at jambs of openings; frame sills and install cripple studs.",
  "Install horizontal bridging in stud system, spaced vertically not more than 48 inches. Fasten at each stud intersection with combination of flat, taut, steel sheet straps of width and thickness indicated and stud-track solid blocking of width and thickness to match studs.",
  "Install steel sheet diagonal bracing straps to both stud flanges, terminate at and fasten to reinforced top and bottom tracks. Fasten clip-angle connectors to multiple studs at ends of bracing and anchor to structure.",
  "Install miscellaneous framing and connections, including supplementary framing, web stiffeners, clip angles, continuous angles, anchors, and fasteners, to provide a complete and stable wall-framing system.",
]

[[section.part3]]
title = "EXTERIOR NON-LOAD-BEARING WALL INSTALLATION"
items = [
  "Install continuous tracks sized to match studs. Align tracks accurately and securely anchor to supporting structure as indicated.",
  "Fasten studs to top and bottom tracks; space studs 16 inches o.c. unless otherwise indicated.",
  "Install deflection clips or double deflection track at head of wall where framing abuts overhead structure, to allow vertical movement of structure without imposing load on studs.",
  "Install horizontal bridging in wall studs, spaced in rows indicated on Shop Drawings but not more than 48 inches apart.",
  "Frame openings with headers, jambs, and sills as indicated, with jamb studs fastened to headers and sills and to top and bottom tracks.",
]

[[section.part3]]
title = "JOIST AND RAFTER INSTALLATION"
items = [
  "Install perimeter joist track sized to match joists. Align and securely anchor or fasten track to supporting structure at corners, ends, and spacings indicated on Shop Drawings.",
  "Install joists bearing on supporting frame, level, straight, and plumb; adjust to final position, brace, and reinforce. Fasten joists to both flanges of joist track.",
  ">Install joists over supporting frame with a minimum end bearing of 1-1/2 inches.",
  ">Reinforce ends and bearing points of joists with web stiffeners, end clips, joist hangers, steel clip angles, or steel-stud sections as indicated on Shop Drawings.",
  "Space joists and rafters not more than 2 inches from abutting walls, and 16 inches o.c. unless otherwise indicated.",
  "Frame openings with built-up joist headers consisting of joist and joist track, or another combination of connected joists if indicated.",
  "Install joist and rafter bridging at intervals indicated on Shop Drawings. Fasten bridging at each joist intersection.",
  "Secure joists to interior support systems to prevent lateral movement of bottom flange.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Testing: The Owner will engage a qualified independent testing and inspecting agency to perform field tests and inspections and prepare test reports.",
  "Field and shop welds will be subject to testing and inspecting.",
  "Remove and replace work where test results indicate that it does not comply with specified requirements.",
]

[[section.part3]]
title = "REPAIRS AND PROTECTION"
items = [
  "Galvanizing Repairs: Prepare and repair damaged galvanized coatings on fabricated and installed cold-formed steel framing with galvanized repair paint according to ASTM A780 and manufacturer's written instructions.",
  "Provide final protection and maintain conditions, in a manner acceptable to manufacturer and Installer, that ensure that cold-formed steel framing is without damage or deterioration at time of Substantial Completion.",
]

[[section]]
number = "05 50 00"
title = "METAL FABRICATIONS"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Steel framing and supports for mechanical and electrical equipment, operable partitions, countertops, and overhead doors.",
  ">Loose steel lintels.",
  ">Shelf angles.",
  ">Steel pipe bollards.",
  ">Miscellaneous steel trim, including edge angles and corner guards.",
  ">Anchor bolts, steel embedments, and post-installed anchors for metal fabrications.",
  ">Metal ladders.",
  "Related Requirements:",
  ">Section 03 30 00 \"Cast-in-Place Concrete\" for installing anchor bolts and other items cast into concrete.",
  ">Section 04 20 00 \"Unit Masonry\" for installing loose lintels, anchor bolts, and other items built into masonry.",
  ">Section 05 12 00 \"Structural Steel Framing\" for structural steel.",
  ">Section 05 52 13 \"Pipe and Tube Railings.\"",
  ">Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting\" for finish painting of metal fabrications.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of manufactured product, including paint products, grout, and post-installed anchors.",
  "Shop Drawings: Show fabrication and installation details. Provide plans, elevations, sections, and details of metal fabrications and their connections. Show anchorage and accessory items.",
  "Delegated-Design Submittal: For ladders and for framing and supports indicated to comply with performance requirements, including analysis data signed and sealed by the qualified professional engineer responsible for their preparation.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Welding certificates.",
  "Evaluation Reports: For post-installed anchors, from ICC-ES.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Welding Qualifications: Qualify procedures and personnel according to AWS D1.1 \"Structural Welding Code - Steel\" and AWS D1.2 \"Structural Welding Code - Aluminum,\" as applicable.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Field Measurements: Verify actual locations of walls and other construction contiguous with metal fabrications by field measurements before fabrication, and indicate measurements on Shop Drawings.",
  "Where field measurements cannot be made without delaying the Work, establish dimensions and proceed with fabricating metal fabrications without field measurements. Coordinate construction to ensure that actual dimensions correspond to established dimensions.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Delegated Design: Engage a qualified professional engineer to design ladders and equipment supports not fully detailed on Drawings, to comply with loads required by {building_code}.",
  "Thermal Movements: Allow for thermal movements from ambient and surface temperature changes acting on exterior metal fabrications, based on a temperature change of 120 deg F ambient and 180 deg F material surfaces.",
]

[[section.part2]]
title = "METALS"
items = [
  "Metal Surfaces, General: Provide materials with smooth, flat surfaces unless otherwise indicated. For metal fabrications exposed to view in the completed Work, provide materials without seam marks, roller marks, rolled trade names, or blemishes.",
  "Steel Plates, Shapes, and Bars: ASTM A36.",
  "Steel Tubing: ASTM A500, Grade C, cold-formed steel tubing.",
  "Steel Pipe: ASTM A53, Standard Weight (Schedule 40) unless otherwise indicated.",
  "Stainless-Steel Sheet, Strip, and Plate: ASTM A240 or ASTM A666, Type 304.",
  "Aluminum Extrusions: ASTM B221, Alloy 6063-T6.",
]

[[section.part2]]
title = "FASTENERS AND ANCHORS"
items = [
  "General: Unless otherwise indicated, provide Type 304 stainless-steel fasteners for exterior use and zinc-plated fasteners with coating complying with ASTM B633, Class Fe/Zn 5, at exterior walls. Select fasteners for type, grade, and class required.",
  "Steel Bolts and Nuts: Regular hexagon-head bolts, ASTM A307, Grade A; with hex nuts, ASTM A563; and, where indicated, flat washers.",
  "Anchor Bolts: ASTM F1554, Grade 36, of dimensions indicated; with nuts, ASTM A563; and, where indicated, flat washers. Hot-dip galvanize anchor bolts at exterior walls and where exposed to weather.",
  "Post-Installed Anchors: Torque-controlled expansion anchors or chemical anchors capable of sustaining, without failure, a load equal to six times the load imposed when installed in unit masonry and four times the load imposed when installed in concrete, as determined by testing according to ASTM E488, conducted by a qualified independent testing agency.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Hilti, Inc.",
  ">>Simpson Strong-Tie Company, Inc.",
  ">>DEWALT Engineered by Powers.",
]

[[section.part2]]
title = "MISCELLANEOUS MATERIALS"
items = [
  "Shop Primers: Provide primers that comply with Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting.\"",
  "Universal Shop Primer: Fast-curing, lead- and chromate-free, universal modified-alkyd primer complying with MPI 79 and compatible with topcoat.",
  "Galvanizing Repair Paint: High-zinc-dust-content paint complying with SSPC-Paint 20 and compatible with paints specified to be used over it.",
  "Bituminous Paint: Cold-applied asphalt emulsion complying with ASTM D1187.",
  "Nonshrink, Nonmetallic Grout: Factory-packaged, nonstaining, noncorrosive, nongaseous grout complying with ASTM C1107. Provide grout specifically recommended by manufacturer for interior and exterior applications.",
  "Concrete: Comply with requirements in Section 03 30 00 \"Cast-in-Place Concrete\" for normal-weight, air-entrained concrete with a minimum 28-day compressive strength of 3000 psi.",
]

[[section.part2]]
title = "FABRICATION, GENERAL"
items = [
  "Shop Assembly: Preassemble items in the shop to greatest extent possible. Disassemble units only as necessary for shipping and handling limitations. Use connections that maintain structural value of joined pieces. Clearly mark units for reassembly and coordinated installation.",
  "Cut, drill, and punch metals cleanly and accurately. Remove burrs and ease edges to a radius of approximately 1/32 inch unless otherwise indicated. Remove sharp or rough areas on exposed surfaces.",
  "Form bent-metal corners to smallest radius possible without causing grain separation or otherwise impairing work.",
  "Form exposed work with accurate angles and surfaces and straight edges.",
  "Weld corners and seams continuously to comply with the following:",
  ">Use materials and methods that minimize distortion and develop strength and corrosion resistance of base metals.",
  ">Obtain fusion without undercut or overlap.",
  ">Remove welding flux immediately.",
  ">At exposed connections, finish exposed welds and surfaces smooth and blended so no roughness shows after finishing.",
  "Form exposed connections with hairline joints, flush and smooth, using concealed fasteners or welds where possible. Where exposed fasteners are required, use Phillips flat-head (countersunk) fasteners unless otherwise indicated.",
  "Fabricate seams and other connections that are exposed to weather in a manner to exclude water. Provide weep holes where water may accumulate.",
  "Provide for anchorage of type indicated; coordinate with supporting structure. Space anchoring devices to secure metal fabrications rigidly in place and to support indicated loads.",
]

[[section.part2]]
title = "MISCELLANEOUS FRAMING AND SUPPORTS"
items = [
  "General: Provide steel framing and supports not specified in other Sections as needed to complete the Work.",
  "Fabricate units from steel shapes, plates, and bars of welded construction unless otherwise indicated. Fabricate to sizes, shapes, and profiles indicated and as necessary to receive adjacent construction.",
  ">Fabricate units from slotted channel framing where indicated.",
  ">Furnish inserts for units installed after concrete is placed.",
  "Galvanize miscellaneous framing and supports where indicated and at exterior locations.",
]

[[section.part2]]
title = "SHELF ANGLES"
items = [
  "Fabricate shelf angles from steel angles of sizes indicated and for attachment to concrete framing. Provide horizontally slotted holes to receive 3/4-inch bolts, spaced not more than 6 inches from ends and 24 inches o.c. unless otherwise indicated.",
  ">Provide mitered and welded units at corners.",
  ">Provide open joints in shelf angles at expansion and control joints. Make open joint approximately 2 inches larger than expansion or control joint.",
  "Galvanize shelf angles located in exterior walls.",
  "Prime shelf angles located in exterior walls with zinc-rich primer.",
]

[[section.part2]]
title = "LOOSE STEEL LINTELS"
items = [
  "Fabricate loose steel lintels from steel angles and shapes of size indicated for openings and recesses in masonry walls and partitions at locations indicated. Fabricate in single lengths for each opening, providing one angle for each 4 inches of wall thickness unless otherwise indicated.",
  "Size loose lintels to provide bearing length at each side of openings equal to 1/12 of clear span but not less than 8 inches unless otherwise indicated.",
  "Where lintels are not scheduled, provide steel angle 3-1/2 by 3-1/2 by 5/16 inch for openings up to 4 feet and 6 by 3-1/2 by 5/16 inch, long leg vertical, for openings up to 8 feet, per 4-inch wythe.",
  "Galvanize loose steel lintels located in exterior walls.",
]

[[section.part2]]
title = "STEEL PIPE BOLLARDS"
items = [
  "Fabricate pipe bollards from Schedule 80 steel pipe, 6-inch nominal diameter unless otherwise indicated.",
  ">Cap bollards with 1/4-inch-thick steel plate, or fill with concrete and crown the top.",
  ">Where bollards are to be anchored to existing construction with anchor bolts, fabricate with 3/4-inch-thick steel baseplates for bolting to concrete slab. Drill baseplates at all four corners for 3/4-inch anchor bolts.",
  "Galvanize bollards after fabrication, and prime for finish painting as specified in Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting.\"",
]

[[section.part2]]
title = "METAL LADDERS"
items = [
  "General: Comply with ANSI A14.3 and 29 CFR 1910.23, except for elevator pit ladders.",
  "Steel Ladders: Space siderails 18 inches apart unless otherwise indicated; siderails continuous steel flat bars, 1/2 by 2-1/2 inches, with eased edges; rungs 3/4-inch-diameter steel bars spaced 12 inches o.c., with nonslip surfaces.",
  ">Support each ladder at top and bottom and not more than 60 inches o.c. with welded or bolted steel brackets.",
  ">Galvanize exterior ladders, including brackets.",
]

[[section.part2]]
title = "MISCELLANEOUS STEEL TRIM"
items = [
  "Unless otherwise indicated, fabricate units from steel shapes, plates, and bars of profiles shown with continuously welded joints and smooth exposed edges. Miter corners and use concealed field splices where possible.",
  "Provide cutouts, fittings, and anchorages as needed to coordinate assembly and installation with other work. Provide with integrally welded steel strap anchors for embedding in concrete or masonry construction.",
  "Galvanize exterior miscellaneous steel trim.",
]

[[section.part2]]
title = "FINISHES"
items = [
  "Galvanizing: Hot-dip galvanize items as indicated to comply with ASTM A153 for steel and iron hardware and with ASTM A123 for other steel and iron products.",
  "Shop Priming: Prepare surfaces of items not indicated to be galvanized according to SSPC-SP 3 \"Power Tool Cleaning\" for interior items and SSPC-SP 6 \"Commercial Blast Cleaning\" for exterior items. Apply shop primer to uncoated surfaces of metal fabrications, except those with galvanized finishes and those to be embedded in concrete, sprayed-on fireproofing, or masonry, unless otherwise indicated, to comply with SSPC-PA 1.",
  "Galvanized Items to Be Painted: Prepare galvanized surfaces according to SSPC-SP 16 and prime with primer compatible with galvanizing and finish paint.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Cutting, Fitting, and Placement: Perform cutting, drilling, and fitting required for installing metal fabrications. Set metal fabrications accurately in location, alignment, and elevation; with edges and surfaces level, plumb, true, and free of rack; and measured from established lines and levels.",
  "Fit exposed connections accurately together to form hairline joints. Weld connections that are not to be left as exposed joints but cannot be shop welded because of shipping size limitations. Do not weld, cut, or abrade surfaces of exterior units that have been hot-dip galvanized after fabrication and are for bolted or screwed field connections.",
  "Field Welding: Comply with the requirements for welding in \"Fabrication, General\" Article.",
  "Fastening to In-Place Construction: Provide anchorage devices and fasteners where metal fabrications are required to be fastened to in-place construction. Provide threaded fasteners for use with concrete and masonry inserts, toggle bolts, through bolts, lag screws, wood screws, and other connectors.",
  "Provide temporary bracing or anchors in formwork for items that are to be built into concrete, masonry, or similar construction.",
  "Corrosion Protection: Coat concealed surfaces of aluminum that come into contact with grout, concrete, masonry, wood, or dissimilar metals with a heavy coat of bituminous paint.",
]

[[section.part3]]
title = "INSTALLING MISCELLANEOUS FRAMING AND SUPPORTS"
items = [
  "General: Install framing and supports to comply with requirements of items being supported, including manufacturers' written instructions and requirements indicated on Shop Drawings.",
  "Anchor supports for operable partitions and overhead doors securely to, and rigidly brace from, building structure.",
  "Install shelf angles level and aligned, shimmed as needed, with bolts tightened at slotted holes after alignment.",
  "Install loose steel lintels with full bearing on masonry or as indicated, and build into masonry as specified in Section 04 20 00 \"Unit Masonry.\"",
]

[[section.part3]]
title = "INSTALLING BOLLARDS"
items = [
  "Anchor bollards in concrete footings, minimum 18 inches in diameter and 48 inches deep, or as indicated. Center and align bollards in holes 3 inches above bottom of excavation. Place concrete around bollards and vibrate or tamp for consolidation. Support and brace bollards in position until concrete has cured.",
  "Anchor bollards to existing construction with anchor bolts, and fill space under base plate with nonshrink grout.",
  "Fill bollards solidly with concrete, mounding top surface to shed water.",
]

[[section.part3]]
title = "ADJUSTING AND CLEANING"
items = [
  "Touchup Painting: Immediately after erection, clean field welds, bolted connections, and abraded areas. Paint uncoated and abraded areas with the same material as used for shop priming to comply with SSPC-PA 1 for touching up shop-painted surfaces.",
  "Galvanized Surfaces: Clean field welds, bolted connections, and abraded areas and repair galvanizing to comply with ASTM A780.",
]

