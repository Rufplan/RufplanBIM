]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Install deck panels and accessories according to applicable specifications and commentary in SDI Publication No. 31, manufacturer's written instructions, and requirements in this Section.",
  "Install temporary shoring before placing deck panels if required to meet deflection limitations.",
  "Locate deck bundles to prevent overloading of supporting members.",
  "Place deck panels on supporting frame and adjust to final position with ends accurately aligned and bearing on supporting frame before being permanently fastened. Do not stretch or contract side-lap interlocks.",
  "Place deck panels flat and square and fasten to supporting frame without warp or deflection.",
  "Cut and neatly fit deck panels and accessories around openings and other work projecting through or adjacent to deck.",
  "Provide additional reinforcement and closure pieces at openings as required for strength, continuity of deck, and support of other work.",
  "Comply with AWS requirements and procedures for manual shielded metal arc welding, appearance and quality of welds, and methods used for correcting welding work.",
]

[[section.part3]]
title = "ROOF-DECK INSTALLATION"
items = [
  "Fasten roof-deck panels to steel supporting members by arc spot (puddle) welds of the surface diameter indicated and as follows:",
  ">Weld Diameter: 5/8 inch, nominal.",
  ">Weld Spacing: 36/4 pattern at intermediate supports and 36/7 pattern at end laps, unless otherwise indicated on structural Drawings.",
  ">Weld Washers: Install weld washers at each weld location for deck thinner than 0.028 inch.",
  "Side-Lap and Perimeter Edge Fastening: Fasten with a maximum spacing of 36 inches, and not more than one-half the span, using mechanical fasteners, and fasten perimeter edges at 12 inches o.c.",
  "End Bearing: Install deck ends over supporting frame with a minimum end bearing of 1-1/2 inches, with end joints lapped 2 inches minimum.",
  "Roof Sump Pans and Sump Plates: Install over openings provided in roof deck and mechanically fasten flanges to top of deck. Space mechanical fasteners not more than 12 inches apart with at least one fastener at each corner.",
  "Miscellaneous Roof-Deck Accessories: Install ridge and valley plates, finish strips, end closures, and reinforcing channels according to deck manufacturer's written instructions.",
]

[[section.part3]]
title = "FLOOR-DECK INSTALLATION"
items = [
  "Fasten floor-deck panels to steel supporting members by arc spot (puddle) welds of the surface diameter indicated and as follows:",
  ">Weld Diameter: 5/8 inch, nominal.",
  ">Weld Spacing: Space welds 12 inches apart in the field of the panel and 18 inches apart, maximum, at intermediate supports.",
  "Side-Lap and Perimeter Edge Fastening: Fasten with a maximum spacing of 36 inches, and not more than one-half the span, using mechanical fasteners.",
  "End Bearing: Install deck ends over supporting frame with a minimum end bearing of 1-1/2 inches, with end joints butted.",
  "Pour Stops and Girder Fillers: Weld steel sheet pour stops and girder fillers to supporting structure according to SDI recommendations unless otherwise indicated.",
  "Floor-Deck Closures: Weld steel sheet column closures, cell closures, and Z-closures to deck, according to SDI recommendations, to provide tight-fitting closures at open ends of ribs and sides of deck.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
