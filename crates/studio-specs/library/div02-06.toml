  "Welding Procedure Specifications (WPSs) and Procedure Qualification Records (PQRs): Provide according to AWS D1.1 for each welded joint whether prequalified or qualified by testing.",
  "Delegated-Design Submittal: For structural-steel connections indicated on Drawings to comply with design loads, include analysis data signed and sealed by the qualified professional engineer responsible for their preparation.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For Installer, fabricator, and testing agency.",
  "Welding certificates.",
  "Mill test reports for structural-steel materials, including chemical and physical properties.",
  "Product Test Reports: For bolts, nuts, and washers, including mechanical properties and chemical analysis; for direct-tension indicators and tension-control bolt-nut-washer assemblies.",
  "Source quality-control reports.",
  "Field quality-control and special inspection reports.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Fabricator Qualifications: A qualified fabricator that participates in the AISC Quality Certification Program and is designated an AISC-Certified Plant, Category BU, or is accepted by authorities having jurisdiction as an approved fabricator.",
  "Installer Qualifications: A qualified installer who participates in the AISC Quality Certification Program and is designated an AISC-Certified Erector, Category CSE.",
  "Welding Qualifications: Qualify procedures and personnel according to AWS D1.1 \"Structural Welding Code - Steel.\"",
  "Comply with applicable provisions of the following specifications and documents:",
  ">AISC 303.",
  ">AISC 360 \"Specification for Structural Steel Buildings.\"",
