# Rufplan Studio spec library: Divisions 02 through 06.

[[section]]
number = "02 41 19"
title = "SELECTIVE DEMOLITION"
when = ["renovation"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Demolition and removal of selected portions of the existing building.",
  ">Demolition and removal of selected site elements adjacent to the building.",
  ">Salvage of existing items for reuse or for delivery to the Owner.",
  ">Removal of existing construction to accommodate new work, including cutting and patching of openings.",
  "Related Requirements:",
  ">Section 01 73 00 \"Execution\" for cutting and patching procedures.",
  ">Section 01 74 19 \"Construction Waste Management and Disposal\" for recycling and disposal of demolition waste.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Remove: Detach items from existing construction and legally dispose of them off site unless indicated to be removed and salvaged or removed and reinstalled.",
  "Remove and Salvage: Carefully detach from existing construction, in a manner to prevent damage, and deliver to the Owner ready for reuse.",
  "Remove and Reinstall: Detach items from existing construction, prepare for reuse, and reinstall where indicated.",
  "Existing to Remain: Existing items of construction that are not to be permanently removed and that are not otherwise indicated to be removed, removed and salvaged, or removed and reinstalled.",
]

[[section.part1]]
title = "MATERIALS OWNERSHIP"
items = [
  "Unless otherwise indicated, demolition waste becomes the property of the Contractor.",
  "Historic items, relics, antiques, and similar objects including, but not limited to, cornerstones and their contents, commemorative plaques and tablets, and other items of interest or value to the Owner that may be uncovered during demolition remain the property of the Owner. Carefully salvage in a manner to prevent damage and promptly return to the Owner.",
]

[[section.part1]]
title = "PREINSTALLATION MEETINGS"
items = [
  "Predemolition Conference: Conduct conference at Project site before beginning demolition.",
  ">Review methods and procedures related to selective demolition, including dust and noise control, utility interruptions, and protection of adjacent occupied areas.",
  ">Review areas where existing construction is to remain and requires protection.",
  ">Inspect and discuss condition of construction to be selectively demolished.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For refrigerant recovery technician.",
  "Schedule of Selective Demolition Activities: Indicate the following:",
  ">Detailed sequence of selective demolition and removal work, with starting and ending dates for each activity.",
  ">Interruption of utility services, with the length of time each interruption will occur.",
  ">Coordination for shutoff, capping, and continuation of utility services.",
  ">Use of elevators and stairs, and locations of temporary partitions and means of egress.",
  "Predemolition Photographs or Video: Show existing conditions of adjoining construction, including finish surfaces that might be misconstrued as damage caused by demolition operations. Submit before work begins.",
  "Statement of Refrigerant Recovery: Signed by refrigerant recovery technician responsible for recovering refrigerant, stating that all refrigerant present was recovered and that recovery was performed according to EPA regulations.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Inventory: Submit a list of items that have been removed and salvaged, with the location where each was delivered.",
  "Landfill Records: Indicate receipt and acceptance of hazardous wastes by a landfill facility licensed to accept hazardous wastes.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Refrigerant Recovery Technician Qualifications: Certified by an EPA-approved certification program.",
  "Regulatory Requirements: Comply with governing EPA notification regulations before beginning selective demolition. Comply with hauling and disposal regulations of authorities having jurisdiction in {jurisdiction}.",
  "Standards: Comply with ANSI/ASSP A10.6 \"Safety Requirements for Demolition Operations\" and NFPA 241 \"Standard for Safeguarding Construction, Alteration, and Demolition Operations.\"",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Owner will occupy portions of the building immediately adjacent to selective demolition area. Conduct selective demolition so the Owner's operations will not be disrupted.",
  "Conditions existing at time of inspection for bidding purpose will be maintained by the Owner as far as practical.",
  "Notify the Architect of discrepancies between existing conditions and Drawings before proceeding with selective demolition.",
  "Hazardous Materials: It is not expected that hazardous materials will be encountered in the Work.",
  ">Hazardous materials will be removed by the Owner under a separate contract before the start of the Work, where identified in a hazardous materials survey.",
  ">If suspected hazardous materials are encountered, do not disturb; immediately notify the Architect and the Owner.",
  "Storage or sale of removed items or materials on site is not permitted.",
  "Utility Service: Maintain existing utilities indicated to remain in service and protect them against damage during selective demolition operations.",
]

[[section.part2]]
title = "PATCHING MATERIALS"
items = [
  "Use patching materials that match existing adjacent construction in type, composition, and appearance, or as specified in the Sections for the new work.",
  "Where existing materials cannot be matched, provide materials selected by the Architect from manufacturer's full range.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Verify that utilities have been disconnected and capped before starting selective demolition operations.",
  "Review record documents of existing construction provided by the Owner. The Owner does not guarantee that existing conditions are the same as those indicated in record documents.",
  "Survey existing conditions and correlate with requirements indicated to determine extent of selective demolition required.",
  "When unanticipated mechanical, electrical, or structural elements that conflict with intended function or design are encountered, investigate and measure the nature and extent of conflict. Promptly submit a written report to the Architect.",
  "Survey the condition of the building to determine whether removing any element might result in structural deficiency or unplanned collapse of any portion of the structure or adjacent structures during selective demolition.",
]

[[section.part3]]
title = "UTILITY SERVICES AND MEP SYSTEMS"
items = [
  "Existing Services and Systems to Remain: Maintain services and systems indicated to remain and protect them against damage.",
  "Existing Services and Systems to Be Removed, Relocated, or Abandoned: Locate, identify, disconnect, and seal or cap off utility services and MEP systems serving areas to be selectively demolished.",
  ">Arrange to shut off utilities with utility companies.",
  ">Where entire wall is to be removed, remove existing services and systems in the wall.",
  ">Cut off pipe or conduit in walls or partitions to be removed. Cap, valve, or plug and seal remaining portion of pipe or conduit after bypassing.",
  ">Remove ducts and piping to be abandoned back to the main; cap or plug remaining open ends.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Site Access and Temporary Controls: Conduct selective demolition and debris-removal operations to ensure minimum interference with roads, streets, walks, walkways, and other adjacent occupied and used facilities.",
  "Temporary Facilities: Provide temporary barricades and other protection required to prevent injury to people and damage to adjacent buildings and facilities to remain.",
  ">Provide protection to ensure safe passage of people around selective demolition area and to and from occupied portions of the building.",
  ">Provide temporary weather protection, during interval between selective demolition of existing construction on exterior surfaces and new construction, to prevent water leakage and damage to structure and interior areas.",
  ">Protect walls, ceilings, floors, and other existing finish work that are to remain or that are exposed during selective demolition operations.",
  ">Cover and protect furniture, furnishings, and equipment that have not been removed.",
  ">Erect and maintain dustproof partitions, minimum 6-mil polyethylene on framing, with closable openings and negative air pressure where adjacent spaces are occupied.",
  "Temporary Shoring: Design, provide, and maintain shoring, bracing, and structural supports as required to preserve stability and prevent movement, settlement, or collapse of construction and finishes to remain.",
]

[[section.part3]]
title = "SELECTIVE DEMOLITION, GENERAL"
items = [
  "Demolish and remove existing construction only to the extent required by new construction and as indicated. Use methods required to complete the Work within limitations of governing regulations and as follows:",
  ">Proceed with selective demolition systematically, from higher to lower level. Complete selective demolition operations above each floor or tier before disturbing supporting members on the next lower level.",
  ">Neatly cut openings and holes plumb, square, and true to dimensions required. Use cutting methods least likely to damage construction to remain or adjoining construction.",
  ">Cut or drill from the exposed or finished side into concealed surfaces to avoid marring existing finished surfaces.",
  ">Do not use cutting torches until work area is cleared of flammable materials. Maintain portable fire-suppression devices during flame-cutting operations and comply with a hot work permit program.",
  ">Maintain fire watch during and for at least one hour after flame-cutting operations.",
  ">Dispose of demolished items and materials promptly.",
  "Removed and Salvaged Items:",
  ">Clean salvaged items, pack or crate items after cleaning, and identify contents of containers.",
  ">Store items in a secure area until delivery to the Owner.",
  ">Transport items to the Owner's storage area on site designated by the Owner.",
  "Removed and Reinstalled Items: Clean and repair items to functional condition adequate for intended reuse. Reinstall items in locations indicated, complying with installation requirements for new materials and equipment.",
  "Existing Items to Remain: Protect construction indicated to remain against damage and soiling during selective demolition.",
]

[[section.part3]]
title = "SELECTIVE DEMOLITION PROCEDURES FOR SPECIFIC MATERIALS"
items = [
  "Concrete: Demolish in small sections. Cut concrete to a depth of at least 3/4 inch at junctures with construction to remain, using power-driven saw. Dislodge concrete from reinforcement at perimeter of areas being demolished, cut reinforcement, and then remove remainder of concrete.",
  "Masonry: Demolish in small sections. Cut masonry at junctures with construction to remain, using power-driven saw, then remove masonry between saw cuts.",
  "Concrete Slabs-on-Grade: Saw-cut perimeter of area to be demolished, then break up and remove.",
  "Resilient Floor Coverings: Remove floor coverings and adhesive according to recommendations in RFCI's \"Recommended Work Practices for the Removal of Resilient Floor Coverings.\"",
  "Roofing: Remove no more existing roofing than what can be covered in one day by new roofing, and provide temporary protection at the end of each day.",
  "Air-Conditioning Equipment: Remove equipment without releasing refrigerants.",
]

[[section.part3]]
title = "DISPOSAL OF DEMOLISHED MATERIALS"
items = [
  "Remove demolition waste materials from Project site and recycle or dispose of them according to Section 01 74 19 \"Construction Waste Management and Disposal.\"",
  ">Do not allow demolished materials to accumulate on site.",
  ">Remove debris from elevated portions of building by chute, hoist, or other device that will convey debris to grade level in a controlled descent.",
  "Burning: Do not burn demolished materials.",
  "Disposal: Transport demolished materials off Owner's property and legally dispose of them.",
]

[[section.part3]]
title = "CLEANING"
items = [
  "Clean adjacent structures and improvements of dust, dirt, and debris caused by selective demolition operations. Return adjacent areas to condition existing before selective demolition operations began.",
  "Repair damage to construction to remain caused by demolition operations, to match existing construction.",
]

[[section]]
number = "03 30 00"
title = "CAST-IN-PLACE CONCRETE"
when = ["concrete"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Cast-in-place concrete, including formwork, reinforcement, concrete materials, mixture design, placement procedures, and finishes.",
  ">Footings and foundation walls.",
  ">Slabs-on-grade, including vapor retarder and granular base.",
  ">Concrete stoops, steps, and equipment pads.",
  "Related Requirements:",
  ">Section 03 35 43 \"Polished Concrete Finishing\" for polished concrete floor finishes.",
  ">Section 04 20 00 \"Unit Masonry\" for grout and reinforcement in masonry.",
  ">Section 07 92 00 \"Joint Sealants\" for sealing of joints in slabs.",
  ">Section 31 20 00 \"Earth Moving\" for drainage fill and subgrade preparation.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Cementitious Materials: Portland cement alone or in combination with one or more of the following: blended hydraulic cement, fly ash, slag cement, and silica fume; subject to compliance with requirements.",
  "W/C Ratio: The ratio by weight of water to cementitious materials.",
]

[[section.part1]]
title = "PREINSTALLATION MEETINGS"
items = [
  "Preinstallation Conference: Conduct conference at Project site.",
  ">Require attendance of the Contractor's superintendent, independent testing agency, ready-mix concrete manufacturer, and concrete subcontractor.",
  ">Review concrete mixture designs, forming and reinforcement, placement sequence, joint locations, vapor retarder installation, finishing, curing, cold- and hot-weather procedures, and testing and inspection requirements.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including admixtures, vapor retarder, curing compounds, joint fillers, and bonding agents.",
  "Design Mixtures: For each concrete mixture. Submit alternate design mixtures when characteristics of materials, Project conditions, weather, test results, or other circumstances warrant adjustments.",
  ">Indicate amounts of mixing water to be withheld for later addition at Project site.",
  ">Include field-test records or trial-batch data used to establish required average strength per ACI 301.",
  "Steel Reinforcement Shop Drawings: Placing drawings that detail fabrication, bending, and placement. Include bar sizes, lengths, material, grade, bar schedules, stirrup spacing, bent bar diagrams, bar arrangement, splices and laps, mechanical splices, and supports for concrete reinforcement.",
  "Construction Joint Layout: Indicate proposed construction joints and contraction joints required to construct the structure and slabs-on-grade.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For Installer, manufacturer, and testing agency.",
  "Material Certificates: For each of the following, signed by manufacturers: cementitious materials, admixtures, steel reinforcement and accessories, curing compounds, and vapor retarder.",
  "Material Test Reports: For aggregates, from a qualified testing agency, indicating compliance with ASTM C33.",
  "Field Quality-Control Reports.",
  "Minutes of preinstallation conference.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: A qualified installer who employs on Project personnel qualified as ACI-certified Flatwork Technician and Finisher and a supervisor who is an ACI-certified Concrete Flatwork Technician.",
  "Manufacturer Qualifications: A firm experienced in manufacturing ready-mixed concrete products and that complies with ASTM C94 requirements for production facilities and equipment. Manufacturer certified according to NRMCA's \"Certification of Ready Mixed Concrete Production Facilities.\"",
  "Testing Agency Qualifications: An independent agency qualified according to ASTM C1077 and ASTM E329 for testing indicated.",
  ">Personnel conducting field tests shall be qualified as ACI Concrete Field Testing Technician, Grade 1.",
  "Comply with ACI 301 \"Specifications for Concrete Construction\" and ACI 318 \"Building Code Requirements for Structural Concrete\" as adopted under {building_code}, unless modified by requirements in the Contract Documents.",
  "Tolerances: Comply with ACI 117 \"Specification for Tolerances for Concrete Construction and Materials.\"",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Steel Reinforcement: Deliver, store, and handle steel reinforcement to prevent bending and damage. Store off the ground on supports and cover to prevent contamination.",
  "Store cementitious materials and admixtures in weathertight conditions and use in order of receipt.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Cold-Weather Placement: Comply with ACI 306.1 and as follows. Protect concrete work from physical damage or reduced strength that could be caused by frost, freezing actions, or low temperatures.",
  ">When average high and low temperature is expected to fall below 40 deg F for three successive days, maintain delivered concrete mixture temperature within the temperature range required by ACI 301.",
  ">Do not use frozen materials or materials containing ice or snow. Do not place concrete on frozen subgrade or on subgrade containing frozen materials.",
  ">Do not use calcium chloride, salt, or other materials containing antifreeze agents or chemical accelerators unless otherwise specified and approved in mixture designs.",
  "Hot-Weather Placement: Comply with ACI 305.1 and as follows:",
  ">Maintain concrete temperature below 90 deg F at time of placement. Chilled mixing water or chopped ice may be used to control temperature, provided water equivalent of ice is calculated in total amount of mixing water.",
  ">Fog-spray forms, steel reinforcement, and subgrade just before placing concrete. Keep subgrade uniformly moist without standing water, soft spots, or dry areas.",
]

[[section.part2]]
title = "CONCRETE, GENERAL"
items = [
  "ACI Publications: Comply with ACI 301 unless modified by requirements in the Contract Documents.",
  "Structural Design: Concrete members are designed by the Architect's or Owner's structural engineer as indicated on Drawings. Do not alter member sizes, reinforcement, or strengths without written approval.",
]

[[section.part2]]
title = "FORM-FACING MATERIALS"
items = [
  "Smooth-Formed Finished Concrete: Form-facing panels that provide continuous, true, and smooth concrete surfaces. Furnish in largest practicable sizes to minimize number of joints.",
  ">Plywood, metal, or other approved panel materials.",
  ">Exterior-grade plywood panels, suitable for concrete forms, complying with DOC PS 1, and with smooth face on exposed surfaces.",
  "Rough-Formed Finished Concrete: Plywood, lumber, metal, or another approved material. Provide lumber dressed on at least two edges and one side for tight fit.",
  "Chamfer Strips: Wood, metal, PVC, or rubber strips, 3/4 by 3/4 inch, minimum, at exposed outside corners.",
  "Form-Release Agent: Commercially formulated form-release agent that will not bond with, stain, or adversely affect concrete surfaces and will not impair subsequent treatments of concrete surfaces.",
  "Form Ties: Factory-fabricated, removable or snap-off glass-fiber-reinforced plastic or metal form ties designed to resist lateral pressure of fresh concrete on forms and to prevent spalling of concrete on removal. Ties shall leave no metal closer than 1 inch to the plane of exposed concrete surface.",
]

[[section.part2]]
title = "STEEL REINFORCEMENT"
items = [
  "Reinforcing Bars: ASTM A615, Grade 60, deformed.",
  "Low-Alloy Steel Reinforcing Bars: ASTM A706, deformed, where welding of reinforcement is indicated.",
  "Plain-Steel Welded-Wire Reinforcement: ASTM A1064, plain, fabricated from as-drawn steel wire into flat sheets.",
  "Epoxy-Coated Reinforcing Bars: ASTM A775, with ASTM A615 Grade 60 deformed bars, where indicated.",
]

[[section.part2]]
title = "REINFORCEMENT ACCESSORIES"
items = [
  "Bar Supports: Bolsters, chairs, spacers, and other devices for spacing, supporting, and fastening reinforcing bars and welded-wire reinforcement in place.",
  ">Manufacture bar supports from steel wire, plastic, or precast concrete according to CRSI's \"Manual of Standard Practice,\" of greater compressive strength than concrete.",
  ">For concrete surfaces exposed to view, where legs of wire bar supports contact forms, use CRSI Class 1 plastic-protected steel wire or CRSI Class 2 stainless-steel bar supports.",
  ">For slabs-on-grade, provide sand plates, horizontal runners, or precast concrete blocks where base material will not support chair legs.",
  "Tie Wire: ASTM A1064, annealed steel, not less than 0.0508 inch in diameter.",
  "Mechanical Splice Couplers: ACI 318 Type 2, capable of developing 125 percent of specified yield strength of the bar, where indicated.",
]

[[section.part2]]
title = "CONCRETE MATERIALS"
items = [
  "Cementitious Materials:",
  ">Portland Cement: ASTM C150, Type I/II, gray.",
  ">Fly Ash: ASTM C618, Class F or C.",
  ">Slag Cement: ASTM C989, Grade 100 or 120.",
  "Normal-Weight Aggregates: ASTM C33, Class 3S coarse aggregate or better, graded. Provide aggregates from a single source with documented service record data of at least 10 years' satisfactory service in similar applications and service conditions using similar aggregates and cementitious materials.",
  ">Maximum Coarse-Aggregate Size: 1 inch nominal for footings and walls; 3/4 inch nominal for slabs.",
  ">Fine Aggregate: Free of materials with deleterious reactivity to alkali in cement.",
  "Air-Entraining Admixture: ASTM C260.",
  "Chemical Admixtures: Certified by manufacturer to be compatible with other admixtures and that do not contribute water-soluble chloride ions exceeding those permitted in hardened concrete. Do not use calcium chloride or admixtures containing calcium chloride.",
  ">Water-Reducing Admixture: ASTM C494, Type A.",
  ">High-Range, Water-Reducing Admixture: ASTM C494, Type F.",
  ">Water-Reducing and Accelerating Admixture: ASTM C494, Type E.",
  ">Water-Reducing and Retarding Admixture: ASTM C494, Type D.",
  "Water: Potable and complying with ASTM C1602.",
]

[[section.part2]]
title = "VAPOR RETARDERS"
