  ">Joint Type: Snug tightened, unless pretensioned or slip critical is indicated.",
  "Weld Connections: Comply with AWS D1.1 for tolerances, appearances, welding procedure specifications, weld quality, and methods used in correcting welding work.",
  ">Comply with AISC 303 and AISC 360 for bearing, alignment, adequacy of temporary connections, and removal of paint on surfaces adjacent to field welds.",
  ">Remove backing bars or runoff tabs where indicated, back gouge, and grind steel smooth.",
  ">Assemble and weld built-up sections by methods that maintain true alignment of axes without exceeding tolerances in AISC 303 for mill material.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
