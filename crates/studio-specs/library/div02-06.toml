  "Field welds will be subject to inspection. Remove and replace work that does not comply with specified requirements.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Galvanizing Repairs: Prepare and repair damaged galvanized coatings on both surfaces of deck with galvanized repair paint according to ASTM A780 and manufacturer's written instructions.",
  "Provide final protection and maintain conditions to ensure that steel deck is without damage or deterioration at time of Substantial Completion.",
]

