  ">Connections and anchorages for glued-laminated construction.",
  "Related Requirements:",
  ">Section 06 10 00 \"Rough Carpentry\" for dimension lumber and metal framing anchors.",
  ">Section 09 93 00 \"Staining and Transparent Finishing\" for field finishing of exposed glued-laminated members.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product.",
  ">For preservative-treated members, include chemical treatment manufacturer's written instructions for handling, storing, installing, and finishing treated material.",
  "Shop Drawings: Show layout of glued-laminated structural members and connections. Include dimensions, species, combination symbols, grades, camber, appearance grade, connection details, and location of hardware.",
  "Samples: For each species and appearance grade exposed to view, 12 inches long, showing range of variation to be expected, with factory finish where indicated.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Certificates of Conformance: Issued by a qualified testing and inspecting agency indicating that glued-laminated timber complies with requirements in ANSI A190.1.",
  "Qualification Data: For manufacturer.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Manufacturer Qualifications: A qualified manufacturer that is certified for chain of custody by an FSC-accredited certification body where FSC-certified wood is indicated, and that is qualified by APA or another recognized inspection agency for production of structural glued-laminated timber complying with ANSI A190.1.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Individually wrap members using plastic-coated paper covering with water-resistant seams.",
  ">Provide openings in wrapping for air circulation after members are installed and until completion of enclosure.",
  "Handle and store members with care. Use padded or nonmarring slings, and protect corners with wood blocking. Store members off the ground, on dunnage, and under cover, to prevent staining or damage.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Structural Performance: Provide glued-laminated members and connections capable of supporting design loads indicated on structural Drawings, designed per AWC \"National Design Specification for Wood Construction.\"",
  "Fire-Resistance Ratings: Where heavy timber or fire-resistance-rated construction is indicated, size members to comply with {building_code} and AWC Technical Report 10 calculation methods.",
]

[[section.part2]]
title = "GLUED-LAMINATED TIMBER"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Boise Cascade Company.",
  ">Rosboro Company, LLC.",
  ">Anthony Forest Products Company, LLC; a Canfor company.",
  ">Structurlam Mass Timber Corporation.",
  "General: Provide structural glued-laminated timber that complies with ANSI A190.1 and ANSI 117 and that is factory marked with qualified inspection agency's mark indicating compliance with ANSI A190.1.",
  ">Species and Grades: Douglas fir-larch or southern pine, combination symbol 24F-V4 for simple-span beams and 24F-V8 for cantilevered or continuous beams, unless otherwise indicated.",
  ">Columns: Combination symbol per structural Drawings.",
  ">Adhesive: Wet-use adhesive complying with ANSI 405.",
  "Appearance Grade: Architectural, complying with ANSI A190.1, for members exposed to view; Industrial for concealed members.",
  "Camber: Fabricate members with camber indicated or, if not indicated, with manufacturer's standard camber for simple-span beams based on 3500-foot radius.",
]

[[section.part2]]
title = "TIMBER CONNECTORS"
items = [
  "Fabricate beam seats, hangers, column caps and bases, and other connectors from steel plate complying with ASTM A36, and bolts complying with ASTM A307, Grade A; with ASTM A563 hex nuts and flat washers.",
  "Finish: Shop prime with MPI 79 primer for interior exposed connectors; hot-dip galvanize to ASTM A123 at exterior locations.",
  "Provide slotted holes and details that permit shrinkage perpendicular to grain; do not restrain beam depth with multiple rows of bolts across the grain unless indicated.",
]

[[section.part2]]
title = "FABRICATION"
items = [
  "Shop fabricate for connections to greatest extent possible, including cutting to length and drilling bolt holes.",
  "End-Cut Sealing: Immediately after end cutting each member to final length, apply a saturation coat of manufacturer's standard transparent end sealer.",
  "Seal Coat: After fabricating and surfacing members, apply manufacturer's standard penetrating sealer to members exposed to view.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Erect glued-laminated timber true and plumb and with uniform, tight joints. Provide temporary bracing to maintain lateral stability until permanent lateral support is in place.",
  "Install timber connectors, with bolts, lag screws, and other fasteners as indicated. Drill holes to accommodate bolts and lags without splitting.",
  "Cutting: Avoid extra cutting after fabrication. Where field fabrication cannot be avoided, apply end sealer to cut surfaces of members.",
  "Do not notch or bore members unless indicated or approved by the Architect.",
  "Retighten bolts and connections before enclosing and again before Substantial Completion.",
  "Repair damaged surfaces and finishes after completing erection. Replace damaged glued-laminated construction if repairs are not approved by the Architect.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Leave protective wrapping in place until surrounding work is complete or until members are to be finished. Remove wrapping where it would be exposed to sunlight to avoid uneven coloring.",
]

