  ">Anchor Section: Rib-stiffened steel plate, 0.075 inch thick, with screw holes top and bottom and a raised rib-stiffened strap, 5/8 inch wide by 0.097 inch thick, with sealing washers or gaskets for water-resistive barrier.",
  ">Tie Section: Triangular-shaped wire tie, sized to extend within 1 inch of masonry face, made from 0.187-inch-diameter, hot-dip galvanized steel wire.",
  "Corrugated-Metal Ties for Wood Frame Backup: Metal ties with corrugated profile, 7/8 inch wide by 0.030 inch thick, hot-dip galvanized, fastened through sheathing into studs with corrosion-resistant fasteners, for residential veneer as permitted by {building_code}.",
  "Partition Top Anchors: 0.105-inch-thick metal plate with a 3/8-inch-diameter metal rod 6 inches long welded to plate and with closed-end plastic tube fitted over rod that allows rod to move in and out of tube. Fabricate from steel, hot-dip galvanized after fabrication.",
]

[[section.part2]]
title = "EMBEDDED FLASHING MATERIALS"
items = [
  "Metal Flashing: Provide metal flashing complying with SMACNA's \"Architectural Sheet Metal Manual\" and as follows:",
  ">Stainless Steel: ASTM A240, Type 304, 0.016 inch thick, soft temper.",
  ">Fabricate continuous flashings in sections 96 inches long minimum, but not exceeding 12 feet. Provide splice plates at joints of formed, smooth metal flashing.",
  ">Fabricate metal drip edges from stainless steel. Extend at least 3 inches into wall and 1/2 inch out from wall, with outer edge bent down 30 degrees and hemmed.",
  ">Fabricate metal end dams and corners.",
  "Flexible Flashing: Use one of the following unless otherwise indicated:",
  ">Rubberized-Asphalt Flashing: Composite flashing product consisting of a pliable, adhesive rubberized-asphalt compound, bonded to a high-density, cross-laminated polyethylene film to produce an overall thickness of not less than 0.040 inch.",
  ">EPDM Flashing: Sheet flashing product made from ethylene-propylene-diene terpolymer, complying with ASTM D4637, 0.040 inch thick.",
  "Solder and Sealants for Sheet Metal Flashings: As specified in Section 07 62 00 \"Sheet Metal Flashing and Trim.\"",
  "Adhesives, Primers, and Seam Tapes for Flashings: Flashing manufacturer's standard products or general-purpose products recommended by flashing manufacturer for bonding flashing sheets to each other and to substrates.",
]

[[section.part2]]
title = "MISCELLANEOUS MASONRY ACCESSORIES"
items = [
  "Compressible Filler: Premolded filler strips complying with ASTM D1056, Grade 2A1, compressible up to 35 percent; of width and thickness indicated; formulated from neoprene, urethane, or PVC.",
  "Preformed Control-Joint Gaskets: Made from styrene-butadiene-rubber compound, complying with ASTM D2000, Designation M2AA-805, and designed to fit standard sash block and to maintain lateral stability in masonry wall.",
  "Bond-Breaker Strips: Asphalt-saturated felt complying with ASTM D226, Type I (No. 15 asphalt felt).",
  "Weep/Vent Products: One-piece, flexible cellular plastic extrusion made from UV-resistant polypropylene copolymer, full height and width of head joint and depth 1/8 inch less than depth of outer wythe, in color selected from manufacturer's standard.",
  "Cavity Drainage Material: Free-draining mesh, made from polymer strands that will not degrade within the wall cavity, 1 inch thick, full width of cavity, with dovetail-shaped notches that prevent mesh from being clogged with mortar droppings.",
  "Masonry Cleaner: Manufacturer's standard-strength proprietary cleaner designed for removing mortar and grout stains, efflorescence, and other new construction stains from new masonry without discoloring or damaging masonry surfaces, approved by the manufacturer of the masonry units being cleaned.",
]

[[section.part2]]
title = "MORTAR AND GROUT MIXES"
items = [
  "General: Do not use admixtures, including pigments, air-entraining agents, accelerators, retarders, water-repellent agents, antifreeze compounds, or other admixtures unless otherwise indicated.",
  ">Do not use calcium chloride in mortar or grout.",
  ">Use portland cement-lime mortar for exterior masonry and for reinforced masonry.",
  "Mortar for Unit Masonry: Comply with ASTM C270, Proportion Specification.",
  ">For masonry below grade or in contact with earth, use Type S.",
  ">For reinforced masonry, use Type S.",
  ">For mortar parge coats, use Type S or Type N.",
  ">For exterior, above-grade, load-bearing and non-load-bearing walls and parapet walls; for interior load-bearing walls; for interior non-load-bearing partitions; and for other applications where another type is not indicated, use Type N.",
  "Pigmented Mortar: Use colored cement product or select and proportion pigments with other ingredients to produce color required. Limit pigments to not more than 10 percent of portland cement by weight.",
  "Grout for Unit Masonry: Comply with ASTM C476.",
  ">Use grout of type (fine or coarse) that will comply with TMS 602 for dimensions of grout spaces and pour height.",
  ">Proportion grout to provide specified compressive strength of not less than 2000 psi at 28 days.",
  ">Provide grout with a slump of 8 to 11 inches as measured according to ASTM C143.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine conditions, with Installer present, for compliance with requirements for installation tolerances and other conditions affecting performance of the Work.",
  ">Verify that foundations are within tolerances specified.",
  ">Verify that reinforcing dowels are properly placed.",
  ">Verify that substrates are free of substances that would impair mortar bond.",
  "Before installation, examine rough-in and built-in construction for piping systems to verify actual locations of piping connections.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Build chases and recesses to accommodate items specified in this and other Sections.",
  "Leave openings for equipment to be installed before completing masonry. After installing equipment, complete masonry to match the construction immediately adjacent to opening.",
  "Use full-size units without cutting if possible. If cutting is required, cut units with motor-driven saws to provide clean, sharp, unchipped edges. Install cut units with cut surfaces and, where possible, cut edges concealed.",
  "Select and arrange units for exposed unit masonry to produce a uniform blend of colors and textures. Mix units from several pallets or cubes as they are placed.",
  "Wetting of Brick: Wet brick before laying if initial rate of absorption exceeds 30 g/30 sq. in. per minute when tested per ASTM C67. Allow units to absorb water so they are damp but not wet at time of laying.",
]

[[section.part3]]
title = "TOLERANCES"
items = [
  "Dimensions and Locations of Elements:",
  ">For dimensions in cross section or elevation, do not vary by more than plus 1/2 inch or minus 1/4 inch.",
  ">For location of elements in plan, do not vary from that indicated by more than plus or minus 1/2 inch.",
  ">For location of elements in elevation, do not vary from that indicated by more than plus or minus 1/4 inch in a story height or 1/2 inch total.",
  "Lines and Levels:",
  ">For bed joints and top surfaces of bearing walls, do not vary from level by more than 1/4 inch in 10 feet, or 1/2 inch maximum.",
  ">For vertical lines and surfaces, do not vary from plumb by more than 1/4 inch in 10 feet, 3/8 inch in 20 feet, or 1/2 inch maximum.",
  ">For conspicuous vertical lines, such as external corners, door jambs, reveals, and expansion and control joints, do not vary from plumb by more than 1/4 inch in 20 feet, or 1/2 inch maximum.",
  "Joints:",
  ">For bed joints, do not vary from thickness indicated by more than plus or minus 1/8 inch, with a maximum thickness limited to 1/2 inch.",
  ">For head and collar joints, do not vary from thickness indicated by more than plus 3/8 inch or minus 1/4 inch.",
  ">For exposed head joints, do not vary from thickness indicated by more than plus or minus 1/8 inch.",
]

[[section.part3]]
title = "LAYING MASONRY WALLS"
items = [
  "Lay out walls in advance for accurate spacing of surface bond patterns with uniform joint thicknesses and for accurate location of openings, movement-type joints, returns, and offsets. Avoid using less-than-half-size units, particularly at corners and jambs.",
  "Bond Pattern for Exposed Masonry: Unless otherwise indicated, lay exposed masonry in running bond; do not use units with less than nominal 4-inch horizontal face dimensions at corners or jambs.",
  "Lay concealed masonry with all units in a wythe in running bond or bonded by lapping not less than 4 inches. Bond and interlock each course of each wythe at corners.",
  "Stopping and Resuming Work: Stop work by stepping back units in each course from those in course below; do not tooth. When resuming work, clean masonry surfaces that are to receive mortar, remove loose masonry units and mortar, and wet brick if required before laying fresh masonry.",
  "Built-in Work: As construction progresses, build in items specified in this and other Sections. Fill in solidly with masonry around built-in items.",
  "Fill cores in hollow CMUs with grout 24 inches under bearing plates, beams, lintels, posts, and similar items unless otherwise indicated.",
  "Build non-load-bearing interior partitions full height of story to underside of solid floor or roof structure above unless otherwise indicated. Install compressible filler in joint between top of partition and underside of structure above and install partition top anchors.",
]

[[section.part3]]
title = "MORTAR BEDDING AND JOINTING"
items = [
  "Lay hollow CMUs as follows:",
  ">With face shells fully bedded in mortar and with head joints of depth equal to bed joints.",
  ">With webs fully bedded in mortar in all courses of piers, columns, and pilasters, and in grouted masonry, including starting course on footings.",
  ">With entire units, including areas under cells, fully bedded in mortar at starting course on footings where cells are not grouted.",
  "Lay solid masonry units with completely filled bed and head joints; butter ends with sufficient mortar to fill head joints and shove into place. Do not deeply furrow bed joints or slush head joints.",
  "Tool exposed joints slightly concave when thumbprint hard, using a jointer larger than joint thickness unless otherwise indicated.",
  "Cut joints flush for masonry walls to receive plaster or other direct-applied finishes (other than paint) unless otherwise indicated.",
]

[[section.part3]]
title = "CAVITY WALLS AND MASONRY VENEER"
items = [
  "Keep cavities clean of mortar droppings and other materials during construction. Bevel beds away from cavity to minimize mortar protrusions into cavity.",
  "Anchor masonry veneers to backup with adjustable anchors or ties, spaced so each anchor supports not more than 2.67 sq. ft. of veneer area, with not more than 16 inches vertical and 32 inches horizontal spacing, or as required by TMS 402 for the backup type.",
  ">Provide additional anchors within 12 inches of openings, spaced not more than 36 inches around perimeter.",
  "Maintain a clear airspace of not less than 1 inch between veneer and insulation or sheathing, and not more than 4-5/8 inches between veneer and backup without engineered ties.",
  "Install continuous cavity insulation as specified in Section 07 21 00 \"Thermal Insulation,\" fitted tightly between ties and with joints taped.",
]

[[section.part3]]
title = "MASONRY JOINT REINFORCEMENT"
items = [
  "General: Install entire length of longitudinal side rods in mortar with a minimum cover of 5/8 inch on exterior side of walls, 1/2 inch elsewhere. Lap reinforcement a minimum of 6 inches.",
  ">Space reinforcement not more than 16 inches o.c.",
  ">Space reinforcement not more than 8 inches o.c. in foundation walls and parapet walls.",
  ">Provide reinforcement not more than 8 inches above and below wall openings and extending 12 inches beyond openings in addition to continuous reinforcement.",
  "Interrupt joint reinforcement at control and expansion joints unless otherwise indicated.",
  "Provide continuity at wall intersections and corners by using prefabricated T-shaped and L-shaped units.",
]

[[section.part3]]
title = "CONTROL AND EXPANSION JOINTS"
items = [
  "General: Install control- and expansion-joint materials in unit masonry as masonry progresses. Do not allow materials to span control and expansion joints without provision to allow for in-plane wall or partition movement.",
  "Form control joints in concrete masonry using one of the following methods:",
  ">Fit bond-breaker strips into hollow contour in ends of CMUs on one side of control joint. Fill resultant core with grout and rake out joints in exposed faces for application of sealant.",
  ">Install preformed control-joint gaskets designed to fit standard sash block.",
  "Locate CMU control joints where indicated or, if not indicated, at not more than 25 feet o.c. and at changes in wall height or thickness, in accordance with NCMA TEK 10-2C.",
  "Form expansion joints in brick by leaving an open joint full depth of brick wythe, not less than 3/8 inch wide, for installation of sealant and backer rod. Locate brick expansion joints where indicated or, if not indicated, at not more than 25 feet o.c. and within 10 feet of corners, in accordance with BIA Technical Note 18A.",
  "Provide horizontal, pressure-relieving joints by either leaving an airspace or inserting a compressible filler of width required to permit installation of sealant and backer rod below shelf angles supporting masonry.",
]

[[section.part3]]
title = "LINTELS"
items = [
  "Install steel lintels where indicated, with minimum bearing of 8 inches at each jamb unless otherwise indicated.",
  "Provide masonry lintels where shown and where openings of more than 12 inches for brick-size units and 24 inches for block-size units are shown without structural steel or other supporting lintels.",
  ">Provide precast or formed-in-place masonry lintels. Temporarily support formed-in-place lintels until grout has attained 75 percent of specified strength.",
]

[[section.part3]]
title = "FLASHING, WEEP HOLES, AND CAVITY DRAINAGE"
items = [
  "General: Install embedded flashing and weep holes in masonry at shelf angles, lintels, ledges, other obstructions to downward flow of water in wall, and where indicated.",
  "Install flashing as follows unless otherwise indicated:",
  ">Prepare masonry surfaces so they are smooth and free from projections that could puncture flashing. Seal penetrations in flashing with adhesive, sealant, or tape as recommended by flashing manufacturer.",
  ">At multiwythe masonry walls, including cavity walls, extend flashing through outer wythe, turned up a minimum of 8 inches, and 1-1/2 inches into the inner wythe or lapped behind the water-resistive barrier.",
  ">At lintels and shelf angles, extend flashing a minimum of 6 inches into masonry at each end. At heads and sills, extend flashing 6 inches at ends and turn up not less than 2 inches to form end dams.",
  ">Install metal drip edges beneath flexible flashing at exterior face of wall. Stop flexible flashing 1/2 inch back from outside face of wall and adhere flexible flashing to top of metal drip edge.",
  "Install weep holes in head joints in exterior wythes of first course of masonry immediately above embedded flashing, using specified weep/vent products, spaced 24 inches o.c. unless otherwise indicated.",
  "Place cavity drainage material in cavities immediately above flashing, full width of cavity.",
  "Install vents in head joints in exterior wythes at top of walls and at spacing indicated.",
]

[[section.part3]]
title = "REINFORCED UNIT MASONRY"
items = [
  "Temporary Formwork and Shores: Construct formwork and shores as needed to support reinforced masonry elements during construction. Do not remove until reinforced masonry members have hardened sufficiently to carry their own weight and other temporary loads.",
  "Placing Reinforcement: Comply with requirements in TMS 602. Secure vertical reinforcing bars at top and bottom, and at intervals not exceeding 192 bar diameters, with bar positioners.",
  "Grouting: Do not place grout until entire height of masonry to be grouted has attained enough strength to resist grout pressure.",
  ">Comply with requirements in TMS 602 for cleanouts and for grout placement, including minimum grout space and maximum pour height.",
  ">Limit height of vertical grout lifts to not more than 60 inches unless cleanouts are provided and high-lift grouting procedures of TMS 602 are followed.",
  ">Consolidate grout pours exceeding 12 inches in height by mechanical vibration and reconsolidate after initial water loss and settlement.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Testing and Inspecting: The Owner will engage special inspectors to perform tests and inspections and prepare reports. Allow inspectors access to scaffolding and work areas as needed to perform tests and inspections.",
  "Inspections: Special inspections according to TMS 602 at the level required by {building_code} for the risk category of the building.",
  ">Begin masonry construction only after inspectors have verified proportions of site-prepared mortar.",
  ">Place grout only after inspectors have verified compliance of grout spaces and of grades, sizes, and locations of reinforcement.",
  "Mortar Test (Property Specification): For each mix provided, according to ASTM C780. Test mortar for mortar air content and compressive strength.",
  "Grout Test (Compressive Strength): For each mix provided, according to ASTM C1019.",
  "Prism Test: For each type of construction provided, according to ASTM C1314 at 7 days and at 28 days, where required by structural Drawings.",
]

[[section.part3]]
title = "REPAIRING, POINTING, AND CLEANING"
items = [
  "Remove and replace masonry units that are loose, chipped, broken, stained, or otherwise damaged or that do not match adjoining units. Install new units to match adjoining units, in fresh mortar, pointed to eliminate evidence of replacement.",
  "Pointing: During the tooling of joints, enlarge voids and holes, except weep holes, and completely fill with mortar. Point up joints, including corners, openings, and adjacent construction, to provide a neat, uniform appearance. Prepare joints for sealant application where indicated.",
  "In-Progress Cleaning: Clean unit masonry as work progresses by dry brushing to remove mortar fins and smears before tooling joints.",
  "Final Cleaning: After mortar is thoroughly set and cured, clean exposed masonry as follows:",
  ">Remove large mortar particles by hand with wooden paddles and nonmetallic scrape hoes or chisels.",
  ">Test cleaning methods on sample panel; leave one-half of panel uncleaned for comparison purposes. Obtain the Architect's approval of sample cleaning before proceeding.",
  ">Protect adjacent stone and nonmasonry surfaces from contact with cleaner by covering them with liquid strippable masking agent or polyethylene film and waterproof masking tape.",
  ">Wet wall surfaces with water before applying cleaners; remove cleaners promptly by rinsing surfaces thoroughly with clear water.",
  ">Clean brick by bucket-and-brush hand-cleaning method described in BIA Technical Note 20.",
  ">Clean concrete masonry by applicable cleaning methods indicated in NCMA TEK 8-4A.",
  "Waste Disposal: Remove excess masonry waste and legally dispose of off Owner's property.",
]

[[section]]
number = "04 72 00"
title = "CAST STONE MASONRY"
when = ["optional"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Cast stone trim, including sills, lintels, copings, water tables, bands, and caps.",
  ">Anchors, dowels, and mortar for setting cast stone.",
  "Related Requirements:",
  ">Section 04 20 00 \"Unit Masonry\" for setting cast stone in unit masonry, and for flashing.",
  ">Section 07 92 00 \"Joint Sealants\" for sealants at cast stone joints.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For cast stone units, anchors, and mortar.",
  "Shop Drawings: Show fabrication and installation details for cast stone units. Include dimensions, details of reinforcement and anchorages, and indication of finished faces. Show profiles, joint locations, and relationship to adjoining construction.",
  "Samples: For each color and texture of cast stone required, 10 inches square, and for colored mortar.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For manufacturer.",
  "Material Test Reports: For each cast stone mix, indicating compliance with ASTM C1364 for compressive strength, absorption, and freeze-thaw durability, based on tests performed within the previous 12 months.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Manufacturer Qualifications: A qualified manufacturer that is a producer member of the Cast Stone Institute and certified in its plant certification program.",
  "Mockups: Include cast stone units in masonry sample panels specified in Section 04 20 00 \"Unit Masonry.\"",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Pack, handle, and ship cast stone units in suitable packs or pallets. Lift with wide-belt slings; do not use wire rope or ropes that might cause staining.",
  "Store units on wood skids or pallets with nonstaining, waterproof covers, securely tied. Arrange to distribute weight evenly and to prevent damage to units.",
]

[[section.part2]]
title = "CAST STONE MATERIALS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Continental Cast Stone.",
  ">Edwards Cast Stone Company.",
  ">Advanced Cast Stone, Inc.",
  ">Reading Rock, Inc.",
  "Cast Stone Units: Comply with ASTM C1364.",
  ">Minimum Compressive Strength: 6500 psi at 28 days.",
  ">Maximum Cold-Water Absorption: 6 percent.",
  ">Freeze-Thaw Resistance: Loss not more than 5 percent after 300 cycles, per ASTM C1364.",
  "Portland Cement: ASTM C150, Type I or Type III, white or gray as required to match approved Samples.",
  "Coarse Aggregates: Granite, quartz, or limestone complying with ASTM C33; gradation and colors as needed to produce required cast stone textures and colors.",
  "Fine Aggregates: Natural sand or crushed stone complying with ASTM C33.",
  "Color Pigments: ASTM C979, synthetic mineral-oxide pigments or colored water-reducing admixtures; color stable, nonfading, and resistant to lime and other alkalis.",
  "Reinforcement: ASTM A615, Grade 60, galvanized or epoxy coated where covered with less than 1-1/2 inches of cast stone material.",
  "Embedded Anchors and Dowels: Type 304 stainless steel.",
]

[[section.part2]]
title = "CAST STONE UNITS"
items = [
  "Fabricate units to dimensions and profiles indicated, with exposed faces having a fine-grained texture similar to natural stone, with no bugholes, air voids, or other surface blemishes visible from 20 feet.",
  "Provide drips on projecting elements unless otherwise indicated. Slope exposed horizontal surfaces 1:12 unless otherwise indicated.",
  "Fabrication Tolerances: Variation from dimensions not more than 1/8 inch or 1/360 of the length, whichever is greater, but not more than 1/4 inch; warp, bow, and twist not more than 1/360 of the length or 1/8 inch, whichever is greater.",
  "Cure units in a warm curing chamber at 100 percent relative humidity for at least 12 hours, or in a moist location for at least 5 days.",
  "Color and Finish: Match the Architect's sample.",
]

[[section.part2]]
title = "MORTAR"
items = [
  "Setting Mortar: ASTM C270, Type N, portland cement-lime, using materials specified in Section 04 20 00 \"Unit Masonry.\"",
  "Pointing Mortar: Match approved sample color; use for pointing joints not scheduled to receive sealant.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates and supports, with Installer present, for compliance with requirements for installation tolerances and other conditions affecting performance of the Work.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install cast stone units to comply with requirements in Section 04 20 00 \"Unit Masonry.\"",
  "Wet joint surfaces thoroughly before applying mortar or setting in mortar.",
  "Set cast stone units accurately in locations indicated, with edges and faces aligned according to established relationships and indicated tolerances.",
  ">Install anchors, supports, fasteners, and other attachments indicated or necessary to secure units in place.",
  ">Set units in full bed of mortar with full head joints unless otherwise indicated.",
  ">Build anchors and ties into mortar joints as units are set.",
  ">Fill dowel holes and anchor slots with mortar.",
  ">Fill collar joints solid as units are set.",
  "Keep joints at copings, sills, and other horizontal surfaces open to receive sealant. Rake out joints to a depth of 3/4 inch and install sealant and backer rod as specified in Section 07 92 00 \"Joint Sealants.\"",
  "Provide sealant joints at heads of lintels and ends of sills, not less than 3/8 inch wide.",
  "Installation Tolerances: Do not vary from level or plumb by more than 1/8 inch in 10 feet or 1/4 inch maximum; do not vary joint thickness by more than 1/8 inch or one-fourth of nominal joint width, whichever is less.",
]

[[section.part3]]
title = "ADJUSTING AND CLEANING"
items = [
  "Remove and replace stained and otherwise damaged units and units not matching approved Samples. Cast stone may be repaired if methods and results are approved by the Architect.",
  "Clean exposed cast stone as work progresses, and after mortar has set clean with a nonacidic cleaner approved by cast stone manufacturer, using soft brushes and clear water rinse. Do not use wire brushes or acid-type cleaners.",
]

[[section]]
number = "05 12 00"
title = "STRUCTURAL STEEL FRAMING"
