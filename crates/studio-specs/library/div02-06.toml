[[section.part2]]
title = "SOFFITS AND DECKING"
items = [
  "Soffit Material: Plywood siding, APA Rated Siding, 303 series, exterior, 1/2 inch thick, or tongue-and-groove boards matching siding species, with continuous perforated or strip vents providing net free area required for attic ventilation.",
  "Exterior Wood Decking: Pressure-preservative-treated southern pine, No. 1, 5/4 by 6 inches, AWPA UC4a; or Western red cedar, Select Knotty or better, where indicated.",
]

[[section.part2]]
title = "MISCELLANEOUS MATERIALS"
items = [
  "Fasteners for Exterior Finish Carpentry: Stainless-steel nails, Type 304, for cedar siding and trim; hot-dip galvanized nails complying with ASTM A153 elsewhere; of size and type recommended by siding manufacturer.",
  ">Length: As recommended by siding manufacturer to penetrate 1-1/4 inches into studs or blocking.",
  "Flashing: Comply with requirements in Section 07 62 00 \"Sheet Metal Flashing and Trim\" for flashing materials installed in exterior finish carpentry.",
  "Sealants: Latex, complying with ASTM C834 Type OP, Grade NF, and paintable, or as specified in Section 07 92 00 \"Joint Sealants.\"",
  "Rainscreen Furring or Drainage Mat: Preservative-treated furring strips, 3/8 by 1-1/2 inches, or proprietary drainage mat, providing a drained air space behind siding where indicated.",
  "Insect Screening: Aluminum or stainless-steel mesh at bottom and top of ventilated rainscreen cavities.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, with Installer present, for compliance with requirements for installation tolerances and other conditions affecting performance of exterior finish carpentry. Verify that water-resistive barrier and window and door flashings are complete.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Clean substrates of projections and substances detrimental to application.",
  "Prime lumber for exterior applications to be painted, including both faces and edges, unless factory primed. Cut to required lengths and prime ends. Comply with requirements in Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting.\"",
  "Back-prime or back-seal siding and trim, and seal field-cut ends, before installation.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Do not use materials that are unsound, warped, improperly treated or finished, inadequately seasoned, or too small to fabricate with minimum joints or optimum joint arrangement.",
  "Install exterior finish carpentry level, plumb, true, and aligned with adjacent materials. Use concealed shims where necessary for alignment.",
  ">Scribe and cut exterior finish carpentry to fit adjoining work. Refinish and seal cuts as recommended by manufacturer.",
  ">Install to tolerance of 1/8 inch in 96 inches for level and plumb. Install adjoining exterior finish carpentry with 1/32-inch maximum offset for flush installation and 1/16-inch maximum offset for reveal installation.",
  ">Coordinate exterior finish carpentry with materials and systems in or adjacent to it. Provide cutouts for mechanical and electrical items that penetrate exterior finish carpentry.",
]

[[section.part3]]
title = "STANDING AND RUNNING TRIM INSTALLATION"
items = [
  "Install flat-grain lumber with bark side exposed to weather.",
  "Install trim with minimum number of joints as is practical, using full-length pieces from maximum lengths of lumber available. Do not use pieces less than 24 inches long except where necessary.",
  ">Use scarf joints for end-to-end joints.",
  ">Stagger end joints in adjacent and related members.",
  "Fit exterior joints to exclude water. Cope at returns and miter at corners to produce tight-fitting joints, with full-surface contact throughout length of joint. Plane backs of casings to provide uniform thickness across joints where necessary for alignment.",
  "Where face fastening is unavoidable, countersink fasteners, fill surface flush, and sand unless otherwise indicated.",
  "Install head flashing over trim at windows, doors, and horizontal trim, lapped under water-resistive barrier.",
]

[[section.part3]]
title = "SIDING INSTALLATION"
items = [
  "Install siding to comply with manufacturer's written instructions and industry guidelines of the Western Red Cedar Lumber Association, as applicable.",
  ">Lap Siding: Lap siding not less than 1 inch, and fasten with one nail per bearing just above the lap so that nail does not penetrate the course below. Butt joints only over framing or blocking, staggered in adjacent courses.",
  ">Vertical Siding: Install over horizontal furring or blocking at 24 inches o.c. maximum; fasten tongue-and-groove boards by blind nailing through tongue.",
  ">Shiplap and Channel Siding: Leave 1/8-inch expansion gap in each lap; face nail with two nails per bearing for boards 8 inches and wider.",
  "Leave 1/8-inch gap at trim and at abutting materials, and seal joints with sealant unless otherwise indicated.",
  "Maintain clearance of not less than 6 inches between siding and finished grade and not less than 2 inches above roofing, decks, and hardscape.",
  "Install siding over rainscreen furring or drainage mat where indicated, with insect screening at top and bottom of cavity.",
]

[[section.part3]]
title = "SOFFIT AND DECKING INSTALLATION"
items = [
  "Install soffits with joints over supports, fastened at 6 inches o.c. at edges and 12 inches o.c. in field, with vents located to provide continuous ventilation.",
  "Install decking with crown up and bark side down, gapped 1/8 inch minimum, fastened with two stainless-steel screws per bearing or with concealed fastener system.",
]

[[section.part3]]
title = "ADJUSTING AND PROTECTION"
items = [
  "Replace exterior finish carpentry that is damaged or does not comply with requirements. Exterior finish carpentry may be repaired or refinished if work complies with requirements and shows no evidence of repair or refinishing.",
  "Protect installed products from damage from weather and other causes during construction. Apply first coat of finish within 14 days of installation.",
  "Remove and replace finish carpentry materials that are wet, moisture damaged, and mold damaged.",
]

