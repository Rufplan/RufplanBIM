[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including high-strength bolts, shear stud connectors, anchor rods, shop primer, and grout.",
  "Shop Drawings: Show fabrication of structural-steel components.",
  ">Include details of cuts, connections, splices, camber, holes, and other pertinent data.",
  ">Include embedment Drawings.",
  ">Indicate welds by standard AWS symbols, distinguishing between shop and field welds, and show size, length, and type of each weld. Show backing bars that are to be removed and supplemental fillet welds where backing bars are to remain.",
  ">Indicate type, size, and length of bolts, distinguishing between shop and field bolts. Identify pretensioned and slip-critical high-strength bolted connections.",
