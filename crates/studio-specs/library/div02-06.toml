  ">Section 05 50 00 \"Metal Fabrications\" for steel lintels and shelf angles.",
  ">Section 07 21 00 \"Thermal Insulation\" for cavity wall insulation.",
  ">Section 07 62 00 \"Sheet Metal Flashing and Trim\" for exposed sheet metal flashing.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "CMU(s): Concrete masonry unit(s).",
  "Reinforced Masonry: Masonry containing reinforcing steel in grouted cells.",
]

[[section.part1]]
title = "PREINSTALLATION MEETINGS"
items = [
  "Preinstallation Conference: Conduct conference at Project site to review sample panel, flashing and weep details, reinforcement and grouting procedures, cold- and hot-weather procedures, and inspection requirements.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product.",
  "Shop Drawings: For the following:",
  ">Masonry Units: Show sizes, profiles, coursing, and locations of special shapes.",
  ">Reinforcing Steel: Detail bending, lap lengths, and placement of unit masonry reinforcing bars. Comply with ACI 315. Show elevations of reinforced walls.",
  ">Flashing: Show flashing at lintels, shelf angles, sills, and wall bases, including end dams and laps.",
  "Samples for Initial Selection: For the following:",
  ">Face brick, in the form of straps of five or more bricks.",
  ">Decorative CMUs, in the form of small-scale units.",
  ">Colored mortar, showing the full range of colors available.",
  "Samples for Verification: For each type and color of exposed masonry unit and colored mortar.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For testing agency.",
  "Material Certificates: For each type and size of the following:",
  ">Masonry units. Include material test reports substantiating compliance with requirements. For bricks, include size-variation data verifying that actual range of sizes falls within specified tolerances.",
  ">Cementitious materials. Include name of manufacturer, brand name, and type.",
  ">Grout mixes. Include description of type and proportions of ingredients.",
  ">Reinforcing bars, joint reinforcement, anchors, ties, and metal accessories.",
  "Mix Designs: For each type of mortar and grout. Include description of type and proportions of ingredients.",
  ">Include test reports for mortar mixes according to ASTM C780.",
  ">Include test reports, according to ASTM C1019, for grout mixes required to comply with compressive strength requirement.",
  "Statement of Compressive Strength of Masonry: For each combination of masonry unit type and mortar type, provide statement of average net-area compressive strength of masonry units, mortar type, and resulting net-area compressive strength of masonry determined according to TMS 602.",
  "Cold-Weather and Hot-Weather Procedures: Detailed description of methods, materials, and equipment to be used to comply with requirements.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Testing Agency Qualifications: Qualified according to ASTM C1093 for testing indicated.",
  "Code Compliance: Design, construct, and inspect masonry according to TMS 402 \"Building Code Requirements for Masonry Structures\" and TMS 602 \"Specification for Masonry Structures,\" as adopted by {building_code}.",
  "Sample Panels: Build sample panels to verify selections made under Sample submittals and to demonstrate aesthetic effects. Comply with requirements in Section 01 40 00 \"Quality Requirements\" for mockups.",
  ">Build sample panels for each type of exposed unit masonry construction in sizes approximately 72 inches long by 48 inches high by full thickness.",
  ">Include through-wall flashing with end dams, weep holes, cavity drainage material, ties, and insulation in the panel, with a portion of the veneer omitted to show cavity construction.",
  ">Clean exposed faces of panels with masonry cleaner indicated.",
  ">Protect approved sample panels from the elements with weather-resistant membrane.",
  ">Approval of sample panels is for color, texture, and blending of masonry units; relationship of mortar and sealant colors to masonry unit colors; tooling of joints; and aesthetic qualities of workmanship.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Store masonry units on elevated platforms in a dry location. If units are not stored in an enclosed location, cover tops and sides of stacks with waterproof sheeting, securely tied. If units become wet, do not install until they are dry.",
  "Store cementitious materials on elevated platforms, under cover, and in a dry location. Do not use cementitious materials that have become damp.",
  "Store aggregates where grading and other required characteristics can be maintained and contamination avoided.",
  "Deliver preblended, dry mortar mix in moisture-resistant containers. Store in delivery containers on elevated platforms in a dry location or in covered weatherproof dispensing silos.",
  "Store masonry accessories, including metal items, to prevent corrosion and accumulation of dirt and oil.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Protection of Masonry: During construction, cover tops of walls, projections, and sills with waterproof sheeting at end of each day's work. Cover partially completed masonry when construction is not in progress.",
  ">Extend cover a minimum of 24 inches down both sides of walls, and hold cover securely in place.",
  "Do not apply uniform floor or roof loads for at least 12 hours and concentrated loads for at least three days after building masonry walls or columns.",
  "Stain Prevention: Prevent grout, mortar, and soil from staining the face of masonry to be left exposed or painted. Immediately remove grout, mortar, and soil that come in contact with such masonry.",
  ">Protect base of walls from rain-splashed mud and from mortar splatter by spreading coverings on ground and over wall surface.",
  ">Protect sills, ledges, and projections from mortar droppings.",
  "Cold-Weather Requirements: Do not use frozen materials or materials mixed or coated with ice or frost. Do not build on frozen substrates. Remove and replace unit masonry damaged by frost or by freezing conditions. Comply with cold-weather construction requirements contained in TMS 602.",
  "Hot-Weather Requirements: Comply with hot-weather construction requirements contained in TMS 602.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Provide unit masonry that develops indicated net-area compressive strengths at 28 days.",
  ">Determine net-area compressive strength of masonry from average net-area compressive strengths of masonry units and mortar types (unit-strength method) according to TMS 602.",
  ">Net-Area Compressive Strength of Concrete Masonry (f'm): 2000 psi, unless otherwise indicated on structural Drawings.",
]

[[section.part2]]
title = "MASONRY UNITS, GENERAL"
items = [
