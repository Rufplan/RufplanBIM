]

[[section.part3]]
title = "PREPARATION"
items = [
  "Provide temporary shores, guys, braces, and other supports during erection to keep structural steel secure, plumb, and in alignment against temporary construction loads and loads equal in intensity to design loads. Remove temporary supports when permanent structural steel, connections, and bracing are in place unless otherwise indicated.",
]

[[section.part3]]
title = "ERECTION"
items = [
  "Set structural steel accurately in locations and to elevations indicated and according to AISC 303 and AISC 360.",
  "Base, Bearing, and Leveling Plates: Clean concrete- and masonry-bearing surfaces of bond-reducing materials, and roughen surfaces prior to setting plates. Clean bottom surface of plates.",
  ">Set plates for structural members on wedges, shims, or setting nuts as required.",
  ">Weld plate washers to top of base plate, where indicated.",
  ">Snug-tighten anchor rods after supported members have been positioned and plumbed. Do not remove wedges or shims but, if protruding, cut off flush with edge of plate before packing with grout.",
  ">Promptly pack shrinkage-resistant grout solidly between bearing surfaces and plates so no voids remain. Neatly finish exposed surfaces; protect grout and allow to cure.",
  "Maintain erection tolerances of structural steel within AISC 303.",
  "Align and adjust various members that form part of complete frame or structure before permanently fastening. Before assembly, clean bearing surfaces and other surfaces that will be in permanent contact with members. Perform necessary adjustments to compensate for discrepancies in elevations and alignment.",
  "Splice members only where indicated.",
  "Do not use thermal cutting during erection unless approved by the Architect. Finish thermally cut sections within smoothness limits in AWS D1.1.",
  "Do not enlarge holes in members by burning or using drift pins. Ream holes that must be enlarged to admit bolts.",
]

