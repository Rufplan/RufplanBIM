[[section.part3]]
title = "INSTALLATION"
items = [
  "Grade: Install cabinets to comply with same grade as item to be installed.",
  "Assemble cabinets and complete fabrication at Project site to extent that it was not completed in the shop.",
  "Install cabinets level, plumb, true in line, and without distortion. Shim as required with concealed shims. Install level and plumb to a tolerance of 1/8 inch in 96 inches.",
  "Scribe and cut cabinets to fit adjoining work, refinish cut surfaces, and repair damaged finish at cuts.",
  "Base Cabinets: Set cabinets straight, level, and plumb. Adjust subtops within 1/16 inch of a single plane. Fasten individual cabinets together with joint fasteners, and scribe and fit to wall and floors. Secure cabinets to walls with No. 10 wafer-head screws sized for not less than 1-1/2-inch penetration into wood framing, blocking, or hanging strips, spaced 16 inches o.c.",
  "Wall Cabinets: Hang cabinets straight, level, and plumb. Adjust fronts and bottoms within 1/16 inch of a single plane. Fasten to hanging strips, masonry, framing, or blocking. Fasten each cabinet with not less than four fasteners.",
  "Fasten fillers and scribe molding; install toe kicks, light rails, and crown molding.",
  "Install hardware uniformly and precisely. Set hinges snug and flat in mortises unless otherwise indicated. Adjust and align hardware so moving parts operate freely and contact points meet accurately. Allow for final adjustment after installation.",
  "Coordinate installation with countertops, appliances, plumbing fixtures, and electrical devices.",
]

