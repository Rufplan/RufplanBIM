]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Code Compliance: Construct wood framing to comply with {building_code}, including the prescriptive requirements of the International Residential Code for one- and two-family dwellings and the requirements of the International Building Code and the AWC \"National Design Specification for Wood Construction\" (NDS) for other buildings.",
  "Where framing members, spacings, or connections are not indicated, comply with the fastening schedule and span tables of the governing code.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Stack lumber flat with spacers beneath and between each bundle to provide air circulation. Protect lumber from weather by covering with waterproof sheeting, securely anchored. Provide for air circulation around stacks and under coverings.",
  "Store engineered wood products and treated lumber off the ground, under cover, and in accordance with manufacturer's written instructions.",
]

[[section.part2]]
title = "WOOD PRODUCTS, GENERAL"
items = [
  "Lumber: DOC PS 20 and applicable rules of grading agencies indicated. If no grading agency is indicated, provide lumber that complies with the applicable rules of any rules-writing agency certified by the ALSC Board of Review. Provide lumber graded by an agency certified by the ALSC Board of Review to inspect and grade lumber under the rules indicated.",
  ">Factory mark each piece of lumber with grade stamp of grading agency.",
  ">Dress lumber, S4S, unless otherwise indicated.",
  "Maximum Moisture Content of Lumber: 19 percent unless otherwise indicated.",
  "Engineered Wood Products: Provide engineered wood products acceptable to authorities having jurisdiction and for which current model code research or evaluation reports exist that show compliance with building code in effect for Project.",
]

[[section.part2]]
title = "WOOD-PRESERVATIVE-TREATED LUMBER"
items = [
  "Preservative Treatment by Pressure Process: AWPA U1; Use Category UC2 for interior construction not in contact with ground, Use Category UC3b for exterior construction not in contact with ground, and Use Category UC4a for items in contact with ground.",
  ">Preservative Chemicals: Acceptable to authorities having jurisdiction and containing no arsenic or chromium.",
  "Kiln-dry lumber after treatment to a maximum moisture content of 19 percent. Do not use material that is warped or that does not comply with requirements for untreated material.",
  "Mark lumber with treatment quality mark of an inspection agency approved by the ALSC Board of Review.",
  "Application: Treat items indicated on Drawings, and the following:",
  ">Wood cants, nailers, curbs, equipment support bases, blocking, stripping, and similar members in connection with roofing, flashing, vapor barriers, and waterproofing.",
  ">Wood sills, sleepers, blocking, furring, and similar concealed members in contact with masonry or concrete.",
  ">Wood framing and furring attached directly to the interior of below-grade exterior masonry or concrete walls.",
  ">Wood framing members that are less than 18 inches above the ground in crawlspaces or unexcavated areas.",
  ">Wood floor plates that are installed over concrete slabs-on-grade.",
]

[[section.part2]]
title = "FIRE-RETARDANT-TREATED MATERIALS"
items = [
  "General: Where fire-retardant-treated materials are indicated, use materials complying with requirements in this article, that are acceptable to authorities having jurisdiction, and with fire-test-response characteristics specified as determined by testing identical products per test method indicated by a qualified testing agency.",
  "Fire-Retardant-Treated Lumber and Plywood by Pressure Process: Products with a flame-spread index of 25 or less when tested according to ASTM E84, and with no evidence of significant progressive combustion when the test is extended an additional 20 minutes, and with the flame front not extending more than 10.5 feet beyond the centerline of the burners at any time during the test (ASTM E2768).",
  ">Treatment shall not promote corrosion of metal fasteners.",
  ">Exterior Type: Treated materials shall comply with requirements specified above for fire-retardant-treated lumber and plywood after being subjected to accelerated weathering according to ASTM D2898.",
  ">Interior Type A: Treated materials shall have a moisture content of 28 percent or less when tested according to ASTM D3201 at 92 percent relative humidity.",
  "Identify fire-retardant-treated wood with appropriate classification marking of qualified testing agency.",
  "Application: Treat items indicated on Drawings, and wood in Type III, IV, and V construction where required by {building_code}, including exterior wall framing and roof framing where fire-retardant-treated wood is indicated.",
]

[[section.part2]]
title = "DIMENSION LUMBER FRAMING"
items = [
  "Non-Load-Bearing Interior Partitions: Construction or No. 2 grade of any species.",
  "Framing Other Than Non-Load-Bearing Partitions: No. 2 grade, of one of the following species:",
  ">Hem-fir (north); NLGA.",
  ">Southern pine; SPIB.",
  ">Douglas fir-larch; WCLIB or WWPA.",
  ">Spruce-pine-fir; NLGA.",
  "Exposed Framing: Hand-select lumber for uniformity of appearance and freedom from characteristics, on exposed surfaces and edges, that would impair finish appearance, including decay, honeycomb, knot-holes, shake, splits, torn grain, and wane.",
  ">Species and Grade: As indicated for framing, Appearance grade.",
]

[[section.part2]]
title = "ENGINEERED WOOD PRODUCTS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Weyerhaeuser Company.",
  ">Boise Cascade Company.",
  ">LP Building Solutions.",
  ">Roseburg Forest Products.",
  "Laminated-Veneer Lumber (LVL): Structural composite lumber made from wood veneers with grain primarily parallel to member lengths, evaluated and monitored according to ASTM D5456 and manufactured with an exterior-type adhesive complying with ASTM D2559. Extreme Fiber Stress in Bending, Edgewise: 2600 psi for 12-inch nominal-depth members; Modulus of Elasticity, Edgewise: 1,900,000 psi.",
  "Parallel-Strand Lumber (PSL): Structural composite lumber made from wood strand elements with grain primarily parallel to member lengths, evaluated and monitored according to ASTM D5456. Extreme Fiber Stress in Bending, Edgewise: 2900 psi; Modulus of Elasticity, Edgewise: 2,000,000 psi.",
  "Prefabricated Wood I-Joists: Manufactured units fabricated from solid-sawn lumber or structural composite lumber flanges and wood-based structural panel webs, evaluated according to ASTM D5055 and with performance rating PRI-400.",
  ">Provide rim boards, blocking panels, web stiffeners, and hangers as recommended by manufacturer.",
]

[[section.part2]]
title = "MISCELLANEOUS LUMBER"
items = [
  "General: Provide miscellaneous lumber indicated and lumber for support or attachment of other construction, including blocking, nailers, cants, furring, grounds, and sleepers.",
  "Dimension Lumber Items: Construction or No. 2 grade lumber of any species.",
  "Concealed Boards: 15 percent maximum moisture content and the following species and grades: Hem-fir or Spruce-pine-fir, Construction or No. 2 Common grade; or Southern pine, No. 2 grade.",
  "For blocking not used for attachment of other construction, Utility, Stud, or No. 3 grade lumber of any species may be used provided that it is cut and selected to eliminate defects that will interfere with its attachment and purpose.",
  "For blocking and nailers used for attachment of other construction, select and cut lumber to eliminate knots and other defects that will interfere with attachment of other work.",
  "Plywood Backing Panels: For mounting electrical or telephone equipment, provide fire-retardant-treated plywood panels, APA Rated Sheathing, Exposure 1, C-D Plugged, 3/4 inch thick.",
]

[[section.part2]]
title = "FASTENERS"
items = [
  "General: Fasteners shall be of size and type indicated that comply with requirements specified in this article for material and manufacture.",
  ">Where rough carpentry is exposed to weather, in ground contact, pressure-preservative treated, or in area of high relative humidity, provide fasteners with hot-dip zinc coating complying with ASTM A153 or of Type 304 stainless steel.",
  "Nails, Brads, and Staples: ASTM F1667.",
  "Power-Driven Fasteners: Fastener systems with an evaluation report acceptable to authorities having jurisdiction, based on ICC-ES AC70.",
  "Wood Screws: ASME B18.6.1.",
  "Screws for Fastening to Cold-Formed Metal Framing: ASTM C954, except with wafer heads and reamer wings, length as recommended by screw manufacturer for material being fastened.",
  "Lag Bolts: ASME B18.2.1.",
  "Bolts: Steel bolts complying with ASTM A307, Grade A; with ASTM A563 hex nuts and, where indicated, flat washers.",
  "Post-Installed Anchors: Carbon-steel expansion or chemical anchors with capability to sustain, without failure, a load equal to six times the load imposed when installed in unit masonry assemblies and equal to four times the load imposed when installed in concrete, as determined by testing according to ASTM E488 or ASTM E1512.",
]

[[section.part2]]
title = "METAL FRAMING ANCHORS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Simpson Strong-Tie Company, Inc.",
  ">MiTek USA, Inc.",
  ">KC Metals Products, Inc.",
  ">Cleveland Steel Specialty Co.",
  "Allowable Design Loads: Provide products with allowable design loads, as published by manufacturer, that meet or exceed those indicated. Manufacturer's published values shall be determined from empirical data or by rational engineering analysis and demonstrated by comprehensive testing performed by a qualified independent testing agency, and listed in an ICC-ES evaluation report.",
  "Galvanized-Steel Sheet: Hot-dip, zinc-coated steel sheet complying with ASTM A653, G60 coating designation for interior use; G185 coating designation or stainless steel for use with preservative-treated lumber and at exterior locations.",
  "Provide joist hangers, beam hangers, hurricane or seismic ties, post bases and caps, holdowns, strap ties, and other connectors as indicated, of type and size recommended by manufacturer for the application.",
]

[[section.part2]]
title = "MISCELLANEOUS MATERIALS"
items = [
  "Sill-Sealer Gaskets: Glass-fiber-blanket insulation compressible to 1/32 inch thick, or closed-cell neoprene foam, 1/4 inch thick, selected from manufacturer's standard widths to suit width of sill members indicated.",
  "Sill Flashing: Self-adhering rubberized-asphalt sheet or proprietary sill gasket, as capillary break between concrete or masonry and wood sill plates.",
  "Adhesives for Gluing Furring and Sleepers to Concrete or Masonry: Formulation complying with ASTM D3498 that is approved for use indicated by adhesive manufacturer.",
  "Field-Applied Preservative: Copper naphthenate or other preservative complying with AWPA M4, for field treatment of cut surfaces of preservative-treated lumber.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Set rough carpentry to required levels and lines, with members plumb, true to line, cut, and fitted. Fit rough carpentry to other construction; scribe and cope as needed for accurate fit. Locate furring, nailers, blocking, grounds, and similar supports to comply with requirements for attaching other construction.",
  "Framing Standard: Comply with AWC's WCD 1 \"Details for Conventional Wood Frame Construction\" unless otherwise indicated.",
  "Framing with Engineered Wood Products: Install engineered wood products to comply with manufacturer's written instructions.",
  "Install metal framing anchors to comply with manufacturer's written instructions. Install fasteners through each fastener hole.",
  "Do not splice structural members between supports unless otherwise indicated.",
  "Provide blocking and framing as indicated and as required to support facing materials, fixtures, specialty items, cabinets, grab bars, handrails, toilet accessories, and trim.",
  "Provide fire blocking in furred spaces, stud spaces, and other concealed cavities as indicated and as follows:",
  ">Fire block furred spaces of walls, at each floor level, at ceiling, and at not more than 96 inches o.c. with solid wood blocking or noncombustible materials accurately fitted to close furred spaces.",
  ">Fire block concealed spaces of wood-framed walls and partitions at each floor level, at ceiling line of top story, and at not more than 10 feet o.c. vertically and horizontally.",
  ">Fire block concealed spaces between floor sleepers with same material as sleepers to limit concealed spaces to not more than 100 sq. ft. and to solidly fill space below partitions.",
  ">Provide draftstopping as required by {building_code} in concealed floor-ceiling and attic spaces.",
  "Sort and select lumber so that natural characteristics do not interfere with installation or with fastening other materials to lumber. Do not use materials with defects that interfere with function of member or pieces that are too small to use with minimum number of joints or optimum joint arrangement.",
  "Comply with AWPA M4 for applying field treatment to cut surfaces of preservative-treated lumber.",
  "Where wood-preservative-treated lumber is installed adjacent to metal decking, install continuous flexible flashing separator between wood and metal decking.",
  "Securely attach rough carpentry work to substrate by anchoring and fastening as indicated.",
  "Fastening: Comply with fastening schedules in the International Residential Code or the International Building Code, as applicable under {building_code}.",
  "Use steel common nails unless otherwise indicated. Select fasteners of size that will not fully penetrate members where opposite side will be exposed to view or will receive finish materials. Make tight connections between members. Install fasteners without splitting wood. Drive nails snug but do not countersink nail heads unless otherwise indicated.",
]

[[section.part3]]
title = "WOOD GROUND, SLEEPER, BLOCKING, AND NAILER INSTALLATION"
items = [
  "Install where indicated and where required for attaching other work. Form to shapes indicated and cut as required for true line and level of attached work. Coordinate locations with other work involved.",
  "Attach items to substrates to support applied loading. Recess bolts and nuts flush with surfaces unless otherwise indicated.",
  "Where wood nailers are indicated at roof edges and curbs, install to thickness of roof insulation, and anchor to resist uplift per FM Global Property Loss Prevention Data Sheet 1-49, where applicable.",
]

[[section.part3]]
title = "WALL AND PARTITION FRAMING INSTALLATION"
items = [
  "General: Arrange studs so wide faces are perpendicular to direction of wall or partition and narrow faces are flush with surfaces of wall or partition. Provide single bottom plate and double top plates using members of 2-inch nominal thickness whose widths equal that of studs, except single top plate may be used for non-load-bearing partitions.",
  ">Fasten plates to supporting construction unless otherwise indicated.",
  ">For exterior walls, provide 2-by-6-inch nominal-size wood studs spaced 16 inches o.c. unless otherwise indicated.",
  ">For interior partitions and walls, provide 2-by-4-inch nominal-size wood studs spaced 16 inches o.c. unless otherwise indicated.",
  ">Provide continuous horizontal blocking at midheight of partitions more than 96 inches high, using members of 2-inch nominal thickness and of same width as wall or partitions.",
  "Construct corners and intersections with three or more studs, except that two studs may be used for interior non-load-bearing partitions; use insulated or ladder-blocked corners where energy code requires.",
  "Frame openings with multiple studs and headers. Provide nailed header members of thickness equal to width of studs. Support headers on jamb studs.",
  ">For non-load-bearing partitions, provide double-jamb studs and headers not less than 4-inch nominal depth for openings 48 inches and less in width, 6-inch nominal depth for openings 48 to 72 inches in width, 8-inch nominal depth for openings 72 to 120 inches in width, and not less than 10-inch nominal depth for openings 10 to 12 feet in width.",
  ">For load-bearing walls, provide double-jamb studs for openings 72 inches and less in width, and triple-jamb studs for wider openings. Provide headers of depth indicated or, if not indicated, sized per {building_code} header tables.",
  "Anchor sill plates to foundations with anchor bolts or approved straps at spacing indicated, over sill-sealer gasket and sill flashing.",
  "Install shear walls, holdowns, and straps where indicated, with nailing as scheduled on structural Drawings.",
]

[[section.part3]]
title = "FLOOR JOIST FRAMING INSTALLATION"
items = [
  "General: Install floor joists with crown edge up and support ends of each member with not less than 1-1/2 inches of bearing on wood or metal, or 3 inches on masonry. Attach floor joists as follows:",
  ">Where supported on wood members, by toe nailing or by using metal framing anchors.",
  ">Where framed into wood supporting members, by using wood ledgers as indicated or, if not indicated, by using metal joist hangers.",
  "Do not notch in middle third of joists; limit notches to one-sixth depth of joist, one-third at ends. Do not bore holes larger than one-third depth of joist; do not locate closer than 2 inches from top or bottom.",
  "Provide solid blocking of 2-inch nominal thickness by depth of joist at ends of joists unless nailed to header or band.",
  "Lap members framing from opposite sides of beams, girders, or partitions not less than 4 inches or securely tie opposing members together. Provide solid blocking of 2-inch nominal thickness by depth of joist over supports.",
  "Provide solid blocking between joists under jamb studs for openings.",
  "Under non-load-bearing partitions, provide double joists separated by solid blocking equal to depth of studs above. Provide triple joists separated as above, under partitions receiving ceramic tile and similar heavy finishes or fixtures.",
  "Provide bridging of type indicated below, at intervals of 96 inches o.c., between joists: diagonal wood bridging formed from bevel-cut, 1-by-3-inch nominal-size boards nailed together at crossings; or steel bridging installed to comply with bridging manufacturer's written instructions.",
]

[[section.part3]]
title = "CEILING JOIST AND RAFTER FRAMING INSTALLATION"
items = [
  "Ceiling Joists: Install ceiling joists with crown edge up and complying with requirements specified above for floor joists. Face nail to ends of parallel rafters.",
  "Rafters: Notch to fit exterior wall plates and toe nail or use metal framing anchors. Double rafters to form headers and trimmers at openings in roof framing, if any, and support with metal hangers. Where rafters abut at ridge, place directly opposite each other and nail to ridge members or use metal ridge hangers.",
  ">At valleys, provide double-valley rafters of size indicated or, if not indicated, of same thickness as regular rafters and 2 inches deeper. Bevel ends of jack rafters for full bearing against valley rafters.",
  ">At hips, provide hip rafter of size indicated or, if not indicated, of same thickness as regular rafters and 2 inches deeper. Bevel ends of jack rafters for full bearing against hip rafter.",
  "Provide collar beams (ties) as indicated or, if not indicated, provide 1-by-6-inch nominal-size boards between every third pair of rafters, or rafter ties as required by {building_code}.",
  "Install hurricane or seismic ties at each rafter-to-plate connection where indicated or required by code for uplift.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Protect wood that has been treated with inorganic boron (SBX) from weather. If, despite protection, inorganic boron-treated wood becomes wet, apply EPA-registered borate treatment. Apply borate solution by spraying to comply with EPA-registered label.",
  "Protect rough carpentry from weather. If, despite protection, rough carpentry becomes sufficiently wet that moisture content exceeds that specified, apply EPA-registered borate treatment and allow to dry to 19 percent or less before enclosing.",
]

[[section]]
number = "06 16 00"
title = "SHEATHING"
when = ["wood_framing"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Wall sheathing.",
  ">Roof sheathing.",
  ">Subflooring.",
  ">Sheathing joint and penetration treatment.",
  "Related Requirements:",
  ">Section 06 10 00 \"Rough Carpentry\" for plywood backing panels.",
  ">Section 07 25 00 \"Weather Barriers\" for water-resistive barrier applied over wall sheathing.",
  ">Section 09 29 00 \"Gypsum Board\" for gypsum sheathing used as interior finish.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of process and factory-fabricated product. Indicate component materials and dimensions and include construction and application details.",
  ">Include data for fire-retardant treatment from chemical treatment manufacturer and certification by treating plant that treated plywood complies with requirements, where fire-retardant-treated sheathing is indicated.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Evaluation Reports: For wood-based structural-use panels with integral water-resistive barrier, fire-retardant-treated plywood, and power-driven fasteners, from ICC-ES.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Stack panels flat with spacers beneath and between each bundle to provide air circulation. Protect sheathing from weather by covering with waterproof sheeting, securely anchored. Provide for air circulation around stacks and under coverings.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Fire-Resistance Ratings: As tested according to ASTM E119; testing by a qualified testing agency, for assemblies indicated.",
  "Structural Performance: Provide sheathing and fastening to comply with shear wall and diaphragm nailing schedules on structural Drawings and {building_code}.",
]

[[section.part2]]
title = "WOOD PANEL PRODUCTS"
items = [
  "Plywood: Either DOC PS 1 or DOC PS 2 unless otherwise indicated.",
  "Oriented Strand Board (OSB): DOC PS 2.",
  "Factory mark panels to indicate compliance with applicable standard.",
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Huber Engineered Woods LLC.",
  ">LP Building Solutions.",
  ">Weyerhaeuser Company.",
  ">Georgia-Pacific Wood Products LLC.",
]

[[section.part2]]
title = "WALL SHEATHING"
items = [
  "Plywood or OSB Wall Sheathing: Exposure 1, Structural I sheathing where shear walls are indicated; otherwise APA Rated Sheathing.",
  ">Span Rating: Not less than 24/16.",
  ">Nominal Thickness: Not less than 7/16 inch; 15/32 inch at shear walls unless otherwise indicated.",
  "OSB Wall Sheathing with Integral Water-Resistive Barrier: DOC PS 2, Exposure 1, with factory-laminated, water-resistive overlay, recognized in an ICC-ES evaluation report as a water-resistive barrier, where indicated.",
  ">Seam Tape: Manufacturer's standard self-adhering tape for sealing joints and penetrations.",
  "Glass-Mat Gypsum Wall Sheathing: ASTM C1177, Type X, 5/8 inch thick, where indicated for fire-resistance-rated exterior walls.",
]

[[section.part2]]
title = "ROOF SHEATHING"
items = [
  "Plywood or OSB Roof Sheathing: Exposure 1, Structural I sheathing.",
  ">Span Rating: Not less than 40/20 for 24-inch rafter or truss spacing.",
  ">Nominal Thickness: Not less than 19/32 inch, unless otherwise indicated.",
  ">Edge Support: Tongue-and-groove edges or panel clips at unsupported edges, as required by span rating.",
  "Fire-Retardant-Treated Plywood Roof Sheathing: Where indicated, exterior-type fire-retardant-treated plywood complying with requirements in Section 06 10 00 \"Rough Carpentry.\"",
]

[[section.part2]]
title = "SUBFLOORING"
items = [
  "Plywood or OSB Combination Subfloor-Underlayment: APA Rated Sturd-I-Floor, Exposure 1, single-floor panels with tongue-and-groove edges.",
  ">Span Rating: Not less than 24 inches o.c.",
  ">Nominal Thickness: Not less than 23/32 inch.",
  "Subfloor Adhesive: APA AFG-01 or ASTM D3498, solvent-free formulation compatible with panels.",
]

[[section.part2]]
title = "FASTENERS"
items = [
  "General: Provide fasteners of size and type indicated that comply with requirements specified in this article for material and manufacture.",
  ">For wall and roof sheathing, provide fasteners with hot-dip zinc coating complying with ASTM A153 at exterior exposure and where treated wood is fastened.",
  "Nails, Brads, and Staples: ASTM F1667.",
  "Power-Driven Fasteners: Fastener systems with an evaluation report acceptable to authorities having jurisdiction, based on ICC-ES AC70.",
  "Screws for Fastening Sheathing to Wood Framing: ASTM C1002.",
  "Screws for Fastening Gypsum Sheathing to Cold-Formed Metal Framing: Steel drill screws, in length recommended by sheathing manufacturer for thickness of sheathing to be attached, complying with ASTM C1513, corrosion-resistant coated.",
]

[[section.part2]]
title = "SHEATHING JOINT-AND-PENETRATION TREATMENT MATERIALS"
items = [
  "Sealant for Glass-Mat Gypsum Sheathing: Elastomeric, medium-modulus, neutral-curing silicone joint sealant compatible with joint substrates formed by gypsum sheathing and other materials, recommended by sheathing manufacturer for application indicated and complying with requirements for elastomeric sealants in Section 07 92 00 \"Joint Sealants.\"",
  "Sheathing Tape: Pressure-sensitive, self-adhering tape recommended by sheathing or water-resistive barrier manufacturer.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Do not use materials with defects that impair quality of sheathing or pieces that are too small to use with minimum number of joints or optimum joint arrangement. Arrange joints so that pieces do not span between fewer than three support members.",
  "Cut panels at penetrations, edges, and other obstructions of work; fit tightly against abutting construction unless otherwise indicated.",
  "Securely attach to substrate by fastening as indicated, complying with the following:",
  ">Fastening schedules on structural Drawings for shear walls and diaphragms.",
  ">Fastening schedules in the International Residential Code or the International Building Code, as applicable under {building_code}, where not indicated.",
  "Use common wire nails unless otherwise indicated. Select fasteners of size that will not penetrate members where opposite side will be exposed to view or will receive finish materials. Make tight connections. Install fasteners without splitting wood. Do not overdrive nails into panel face.",
  "Coordinate wall and roof sheathing installation with flashing and joint-sealant installation so these materials are installed in sequence and manner that prevent exterior moisture from passing through completed assembly.",
  "Do not bridge building expansion joints; cut and space edges of panels to match spacing of structural support elements.",
]

[[section.part3]]
title = "WOOD STRUCTURAL PANEL INSTALLATION"
items = [
  "General: Comply with applicable recommendations in APA Form No. E30 \"Engineered Wood Construction Guide,\" for types of structural-use panels and applications indicated.",
  "Fastening Methods: Fasten panels as indicated below:",
  ">Subflooring: Glue and nail to wood framing, or glue and screw where indicated. Space panels 1/8 inch apart at edges and ends.",
  ">Wall and Roof Sheathing: Nail to wood framing; space panels 1/8 inch apart at edges and ends. Unless otherwise indicated, space nails 6 inches o.c. at panel edges and 12 inches o.c. at intermediate supports.",
  ">Install roof sheathing with long dimension perpendicular to framing and end joints staggered; provide panel clips at unsupported edges.",
  "Protect subflooring and sheathing from exposure to weather until covered by roofing or water-resistive barrier.",
]

[[section.part3]]
title = "GYPSUM SHEATHING INSTALLATION"
items = [
  "Comply with GA-253 and with manufacturer's written instructions.",
  ">Fasten gypsum sheathing to wood framing with screws or nails; fasten to cold-formed metal framing with screws.",
  ">Install panels with a 3/8-inch gap where non-load-bearing construction abuts structural elements.",
  ">Install panels with a 1/4-inch gap where they abut masonry or similar materials that might retain moisture, to prevent wicking.",
  "Apply fasteners so heads bear tightly against face of sheathing, but do not cut into facing.",
  "Horizontal Installation: Install sheathing with V-grooved edge down and tongue edge up. Interlock tongue with groove to bring long edges in contact with edges of adjacent panels without forcing. Abut ends over centers of studs, and stagger end joints of adjacent panels not less than one stud spacing.",
  "Seal sheathing joints and penetrations according to sheathing manufacturer's written instructions, where sheathing is used as the air barrier.",
]

[[section]]
number = "06 17 53"
title = "SHOP-FABRICATED WOOD TRUSSES"
when = ["wood_trusses"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Wood roof trusses.",
  ">Wood floor trusses.",
  ">Wood girder trusses.",
  ">Truss bracing and metal truss accessories.",
  "Related Requirements:",
  ">Section 06 10 00 \"Rough Carpentry\" for dimension lumber items associated with wood trusses.",
  ">Section 06 16 00 \"Sheathing\" for roof sheathing and subflooring.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Metal-Plate-Connected Wood Trusses: Planar structural units consisting of metal-plate-connected members fabricated from dimension lumber and cut and assembled before delivery to Project site.",
  "TPI: Truss Plate Institute.",
  "Truss Designer: The qualified professional engineer responsible for design of individual trusses, working for the truss manufacturer.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For metal-plate connectors, metal truss accessories, and fasteners.",
  "Shop Drawings: Show fabrication and installation details for trusses.",
  ">Show location, pitch, spacing, span, camber, configuration, and identification for each truss type and for each truss.",
  ">Indicate sizes, stress grades, and species of lumber.",
  ">Indicate locations of permanent bracing required to prevent buckling of individual truss members due to design loads.",
  ">Indicate type, size, material, finish, design values, orientation, and location of metal connector plates.",
  ">Show splice details and bearing details.",
  "Delegated-Design Submittal: For metal-plate-connected wood trusses, including truss design drawings and analysis data signed and sealed by the qualified professional engineer responsible for their preparation.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For fabricator.",
  "Product Certificates: For metal-plate-connected wood trusses, signed by officer of truss-fabricating firm.",
  "Evaluation Reports: For the following, from ICC-ES: metal-plate connectors and metal truss accessories.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Fabricator Qualifications: Shop that participates in a recognized quality-assurance program that complies with quality-control procedures in TPI 1 and that involves third-party inspection by an independent testing and inspecting agency acceptable to Architect and authorities having jurisdiction.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Handle and store trusses to comply with recommendations in SBCA BCSI \"Guide to Good Practice for Handling, Installing, Restraining and Bracing of Metal Plate Connected Wood Trusses.\"",
  ">Store trusses flat, off of ground, and adequately supported to prevent lateral bending.",
  ">Protect trusses from weather by covering with waterproof sheeting, securely anchored.",
  ">Provide for air circulation around stacks and under coverings.",
  "Inspect trusses showing discoloration, corrosion, or other evidence of deterioration. Discard and replace trusses that are damaged or defective.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Delegated Design: Engage a qualified professional engineer to design metal-plate-connected wood trusses.",
  "Structural Performance: Metal-plate-connected wood trusses shall be capable of withstanding design loads within limits and under conditions indicated. Comply with requirements in TPI 1 unless more stringent requirements are specified below.",
  ">Design Loads: As indicated on structural Drawings and as required by {building_code}, including dead, live, snow, wind uplift, and mechanical equipment loads.",
  ">Maximum Deflection under Design Loads: Roof trusses, vertical deflection of 1/360 of span for live load and 1/240 for total load; floor trusses, vertical deflection of 1/480 of span for live load and 1/360 for total load.",
  "Construction Details: Comply with AWC \"National Design Specification for Wood Construction\" and TPI 1 \"National Design Standard for Metal Plate Connected Wood Truss Construction.\"",
]

[[section.part2]]
title = "DIMENSION LUMBER"
items = [
  "Lumber: DOC PS 20 and applicable rules of grading agencies indicated. Factory mark each piece of lumber with grade stamp of grading agency.",
  ">Maximum Moisture Content: 19 percent.",
  "Minimum Chord Size for Roof Trusses: 2 by 4 inches nominal for both top and bottom chords.",
  "Minimum Chord Size for Floor Trusses: 2 by 4 inches nominal, flat orientation.",
  "Machine-Stress-Rated Lumber: Where required by design, lumber stress rated according to grading rules of agency indicated.",
]

[[section.part2]]
title = "METAL CONNECTOR PLATES"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">MiTek USA, Inc.",
  ">Alpine; an ITW company.",
  ">Eagle Metal Products.",
  "General: Fabricate connector plates to comply with TPI 1.",
  "Hot-Dip Galvanized-Steel Sheet: ASTM A653, Structural Steel (SS), high-strength low-alloy steel Type A (HSLAS Type A), or high-strength low-alloy steel Type B (HSLAS Type B); G60 coating designation; and not less than 0.036 inch thick.",
  ">Use for interior locations unless otherwise indicated.",
  "Stainless-Steel Sheet: ASTM A666, Type 304, for trusses in exposed exterior or high-humidity locations.",
]

[[section.part2]]
title = "FASTENERS AND ACCESSORIES"
items = [
  "Fasteners: Provide fasteners for anchoring trusses and attaching accessories, with hot-dip zinc coating complying with ASTM A153 at exterior and treated-lumber locations.",
  "Nails, Brads, and Staples: ASTM F1667.",
  "Metal Truss Accessories: Provide truss tiedowns, hurricane ties, girder truss hangers, truss hangers, and truss spacers, galvanized steel sheet, ASTM A653, G60 minimum, with allowable design loads per ICC-ES evaluation report.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Simpson Strong-Tie Company, Inc.",
  ">>MiTek USA, Inc.",
  ">>KC Metals Products, Inc.",
  "Permanent Bracing: Continuous lateral restraint and diagonal bracing of dimension lumber or proprietary metal bracing, as indicated on truss design drawings and per SBCA BCSI.",
]

[[section.part2]]
title = "FABRICATION"
items = [
  "Assemble truss members in design configuration indicated; use jigs or other means to ensure uniformity and accuracy of assembly with close-fitting joints. Cut truss members to accurate lengths, angles, and sizes to produce close-fitting joints.",
  "Connect truss members by metal connector plates located and securely embedded simultaneously in both sides of wood members by air or hydraulic press.",
  "Fabricate wood trusses within manufacturing tolerances in TPI 1.",
  "Label each truss with identification matching Shop Drawings.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install wood trusses only after supporting construction is in place and is braced and secured.",
  "If trusses are delivered to Project site in more than one piece, assemble trusses before installing.",
  "Hoist trusses in place by lifting equipment suited to sizes and types of trusses required, exercising care not to damage truss members or joints by out-of-plane bending or other causes.",
  "Install trusses plumb, square, and true to line and securely fasten to supporting construction.",
  "Space trusses as indicated; adjust and align trusses in location before permanently fastening.",
  "Anchor trusses securely at bearing points; use metal truss tiedowns or hurricane ties. Install fasteners through each fastener hole in metal framing anchors according to manufacturer's fastening schedules and written instructions.",
  "Securely connect each truss ply required for forming built-up girder trusses.",
  ">Anchor trusses to girder trusses as indicated.",
  "Install and fasten permanent bracing during truss erection and before construction loads are applied. Anchor ends of permanent bracing where terminating at walls or beams.",
  ">Install bracing to comply with Section 06 10 00 \"Rough Carpentry.\"",
  ">Install and fasten strongback bracing vertically against vertical web of parallel-chord floor trusses at centers indicated.",
  "Install wood trusses within installation tolerances in TPI 1.",
  "Do not alter trusses in field. Do not cut, drill, notch, or remove truss members.",
  "Replace wood trusses that are damaged or do not comply with requirements. Damaged trusses may be repaired according to truss repair details signed and sealed by the qualified professional engineer responsible for truss design, when approved by the Architect.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Special Inspections: The Owner will engage a special inspector to verify truss installation and permanent bracing where required by {building_code} for trusses spanning 60 feet or more.",
  "Correct deficiencies in Work that inspections indicate do not comply with the Contract Documents.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Protect wood trusses from weather. If, despite protection, wood trusses become wet, apply EPA-registered borate treatment and allow to dry before enclosing.",
  "Do not stack construction materials on trusses beyond the limits recommended in SBCA BCSI.",
]

