  "Fire-Resistance Ratings: Where fire-resistance-rated construction is indicated, units shall be listed and labeled by a qualified testing agency or shall comply with ACI 216.1/TMS 216.1 for equivalent thickness.",
]

[[section.part2]]
title = "CONCRETE MASONRY UNITS"
