  "CMUs: ASTM C90, normal weight, 115 pcf or more.",
  ">Unit Compressive Strength: Provide units with minimum average net-area compressive strength of 2000 psi.",
  ">Size (Width): Manufactured to dimensions 3/8 inch less than nominal dimensions; 8 inch nominal unless otherwise indicated.",
