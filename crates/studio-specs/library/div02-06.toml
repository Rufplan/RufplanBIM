[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Delegated Design: Engage a qualified professional engineer to design metal stairs.",
  "Structural Performance of Stairs: Metal stairs shall withstand the effects of gravity loads and the following loads and stresses within limits and under conditions indicated:",
  ">Uniform Load: 100 lbf/sq. ft.",
  ">Concentrated Load: 300 lbf applied on an area of 4 sq. in.",
  ">Uniform and concentrated loads need not be assumed to act concurrently.",
  ">Stair Framing: Capable of withstanding stresses resulting from railing loads in addition to loads specified above.",
  ">Limit deflection of treads, platforms, and framing members to L/360 or 1/4 inch, whichever is less.",
  "Structural Performance of Railings: Railings shall withstand a concentrated load of 200 lbf applied in any direction at any point on the top rail, and a uniform load of 50 lbf/ft. applied in any direction; infill shall withstand a concentrated load of 50 lbf applied horizontally on an area of 1 sq. ft.",
  "Stair Geometry: Comply with {building_code} for riser height, tread depth, headroom, landing length, and handrail height and extensions; include accessible stair requirements of ICC A117.1.",
  "Seismic Performance: Metal stairs shall withstand the effects of earthquake motions determined according to ASCE/SEI 7.",
]

[[section.part2]]
title = "METALS"
items = [
  "Steel Plates, Shapes, and Bars: ASTM A36.",
  "Steel Tubing for Railings: ASTM A500, Grade C, or ASTM A513.",
  "Uncoated, Cold-Rolled Steel Sheet: ASTM A1008, either commercial steel, Type B, or structural steel, Grade 25, unless another grade is required by design loads.",
  "Uncoated, Hot-Rolled Steel Sheet: ASTM A1011, either commercial steel, Type B, or structural steel, Grade 30, unless another grade is required by design loads.",
  "Metallic-Coated Steel Sheet: ASTM A653, G90 coating, for exterior stairs.",
]

[[section.part2]]
title = "ABRASIVE NOSINGS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">American Safety Tread Co., Inc.",
  ">Balco, Inc.",
  ">Wooster Products Inc.",
  ">Nystrom, Inc.",
  "Cast-Metal Units: Cast aluminum with an integral-abrasive, as-cast finish consisting of aluminum oxide, silicon carbide, or a combination of both, 3 inches wide, with contrasting color stripe where required by {building_code}.",
  "Provide anchors for embedding units in concrete, either integral or applied to units, as standard with manufacturer.",
]

[[section.part2]]
title = "MISCELLANEOUS MATERIALS"
items = [
  "Fasteners: Provide zinc-plated fasteners with coating complying with ASTM B633, Class Fe/Zn 12, for exterior use, and Class Fe/Zn 5 where built into exterior walls.",
  "Post-Installed Anchors: Torque-controlled expansion anchors or chemical anchors, as specified in Section 05 50 00 \"Metal Fabrications.\"",
  "Universal Shop Primer: Fast-curing, lead- and chromate-free, universal modified-alkyd primer complying with MPI 79.",
  "Concrete Materials and Properties: Comply with requirements in Section 03 30 00 \"Cast-in-Place Concrete\" for normal-weight, air-entrained, ready-mix concrete with a minimum 28-day compressive strength of 3000 psi unless otherwise indicated.",
  "Welded Wire Reinforcement: ASTM A1064, 6 by 6 inches, W1.4 by W1.4, unless otherwise indicated.",
  "Nonshrink, Nonmetallic Grout: ASTM C1107.",
]

[[section.part2]]
title = "FABRICATION, GENERAL"
items = [
  "Provide complete stair assemblies, including metal framing, hangers, struts, clips, brackets, bearing plates, and other components necessary to support and anchor stairs and platforms on supporting structure.",
  ">Join components by welding unless otherwise indicated.",
  ">Use connections that maintain structural value of joined pieces.",
  "Shop Assembly: Preassemble items in the shop to greatest extent possible.",
  "Weld connections to comply with the following: Use materials and methods that minimize distortion and develop strength and corrosion resistance of base metals; obtain fusion without undercut or overlap; remove welding flux immediately; weld exposed corners and seams continuously unless otherwise indicated.",
  ">Finish exposed welds to comply with NOMMA Guideline 1, Finish #2, completely sanded joint, some undercutting and pinholes are okay.",
]

[[section.part2]]
title = "STEEL-FRAMED STAIRS"
items = [
  "Stair Framing: Fabricate stringers of steel channels or rectangular steel tubes, 12 inches deep minimum or as required by design.",
  ">Provide closures for exposed ends of channel stringers.",
  ">Construct platforms of steel channel headers and miscellaneous framing members as required by design.",
  ">Weld stringers to headers; weld framing members to stringers and headers.",
  ">Where stairs are enclosed by gypsum board assemblies, provide hanger rods or struts to support landings from floor construction above or below. Locate hanger rods and struts where they will not encroach on required stair width and will be within the fire-resistance-rated stair enclosure.",
  "Metal Pan Stairs: Form risers, subtread pans, and subplatforms to configurations shown from steel sheet of thickness needed to comply with performance requirements, but not less than 0.067 inch.",
  ">Steel Sheet: Uncoated, cold-rolled steel sheet for interior stairs; galvanized steel sheet for exterior stairs.",
  ">Directly weld metal pans to stringers; locate welds on top of subtreads where they will be concealed by concrete fill. Do not weld risers to stringers.",
  ">Shape metal pans to include nosing integral with riser.",
  ">Provide sloped riser closures and pan closures so there are no open risers, as required by {building_code}.",
  ">Provide subplatforms of configuration indicated or, if not indicated, the same as subtreads. Weld subplatforms to platform framing.",
]

[[section.part2]]
title = "STAIR RAILINGS"
items = [
  "Comply with applicable requirements in Section 05 52 13 \"Pipe and Tube Railings.\"",
  "Steel Tube Railings: Top rail 1-1/2-inch OD or 1-1/4-by-1-1/4-inch tubing, guards 42 inches high, handrails 34 to 38 inches above nosings, with infill that will not pass a 4-inch sphere.",
  ">Rails and Posts: 1-5/8-inch-diameter top and bottom rails and 1-1/2-inch-square posts, unless otherwise indicated.",
  ">Picket Infill: 1/2-inch-square pickets spaced less than 4 inches clear.",
  "Wall-mounted handrails with 1-1/2-inch clearance to wall, supported by brackets at not more than 48 inches o.c.",
]

[[section.part2]]
title = "FINISHES"
items = [
  "Finish metal stairs after assembly.",
  "Preparation for Shop Priming: Prepare uncoated ferrous-metal surfaces to comply with SSPC-SP 3 \"Power Tool Cleaning.\"",
  "Apply shop primer to uncoated surfaces of metal stair components, except those with galvanized finishes and those to be embedded in concrete or masonry, to comply with SSPC-PA 1.",
  "Galvanizing: Hot-dip galvanize exterior stairs according to ASTM A123.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Fastening to In-Place Construction: Provide anchorage devices and fasteners where necessary for securing metal stairs to in-place construction.",
  "Cutting, Fitting, and Placement: Perform cutting, drilling, and fitting required for installing metal stairs. Set units accurately in location, alignment, and elevation, measured from established lines and levels and free of rack.",
  "Install metal stairs by welding stair framing to steel structure or to weld plates cast into concrete unless otherwise indicated.",
  "Provide temporary bracing or anchors in formwork for items that are to be built into concrete, masonry, or similar construction.",
  "Fit exposed connections accurately together to form hairline joints.",
  "Field Welding: Comply with requirements for welding in \"Fabrication, General\" Article.",
  "Place and finish concrete fill for treads and platforms to comply with Section 03 30 00 \"Cast-in-Place Concrete.\" Install abrasive nosings with anchors fully embedded in concrete; center nosings on tread width.",
  "Install railings to comply with requirements in Section 05 52 13 \"Pipe and Tube Railings.\"",
]

[[section.part3]]
title = "ADJUSTING AND CLEANING"
items = [
  "Touchup Painting: Immediately after erection, clean field welds, bolted connections, and abraded areas of shop paint, and paint exposed areas with same material as used for shop priming to comply with SSPC-PA 1.",
  "Galvanized Surfaces: Clean field welds, bolted connections, and abraded areas and repair galvanizing to comply with ASTM A780.",
  "Protect abrasive nosings and treads from damage until Substantial Completion.",
]

[[section]]
number = "05 52 13"
title = "PIPE AND TUBE RAILINGS"
when = ["railings"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Steel pipe and tube railings and guards.",
  ">Stainless-steel handrails, where indicated.",
  ">Wall-mounted handrails.",
  "Related Requirements:",
  ">Section 05 51 00 \"Metal Stairs\" for railings attached to metal stairs.",
  ">Section 06 43 13 \"Wood Stairs\" for wood railings.",
  ">Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting\" for field painting of railings.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For manufactured products, including railing brackets, fittings, grout, anchoring cement, and paint products.",
  "Shop Drawings: Include plans, elevations, sections, details, and attachments to other work. Show post spacing, anchorage, and blocking in walls.",
  "Samples: For each type of exposed finish required, 6 inches long.",
  "Delegated-Design Submittal: For railings, including analysis data signed and sealed by the qualified professional engineer responsible for their preparation.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For professional engineer.",
  "Welding certificates.",
  "Product Test Reports: For post-installed anchors, from ICC-ES or a qualified testing agency.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Welding Qualifications: Qualify procedures and personnel according to AWS D1.1 \"Structural Welding Code - Steel\" and AWS D1.6 \"Structural Welding Code - Stainless Steel.\"",
  "Mockups: Build a mockup of typical railing, 8 feet long, including post, top rail, infill, and end termination, to verify selections and to demonstrate aesthetic effects.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Field Measurements: Verify actual locations of walls and other construction contiguous with railings by field measurements before fabrication.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Delegated Design: Engage a qualified professional engineer to design railings, including attachment to building construction.",
  "Structural Performance: Railings, including attachment to building construction, shall withstand the effects of gravity loads and the following loads and stresses within limits and under conditions indicated:",
  ">Handrails and Top Rails of Guards: Uniform load of 50 lbf/ft. applied in any direction, and concentrated load of 200 lbf applied in any direction; uniform and concentrated loads need not be assumed to act concurrently.",
  ">Infill of Guards: Concentrated load of 50 lbf applied horizontally on an area of 1 sq. ft.",
  "Thermal Movements: Allow for thermal movements from ambient and surface temperature changes, based on a temperature change of 120 deg F ambient and 180 deg F material surfaces.",
  "Geometry: Comply with {building_code} and ICC A117.1: guards not less than 42 inches high (36 inches in dwelling units where permitted); handrails 34 to 38 inches above walking surface and stair nosings; openings in guards that will not pass a 4-inch sphere; handrail extensions at top and bottom of stairs and ramps.",
]

[[section.part2]]
title = "METALS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide railing fittings and brackets by one of the following:",
  ">Julius Blum & Co., Inc.",
  ">Wagner, R & B, Inc.",
  ">Hollaender Manufacturing Company.",
  "Steel and Iron: Tubing, ASTM A500 (cold formed) or ASTM A513; pipe, ASTM A53, Type F or Type S, Grade A, Standard Weight (Schedule 40); plates, shapes, and bars, ASTM A36.",
  "Stainless Steel: Tubing, ASTM A554, Grade MT 304; pipe, ASTM A312, Grade TP 304; castings, ASTM A743, Grade CF 8 or CF 20.",
  "Handrail Profile: 1-1/2-inch outside diameter, or noncircular with perimeter not less than 4 inches and not more than 6-1/4 inches and maximum cross-section dimension of 2-1/4 inches.",
  "Brackets, Flanges, and Anchors: Cast or formed metal of same type of material and finish as supported rails unless otherwise indicated.",
]

[[section.part2]]
title = "MISCELLANEOUS MATERIALS"
items = [
  "Fasteners: Provide fasteners of same basic metal as fastened metal unless otherwise indicated. Do not use metals that are corrosive or incompatible with materials joined. Use Phillips flat-head (countersunk) fasteners for exposed fasteners.",
  "Post-Installed Anchors: Torque-controlled expansion anchors or chemical anchors capable of sustaining, without failure, a load equal to four times the load imposed when installed in concrete, as determined by testing according to ASTM E488.",
  "Shop Primer: MPI 79, lead- and chromate-free universal alkyd primer, compatible with finish coats specified in Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting.\"",
  "Nonshrink, Nonmetallic Grout: ASTM C1107, factory-packaged, recommended by manufacturer for exterior applications.",
  "Anchoring Cement: Factory-packaged, nonshrink, nonstaining, hydraulic-controlled expansion cement formulation for mixing with potable water at Project site to create pourable anchoring, patching, and grouting compound.",
]

[[section.part2]]
title = "FABRICATION"
items = [
  "General: Fabricate railings to comply with requirements indicated for design, dimensions, member sizes and spacing, details, finish, and anchorage, but not less than that needed to withstand indicated loads.",
  "Assemble railings in the shop to greatest extent possible to minimize field splicing and assembly. Clearly mark units for reassembly and coordinated installation.",
  "Welded Connections: Cope components at connections to provide close fit, or use fittings designed for this purpose. Weld all around at connections, including at fittings.",
  ">Obtain fusion without undercut or overlap; remove flux immediately.",
  ">At exposed connections, finish exposed surfaces smooth and blended so no roughness shows after finishing and welded surface matches contours of adjoining surfaces, to NOMMA Guideline 1, Finish #1.",
  "Form changes in direction by bending or by inserting prefabricated elbow fittings, with bends of uniform radius, free from buckles and twists.",
  "Close exposed ends of railing members with prefabricated end fittings; return ends of handrails to wall or post, with clearance not more than 1/4 inch.",
  "Provide weep holes or another means to evacuate entrapped water in hollow sections of exterior railing members.",
  "Toe Boards: Where indicated, provide toe boards at railings around openings and at edge of open-sided floors and platforms, 4 inches high.",
]

[[section.part2]]
title = "FINISHES"
items = [
  "Steel Railings, Exterior: Hot-dip galvanize after fabrication according to ASTM A123, and prepare for field painting according to SSPC-SP 16.",
  "Steel Railings, Interior: Prepare surfaces according to SSPC-SP 3 and shop prime to comply with SSPC-PA 1.",
  "Stainless Steel: Directional satin finish, No. 4; grind and polish welds to match.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine plaster and gypsum board assemblies, where reinforced to receive anchors, to verify that locations of concealed reinforcements have been clearly marked for Installer.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Fit exposed connections together to form tight, hairline joints.",
  "Perform cutting, drilling, and fitting required for installing railings. Set railings accurately in location, alignment, and elevation; measured from established lines and levels and free of rack.",
  ">Set posts plumb within a tolerance of 1/16 inch in 3 feet.",
  ">Align rails and handrails so variations from level for horizontal members and variations from parallel with rake of stairs and ramps for sloping members do not exceed 1/4 inch in 12 feet.",
  "Anchor posts in concrete by inserting into preset metal pipe sleeves and filling annular space with nonshrink grout or anchoring cement, sloped to shed water; or by base plates with post-installed anchors.",
  "Attach handrails to walls with wall brackets. Locate brackets at spacing required to support structural loads, not more than 48 inches o.c.",
  ">For wood stud partitions, use hanger or lag bolts set into wood backing between studs.",
  ">For steel-framed partitions, use self-tapping screws fastened to steel backing plates or blocking.",
  ">For concrete and solid masonry anchorage, use post-installed anchors.",
  "Install expansion joints at intervals not more than 40 feet in exterior railings, and where railings cross building expansion joints.",
]

[[section.part3]]
title = "ADJUSTING AND CLEANING"
items = [
  "Clean by washing thoroughly with clean water and soap and rinsing with clean water.",
  "Touch up shop primer and repair galvanizing according to ASTM A780 immediately after installation.",
  "Protect finishes of railings from damage during construction period with temporary protective coverings approved by railing manufacturer.",
]

[[section]]
