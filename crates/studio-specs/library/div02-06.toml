  "Repair damaged and defective cabinets, where possible, to eliminate functional and visual defects. Where not possible to repair, replace woodwork. Adjust joinery for uniform appearance.",
  "Adjust cabinet doors, drawers, hardware, fixtures, and other moving or operating parts to function smoothly and correctly.",
  "Clean cabinets on exposed and semiexposed surfaces. Touch up shop-applied finishes to restore damaged or soiled areas.",
  "Protect cabinets from damage until Substantial Completion.",
]

[[section]]
number = "06 41 16"
title = "PLASTIC-LAMINATE-FACED ARCHITECTURAL CABINETS"
when = ["casework+commercial"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Plastic-laminate-faced architectural cabinets.",
  ">Cabinet hardware and accessories.",
  ">Wood furring, blocking, shims, and hanging strips for installing plastic-laminate-faced architectural cabinets unless concealed within other construction before cabinet installation.",
  "Related Requirements:",
  ">Section 06 10 00 \"Rough Carpentry\" for wood furring, blocking, shims, and hanging strips required for installing cabinets that are concealed within other construction before cabinet installation.",
  ">Section 12 36 61 \"Simulated Stone Countertops\" for countertops.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Exposed Surfaces of Casework: Surfaces visible when doors and drawers are closed, including visible faces of cabinet sides, backs, and bottoms of wall cabinets more than 48 inches above floor.",
  "Semiexposed Surfaces of Casework: Surfaces behind opaque doors or drawer fronts, including interiors of cabinets, shelves, dividers, interiors and sides of drawers, and interior faces of doors.",
  "Concealed Surfaces of Casework: Surfaces not usually visible after installation.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For panel products, high-pressure decorative laminate, adhesive for bonding plastic laminate, cabinet hardware and accessories, and edgebanding.",
  "Shop Drawings: For plastic-laminate-faced architectural cabinets. Include plans, elevations, sections, and attachment details.",
  ">Show large-scale details.",
  ">Show locations and sizes of furring, blocking, and hanging strips, including concealed blocking and reinforcement specified in other Sections.",
  ">Show locations and sizes of cutouts and holes for electrical switches and outlets and other items installed in architectural plastic-laminate cabinets.",
  ">Show accessible cabinet locations, knee spaces, and hardware complying with ICC A117.1.",
  "Samples for Initial Selection: For plastic laminates, PVC edgebanding, and thermoset decorative panels.",
  "Samples for Verification: Plastic laminates, 8 by 10 inches, for each type, color, pattern, and surface finish; thermoset decorative panels, 8 by 10 inches; and one of each exposed hardware item.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For fabricator.",
  "Product Certificates: For each type of product.",
  "Quality Standard Compliance Certificates: AWI Quality Certification Program certificates, where indicated.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Fabricator Qualifications: Shop that employs skilled workers who custom fabricate products similar to those required for this Project and whose products have a record of successful in-service performance.",
  "Standard: Comply with AWI, AWMAC, and WI \"Architectural Woodwork Standards\" (AWS), Custom grade unless otherwise indicated.",
  "Mockups: Build a mockup of a typical base cabinet and wall cabinet with countertop, including hardware, where indicated.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Do not deliver cabinets until painting and similar operations that could damage woodwork have been completed in installation areas.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Environmental Limitations: Do not deliver or install cabinets until building is enclosed, wet work is complete, and HVAC system is operating and maintaining temperature and relative humidity at levels planned for building occupants during the remainder of the construction period.",
  "Field Measurements: Where cabinets are indicated to fit to other construction, verify dimensions of other construction by field measurements before fabrication.",
]

[[section.part2]]
title = "PLASTIC-LAMINATE-FACED ARCHITECTURAL CABINETS"
items = [
  "Grade: Custom.",
  "AWS Type of Cabinet Construction: Frameless.",
  "Door and Drawer-Front Style: Flush overlay.",
  "High-Pressure Decorative Laminate: NEMA LD 3, grades as indicated or, if not indicated, as required by woodwork quality standard.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Wilsonart LLC.",
  ">>Formica Corporation.",
  ">>Panolam Surface Systems (Nevamar).",
  ">>Abet Laminati.",
  "Laminate Cladding for Exposed Surfaces:",
  ">Horizontal Surfaces: Grade HGS.",
  ">Postformed Surfaces: Grade HGP.",
  ">Vertical Surfaces: Grade VGS.",
  ">Edges: PVC edgebanding, 0.12 inch thick, matching laminate in color, pattern, and finish.",
  "Materials for Semiexposed Surfaces:",
  ">Surfaces Other Than Drawer Bodies: Thermoset decorative panels, white or as selected.",
  ">Drawer Sides and Backs: Thermoset decorative panels with PVC or polyester edge banding.",
  ">Drawer Bottoms: Thermoset decorative panels, 1/2 inch thick.",
  "Dust Panels: 1/4-inch plywood or tempered hardboard above compartments and drawers unless located directly under tops.",
  "Colors, Patterns, and Finishes: As selected by the Architect from laminate manufacturer's full range.",
]

[[section.part2]]
title = "WOOD MATERIALS"
items = [
  "Composite Wood Products: Provide materials that comply with requirements of referenced quality standard for each type of woodwork and quality grade specified unless otherwise indicated, made without urea formaldehyde.",
  ">Medium-Density Fiberboard (MDF): ANSI A208.2, Grade 130.",
  ">Particleboard: ANSI A208.1, Grade M-2, or Grade M-2-Exterior Glue where located at sinks and wet areas.",
  ">Softwood Plywood: DOC PS 1, medium-density overlay, at sink bases.",
  ">Thermoset Decorative Panels: Particleboard or MDF finished with thermally fused, melamine-impregnated decorative paper and complying with requirements of NEMA LD 3, Grade VGL, for test methods 3.3, 3.4, 3.6, 3.8, and 3.10.",
]

[[section.part2]]
title = "CABINET HARDWARE AND ACCESSORIES"
items = [
  "General: Provide cabinet hardware and accessory materials associated with architectural cabinets except for items specified in Section 08 71 00 \"Door Hardware.\"",
  "Frameless Concealed Hinges (European Type): BHMA A156.9, B01602, 110 degrees of opening, self-closing.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Blum, Inc.",
  ">>Grass America, Inc.",
  ">>Hettich America, L.P.",
  "Wire Pulls: Back mounted, solid metal, 4 inches long, 5/16 inch in diameter, satin stainless steel or BHMA 630 finish.",
  "Catches: Magnetic catches, BHMA A156.9, B03141, where self-closing hinges are not provided.",
  "Adjustable Shelf Standards and Supports: BHMA A156.9, B04071; with shelf rests, B04081; or 5-mm pin supports in drilled holes.",
  "Drawer Slides: BHMA A156.9.",
  ">Grade 1 and Grade 2: Side mounted and extending under bottom edge of drawer; full-extension type; zinc-plated-steel ball-bearing slides.",
  ">For drawers not more than 3 inches high and not more than 24 inches wide, provide Grade 2.",
  ">For drawers more than 3 inches high but not more than 6 inches high and not more than 24 inches wide, provide Grade 1.",
  ">For drawers more than 6 inches high or more than 24 inches wide, provide Grade 1HD-100.",
  ">For computer keyboard shelves, provide Grade 1.",
  ">For file drawers, provide Grade 1HD-200, full-extension, with file suspension rails.",
  "Door Locks: BHMA A156.11, E07121, cam type, keyed alike within each room, where indicated.",
  "Drawer Locks: BHMA A156.11, E07041, where indicated.",
  "Grommets for Cable Passage: 2-inch OD, molded-plastic grommets and matching plastic caps with slot for wire passage, at locations indicated.",
  "Accessible Hardware: Operable with one hand without tight grasping, pinching, or twisting of the wrist, and requiring not more than 5 lbf to operate, at accessible cabinets.",
]

[[section.part2]]
title = "MISCELLANEOUS MATERIALS"
items = [
  "Furring, Blocking, Shims, and Hanging Strips: Fire-retardant-treated softwood lumber, kiln dried to less than 15 percent moisture content, where required by {building_code}.",
  "Anchors: Select material, type, size, and finish required for each substrate for secure anchorage.",
  "Adhesive for Bonding Plastic Laminate: Contact cement or PVA, with VOC content of 70 g/L or less.",
]

[[section.part2]]
title = "FABRICATION"
items = [
  "Fabricate architectural cabinets to dimensions, profiles, and details indicated.",
  "Complete fabrication, including assembly and hardware application, to maximum extent possible before shipment to Project site. Disassemble components only as necessary for shipment and installation. Where necessary for fitting at site, provide ample allowance for scribing, trimming, and fitting.",
  "Shop-cut openings to maximum extent possible to receive hardware, appliances, electrical work, and similar items. Locate openings accurately and use templates or roughing-in diagrams to produce accurately sized and shaped openings. Sand edges of cutouts to remove splinters and burrs.",
  ">Seal edges of openings in countertops with a coat of varnish or sealer.",
  "Install glass in cabinet doors where indicated, using tempered glass complying with ASTM C1048 and Consumer Product Safety Commission 16 CFR 1201, 1/4 inch thick.",
  "Balance cabinet door and panel faces with laminate backer of same type and thickness on concealed faces.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Before installation, condition cabinets to humidity conditions in installation areas for not less than 72 hours.",
  "Before installing cabinets, examine shop-fabricated work for completion and complete work as required, including removal of packing and backpriming.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Grade: Install cabinets to comply with quality standard grade of item to be installed.",
  "Assemble cabinets and complete fabrication at Project site to the extent that it was not completed in the shop.",
  "Anchor cabinets to anchors or blocking built in or directly attached to substrates. Secure with countersunk, concealed fasteners and blind nailing. Use fine finishing nails or finishing screws for exposed fastening, countersunk and filled flush with woodwork.",
  ">For shop-finished items, use filler matching finish of items being installed.",
  "Install cabinets level, plumb, and true in line to a tolerance of 1/8 inch in 96 inches using concealed shims.",
  ">Scribe and cut cabinets to fit adjoining work, refinish cut surfaces, and repair damaged finish at cuts.",
  "Base Cabinets: Set cabinets straight, level, and plumb. Adjust subtops within 1/16 inch of a single plane. Fasten individual cabinets together with joint fasteners, and scribe and fit to wall and floor surfaces. Secure cabinets to walls with No. 10 wafer-head sheet metal screws through metal backing or metal framing behind wall finish, or wood screws into wood blocking.",
  "Wall Cabinets: Hang cabinets straight, level, and plumb. Adjust fronts and bottoms within 1/16 inch of a single plane. Fasten to hanging strips, masonry, framing, wood blocking, or reinforcements built into walls or partitions. Fasten each cabinet through back, near top and bottom, and at ends not more than 16 inches o.c.",
  "Install accessible cabinets and knee spaces at locations and heights complying with ICC A117.1.",
]

[[section.part3]]
title = "ADJUSTING AND CLEANING"
items = [
  "Repair damaged and defective cabinets, where possible, to eliminate functional and visual defects. Where not possible to repair, replace cabinets. Adjust joinery for uniform appearance.",
  "Adjust cabinet doors, drawers, hardware, fixtures, and other moving or operating parts to function smoothly and correctly.",
  "Clean cabinets on exposed and semiexposed surfaces. Touch up shop-applied finishes to restore damaged or soiled areas.",
]

[[section]]
number = "06 43 13"
title = "WOOD STAIRS"
when = ["stairs_wood"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Interior wood stairs with site-built or shop-fabricated stringers.",
  ">Wood treads, risers, skirtboards, and nosings.",
  ">Wood handrails, newel posts, balusters, and guards.",
  "Related Requirements:",
  ">Section 06 10 00 \"Rough Carpentry\" for stair framing, carriages, and blocking concealed in finished work.",
  ">Section 05 52 13 \"Pipe and Tube Railings\" for metal railings.",
  ">Section 09 93 00 \"Staining and Transparent Finishing\" for field finishing of wood stairs and railings.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including stair parts, fasteners, and adhesives.",
  "Shop Drawings: For wood stairs and railings. Include plans, elevations, sections, and details; show riser and tread dimensions, nosing profile, handrail profile and heights, baluster spacing, newel post anchorage, and attachment to framing.",
  "Samples: For each species and finish, treads and handrail sections 12 inches long, and one baluster.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For fabricator.",
  "Product Test Reports: For newel post and guard anchorage systems, indicating compliance with loads required by {building_code}.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Standard: Comply with AWI, AWMAC, and WI \"Architectural Woodwork Standards\" (AWS) for stairs and railings, Custom grade unless otherwise indicated.",
  "Fabricator Qualifications: Shop that employs skilled workers who fabricate stairs similar to those required for this Project.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver stair parts only after building is enclosed and wet work is complete. Store flat in a dry, ventilated area within the building, protected from damage.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Environmental Limitations: Install stairs only when HVAC system is operating and maintaining temperature between 60 and 90 deg F and relative humidity between 25 and 55 percent. Acclimate materials for not less than 72 hours.",
  "Field Measurements: Verify floor-to-floor heights and stair opening dimensions by field measurements before fabrication.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Stair Geometry: Comply with {building_code}. Unless more restrictive requirements apply, provide the following:",
  ">Residential (IRC) Stairs: Maximum riser height 7-3/4 inches; minimum tread depth 10 inches; nosing projection 3/4 to 1-1/4 inches where tread depth is less than 11 inches; minimum headroom 6 feet 8 inches; minimum width 36 inches.",
  ">Commercial (IBC) Stairs: Riser height 4 to 7 inches; minimum tread depth 11 inches; minimum headroom 80 inches; width as required for egress capacity but not less than 44 inches, or 36 inches where occupant load is less than 50.",
  ">Riser and Tread Uniformity: Variation between adjacent risers or treads and within a flight not more than 3/8 inch.",
  "Handrails: Height 34 to 38 inches above tread nosings; graspable profile Type I (1-1/4 to 2 inches in diameter) or Type II as permitted by code; continuous for full length of flight; 1-1/2 inches clear of walls.",
  "Guards: Height not less than 36 inches in dwelling units and 42 inches elsewhere, measured from the line of nosings; openings shall not allow passage of a 4-inch sphere, or 4-3/8 inches at stair guards where permitted by the International Residential Code.",
  "Structural Performance: Handrails and guards shall withstand a concentrated load of 200 lbf applied in any direction at the top; stairs shall support a uniform live load of 40 lbf/sq. ft. in dwelling units and 100 lbf/sq. ft. elsewhere, and a concentrated load of 300 lbf on an area of 4 sq. in.",
]

[[section.part2]]
title = "WOOD MATERIALS"
items = [
  "Treads: Solid hardwood, [red oak] [white oak] [hard maple], 1-1/16 inches thick, edge-glued, clear, with bullnose or square nosing as indicated, AWS Custom grade.",
  "Risers: [Hardwood matching treads, 3/4 inch thick, for transparent finish] [Poplar or MDF, 3/4 inch thick, primed, for opaque finish].",
  "Skirtboards: Solid lumber or veneer-faced panel matching treads or trim, 3/4 inch thick minimum.",
  "Stringers and Carriages: Laminated-veneer lumber or No. 2 dimension lumber, 2 by 12 inches nominal minimum, sized per design; minimum 3-1/2 inches of solid material below notches.",
  "Handrails, Newel Posts, and Balusters: Hardwood matching treads for transparent finish, or poplar for opaque finish, of profiles indicated.",
  ">Manufacturers of Stair Parts: Subject to compliance with requirements, provide products by one of the following:",
  ">>LJ Smith Stair Systems.",
  ">>Crown Heritage.",
  ">>WM Coffman LLC.",
  "Moisture Content: 6 to 9 percent for hardwood.",
]

[[section.part2]]
title = "MISCELLANEOUS MATERIALS"
items = [
  "Newel Post Fasteners: Manufacturer's concealed rail-bolt and newel-anchor systems, tested for guard loads.",
  "Rail Bolts: Zinc-plated steel, 5/16 inch diameter by 3-1/2 inches, with star nut.",
  "Fasteners: Finish nails and trim-head screws, countersunk and filled; construction screws for attachment to carriages.",
  "Construction Adhesive: ASTM D3498, polyurethane-based subfloor adhesive, for bonding treads and risers to carriages to prevent squeaks. VOC content of 70 g/L or less.",
  "Wood Glue: PVA, ASTM D5572 or ANSI/HPVA HP-1 Type II, for joinery.",
]

[[section.part2]]
title = "FABRICATION"
items = [
  "Shop fabricate treads, risers, and railings to the greatest extent practical. Rout treads for balusters, and glue and dowel or plow risers into treads where indicated.",
  "Housed Stringers: Where indicated, rout finish stringers to receive treads and risers with wedges and glue.",
  "Ease exposed edges to 1/16-inch radius; sand surfaces smooth for finishing.",
  "Fabricate handrail fittings (easings, goosenecks, volutes, and returns) from matching species with grain continuity at joints.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine stair openings, framing, and blocking, with Installer present, for compliance with requirements, including rough riser heights and headroom. Verify that blocking is in place for newel posts and wall rail brackets.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install stair carriages level and securely anchored to headers and framing, using metal hangers where indicated. Provide intermediate carriage at stairs wider than 36 inches, spaced not more than 18 inches o.c. for 1-1/16-inch treads.",
  "Install risers and treads with construction adhesive at each carriage bearing, fastened with screws or nails into carriages, and with risers fastened to back of treads below to prevent movement and squeaks.",
  "Install skirtboards scribed to treads and risers, with tight joints.",
  "Newel Posts: Anchor newel posts to framing with concealed newel-anchor systems or through-bolting to blocking, capable of resisting required guard loads without perceptible movement.",
  "Handrails: Install handrails and fittings with rail bolts and glue at joints; attach wall-mounted handrails with brackets into blocking at not more than 48 inches o.c.",
  "Balusters: Install balusters into routed treads and plowed handrail with glue and pins, spaced to comply with opening limitations.",
  "Installation Tolerances: Install stair components plumb and level within 1/8 inch in 96 inches; maintain uniform riser heights within 3/16 inch of each other.",
  "Countersink exposed fasteners and fill with color-matched filler.",
]

[[section.part3]]
title = "ADJUSTING AND PROTECTION"
items = [
  "Repair or replace damaged components. Adjust joinery for uniform appearance.",
  "Protect treads with hardboard or heavy paper protection taped to risers, and protect handrails and newels with padded coverings, until Substantial Completion. Do not apply tape directly to finished surfaces.",
]
