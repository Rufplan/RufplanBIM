  "Welded Connections: In addition to visual inspection, shop-welded connections will be tested and inspected according to AWS D1.1 and the following inspection procedures, at testing agency's option: liquid penetrant inspection per ASTM E165, magnetic particle inspection per ASTM E709, ultrasonic inspection per ASTM E164, or radiographic inspection per ASTM E94.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
