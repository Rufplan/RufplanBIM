]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Boards or Strips: Lumber of less than 2 inches nominal size in least dimension.",
  "Dimension Lumber: Lumber of 2 inches nominal or greater size but less than 5 inches nominal size in least dimension.",
  "Timbers: Lumber of 5 inches nominal or greater size in least dimension.",
  "Lumber grading agencies, and the abbreviations used to reference them, include the following: NeLMA, Northeastern Lumber Manufacturers' Association; NLGA, National Lumber Grades Authority; SPIB, Southern Pine Inspection Bureau; WCLIB, West Coast Lumber Inspection Bureau; WWPA, Western Wood Products Association.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of process and factory-fabricated product. Indicate component materials and dimensions and include construction and application details.",
  ">Include data for wood-preservative treatment from chemical treatment manufacturer and certification by treating plant that treated materials comply with requirements. Indicate type of preservative used and net amount of preservative retained.",
  ">Include data for fire-retardant treatment from chemical treatment manufacturer and certification by treating plant that treated materials comply with requirements.",
  ">For products receiving a waterborne treatment, include statement that moisture content of treated materials was reduced to levels specified before shipment to Project site.",
  ">Include copies of warranties from chemical treatment manufacturers for each type of treatment.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
