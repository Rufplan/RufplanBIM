  "Cleaners for Nonporous Surfaces: Chemical cleaners acceptable to manufacturers of sealants and sealant backing materials.",
  "Masking Tape: Nonstaining, nonabsorbent material compatible with joint sealants and surfaces adjacent to joints.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine joints indicated to receive joint sealants, with Installer present, for compliance with requirements for joint configuration, installation tolerances and other conditions affecting performance of the Work.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Surface Cleaning of Joints: Clean out joints immediately before installing joint sealants to comply with joint-sealant manufacturer's written instructions and the following:",
  ">Remove foreign material from joint substrates that could interfere with adhesion of joint sealant, including dust, paints (except permanent, protective coatings tested and approved for sealant adhesion), old joint sealants, oil, grease, waterproofing and curing compounds.",
  ">Clean porous joint substrate surfaces by brushing, grinding, mechanical abrading or a combination of these methods. Remove loose particles by vacuuming or blowing out joints with oil-free compressed air.",
  ">Remove laitance and form-release agents from concrete.",
  ">Clean nonporous joint substrate surfaces with chemical cleaners or other means that do not stain, harm substrates or leave residues capable of interfering with adhesion.",
  "Joint Priming: Prime joint substrates where recommended by joint-sealant manufacturer or as indicated by preconstruction testing.",
  "Masking Tape: Use masking tape where required to prevent contact of sealant or primer with adjoining surfaces that otherwise would be permanently stained or damaged by such contact or by cleaning methods required to remove sealant smears.",
]

[[section.part3]]
title = "INSTALLATION OF JOINT SEALANTS"
items = [
  "General: Comply with joint-sealant manufacturer's written installation instructions for products and applications indicated, unless more stringent requirements apply.",
  "Sealant Installation Standard: Comply with recommendations in ASTM C1193 for use of joint sealants as applicable to materials, applications and conditions indicated.",
  "Acoustical Sealant Installation: Comply with ASTM C919 and manufacturer's written recommendations.",
  "Install sealant backings of type indicated to support sealants during application and at position required to produce cross-sectional shapes and depths of installed sealants relative to joint widths that allow optimum sealant movement capability.",
  ">Do not leave gaps between ends of sealant backings.",
  ">Do not stretch, twist, puncture or tear sealant backings.",
  ">Remove absorbent sealant backings that have become wet before sealant application, and replace them with dry materials.",
  "Install bond-breaker tape behind sealants where sealant backings are not used between sealants and backs of joints.",
  "Install sealants using proven techniques that comply with the following and at the same time backings are installed:",
  ">Place sealants so they directly contact and fully wet joint substrates.",
  ">Completely fill recesses in each joint configuration.",
  ">Produce uniform, cross-sectional shapes and depths relative to joint widths that allow optimum sealant movement capability.",
  "Tooling of Nonsag Sealants: Immediately after sealant application and before skinning or curing begins, tool sealants according to requirements specified to form smooth, uniform beads of configuration indicated; to eliminate air pockets; and to ensure contact and adhesion of sealant with sides of joint. Provide concave joint profile per ASTM C1193 unless otherwise indicated.",
  "Sealant Depth: Unless otherwise recommended by manufacturer, install sealant to a width-to-depth ratio of 2:1, with depth not less than 1/4 inch nor more than 1/2 inch.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Field-Adhesion Testing: Test joint sealants according to Method A, Field-Applied Sealant Joint Hand Pull Tab, in Appendix X1 of ASTM C1193 or Method A, Tail Procedure, in ASTM C1521.",
  ">Extent of Testing: Test completed and cured sealant joints as follows: perform 10 tests for the first 1000 feet of joint length for each kind of sealant and joint substrate, and one test for each 1000 feet thereafter or one test per each floor per elevation.",
  ">Inspect tested joints and report on whether sealant filled joint cavities and is free of voids, whether dimensions and configurations comply with requirements, and whether sealants showed adhesive or cohesive failure.",
  "Evaluation of Field-Adhesion-Test Results: Sealants not evidencing adhesive failure from testing or noncompliance with other indicated requirements will be considered satisfactory. Remove sealants that fail to adhere to joint substrates during testing, and retest until test results prove sealants comply with indicated requirements.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Clean off excess sealant or sealant smears adjacent to joints as the Work progresses by methods and with cleaning materials approved in writing by manufacturers of joint sealants and of products in which joints occur.",
  "Protect joint sealants during and after curing period from contact with contaminating substances and from damage resulting from construction operations. Cut out and remove damaged or deteriorated joint sealants immediately, and reseal joints with new materials.",
]

