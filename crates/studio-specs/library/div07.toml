  "Trim: Same species and grade as siding, 5/4 inch thick nominal, widths as indicated.",
  "Moisture Content: 12 to 15 percent maximum at time of installation.",
]

[[section.part2]]
title = "FACTORY FINISH"
items = [
  "Manufacturers: Subject to compliance with requirements, provide factory-primed or prefinished siding using finishes by one of the following:",
  ">PPG Industries, Inc.",
  ">Sherwin-Williams Company.",
  ">Sikkens (AkzoNobel).",
  "Prime siding and trim on all six sides with alkyd or acrylic primer before installation, or apply penetrating semi-transparent stain as selected by Architect.",
]

[[section.part2]]
title = "ACCESSORIES"
items = [
  "Fasteners: Stainless steel, Type 304 or 316, ring-shank siding nails, of length to penetrate framing or blocking 1-1/2 inches. Do not use electroplated or uncoated nails.",
  "Rainscreen Furring: Preservative-treated wood furring, 3/4 by 1-1/2 inches, or proprietary drainage mat providing 3/8-inch minimum cavity.",
