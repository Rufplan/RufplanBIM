[[section]]
number = "07 84 13"
title = "PENETRATION FIRESTOPPING"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Penetration firestopping systems for penetrations through fire-resistance-rated walls, floors and floor-ceiling assemblies, including both empty openings and openings containing penetrating items.",
  ">Smoke-seal systems at penetrations of smoke barriers.",
  "Related Requirements:",
  ">Section 07 21 00 \"Thermal Insulation\" for safing insulation.",
  ">Section 07 92 00 \"Joint Sealants\" for non-fire-rated joints.",
  ">Section 09 29 00 \"Gypsum Board\" for fire-resistance-rated gypsum board assemblies.",
  ">Divisions 21, 22, 23, 26 and 27 for piping, ductwork, conduit and cable penetrations requiring firestopping.",
]

[[section.part1]]
title = "PREINSTALLATION MEETINGS"
items = [
  "Preinstallation Conference: Conduct conference at Project site with firestopping Installer and installers of penetrating items to review rated assemblies, system selection, sequencing and inspection.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product.",
  "Product Schedule: For each penetration firestopping system, indicating location, rated assembly, penetrating item, annular space, F- and T-ratings, and the design designation of the testing and inspecting agency.",
  "Shop Drawings: For each system, the listed system drawing from UL Product iQ or Intertek Directory of Building Products, and engineering judgments where no tested system exists.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For Installer.",
  "Engineering Judgments: For conditions not covered by a listed system, signed by the firestop manufacturer's engineering staff, following IFC guidelines for engineering judgments.",
  "Field Quality-Control Reports: Inspection reports from the special inspector.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: A firm approved under FM 4991 (FM Approved Firestop Contractor) or UL Qualified Firestop Contractor Program, or a firm trained and approved by firestopping manufacturer.",
  "Source Limitations: Obtain firestopping products for each type of penetration from single manufacturer.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Install firestopping only when ambient and substrate temperatures and humidity are within limits recommended by manufacturer, and substrates are dry.",
  "Ventilate firestopping work per manufacturer's written instructions.",
]

[[section.part1]]
title = "COORDINATION"
items = [
  "Coordinate construction of openings and penetrating items so that annular spaces and sleeve sizes comply with the listed systems.",
  "Do not conceal firestopping until inspections have been completed.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Fire-Test-Response Characteristics: Provide penetration firestopping systems tested according to ASTM E814 or UL 1479, with a positive pressure differential of 0.01 inch of water, by a qualified testing agency.",
  "F-Rating: Not less than the fire-resistance rating of the constructions penetrated, as determined per ASTM E119 or UL 263.",
  "T-Rating: Where required by the building code, not less than one hour, but not less than the fire-resistance rating of the floor penetrated.",
  "L-Rating: Where penetrating smoke barriers or where required, 5.0 cfm/sq. ft. of opening or less at both ambient and 400 deg F, per UL 1479.",
  "W-Rating: Class 1 water resistance per UL 1479, for floor penetrations in wet areas where indicated.",
  "Surface-Burning Characteristics: Flame-spread index of 25 or less and smoke-developed index of 450 or less for exposed firestopping per ASTM E84.",
]

[[section.part2]]
title = "PENETRATION FIRESTOPPING SYSTEMS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">3M Fire Protection Products.",
  ">Hilti, Inc.",
  ">Specified Technologies Inc. (STI).",
  ">Tremco Incorporated.",
  "Products: Provide the listed system components, including sealants, mortars, putties, wraps, collars, pillows, sleeves, forming materials and devices, as required by each tested system and compatible with each other and with substrates.",
  ">Intumescent Sealant: Latex or silicone-based, for metallic and nonmetallic pipes and cables.",
  ">Wrap Strips and Collars: Intumescent, for combustible (plastic) pipes and insulated pipes.",
  ">Firestop Devices: Factory-assembled sleeves with intumescent inserts, for cable penetrations and future cabling.",
  ">Mortar: Portland-cement-based, for large openings and multiple penetrations in floors.",
  ">Forming and Packing Materials: Mineral wool or other materials required by the listed system.",
  "Color: Identifiable red or manufacturer's standard color for concealed work; for exposed work, color as selected by Architect where available.",
]

[[section.part2]]
title = "ACCESSORIES"
items = [
  "Identification Labels: Pressure-sensitive, preprinted labels reading \"Warning - Penetration Firestopping - Do Not Disturb,\" with spaces for listed system designation, manufacturer, Installer and date.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates and penetrating items, with Installer present, for compliance with requirements for opening configurations, penetrating items, substrates and other conditions affecting performance of the Work.",
  "Verify that penetrating items are permanently supported and that insulation, sleeves and coverings are complete as required by the listed system.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Clean out openings immediately before installing firestopping to remove debris, oils, loose materials and other substances that impair bonding.",
  "Prime substrates where recommended by manufacturer. Mask adjacent surfaces where required to prevent staining.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "General: Install penetration firestopping to comply with the listed system and manufacturer's written installation instructions for each type of penetration.",
  "Install forming materials and other accessories of types required to support fill materials during application and in the position needed to produce cross-sectional shapes and depths required to achieve fire ratings.",
  "Install fill materials by proven techniques to produce the following results:",
  ">Fill voids and cavities formed by openings, forming materials, accessories and penetrating items as required to achieve fire-resistance ratings.",
  ">Apply materials so they contact and adhere to substrates formed by openings and penetrating items.",
  ">For fill materials that will remain exposed after completing the Work, finish to produce smooth, uniform surfaces flush with adjoining finishes.",
  "Install firestopping at both sides of rated walls where the listed system requires it.",
]

[[section.part3]]
title = "IDENTIFICATION"
items = [
  "Wall Identification: Permanently label walls containing penetrations sealed with firestopping systems with the fire-resistance rating and the words \"Fire and/or Smoke Barrier - Protect All Openings,\" located above ceilings at 30 feet on center maximum, as required by the building code.",
  "Penetration Identification: Attach identification labels to surfaces adjacent to each firestopping system, within 6 inches of the edge, where visible to anyone seeking to remove penetrating items.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Inspecting Agency: Owner will engage a qualified special inspector to perform inspections according to ASTM E2174 and the building code.",
  "Where deficiencies are found or firestopping is damaged or removed because of testing, repair or replace to comply with requirements.",
  "Proceed with enclosing firestopping with other construction only after inspection reports are issued and firestopping complies with requirements.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Clean off excess fill materials adjacent to openings as the Work progresses, by methods and with cleaning materials approved by manufacturer.",
  "Protect firestopping from damage during construction. Remove and replace damaged firestopping, and firestopping disturbed by later penetrations, to comply with the listed system.",
]

