  "Tapered Insulation: Polyisocyanurate, ASTM C1289, with a slope of 1/4 inch per 12 inches minimum, and crickets at 1/2 inch per 12 inches.",
  "Cover Board: ASTM C1177 glass-mat gypsum roof board, 1/2 inch thick, or high-density polyisocyanurate cover board, ASTM C1289, Type II, Class 4, Grade 1, as approved by roofing manufacturer.",
