[[section.part2]]
title = "WOOD SIDING"
items = [
  "Grading: Comply with the grading rules of WWPA or WCLIB for the species indicated.",
  "Species and Grade: Western red cedar, Clear Heart or A and Better, kiln dried, unless otherwise indicated.",
