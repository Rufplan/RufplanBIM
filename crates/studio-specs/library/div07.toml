  "Lap joints 6 inches and seal with manufacturer's tape. Turn up at perimeter and seal to foundation walls or grade beams.",
  "Seal penetrations with pipe boots or manufacturer's details.",
  "Repair damaged areas with patches of vapor retarder lapped 6 inches beyond damage and taped.",
]

[[section.part3]]
title = "INSTALLATION OF CRAWLSPACE GROUND COVER"
items = [
