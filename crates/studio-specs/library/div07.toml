  "Installer's Warranty: Two years from date of Substantial Completion for workmanship.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "General: Provide an installed roofing system that remains watertight and resists specified uplift pressures, thermally induced movement and exposure to weather without failure.",
  "Wind-Uplift Resistance: Design roofing system to resist wind-uplift pressures calculated per ASCE 7 for each roof zone, based on tested assemblies per FM 4474 or UL 1897.",
  "Fire Classification: Class A per ASTM E108 or UL 790.",
  "Energy Performance: Initial solar reflectance of not less than 0.70 and thermal emittance of not less than 0.75, as rated by the Cool Roof Rating Council, where required by the energy code.",
  "Thermal Resistance: Provide insulation with average R-value of not less than R-30, continuous above deck, or as required by the energy code adopted by {jurisdiction}.",
]

[[section.part2]]
title = "TPO MEMBRANE ROOFING"
