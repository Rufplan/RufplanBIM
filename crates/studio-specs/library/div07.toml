]

[[section.part3]]
title = "PREPARATION"
items = [
  "Mask and protect adjacent surfaces, windows, equipment and finishes from overspray.",
  "Clean substrates of dust, oil and other contaminants that impair adhesion. Prime where recommended by manufacturer.",
]

[[section.part3]]
title = "APPLICATION"
items = [
  "Apply foam according to manufacturer's written instructions, in passes not exceeding the maximum lift thickness recommended by manufacturer, allowing cooling between passes.",
  "Apply to thickness required to achieve R-value indicated, with tolerance of plus 1/2 inch, minus 0 inch.",
  "Seal continuously to framing and at perimeters, penetrations and transitions to form a continuous air barrier.",
  "Trim foam protruding beyond face of framing where gypsum board or other finishes will be applied.",
  "Apply ignition or thermal barrier over exposed foam as required by the building code and the foam's evaluation report.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Measure installed thickness at not less than one location per 500 sq. ft. and record in daily log.",
  "Cut and inspect core samples where directed for cell structure, adhesion and density. Patch sample locations.",
  "Remove and replace foam that is off-ratio, discolored, poorly adhered or does not comply with requirements.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Remove overspray and masking. Clean adjacent surfaces damaged by foam application.",
  "Protect foam from ultraviolet exposure; cover within period recommended by manufacturer.",
]

[[section]]
number = "07 25 00"
title = "WEATHER BARRIERS"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Building wrap (water-resistive barrier and air barrier) over exterior sheathing.",
  ">Fluid-applied water-resistive and air barrier where indicated.",
  ">Flexible flashing and seam tape at openings, penetrations and transitions.",
  "Related Requirements:",
  ">Section 06 16 00 \"Sheathing\" for wall sheathing and integral water-resistive-barrier sheathing systems.",
  ">Section 07 21 00 \"Thermal Insulation\" for continuous exterior insulation.",
  ">Section 07 62 00 \"Sheet Metal Flashing and Trim\" for head and sill flashings.",
  ">the Division 08 window Sections for window installation and integration with water-resistive barrier.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including tested physical and performance properties.",
  "Shop Drawings: Show details for integrating weather barrier with window and door openings, penetrations, foundation, roof and dissimilar cladding transitions.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Evaluation Reports: ICC-ES evaluation report for water-resistive barrier, showing compliance with the building code.",
  "Field Quality-Control Reports: Results of air-leakage testing, where required.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Mockups: As part of exterior wall mockup, demonstrate installation of weather barrier and flashing at a typical window opening and a penetration. Obtain Architect's approval before proceeding with the Work.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Store rolls and containers off the ground, protected from weather and ultraviolet exposure, within temperature limits recommended by manufacturer.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Water-Resistive Barrier: Comply with the International Building Code and International Residential Code requirements for water-resistive barriers behind exterior cladding.",
  "Air Barrier: Provide a continuous air barrier across the building enclosure, joined airtight to foundation, roof air barrier, fenestration and penetrations, with material air permeance not more than 0.004 cfm/sq. ft. at 1.57 lbf/sq. ft. when tested according to ASTM E2178.",
  "Whole-Building Air Leakage: Assembly shall be capable of achieving the air-leakage rate required by the energy code adopted by {jurisdiction}.",
]

[[section.part2]]
title = "BUILDING WRAP"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">DuPont (Tyvek).",
  ">Kingspan Insulation LLC (GreenGuard).",
  ">Owens Corning (PinkWrap).",
  ">VaproShield LLC.",
  "Building Wrap: Nonwoven or spun-bonded polyolefin sheet, with the following properties:",
  ">Water Penetration Resistance: Hydrostatic head of 210 cm minimum; AATCC 127.",
  ">Water Vapor Permeance: 10 perms minimum; ASTM E96, Desiccant Method.",
  ">Air Permeance: 0.004 cfm/sq. ft. maximum at 1.57 lbf/sq. ft.; ASTM E2178.",
  ">Tensile Strength: 30 lbf minimum; ASTM D882 or ASTM D5034.",
  ">Surface-Burning Characteristics: Flame-spread index of 25 or less and smoke-developed index of 450 or less; ASTM E84.",
  ">UV Exposure: Rated by manufacturer for not less than 120 days of exposure before cladding.",
  "Drainable Building Wrap: Where behind stucco, adhered stone or directly applied cladding, provide wrap with integral drainage texture or spacer providing drainage efficiency of 90 percent minimum per ASTM E2273.",
  "Building-Wrap Tape: Pressure-sensitive tape recommended by building-wrap manufacturer for sealing seams and penetrations.",
  "Fasteners: Cap nails or cap staples with 1-inch-diameter plastic caps, as recommended by manufacturer.",
]

[[section.part2]]
title = "FLUID-APPLIED WEATHER BARRIER"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Carlisle Coatings and Waterproofing Inc.",
  ">Henry Company.",
  ">Prosoco, Inc.",
  ">Tremco Incorporated.",
  "Vapor-Permeable Fluid-Applied Membrane: Single-component, silyl-terminated polyether or silicone, with water vapor permeance of 10 perms minimum per ASTM E96, material air permeance of 0.004 cfm/sq. ft. maximum per ASTM E2178, and assembly air leakage of 0.04 cfm/sq. ft. maximum per ASTM E2357.",
  ">Dry Film Thickness: As recommended by manufacturer, not less than 12 mils.",
  "Joint and Transition Materials: Manufacturer's joint filler, reinforcing fabric and transition membranes for sheathing joints, rough openings and transitions.",
]

[[section.part2]]
title = "FLEXIBLE FLASHING"
items = [
  "Self-Adhering Flexible Flashing: Butyl or rubberized-asphalt membrane laminated to polyethylene film or nonwoven facing, 25 mils minimum total thickness, complying with AAMA 711, Level 3, for openings and penetrations.",
  "Stretchable Sill Flashing: Self-adhering, extensible flashing capable of forming a seamless sill pan with end dams, complying with AAMA 711.",
  "Primer: As recommended by flashing manufacturer for substrate.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine sheathing for proper attachment, surface condition and joint treatment. Verify that sheathing is dry and free of projecting fasteners and damaged areas.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "INSTALLATION OF BUILDING WRAP"
items = [
  "Install building wrap according to manufacturer's written instructions, covering sheathing with sheets installed horizontally, starting at the bottom and shingled so upper courses lap lower courses.",
  "Lap horizontal seams not less than 6 inches and vertical seams not less than 12 inches. Stagger vertical seams.",
  "Extend wrap over sill plate and foundation interface not less than 2 inches, and lap over flashings and weep screeds so water drains to the exterior.",
  "Fasten with cap fasteners at 12 to 18 inches on center along studs, or as recommended by manufacturer.",
  "Seal vertical and horizontal seams with building-wrap tape where wrap serves as air barrier.",
  "Seal around penetrations with tape or flexible flashing, shingled to shed water.",
  "Repair tears and punctures with tape or patches lapped to shed water.",
]

[[section.part3]]
title = "INSTALLATION OF FLUID-APPLIED WEATHER BARRIER"
items = [
  "Treat sheathing joints, inside and outside corners and rough openings with joint materials before applying field membrane.",
  "Apply membrane by spray, roller or trowel to a continuous, uniform film at the thickness recommended by manufacturer, free of voids and pinholes.",
  "Verify wet-film thickness during application with a wet-film gauge, not less than one reading per 100 sq. ft.",
]

[[section.part3]]
title = "FLASHING AT OPENINGS"
items = [
  "Flash rough openings in sequence with window and door installation according to ASTM E2112, AAMA 2400 and the window manufacturer's written instructions.",
  "Sill: Install sill pan flashing with end dams turned up not less than 6 inches at jambs, before setting window.",
  "Jambs: Install flexible flashing over window flange, lapped over sill flashing.",
  "Head: Install head flashing over jamb flashing, and lap building-wrap flap over head flashing. Tape diagonal cuts at head.",
  "Leave the sill flange unsealed or provide a drainage path so water collected in the sill pan drains to exterior.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Inspection: Notify Architect when weather barrier and flashings are complete and before cladding is installed; allow 48 hours for observation.",
  "Air-Leakage Testing: Where required by the energy code, test completed building enclosure according to ASTM E779 or ASTM E3158, and report results. Seal leaks identified and retest.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Cover weather barrier with cladding within the exposure period recommended by manufacturer. Replace barrier exposed longer than permitted.",
  "Protect from damage by other trades; repair before concealment.",
]

