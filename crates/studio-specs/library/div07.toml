  ">Firestone Building Products (UNA-CLAD).",
  ">Petersen Aluminum Corporation (PAC-CLAD).",
  "Prefinished Aluminum-Zinc Alloy-Coated Steel Sheet: ASTM A792/A792M, AZ50 coating, 24 gauge (0.024 inch) minimum, with two-coat fluoropolymer finish complying with AAMA 621, color as selected by Architect.",
  "Prefinished Aluminum Sheet: ASTM B209, alloy 3003-H14, 0.040 inch thick minimum, with fluoropolymer finish complying with AAMA 2605.",
  "Copper Sheet: Where indicated, ASTM B370, cold-rolled temper H00, 16 oz./sq. ft.",
  "Stainless Steel Sheet: ASTM A240/A240M, Type 304, dead soft, 26 gauge, 2D finish, for concealed through-wall flashing where indicated.",
]

[[section.part2]]
title = "UNDERLAYMENT MATERIALS"
items = [
