  ">Elevate (Holcim Building Envelope).",
  ">GAF.",
  ">Johns Manville.",
  "TPO Sheet: ASTM D6878, internally fabric reinforced, 60 mils thick minimum, [white] [gray] [tan].",
  "Flashing Membrane: Manufacturer's unreinforced TPO flashing sheet, 60 mils thick, for field-formed flashings.",
