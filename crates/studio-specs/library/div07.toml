  "Slip Sheet: Rosin-sized building paper, 3 lb/100 sq. ft.",
]

[[section.part2]]
title = "MISCELLANEOUS MATERIALS"
items = [
  "Fasteners: Same metal as flashing or other noncorrosive metal compatible with the sheet metal, with exposed fastener heads finished to match.",
  "Solder: For copper, ASTM B32, lead-free; for stainless steel, ASTM B32 with acid flux.",
  "Sealing Tape: Pressure-sensitive, 100 percent solids, polyisobutylene or butyl tape.",
  "Elastomeric Sealant: ASTM C920, silicone or polyurethane, compatible with sheet metal and adjacent materials.",
  "Bituminous Coating: Cold-applied asphalt mastic, SSPC-Paint 12, for separation of dissimilar metals.",
]

[[section.part2]]
title = "FABRICATION, GENERAL"
items = [
  "Custom fabricate sheet metal to comply with details shown and the SMACNA Architectural Sheet Metal Manual for each application indicated. Shop fabricate items where practicable.",
  "Form exposed sheet metal accurately to profiles, true to line and free of oil canning, buckles and tool marks.",
  "Hem exposed edges on the concealed side 1/2 inch; miter and seal corners.",
  "Expansion Provisions: Form expansion joints at intervals not exceeding 10 feet for steel and 8 feet for aluminum, of intermeshing hooked flanges not less than 1 inch deep, filled with butyl sealant.",
  "Provide cleats and continuous edge strips of same metal, one gauge heavier than item secured.",
]

[[section.part2]]
title = "ROOF DRAINAGE SHEET METAL FABRICATIONS"
items = [
  "Gutters: K-style or half-round as indicated, formed in sections not less than 10 feet long, sized per SMACNA for the rainfall intensity at the Project location, with end caps, outlets and expansion joints. Support with hangers at 36 inches on center maximum.",
  "Downspouts: Rectangular or round as indicated, formed in 10-foot sections with telescoping joints, fastened to wall with straps at 60 inches on center maximum, and with elbows and splash blocks or connections to storm drainage.",
]

[[section.part2]]
title = "LOW-SLOPE ROOF SHEET METAL FABRICATIONS"
items = [
  "Roof-Edge Flashing: Two-piece fascia and gravel stop with continuous cleat, in 10-foot sections, tested to ANSI/SPRI/FM 4435/ES-1.",
  "Copings: Snap-on coping with continuous cleats or anchor chairs, sloped toward roof, joined with concealed splice plates and sealant.",
  "Counterflashing and Reglets: Two-piece removable counterflashing with receiver, lapping base flashing not less than 4 inches.",
]

[[section.part2]]
title = "STEEP-SLOPE ROOF SHEET METAL FABRICATIONS"
items = [
  "Valley Flashing: Open-valley W-profile with 1-inch center crimp and hemmed edges, 24 inches wide, in 10-foot sections lapped 6 inches.",
  "Apron, Step and Chimney Flashing: Formed to profiles indicated, with counterflashing set in reglets.",
]

[[section.part2]]
title = "WALL SHEET METAL FABRICATIONS"
items = [
  "Opening Flashings: Head and sill flashings with end dams and drip edges, extending 3 inches beyond openings.",
  "Base and Transition Flashing: Z-flashing at horizontal transitions and base of wall, with 3/8-inch drip, lapping weather barrier.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, blocking and nailers for correct location, secure attachment and compliance with requirements for installation tolerances.",
  "Verify that roofing and weather barrier are in place where sheet metal must lap over them.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Install sheet metal flashing and trim according to the SMACNA Architectural Sheet Metal Manual and approved Shop Drawings, true to line, level and plumb, with limited oil canning.",
  "Anchor sheet metal securely in place, with provisions for thermal and structural movement. Use concealed fasteners where possible.",
  "Install underlayment beneath sheet metal on roofs where indicated, lapped 2 inches minimum.",
  "Separation: Separate dissimilar metals and metal in contact with concrete, mortar or preservative-treated wood with bituminous coating or sealing tape.",
  "Install exposed sheet metal with lap joints lapped in direction of water flow, not less than 4 inches, and with expansion joints as specified.",
  "Seal joints as indicated or as required for watertight construction. Solder copper and stainless steel seams.",
]

[[section.part3]]
title = "INSTALLATION OF ROOF DRAINAGE SYSTEM"
items = [
  "Install gutters with a slope of not less than 1/16 inch per foot toward downspouts. Provide expansion joints at 50 feet maximum and at mid-length between downspouts.",
  "Install downspouts plumb, with straps at top, bottom and 60 inches on center.",
]

[[section.part3]]
title = "INSTALLATION OF ROOF FLASHINGS"
items = [
  "Install copings and roof-edge flashing with cleats and fasteners per the tested ANSI/SPRI/FM 4435/ES-1 assembly.",
  "Install counterflashing over base flashing, lapped not less than 4 inches, with vertical joints lapped 3 inches and sealed.",
]

[[section.part3]]
title = "ERECTION TOLERANCES"
items = [
  "Install sheet metal to within 1/4 inch in 20 feet on slope and location lines as indicated, and within 1/8-inch offset of adjoining faces and alignment of matching profiles.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Clean exposed metal surfaces of substances that interfere with uniform oxidation and weathering. Remove strippable film and metal filings.",
  "Replace sheet metal that is damaged or has deteriorated finish beyond successful repair.",
]

