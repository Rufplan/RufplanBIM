  "Bonding Adhesive: Manufacturer's standard, low-VOC.",
  "Fasteners and Plates: Factory-coated steel fasteners and plates complying with corrosion-resistance provisions of FM 4470, of size and type required for deck and wind-uplift requirements.",
  "Insulation Adhesive: Manufacturer's low-rise polyurethane foam adhesive, where adhered insulation is indicated.",
  "Termination Bars, Pipe Boots, Corner Flashings, Sealants and Cut-Edge Sealant: Manufacturer's standard.",
  "Walkway Pads: Manufacturer's heat-weldable TPO walkway pads, 30 by 30 inches minimum, contrasting color, at rooftop equipment and access points.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
