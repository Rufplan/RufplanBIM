  "Verify that roof openings, curbs, drains and penetrations are in place, that wood nailers are installed and anchored, and that deck is dry and free of debris.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Clean substrate of dust, debris, moisture and other substances detrimental to roofing installation.",
  "Prevent materials from entering and clogging roof drains and conductors. Install temporary drain protection.",
]

[[section.part3]]
title = "INSTALLATION OF INSULATION"
items = [
  "Install insulation boards in two or more layers with joints staggered not less than 6 inches from joints of previous layer, and tapered insulation to provide drainage to drains and scuppers.",
  "Fasten or adhere insulation and cover board according to manufacturer's requirements for the specified wind-uplift zones.",
  "Trim insulation neatly around penetrations. Fill gaps exceeding 1/4 inch with insulation.",
  "Install tapered edge strips at perimeter edges and crickets on high side of curbs.",
]

[[section.part3]]
title = "INSTALLATION OF MEMBRANE"
items = [
  "Install membrane according to roofing manufacturer's written instructions and requirements of the warranty, starting at low point of roof.",
  "Mechanically Fastened: Fasten sheets in seams at spacing required for each roof zone. Use half-width sheets in perimeter and corner zones where required.",
  "Fully Adhered: Apply bonding adhesive to substrate and underside of membrane at rate recommended by manufacturer and roll to full adhesion.",
  "Seams: Hot-air weld side and end laps with automatic welder, minimum weld width of 1-1/2 inches. Probe all seams and repair voids.",
  "Apply cut-edge sealant to exposed reinforced edges.",
  "Secure membrane at perimeter, curbs and penetrations with termination bars or fastening required by manufacturer.",
]

[[section.part3]]
title = "INSTALLATION OF FLASHINGS"
items = [
  "Install base flashings over cant strips and other sloping and vertical surfaces, extending not less than 8 inches above roofing surface, adhered and heat-welded to field membrane.",
  "Flash penetrations with prefabricated pipe boots or field-formed flashings, and install sealant pockets only where no other method is practical.",
  "Install roof drain flashings with clamping rings set in water cut-off mastic.",
]

[[section.part3]]
title = "INSTALLATION OF WALKWAYS"
items = [
  "Heat-weld walkway pads to membrane at locations indicated, spaced 3 inches apart for drainage.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Manufacturer's Inspection: Arrange for roofing manufacturer's technical representative to inspect roofing installation on completion and submit report.",
  "Repair or remove and replace components of roofing system where inspections indicate noncompliance.",
]

[[section.part3]]
title = "PROTECTION AND CLEANING"
items = [
  "Protect membrane from damage by other trades. Provide plywood protection where traffic or material handling occurs over completed roofing.",
  "Correct deficiencies in or remove roofing that does not comply with requirements; repair substrates and reinstall roofing to a condition free of damage and eligible for the warranty.",
]

