# Division 07 - Thermal and Moisture Protection

[[section]]
number = "07 11 13"
title = "BITUMINOUS DAMPPROOFING"
when = ["basement"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Cold-applied, emulsified-asphalt dampproofing on below-grade exterior faces of foundation walls.",
  ">Cold-applied, cut-back asphalt dampproofing where emulsions are not suitable for the substrate or temperature.",
  ">Protection board.",
  "Related Requirements:",
  ">Section 03 30 00 \"Cast-in-Place Concrete\" for foundation walls and curing.",
  ">Section 07 13 26 \"Self-Adhering Sheet Waterproofing\" for waterproofing where hydrostatic pressure is anticipated.",
  ">Section 31 20 00 \"Earth Moving\" for backfill and foundation drainage.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including manufacturer's written application instructions, coverage rates and cure times.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Product Certificates: Signed by manufacturer certifying that products comply with VOC limits of authorities having jurisdiction.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver materials in original, unopened containers bearing manufacturer's name, product name and batch number.",
  "Store emulsions above 40 deg F and protect from freezing. Store solvent-based products away from ignition sources.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Weather Limitations: Apply only when ambient and substrate temperatures are above 40 deg F and rising, and not when rain or freezing temperatures are expected within 24 hours.",
  "Ventilation: Provide adequate ventilation during application of solvent-based products in enclosed areas.",
]

[[section.part2]]
title = "MANUFACTURERS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Henry Company.",
  ">Karnak Corporation.",
  ">W.R. Meadows, Inc.",
  ">Tremco Incorporated.",
  "Source Limitations: Obtain primary dampproofing materials and primers from single source from single manufacturer.",
]

[[section.part2]]
title = "BITUMINOUS DAMPPROOFING"
items = [
  "Emulsified-Asphalt Dampproofing: Cold-applied, non-fibered or fibered asphalt emulsion complying with ASTM D1227, Type III or Type II, Class 1.",
  ">Brush and Spray Coats: Non-fibered, ASTM D1227, Type III.",
  ">Trowel Coats: Fibered, ASTM D1227, Type II, Class 1.",
  "Cut-Back-Asphalt Dampproofing: Cold-applied, asphalt solution complying with ASTM D4479, Type I (brush or spray grade) or Type II (fibered, trowel grade), with VOC content complying with authorities having jurisdiction.",
  "Primer: Asphalt primer complying with ASTM D41, or as recommended by dampproofing manufacturer for substrate.",
]

[[section.part2]]
title = "AUXILIARY MATERIALS"
items = [
  "Patching Compound: Asphalt-based, fibered mastic of type recommended by dampproofing manufacturer for filling voids and tie holes.",
  "Protection Board: Premolded, semirigid asphalt composition board, 1/8 inch thick, or 1/2 inch thick extruded-polystyrene board complying with ASTM C578, as recommended by dampproofing manufacturer.",
  "Reinforcing Fabric: Woven glass-fiber fabric treated for use with asphalt, as recommended by dampproofing manufacturer.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, with Installer present, for compliance with requirements and other conditions affecting performance of the Work.",
  "Verify that concrete has cured and aged for minimum time period recommended by dampproofing manufacturer, and that surfaces are dry to the touch.",
  "Proceed with application only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Clean substrates of projections, form-release agents, laitance, loose mortar, dirt, oil and other contaminants that would impair adhesion.",
  "Fill tie holes, honeycombs and voids with patching compound; strike off flush with surface.",
  "Protect adjacent surfaces not indicated to receive dampproofing. Remove overspray immediately.",
]

[[section.part3]]
title = "APPLICATION, GENERAL"
items = [
  "Comply with manufacturer's written instructions for application, including coverage rates and cure times between coats.",
  "Apply dampproofing to exterior face of foundation walls from 6 inches below finished grade down to and over top of footing, and extend over outside face and top of footing.",
  "Apply additional coat at inside and outside corners, construction joints and joints between walls and footings, embedding reinforcing fabric 6 inches wide each side of joint.",
  "Where dampproofing adjoins waterproofing, overlap waterproofing 6 inches and seal as recommended by manufacturers of both products.",
]

[[section.part3]]
title = "APPLICATION OF DAMPPROOFING"
items = [
  "Concrete Foundations: Apply one coat of primer where recommended, followed by two brush or spray coats at not less than 1.25 gal./100 sq. ft. per coat for non-fibered emulsion, or one trowel coat at not less than 4 gal./100 sq. ft. for fibered emulsion.",
  "Unit Masonry Foundations: Parge masonry per Section 04 20 00 \"Unit Masonry\" before applying dampproofing, then apply as specified for concrete.",
  "Allow each coat to dry before applying next coat. Produce a continuous, uniform film free of pinholes and voids.",
]

[[section.part3]]
title = "INSTALLATION OF PROTECTION BOARD"
items = [
  "Install protection board over dampproofing while final coat is still tacky, or adhere with manufacturer's recommended adhesive.",
  "Butt joints tightly and stagger vertical joints. Protect board from damage until backfill is placed.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Protect dampproofing from damage during backfilling. Repair damaged areas before backfilling proceeds.",
  "Do not backfill until dampproofing has cured as recommended by manufacturer.",
]

[[section]]
number = "07 13 26"
title = "SELF-ADHERING SHEET WATERPROOFING"
when = ["basement"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Modified bituminous self-adhering sheet waterproofing on below-grade walls.",
  ">Accessory materials including primers, mastics, detail membranes and termination bars.",
  ">Drainage composite and protection course.",
  "Related Requirements:",
  ">Section 03 30 00 \"Cast-in-Place Concrete\" for substrates and curing.",
  ">Section 07 11 13 \"Bituminous Dampproofing\" for dampproofing of other below-grade surfaces.",
  ">Section 31 20 00 \"Earth Moving\" for backfill and subsurface drainage.",
]

[[section.part1]]
title = "PREINSTALLATION MEETINGS"
items = [
  "Preinstallation Conference: Conduct conference at Project site with waterproofing Installer, manufacturer's representative and installers of adjoining work. Review substrate conditions, details, sequencing, protection and inspection procedures.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including technical data and tested physical properties.",
  "Shop Drawings: Show locations and extent of waterproofing, and details for terminations, inside and outside corners, penetrations, expansion and control joints, and transitions to other waterproofing and air barrier systems.",
  "Samples: For each type of membrane, 8 by 8 inches.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For Installer.",
  "Manufacturer's Field Reports: For each inspection by manufacturer's technical representative.",
  "Sample Warranties: For manufacturer's and Installer's warranties.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: A firm approved or licensed by waterproofing manufacturer, with not less than three years of experience installing similar systems.",
  "Mockups: Install a 100 sq. ft. area of waterproofing, including an inside corner, an outside corner and a penetration, to demonstrate surface preparation, laps, details and protection. Approved mockup may become part of the completed Work.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver liquid materials in original containers with seals unbroken. Store rolls on end or as recommended by manufacturer, on pallets, protected from moisture and direct sunlight.",
  "Maintain storage temperatures within range recommended by manufacturer.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Apply waterproofing within the range of ambient and substrate temperatures recommended by manufacturer, and not less than 40 deg F unless a low-temperature membrane is used.",
  "Do not apply to wet, frozen or frost-covered substrates, or during precipitation.",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Manufacturer's Warranty: Manufacturer agrees to furnish waterproofing material to repair or replace material that fails to remain watertight within five years from date of Substantial Completion.",
  "Installer's Warranty: Installer agrees to repair or replace waterproofing that does not comply with requirements or that fails to remain watertight within two years from date of Substantial Completion.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Provide waterproofing that prevents passage of water under hydrostatic pressure indicated, and that remains watertight when subjected to normal structural movement of substrate.",
]

[[section.part2]]
title = "MODIFIED BITUMINOUS SHEET WATERPROOFING"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Carlisle Coatings and Waterproofing Inc.",
  ">GCP Applied Technologies (Saint-Gobain).",
  ">Henry Company.",
  ">W.R. Meadows, Inc.",
  "Membrane: Self-adhering, 60-mil-thick composite of rubberized asphalt laminated to cross-laminated, high-density polyethylene film, with release liner, complying with the following:",
  ">Tensile Strength, Film: 5000 psi minimum; ASTM D882.",
  ">Low-Temperature Flexibility: Pass at minus 20 deg F; ASTM D1970.",
  ">Crack Cycling: Unaffected after 100 cycles of 1/8-inch movement; ASTM C836.",
  ">Puncture Resistance: 40 lbf minimum; ASTM E154.",
  ">Hydrostatic-Head Resistance: 200 feet minimum; ASTM D5385.",
  ">Water Absorption: 0.2 percent maximum weight gain after 48 hours; ASTM D570.",
  ">Vapor Permeance: 0.05 perm maximum; ASTM E96, Water Method.",
]

[[section.part2]]
title = "AUXILIARY MATERIALS"
items = [
  "Primer: Liquid primer recommended by waterproofing manufacturer for substrate and temperature conditions.",
  "Liquid Membrane and Mastic: Elastomeric, two-component or single-component liquid as recommended by manufacturer for detailing corners, penetrations and terminations.",
  "Substrate Patching Material: Manufacturer's recommended patching material.",
  "Metal Termination Bars: Aluminum or stainless steel, 1 inch wide by 1/8 inch thick, predrilled at 8 inches on center.",
  "Protection Course: Semirigid sheets of fiberglass or mineral-reinforced asphaltic core, 1/8 inch thick, or extruded-polystyrene board, as recommended by manufacturer.",
]

[[section.part2]]
title = "MOLDED-SHEET DRAINAGE PANELS"
items = [
  "Drainage Composite: Prefabricated composite of molded polymeric core with nonwoven geotextile facing on the soil side, with a flow rate of not less than 15 gpm per foot when tested according to ASTM D4716, and compressive strength of not less than 10,000 lbf/sq. ft. per ASTM D1621.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, with Installer present, for compliance with requirements and other conditions affecting performance of the Work.",
  "Verify that concrete has cured and is dry, and that surfaces are smooth, sound and free of voids, spalls, fins and sharp projections.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "SURFACE PREPARATION"
items = [
  "Clean, prepare and treat substrates according to manufacturer's written instructions. Remove dust, dirt, form-release agents, curing compounds and other contaminants.",
  "Fill voids, tie holes and honeycombed areas with patching material. Grind off irregularities and fins.",
  "Prepare, fill, prime and treat joints and cracks in substrate. Install a 3/4-inch cant or fillet of liquid membrane at inside corners.",
  "Prime substrate at rate recommended by manufacturer and allow to dry.",
]

[[section.part3]]
title = "INSTALLATION OF MODIFIED BITUMINOUS SHEETS"
items = [
  "Install membrane according to manufacturer's written instructions and approved Shop Drawings.",
  "Apply a double thickness of membrane or a 12-inch-wide strip of detail membrane at inside and outside corners, extending 6 inches each way.",
  "Install sheets starting at low point of surface, lapping side and end laps not less than 2-1/2 inches, shingled in the direction of water flow. Stagger end laps not less than 12 inches.",
  "Roll membrane firmly with a hand roller to ensure full adhesion without voids, wrinkles or fishmouths.",
  "Seal edges of sheets at terminations and seal laps and T-joints with mastic.",
  "Terminate membrane at top of wall with termination bar mechanically fastened at 8 inches on center and sealed with mastic.",
  "Seal around penetrations with liquid membrane or detail sheets as recommended by manufacturer.",
  "Repair tears, voids and lapped seams not complying with requirements, extending patches 6 inches beyond repaired area.",
]

[[section.part3]]
title = "INSTALLATION OF PROTECTION AND DRAINAGE"
items = [
  "Install protection course or drainage composite over completed membrane before backfilling, with joints butted and secured in place as recommended by manufacturer.",
  "Install drainage composite with geotextile facing away from wall, extending down to the foundation drain and lapped as recommended by manufacturer.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Manufacturer's Field Service: Engage manufacturer's technical representative to inspect substrate before installation, observe installation and inspect completed waterproofing before covering.",
  "Flood Testing: Where horizontal waterproofing is indicated, flood test with 2 inches of water for not less than 24 hours and repair leaks before covering.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Do not expose membrane to sunlight longer than recommended by manufacturer.",
  "Protect installed waterproofing from damage during backfill and subsequent construction. Repair damage before covering.",
]

[[section]]
number = "07 21 00"
title = "THERMAL INSULATION"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Glass-fiber and mineral-wool blanket (batt) insulation.",
  ">Extruded-polystyrene and polyisocyanurate board insulation.",
  ">Mineral-wool board insulation.",
  ">Loose-fill (blown) insulation in attics.",
  ">Insulation baffles and accessories.",
  "Related Requirements:",
  ">Section 06 10 00 \"Rough Carpentry\" for wood framing and blocking.",
  ">Section 07 21 19 \"Foamed-in-Place Insulation\" for spray polyurethane foam.",
  ">Section 07 25 00 \"Weather Barriers\" for water-resistive and air barriers.",
  ">Section 07 26 00 \"Vapor Retarders\" for separate vapor retarders.",
  ">Section 09 29 00 \"Gypsum Board\" for sound attenuation blankets in partitions.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, indicating thermal resistance (R-value), density, facing and fire-test-response characteristics.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Product Test Reports: For each product, based on tests by a qualified testing agency, showing compliance with thermal and fire-test-response requirements.",
  "Energy Code Compliance: Insulation certificate listing type, manufacturer, R-value and installed thickness of each insulation, as required by the energy code adopted by {jurisdiction}.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Surface-Burning Characteristics: Where exposed or required by code, provide insulation with flame-spread index of 25 or less and smoke-developed index of 450 or less when tested according to ASTM E84, unless covered by an approved thermal barrier.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Protect insulation from physical damage and from becoming wet, soiled or covered with ice or snow. Comply with manufacturer's written instructions for handling, storing and protecting during installation.",
  "Protect plastic insulation from exposure to sunlight, open flame and ignition sources. Install and cover within the time recommended by manufacturer.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Thermal Performance: Provide insulation with installed R-values not less than those indicated on Drawings, and not less than those required by the International Energy Conservation Code or ASHRAE 90.1 as adopted by {jurisdiction} for the Project's climate zone.",
  "Unless otherwise indicated, provide the following minimum R-values:",
  ">Exterior Wood-Framed Walls, 2 by 6: R-20 cavity or R-13 cavity plus R-5 continuous.",
  ">Attic, Ceiling Below Vented Attic: R-49.",
  ">Floors Over Unconditioned Space: R-30.",
  ">Basement and Crawlspace Walls: R-15 continuous or R-19 cavity.",
  ">Slab Edge: R-10, 24 inches deep.",
]

[[section.part2]]
title = "GLASS-FIBER BLANKET INSULATION"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">CertainTeed (Saint-Gobain).",
  ">Johns Manville.",
  ">Knauf Insulation.",
  ">Owens Corning.",
  "Unfaced Glass-Fiber Blanket Insulation: ASTM C665, Type I; with maximum flame-spread and smoke-developed indexes of 25 and 50, respectively, per ASTM E84; passing ASTM E136 for combustion characteristics.",
  "Kraft-Faced Glass-Fiber Blanket Insulation: ASTM C665, Type II, Class C; kraft facing with vapor permeance of 1 perm maximum, with stapling flanges. Do not leave exposed.",
  "Foil-Faced Glass-Fiber Blanket Insulation: ASTM C665, Type III, Class A; with foil-scrim-kraft vapor-retarder facing, where exposed installation is indicated.",
]

[[section.part2]]
title = "MINERAL-WOOL INSULATION"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Johns Manville.",
  ">Owens Corning (Thermafiber).",
  ">ROCKWOOL.",
  "Mineral-Wool Blanket Insulation: ASTM C665, Type I, unfaced; noncombustible per ASTM E136; nominal density 2.5 pcf.",
  "Mineral-Wool Board Insulation: ASTM C612, Type IVA; unfaced, 8 pcf nominal density; R-4.2 per inch minimum; noncombustible per ASTM E136, for continuous exterior insulation where indicated.",
]

[[section.part2]]
title = "EXTRUDED-POLYSTYRENE BOARD INSULATION"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">DuPont (Styrofoam).",
  ">Kingspan Insulation LLC.",
  ">Owens Corning (Foamular).",
  "Extruded-Polystyrene Board: ASTM C578, Type X (15 psi) for walls and Type IV (25 psi) for below-grade and under-slab applications; square edges; R-5 per inch minimum; flame-spread and smoke-developed indexes of 75 and 450 or less, per ASTM E84.",
]

[[section.part2]]
title = "POLYISOCYANURATE BOARD INSULATION"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Atlas Roofing Corporation.",
  ">Carlisle Construction Materials (Hunter Panels).",
  ">Firestone Building Products (Holcim).",
  ">Rmax, a Sika company.",
  "Foil-Faced Polyisocyanurate Board: ASTM C1289, Type I, Class 1 or 2; foil facing both sides; R-6.0 per inch minimum; flame-spread index of 25 or less per ASTM E84; qualified for use in exterior walls of Type I-IV construction per NFPA 285 where required.",
]

[[section.part2]]
title = "LOOSE-FILL INSULATION"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">CertainTeed (Saint-Gobain).",
  ">Johns Manville.",
  ">Knauf Insulation.",
  ">Owens Corning.",
  "Glass-Fiber Loose-Fill Insulation: ASTM C764, Type I for pneumatic application; installed at density and thickness required to achieve indicated R-value per manufacturer's coverage chart.",
  "Cellulose Loose-Fill Insulation: ASTM C739; chemically treated for flame resistance, processing and handling characteristics, where indicated.",
]

[[section.part2]]
title = "ACCESSORIES"
items = [
  "Insulation Baffles: Rigid polystyrene or cardboard vent baffles designed to maintain a 1-1/2-inch minimum airspace between insulation and roof sheathing at eaves.",
  "Attic Depth Markers: Markers showing minimum installed thickness, one per 300 sq. ft.",
  "Adhesive for Bonding Insulation: Product compatible with insulation and substrate and recommended by insulation manufacturer.",
  "Insulation Fasteners: Mechanical anchors, impaling pins or wire supports as recommended by manufacturer for application indicated.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates and conditions, with Installer present, for compliance with requirements that affect installation and performance of insulation.",
  "Verify that framing, blocking and utilities within insulated cavities are complete and that air sealing of top and bottom plates and penetrations has been completed.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Clean substrates of substances that are harmful to insulation or adhesives, including removing projections capable of puncturing insulation.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Comply with insulation manufacturer's written instructions applicable to products and applications.",
  "Install insulation that is undamaged, dry and unsoiled and that has not been left exposed to ice, rain or snow.",
  "Extend insulation to envelop entire area to be insulated. Fit tightly around obstructions and fill voids with insulation. Remove projections that interfere with placement.",
  "Provide sizes to fit applications and selected from manufacturer's standard thicknesses, widths and lengths. Apply single layer of insulation units unless multiple layers are otherwise shown or required to make up total thickness or to achieve R-value.",
  "Install to Grade I installation quality as defined by RESNET: no gaps, voids, compression or misalignment.",
]

[[section.part3]]
title = "INSTALLATION OF BLANKET INSULATION"
items = [
  "Install in cavities formed by framing members to produce a friction fit between edges of insulation and adjoining framing members.",
  "Split batts around wiring and piping rather than compressing insulation behind them.",
  "Faced Blankets: Install with vapor-retarder facing toward warm-in-winter side of construction, stapled to face of framing members at 6 inches on center unless otherwise indicated.",
  "Maintain 3-inch clearance of insulation around recessed lighting fixtures not rated for or protected from contact with insulation.",
  "Floors Over Unconditioned Space: Install in full contact with underside of subfloor and support with wire insulation supports at 18 inches on center.",
]

[[section.part3]]
title = "INSTALLATION OF BOARD INSULATION"
items = [
  "Below-Grade Walls and Slab Edges: Adhere boards to foundation walls with adhesive at manufacturer's recommended coverage, butting edges tightly. Extend perimeter insulation to depth indicated.",
  "Under Slabs: Set boards on level, compacted fill with joints butted tightly and staggered.",
  "Continuous Exterior Insulation: Install boards over sheathing with joints staggered and butted tight, fastened with manufacturer's recommended fasteners through furring or cladding attachment. Tape joints where board serves as part of the air barrier, per Section 07 25 00 \"Weather Barriers.\"",
]

[[section.part3]]
title = "INSTALLATION OF LOOSE-FILL INSULATION"
items = [
  "Install baffles at each rafter space at eaves before placing insulation.",
  "Apply loose-fill insulation pneumatically to uniform thickness and density to achieve the R-value indicated, per manufacturer's coverage chart. Install depth markers and post the attic insulation certificate near the attic access.",
  "Insulate and weatherstrip attic access hatches to R-value equal to surrounding ceiling.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Protect installed insulation from damage due to harmful weather exposures, physical abuse and other causes. Provide temporary coverings or enclosures where insulation is subject to abuse and cannot be concealed and protected by permanent construction immediately after installation.",
]

