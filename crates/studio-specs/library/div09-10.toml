[[section.part2]]
title = "FIRE-PROTECTION CABINETS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">JL Industries, Inc.",
  ">Larsen's Manufacturing Company.",
  ">Potter Roemer (Fire-End & Croker).",
  ">Babcock-Davis.",
  "Cabinet Construction: Nonrated, and fire rated where installed in fire-resistance-rated walls.",
  ">Fire-Rated Cabinets: Construct with double walls fabricated from 0.043 inch thick cold-rolled steel sheet lined with minimum 5/8 inch thick fire-barrier material, listed and labeled for the rating of the wall.",
  "Cabinet Material: Cold-rolled steel sheet, 0.043 inch thick.",
  "Semirecessed Cabinet: One-piece combination trim and perimeter door frame overlapping surrounding wall surface with exposed trim face and wall return at outer edge (backbend), 1-1/2 inch rolled-edge trim, so that the cabinet projects not more than 4 inches from the wall.",
  "Cabinet Trim Material: Stainless steel sheet, No. 4 finish.",
  "Door Material: Stainless steel sheet, matching trim.",
  "Door Style: Vertical duo panel with frame, with clear tempered float glass, 1/8 inch thick, or clear acrylic.",
  "Door Hardware: Manufacturer's standard door-operating hardware of proper type for cabinet type, trim style, and door material and style indicated, with pull handle and continuous hinge; operable with one hand and not more than 5 lbf.",
  "Accessories:",
  ">Mounting Bracket: Manufacturer's standard steel, designed to secure fire extinguisher, one for each extinguisher.",
  ">Identification: Lettering FIRE EXTINGUISHER applied to door, vertical orientation, in red vinyl, 1 inch high minimum, or as selected by Architect.",
]

[[section.part2]]
title = "MOUNTING BRACKETS"
items = [
  "Mounting Brackets: Manufacturer's standard galvanized steel, designed to secure fire extinguisher to wall or structure, of sizes required for types and capacities of fire extinguishers indicated, with plated or red baked-enamel finish.",
  "Identification: Where extinguishers are mounted on brackets in public areas, provide wall sign complying with Section 10 14 00 \"Signage\" identifying the extinguisher location.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine walls and partitions for suitable framing depth and blocking where semirecessed cabinets will be installed.",
  "Verify that locations of cabinets and brackets provide travel distances to an extinguisher of not more than 75 feet for Class A hazards, per NFPA 10.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Prepare recesses for semirecessed fire-protection cabinets as required by type and size of cabinet and trim style.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "General: Install fire-protection specialties in locations and at mounting heights indicated or, if not indicated, at heights acceptable to authorities having jurisdiction.",
  ">Mounting Height: Top of fire extinguisher not more than 5 feet above finished floor for extinguishers weighing 40 lb or less, and bottom not less than 4 inches above finished floor, per NFPA 10; operable parts of cabinets 48 inches maximum above finished floor.",
  "Fire-Protection Cabinets: Fasten cabinets to structure, square and plumb.",
  ">Unless otherwise indicated, provide recessed fire-protection cabinets. If wall thickness is inadequate for recessed cabinets, provide semirecessed fire-protection cabinets.",
  ">Provide inside latch and lock for break-glass panels.",
  ">Fasten mounting brackets to inside surface of fire-protection cabinets, square and plumb.",
  ">Fire-Rated Cabinets: Install cabinet with not more than 1/16 inch tolerance between pipe and cabinet hole, and seal through penetrations with firestopping sealant.",
  "Mounting Brackets: Fasten mounting brackets to surfaces, square and plumb, at locations indicated.",
  "Protruding Objects: Where brackets or cabinets are in circulation paths with leading edges between 27 and 80 inches above finished floor, limit projection to 4 inches.",
]

[[section.part3]]
title = "ADJUSTING AND CLEANING"
items = [
  "Remove temporary protective coverings and strippable films, if any, as fire-protection specialties are installed unless otherwise indicated in manufacturer's written installation instructions.",
  "Adjust fire-protection cabinet doors to operate easily without binding. Verify that integral locking devices operate properly.",
  "On completion of fire-protection cabinet installation, clean interior and exterior surfaces as recommended by manufacturer.",
  "Touch up marred finishes, or replace fire-protection cabinets that cannot be restored to factory-finished appearance.",
  "Charge and tag extinguishers at time of installation; place in service only at Substantial Completion, or earlier where required for fire protection during construction.",
]
