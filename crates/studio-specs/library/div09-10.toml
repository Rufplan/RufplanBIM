items = [
  "General: Provide auxiliary materials that comply with referenced installation standards and manufacturer's written instructions.",
  "Steel Drill Screws: ASTM C1002 for framing less than 0.033 inch thick; ASTM C954 for framing 0.033 to 0.112 inch thick.",
  "Sound Attenuation Blankets: ASTM C665, Type I, unfaced mineral-fiber blankets, thickness to fill stud cavity, where indicated.",
  "Acoustical Sealant: ASTM C834, nonsag, paintable, nonstaining latex sealant.",
  "Texture Finishes: Primer and texture material compatible with gypsum board and joint compound, of texture matching approved Sample.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine areas and substrates, including welded hollow-metal frames and framing, with Installer present, for compliance with requirements and other conditions affecting performance.",
  "Examine panels before installation. Reject panels that are wet, moisture damaged, or mold damaged.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "APPLYING AND FINISHING PANELS, GENERAL"
items = [
  "Comply with ASTM C840 and GA-216.",
  "Install ceiling panels across framing to minimize the number of abutting end joints and to avoid abutting end joints in central area of each ceiling; stagger abutting end joints of adjacent panels not less than one framing member.",
  "Install panels with face side out. Butt panels together for a light contact at edges and ends with not more than 1/16 inch of open space between panels. Do not force into place.",
  "Locate edge and end joints over supports, except in ceiling applications where intermediate supports or gypsum board back-blocking is provided behind end joints.",
  "Do not place tapered edges against cut edges or ends. Stagger vertical joints on opposite sides of partitions. Do not make joints other than control joints at corners of framed openings.",
  "Form control and expansion joints with space between edges of adjoining gypsum panels.",
  "Cover both faces of support framing with gypsum panels in concealed spaces (above ceilings), except in chases braced internally.",
  "Isolation: Where gypsum board abuts dissimilar materials or structural elements, provide 1/4 to 1/2 inch wide spaces, trim exposed edges with edge trim, and seal joints with acoustical sealant.",
  "Attachment to Steel Framing: Attach panels so leading edge or end of each panel is attached to open (unsupported) edges of stud flanges first.",
  "STC-Rated Assemblies: Seal construction at perimeters, behind control joints, and at openings and penetrations with a continuous bead of acoustical sealant.",
  "Fastener Spacing: Comply with tested assembly and manufacturer's written instructions; space screws 12 inches o.c. in field and 8 inches o.c. at edges on walls, and 12 inches o.c. on ceilings unless more stringent spacing is required.",
]

[[section.part3]]
title = "APPLYING INTERIOR GYPSUM BOARD"
items = [
  "Single-Layer Application: On ceilings, apply gypsum board before wall panels, to the greatest extent possible, and at right angles to framing unless otherwise indicated.",
  "On partitions and walls, apply gypsum panels vertically (parallel to framing) unless otherwise indicated or required by fire-resistance-rated assembly, and minimize end joints.",
  "Multilayer Application: Apply base layers per tested assembly; offset face-layer joints at least 10 inches from parallel base-layer joints and at least one stud or furring member.",
  "Fire-Resistance-Rated Assemblies: Install components in accordance with the listed design; do not substitute components or alter fastening patterns.",
  "Curved Surfaces: Install panels horizontally and unbroken, to the extent possible, across curved surface plus 12-inch long straight sections at ends of curves; use 1/4 inch flexible gypsum board where radius requires.",
]

[[section.part3]]
title = "APPLYING TILE BACKING PANELS"
items = [
  "Cementitious Backer Units: Install per ANSI A108.11 at showers, tubs, and where indicated; leave 1/4 inch gap at bottom above tubs and shower pans, and seal.",
  "Water-Resistant Barrier: Where required by tile setting method, install barrier or liquid-applied waterproofing membrane behind or over backing per TCNA Handbook method indicated in Section 09 30 13 \"Ceramic Tiling.\"",
  "Areas Not Subject to Wetting: Install glass-mat water-resistant backing board in accordance with manufacturer's written instructions.",
]

[[section.part3]]
title = "INSTALLING TRIM ACCESSORIES"
items = [
  "General: For trim with back flanges intended for fasteners, attach to framing with same fasteners used for panels.",
  "Control Joints: Install control joints at locations indicated or, where not indicated, as follows:",
  ">In partitions and walls, at intervals not exceeding 30 feet.",
  ">In ceilings with perimeter relief, at intervals not exceeding 50 feet so areas do not exceed 2500 sq. ft.; without perimeter relief, at intervals not exceeding 30 feet so areas do not exceed 900 sq. ft.",
  ">At building expansion joints, and where framing or substrate changes.",
  ">From door frame head corners to ceiling or to structure.",
  "Interior Trim: Install cornerbead at outside corners, LC-Bead at exposed panel edges, and L-Bead where panels abut dissimilar surfaces or where indicated.",
  "Aluminum Trim: Install in locations indicated on Drawings.",
]

[[section.part3]]
title = "FINISHING GYPSUM BOARD"
items = [
  "General: Treat gypsum board joints, interior angles, edge trim, control joints, penetrations, fastener heads, surface defects, and elsewhere as required to prepare gypsum board surfaces for decoration. Promptly remove residual joint compound from adjacent surfaces.",
  "Prefill open joints, rounded or beveled edges, and damaged surface areas.",
  "Apply joint tape over gypsum board joints, except for trim products specifically indicated as not intended to receive tape.",
  "Levels of Gypsum Board Finish: Provide the following levels of finish per ASTM C840 and GA-214:",
  ">Level 1: Ceiling plenum areas, concealed areas, and where indicated.",
  ">Level 2: Panels that are substrate for tile, and in mechanical and storage rooms.",
  ">Level 3: Where heavy-texture finishes are indicated.",
  ">Level 4: At panel surfaces that will be exposed to view unless otherwise indicated.",
  ">Level 5: At walls and ceilings exposed to critical lighting, receiving gloss or semigloss paint, or where indicated.",
  "Texture Finish: Where indicated, apply primer and texture to match approved Sample, uniformly without starved spots or other evidence of thin application.",
  "Glass-Mat Faced Panels and Cementitious Backer Units: Finish according to manufacturer's written instructions.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Protect adjacent surfaces from drywall compound and promptly remove from floors and other non-drywall surfaces. Repair surfaces stained, marred, or otherwise damaged during drywall application.",
  "Protect installed products from damage from weather, condensation, direct sunlight, construction, and other causes during remainder of the construction period.",
  "Remove and replace panels that are wet, moisture damaged, or mold damaged.",
]

[[section]]
