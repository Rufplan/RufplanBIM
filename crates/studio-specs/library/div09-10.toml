  "Stack panels flat and supported on risers on a flat platform to prevent sagging.",
  "Do not install panels that have been wet, show evidence of mold, or have damaged edges or cores.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Environmental Limitations: Comply with ASTM C840 requirements or gypsum board manufacturer's written instructions, whichever are more stringent; maintain room temperatures between 50 and 95 deg F during installation and finishing, and for 48 hours before and after.",
  "Do not install interior products until the building is enclosed and weathertight, wet work in the space is complete and dry, and HVAC is operating and maintaining conditions.",
  "Provide ventilation during finishing to remove excess moisture that could prevent drying of joint compound.",
]

