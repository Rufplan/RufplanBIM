  ">During installation.",
  ">48 hours after installation.",
  "Install resilient products after other finishing operations, including painting, have been completed.",
]

[[section.part2]]
title = "RESILIENT BASE"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Johnsonite (Tarkett).",
  ">Roppe Corporation.",
  ">Armstrong Flooring.",
  ">Burke Flooring (Mannington Commercial).",
  "Product Standard: ASTM F1861, Type TS (rubber, vulcanized thermoset), Group I (solid, homogeneous).",
  ">Style and Location: Style B, Cove, at resilient flooring and hard surfaces; Style A, Straight (toeless), at carpet.",
  "Thickness: 0.125 inch.",
  "Height: 4 inches; 6 inches where indicated.",
  "Lengths: Coils in manufacturer's standard length.",
  "Outside Corners: Job formed, or preformed where indicated.",
  "Inside Corners: Job formed.",
  "Colors: As selected by Architect from full range of industry colors.",
]

[[section.part2]]
title = "RESILIENT STAIR ACCESSORIES"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by the manufacturer of resilient base, or by one of the following:",
  ">Johnsonite (Tarkett).",
  ">Roppe Corporation.",
  ">Musson Rubber Company.",
  "Stair Treads: ASTM F2169, Type TS, Class 1 (smooth) or Class 2 (pattern), with integral risers where indicated, 1/4 inch thick, square nose profile to fit stair.",
  "Visually Contrasting Nosing Strip: Integral contrasting color abrasive strip, 2 inches wide, complying with {building_code}.",
  "Landing Tile: Matching treads, for landings.",
]

[[section.part2]]
title = "RESILIENT MOLDING ACCESSORIES"
items = [
  "Description: Rubber reducer strips, carpet edge guards, cove caps, and transition strips for flooring transitions of heights indicated.",
  "Profile and Dimensions: As indicated, with vertical changes in level not exceeding 1/4 inch and beveled changes not exceeding 1/2 inch at a slope of 1:2, per ICC A117.1.",
  "Colors and Patterns: As selected by Architect.",
]

[[section.part2]]
title = "INSTALLATION MATERIALS"
items = [
  "Trowelable Leveling and Patching Compounds: Latex-modified, portland cement based or blended hydraulic-cement-based formulation provided or approved by resilient-product manufacturer for applications indicated.",
  "Adhesives: Water-resistant type recommended by resilient-product manufacturer for resilient products and substrate conditions indicated, with VOC content of not more than 50 g/L for cove base adhesives.",
  "Stair-Tread Nose Filler: Two-part epoxy compound recommended by resilient stair-tread manufacturer to fill nosing substrates that do not conform to tread contours.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, with Installer present, for compliance with requirements for maximum moisture content and other conditions affecting performance.",
  "Verify that finishes of substrates comply with tolerances and other requirements specified in other Sections and that substrates are free of cracks, ridges, depressions, scale, and foreign deposits.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "RESILIENT BASE INSTALLATION"
items = [
  "Comply with manufacturer's written instructions for installing resilient base.",
  "Apply resilient base to walls, columns, pilasters, casework and cabinets in toe spaces, and other permanent fixtures in rooms and areas where base is required.",
  "Install resilient base in lengths as long as practical without gaps at seams and with tops of adjacent pieces aligned.",
  "Tightly adhere resilient base to substrate throughout length of each piece, with base in continuous contact with horizontal and vertical substrates.",
  "Do not stretch resilient base during installation.",
  "On masonry surfaces or other similar irregular substrates, fill voids along top edge of resilient base with manufacturer's recommended adhesive filler material.",
  "Job-Formed Corners: Form outside corners by V-cutting the back of the base and bending; form inside corners by scribing or V-cutting as recommended by manufacturer.",
]

[[section.part3]]
title = "RESILIENT ACCESSORY INSTALLATION"
items = [
  "Comply with manufacturer's written instructions for installing resilient accessories.",
  "Resilient Stair Accessories: Use stair-tread-nose filler to fill nosing substrates that do not conform to tread contours; tightly adhere to substrates throughout length of each piece; for treads installed as separate, equal-length units, install to produce a flush joint between units.",
  "Resilient Molding Accessories: Butt to adjacent materials and tightly adhere to substrates throughout length of each piece. Install reducer strips at edges of floor covering that would otherwise be exposed.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Comply with manufacturer's written instructions for cleaning and protecting resilient products.",
  "Perform the following operations immediately after completing resilient-product installation:",
  ">Remove adhesive and other blemishes from exposed surfaces.",
  ">Sweep and vacuum surfaces thoroughly.",
  ">Damp-mop surfaces to remove marks and soil.",
  "Protect resilient products from mars, marks, indentations, and other damage from construction operations and placement of equipment and fixtures during remainder of construction period.",
  "Cover resilient stair treads until Substantial Completion.",
]

