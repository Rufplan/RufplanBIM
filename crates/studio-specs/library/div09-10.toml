[[section.part2]]
title = "METAL SUSPENSION SYSTEMS"
items = [
  "Metal Suspension-System Standard: Provide manufacturer's standard direct-hung metal suspension systems of types, structural classifications, and finishes indicated that comply with ASTM C635.",
  "Wide-Face, Capped, Double-Web, Steel Suspension System: Main and cross runners roll formed from cold-rolled steel sheet, hot-dip galvanized, G30 coating designation, with prefinished 15/16 inch wide metal caps on flanges.",
  ">Structural Classification: Intermediate-duty system per ASTM C635; heavy-duty where supporting light fixtures and diffusers without independent support.",
  ">Face Design: Flat, flush.",
  ">Cap Finish: Painted white to match panels.",
  "Narrow-Face, Capped, Double-Web Steel Suspension System: 9/16 inch face width, where indicated for tegular panels.",
  "Wet Areas: Aluminum or hot-dip galvanized G60 steel suspension system with manufacturer's corrosion-resistant finish.",
  "Fire-Rated Assemblies: Suspension system listed for the fire-resistance design indicated.",
]

[[section.part2]]
title = "ACCESSORIES"
items = [
  "Attachment Devices: Size for five times the design load indicated in ASTM C635, Table 1, Direct Hung, unless otherwise indicated; comply with seismic design requirements.",
  "Wire Hangers, Braces, and Ties: ASTM A641, Class 1 zinc coating, soft temper, not less than 0.106 inch diameter (12 gauge).",
  "Edge Moldings and Trim: Roll-formed sheet-metal edge moldings and trim matching exposed suspension-system members, including splices, corner pieces, and fasteners; 2 inch horizontal flange at perimeters where required by seismic design.",
  "Hold-Down Clips: Manufacturer's standard clips for panels in vestibules and where indicated.",
  "Seismic Stabilizer Bars and Perimeter Clips: Manufacturer's standard, as required by ASTM E580.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, areas, and conditions, including structural framing to which acoustical panel ceilings attach or abut, with Installer present, for compliance with requirements for installation tolerances and other conditions affecting performance.",
  "Verify that work above ceilings, including ductwork, piping, sprinklers, and cabling, is complete and tested before installing panels.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Measure each ceiling area and establish layout of acoustical panels to balance border widths at opposite edges of each ceiling. Avoid using less-than-half-width panels at borders unless otherwise indicated.",
  "Lay out openings for penetrations centered on the penetrating items.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install acoustical panel ceilings to comply with ASTM C636, seismic design requirements of ASTM E580 and {building_code}, and manufacturer's written instructions.",
  "Suspend ceiling hangers from building's structural members and as follows:",
  ">Install hangers plumb and free from contact with insulation or other objects within ceiling plenum that are not part of supporting structure or of ceiling suspension system.",
  ">Splay hangers only where required to miss obstructions; offset resulting horizontal forces by bracing, countersplaying, or other equally effective means.",
  ">Where ducts and other construction within ceiling plenum interfere with hanger spacing, install supplemental suspension members and hangers in form of trapezes.",
  ">Do not support ceilings directly from permanent metal forms or floor deck; fasten hangers to cast-in-place hanger inserts, post-installed mechanical anchors, or power-actuated fasteners that extend through forms into concrete.",
  ">Do not attach hangers to steel deck tabs, ducts, pipes, or conduit.",
  ">Space hangers not more than 48 inches o.c. along each member supported directly from hangers, and provide hangers not more than 8 inches from ends of each member.",
  ">Provide independent support wires at corners of light fixtures and at air terminals as required by ASTM C636 and ASTM E580.",
  "Secure wire hangers to ceiling-suspension members and to supports above with a minimum of three tight turns.",
  "Install edge moldings and trim at perimeter of acoustical ceiling area and where necessary to conceal edges of acoustical panels; screw attach moldings to substrate at intervals not more than 16 inches o.c. and not more than 3 inches from ends.",
  "Install suspension-system runners so they are square and securely interlocked with one another. Remove and replace dented, bent, or kinked members.",
  "Install acoustical panels with undamaged edges and fit accurately into suspension-system runners and edge moldings. Scribe and cut panels at borders and penetrations to provide a neat, precise fit.",
  ">Arrange directionally patterned acoustical panels as indicated or, if not indicated, in one direction.",
  ">For reveal-edged panels, install panels with bottom of reveal in firm contact with top surface of runner flanges.",
  ">Paint cut edges of panel remaining exposed after installation; match color of exposed panel surfaces.",
  "Tolerance: Level ceiling to within 1/8 inch in 12 feet.",
]

[[section.part3]]
title = "CLEANING"
items = [
  "Clean exposed surfaces of acoustical panel ceilings, including trim, edge moldings, and suspension-system members. Comply with manufacturer's written instructions for cleaning and touchup of minor finish damage.",
  "Remove and replace ceiling components that cannot be successfully cleaned and repaired to permanently eliminate evidence of damage.",
]

