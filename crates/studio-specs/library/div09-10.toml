  "Face Size: Actual tile size, excluding spacer lugs.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including setting materials, grout, membranes, and edge strips.",
  "Shop Drawings: Show locations of each type of tile and tile pattern; show widths, details, and locations of movement joints in tile substrates and finished tile surfaces.",
  "Samples: For each type of tile and for each color and finish required, mounted on a 12 by 24 inch board with grout, and for each grout color.",
