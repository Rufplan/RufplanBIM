[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For Installer.",
  "Moisture Test Reports: Subfloor and flooring moisture readings and concrete moisture test results recorded before installation.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Maintenance Data: For wood flooring and finish to include in maintenance manuals, including recommended cleaning products and recoating intervals.",
]

[[section.part1]]
title = "MAINTENANCE MATERIAL SUBMITTALS"
items = [
  "Extra Materials: Furnish flooring of each species, grade, and finish equal to 2 percent of amount installed, packaged and labeled.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: An experienced installer with not less than five years of experience; supervisor certified by the National Wood Flooring Association (NWFA) as an installation or sand and finish professional.",
  "Installation Standard: Comply with NWFA Installation Guidelines and manufacturer's written instructions.",
  "Mockups: Install a 100 sq. ft. area of each flooring type, including finish, to establish standards for color, grain variation, and workmanship.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver wood flooring only after wet work is complete and the building is enclosed and conditioned.",
  "Store flooring in original packaging in a dry, ventilated space, off the floor, and acclimatize at installation location per NWFA guidelines and manufacturer's written instructions until moisture content is within the range specified.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Conditioning: Maintain relative humidity between 35 and 55 percent and temperature between 60 and 80 deg F in spaces to receive flooring for at least 7 days before installation, during installation, and after installation.",
  "Close spaces to traffic during finishing and for the time recommended by the finish manufacturer after finishing.",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Manufacturer's Warranty: For factory-finished flooring, manufacturer's standard finish-wear warranty of not less than 25 years residential and 5 years commercial, and structural warranty against delamination for the life of the floor.",
]

[[section.part2]]
title = "SOLID-WOOD STRIP FLOORING"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Anderson Tuftex.",
  ">Bruce (AHF Products).",
  ">Mohawk Industries.",
  ">Somerset Hardwood Flooring.",
  "Standard: Comply with NWFA grading rules for species, grade, and cut.",
  "Species and Grade: Northern red oak, Select and Better, plain sawn, unless otherwise indicated.",
  "Thickness: 3/4 inch.",
  "Face Width: 2-1/4 inches.",
  "Lengths: Random lengths, minimum average length of 2-3/4 feet.",
  "Edge Style: Tongue and groove, end matched, with backs relieved.",
  "Moisture Content: 6 to 9 percent at time of installation, and within 2 percent of subfloor.",
  "Floor Types: {floor_types}, as indicated on Drawings.",
]

[[section.part2]]
title = "ENGINEERED-WOOD PLANK FLOORING"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Anderson Tuftex.",
  ">Mohawk Industries.",
  ">Shaw Industries Group.",
  ">Mannington Mills.",
  "Standard: ANSI/HPVA EF, engineered wood flooring.",
  "Construction: Multi-ply cross-laminated core with hardwood wear layer not less than 3/16 inch thick.",
  "Species: [White oak] [Red oak] [Hickory] [Maple], as selected.",
  "Thickness: 1/2 inch minimum; 5/8 inch where installed over radiant heat.",
  "Width: 7 inches, random lengths to 6 feet.",
  "Edge Style: Tongue and groove with micro-beveled edges and ends.",
  "Finish: Factory-applied, UV-cured aluminum oxide urethane, color as selected by Architect.",
  "Formaldehyde Emissions: Comply with EPA TSCA Title VI and CARB Phase 2.",
]

[[section.part2]]
title = "ACCESSORY MATERIALS"
items = [
  "Vapor Retarder: Over concrete, 6 mil polyethylene sheet complying with ASTM D4397, or manufacturer's recommended moisture-control membrane; over wood subfloors, asphalt-saturated kraft paper or 15 lb asphalt felt per NWFA guidelines.",
  "Underlayment for Floating Installations: Manufacturer's standard foam or cork underlayment, with an IIC rating contributing to the floor-ceiling assembly rating where indicated.",
  "Wood Flooring Adhesive: Urethane or moisture-cure adhesive recommended by flooring manufacturer, with VOC content not more than 100 g/L.",
  "Fasteners: As recommended by manufacturer and NWFA: 2 inch barbed flooring cleats or 15-1/2 gauge staples for 3/4 inch solid flooring.",
  "Thresholds and Reducers: Solid wood matching flooring species and finish, profiles as indicated.",
  "Sand and Finish Materials for Unfinished Flooring:",
  ">Wood Filler: Compatible with finish system and recommended by filler and finish manufacturers for use indicated.",
  ">Stain: Penetrating type, color as selected by Architect.",
  ">Finish System: Waterborne two-component polyurethane, one coat sealer and two coats finish, satin sheen, complying with manufacturer's VOC limits.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, with Installer present, for compliance with requirements for installation tolerances, moisture content, and other conditions affecting performance.",
  "Wood Subfloors: Verify that subfloor is flat to within 3/16 inch in 10 feet or 1/4 inch in 6 feet, fastened securely, and with moisture content within 2 percent of flooring for strip flooring less than 3 inches wide and within 4 percent for wider flooring.",
  "Concrete Subfloors: Perform tests recommended by manufacturer, including relative humidity testing per ASTM F2170 and pH testing; proceed only when results are within manufacturer's limits.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Clean substrates free of dust, debris, oil, and other materials that could interfere with bond or fastening.",
  "Grind high spots and fill low spots with patching compound recommended by flooring manufacturer.",
  "Undercut door casings and jambs to receive flooring.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Comply with flooring manufacturer's written instructions and NWFA Installation Guidelines for the installation method indicated.",
  "Vapor Retarder: Install over entire surface of subfloor, lapped 4 inches at edges and ends.",
  "Solid Strip Flooring: Blind nail or staple through tongue at 8 to 10 inches o.c. and within 2 to 3 inches of each end, with at least two fasteners per board; face nail first and last rows.",
  "Engineered Plank Flooring: Install by [glue-down] [nail-down] [floating] method as recommended by manufacturer for substrate.",
  "Layout: Lay flooring parallel to the longest room dimension unless otherwise indicated; stagger end joints of adjacent rows not less than 6 inches for strip and 8 inches for plank.",
  "Expansion Space: Provide expansion space at walls and other obstructions and terminations of flooring of not less than 3/4 inch, or as recommended by manufacturer; conceal with base and shoe molding.",
  "Install thresholds and reducers at doorways and transitions to other flooring materials.",
]

[[section.part3]]
title = "FIELD FINISHING"
items = [
  "Machine sand flooring with progressively finer grits to remove ridges, cupping, and sanding machine marks that would be noticeable after finishing; vacuum and tack with a cloth before applying finish.",
  "Fill cracks, open joints, and nail holes with wood filler; sand smooth after drying.",
  "Apply stain, sealer, and finish coats per finish manufacturer's written instructions, with abrasion between coats, to produce a uniform appearance matching approved mockup.",
  "Do not permit traffic until finish is cured as recommended by manufacturer.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Protect installed flooring during remainder of construction with breathable protective covering of kraft paper or fiberboard; do not use plastic sheet coverings.",
  "Do not move heavy and sharp objects directly over flooring; protect flooring with plywood or hardboard panels when moving.",
]

[[section]]
