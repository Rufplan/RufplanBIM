  ">Section 09 96 00 \"High-Performance Coatings\" for coatings in severe exposures.",
  "Do not paint prefinished items, concealed surfaces, finished metal surfaces (stainless steel, anodized aluminum, bronze), operating parts, labels, or items specifically indicated not to be painted.",
