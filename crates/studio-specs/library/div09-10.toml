  "Do not install carpet tiles over concrete slabs until slabs have cured, are sufficiently dry to bond with adhesive, and have pH range recommended by carpet tile manufacturer.",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Special Warranty for Carpet Tiles: Manufacturer agrees to repair or replace components of carpet tile installation that fail in materials or workmanship within specified warranty period.",
  ">Warranty does not include deterioration or failure of carpet tile due to unusual traffic, failure of substrate, vandalism, or abuse.",
  ">Failures include, but are not limited to, more than 10 percent loss of face fiber, edge raveling, backing delamination, snags, runs, and dimensional instability.",
  ">Warranty Period: 15 years from date of Substantial Completion.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
