  "Flammability: Pass CPSC 16 CFR 1630 (methenamine pill test).",
  "Low-Emitting Materials: CRI Green Label Plus certification for carpet tile and adhesives.",
  "Electrostatic Propensity: Less than 3.0 kV per AATCC 134.",
]

