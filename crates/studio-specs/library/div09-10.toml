# Division 09 Finishes and Division 10 Specialties

[[section]]
number = "09 22 16"
title = "NON-STRUCTURAL METAL FRAMING"
when = ["gypsum+commercial", "cold_formed_framing"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Non-load-bearing steel studs and runners for interior partitions.",
  ">Deflection and firestop tracks.",
  ">Shaft wall framing.",
  ">Suspended framing systems for gypsum board ceilings and soffits.",
  ">Furring channels, grid suspension, and accessories.",
  "Related Requirements:",
  ">Section 05 40 00 \"Cold-Formed Metal Framing\" for load-bearing and exterior non-load-bearing framing.",
  ">Section 07 84 13 \"Penetration Firestopping\" for head-of-wall and penetration firestop systems.",
  ">Section 09 29 00 \"Gypsum Board\" for panels applied to framing.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including stud and track sections, gauges, and section properties.",
  "Shop Drawings: For suspended ceiling framing and for partitions exceeding the manufacturer's published limiting heights, showing layout, bracing, and attachment to structure.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Product Certificates: Signed by manufacturers certifying that framing complies with ASTM C645 and has been verified by a code compliance program.",
  "Evaluation Reports: For embossed or dimpled steel framing members and for firestop tracks, from ICC-ES or another qualified evaluation service.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Code Compliance: Provide framing members certified by the Steel Framing Industry Association (SFIA) Code Compliance Certification Program or the Certified Steel Stud Association (CSSA) program.",
  "Fire-Resistance Ratings: Where framing is part of a fire-resistance-rated assembly, provide materials and construction identical to those tested per ASTM E119 by a qualified testing agency, as listed in the UL Fire Resistance Directory or GA-600.",
  "STC-Rated Assemblies: Where partitions are indicated with sound transmission ratings, provide framing identical to assemblies tested per ASTM E90 and classified per ASTM E413.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Store framing off the ground on level platforms, under cover, and protected from moisture, corrosion, and bending.",
  "Handle members to prevent twisting, denting, or damage to galvanized coating.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Horizontal Deflection: For interior partitions, design framing to resist a lateral load of 5 lbf/sq. ft. with a maximum deflection of L/240 for gypsum board finishes and L/360 for tile or plaster finishes.",
  "Head-of-Wall Movement: Accommodate a vertical deflection of the structure above of not less than 1/2 inch without imposing loads on partitions.",
]

[[section.part2]]
title = "FRAMING SYSTEMS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">ClarkDietrich Building Systems.",
  ">MarinoWARE.",
  ">CEMCO.",
  ">Telling Industries.",
  "Framing Members, General: Comply with ASTM C645 for conditions indicated.",
  ">Steel Sheet: ASTM A1003, Structural Grade 33 or Non-Structural Grade as required by structural performance.",
  ">Protective Coating: ASTM A653, G40 hot-dip galvanized, or coating with equivalent corrosion resistance; G60 in wet areas and at exterior wall furring.",
  "Steel Studs and Runners: ASTM C645, C-shaped studs with flanges not less than 1-1/4 inches and matching U-shaped runners.",
  ">Minimum Base-Metal Thickness: 0.0296 inch (20 gauge equivalent) typical; 0.0312 inch (20 gauge structural) behind tile, cementitious backer, casework, and wall-hung fixtures; 0.0179 inch permitted only where the manufacturer's limiting height tables allow for the assembly.",
  ">Depth: 3-5/8 inches unless otherwise indicated; 6 inches at plumbing walls and where indicated.",
  ">Wall Types: {wall_types}, as indicated on Drawings.",
  "Slip-Type Head Joints: Deep-leg runners with 2-inch legs, or proprietary slotted deflection tracks with 1-1/2 inch vertical movement, installed with studs attached through slots.",
  "Firestop Tracks: Top runner manufactured to allow partition heads to expand and contract with movement of structure while maintaining the continuity of the fire-resistance-rated assembly, listed for the joint system indicated.",
  "Flat Strap and Backing Plates: Steel sheet, 0.0428 inch minimum base-metal thickness, for blocking and bracing in lengths required.",
  "Cold-Rolled Channel Bridging: 0.0538 inch base-metal thickness, 1-1/2 inch deep, with clip angles for attachment to studs.",
  "Hat-Shaped, Rigid Furring Channels: ASTM C645, 7/8 inch deep, 0.0179 inch minimum base-metal thickness.",
  "Resilient Furring Channels: 1/2 inch deep, with single leg configuration, used only in tested sound-rated assemblies.",
  "Z-Shaped Furring: With slotted or nonslotted web, face flange of 1-1/4 inches, wall attachment flange of 7/8 inch, and depth required to fit insulation thickness indicated.",
]

[[section.part2]]
title = "SHAFT WALL FRAMING"
items = [
  "Shaft Wall System: Proprietary C-H or C-T studs, J-runners, and 1-inch gypsum shaftliner panels complying with ASTM C1396, tested as a complete assembly for the fire-resistance rating indicated.",
  "Studs: Depth of 2-1/2 inches unless otherwise indicated, 0.0179 inch minimum base-metal thickness, or heavier where required for height and pressure.",
  "Performance: Design for a lateral pressure of 5 lbf/sq. ft. and for elevator shaft piston pressures where indicated, with deflection limited to L/240.",
]

[[section.part2]]
title = "SUSPENSION SYSTEM COMPONENTS"
items = [
  "Tie Wire: ASTM A641, Class 1 zinc coating, soft temper, 0.062 inch diameter wire, or double strand of 0.048 inch diameter wire.",
  "Hanger Attachments to Concrete: Post-installed expansion anchors or cast-in inserts capable of sustaining five times the design load without failure, per ASTM E488.",
  "Wire Hangers: ASTM A641, Class 1 zinc coating, soft temper, 0.162 inch diameter.",
  "Carrying Channels: Cold-rolled, 0.0538 inch base-metal thickness, 1-1/2 inch deep, galvanized.",
  "Furring Channels: Hat-shaped, rigid, 7/8 inch deep, 0.0296 inch base-metal thickness.",
  "Grid Suspension System for Gypsum Board Ceilings: ASTM C645, direct-hung system of main tees and cross tees, with manufacturer's standard components.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Armstrong World Industries; Drywall Grid Systems.",
  ">>USG Corporation; Drywall Suspension System.",
  ">>CertainTeed; Drywall Suspension.",
  ">Ceiling Types: {ceiling_types}, as indicated on Drawings.",
]

[[section.part2]]
title = "AUXILIARY MATERIALS"
items = [
  "Fasteners for Metal Framing: Of type, material, size, corrosion resistance, holding power, and other properties required to fasten steel members to substrates.",
  "Power-Actuated Anchors: Fastener system of type suitable for application indicated, with capability to sustain, without failure, a load equal to 10 times that imposed by construction as determined by testing per ASTM E1190.",
  "Isolation Strip at Exterior Walls: Asphalt-saturated organic felt or closed-cell foam gasket, width to match framing member.",
  "Acoustical Sealant: Nonsag, nonstaining latex sealant complying with ASTM C834, effective in reducing airborne sound transmission.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine areas and substrates, with Installer present, for compliance with requirements for tolerances and other conditions affecting performance.",
  "Verify that cast-in anchors, inserts, and overhead framing are in place and positioned to receive hangers and head runners.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Coordinate installation of anchorage devices for suspended framing with the structure above; furnish inserts and hanger attachments to other trades for installation in advance of concrete placement.",
  "Coordinate location of in-wall backing for casework, grab bars, accessories, handrails, and equipment with Drawings and with other trades.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Installation Standard: ASTM C754 and manufacturer's written instructions, except where more stringent requirements are indicated.",
  "Install framing and accessories plumb, square, and true to line, with connections securely fastened.",
  "Install supplementary framing, blocking, and bracing at terminations and to support fixtures, equipment, services, heavy trim, grab bars, toilet accessories, furnishings, and similar work.",
  "Isolate steel framing from building structure at locations indicated to prevent transfer of loading imposed by structural movement.",
  "Install bracing at terminations in assemblies.",
  "Do not bridge building control and expansion joints with non-load-bearing framing members; frame both sides of joints independently.",
]

[[section.part3]]
title = "INSTALLING FRAMED ASSEMBLIES"
items = [
  "Install studs so flanges point in the same direction and leading edge or end of each panel can be attached to open (unsupported) edges of stud flanges first.",
  "Space studs 16 inches o.c. unless otherwise indicated; 12 inches o.c. where required by limiting height tables or tested assembly.",
  "Install runners at floors and ceilings anchored at 24 inches o.c. maximum and within 2 inches of ends.",
  "Extend partition framing to structure above where indicated and to not less than 6 inches above suspended ceilings elsewhere; brace partitions that terminate at ceilings.",
  "Slip-Type Head Joints: Where framing extends to overhead structural supports, install to produce joints at tops of framing systems that prevent axial loading of finished assemblies.",
  "Door Openings: Screw vertical studs at jambs to jamb anchor clips on door frames; install runner track section for cripple studs at head and secure to jamb studs.",
  ">Install two studs at each jamb unless otherwise indicated.",
  ">Extend jamb studs through suspended ceilings and attach to underside of overhead structure.",
  "Other Framed Openings: Frame openings other than door openings the same as required for door openings unless otherwise indicated.",
  "Fire-Resistance-Rated Partitions: Install framing to comply with fire-resistance-rated assembly indicated and support closures and to make partitions continuous from floor to underside of solid structure.",
  "Sound-Rated Partitions: Install framing to comply with sound-rated assembly indicated, with acoustical sealant at perimeter runners.",
  "Direct Furring: Attach to concrete or masonry with stub nails, screws designed for masonry attachment, or power-driven fasteners spaced 24 inches o.c.",
  "Installation Tolerance: Install each framing member so fastening surfaces vary not more than 1/8 inch from the plane formed by faces of adjacent framing.",
]

[[section.part3]]
title = "INSTALLING SUSPENSION SYSTEMS"
items = [
  "Space hangers not more than 48 inches o.c. along carrying channels and not more than 12 inches from ends; space carrying channels 48 inches o.c.",
  "Isolation: Where partitions intersect suspended ceilings, isolate suspension systems from partition framing to prevent transfer of loading.",
  "Do not attach hangers to steel roof deck, ducts, pipes, or conduit. Where obstructions interfere with hanger spacing, install supplemental trapezes of carrying channels.",
  "Grid Suspension Systems: Attach perimeter wall track or angle where grid abuts vertical surfaces; level to within 1/8 inch in 12 feet measured lengthwise on each member and transversely between parallel members.",
  "Seismic Bracing: Sway-brace suspended ceiling framing where required by {building_code} and ASTM E580.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Before concealment, notify Architect so that framing, backing, and bracing can be observed.",
  "Remove and replace framing that is bent, damaged, or not installed to within specified tolerances.",
]

[[section]]
number = "09 24 00"
title = "CEMENT PLASTERING"
when = ["stucco"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Exterior portland cement plaster (stucco) on metal lath over framed walls.",
  ">Portland cement plaster applied directly to concrete and masonry.",
  ">Lath, accessories, and water-resistive barriers behind plaster.",
  "Related Requirements:",
  ">Section 06 16 00 \"Sheathing\" for wall sheathing.",
  ">Section 07 25 00 \"Weather Barriers\" for water-resistive barriers other than those behind plaster.",
  ">Section 07 92 00 \"Joint Sealants\" for sealants at openings and control joints.",
  ">Section 09 91 13 \"Exterior Painting\" for paint applied over plaster.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including lath, accessories, and factory-prepared finish coat.",
  "Shop Drawings: Elevations showing locations of control joints, expansion joints, reveals, and trim, and details at openings, penetrations, and terminations.",
  "Samples: For each finish coat texture and color, 12 by 12 inches, on rigid backing.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: Firm with not less than five years of experience installing portland cement plaster on projects of similar scope.",
  "Mockups: Build a mockup of each type of plaster system, 48 by 48 inches minimum, including a window head and sill, control joint, and corner, to demonstrate texture, color, and workmanship.",
  ">Approved mockups may become part of the completed Work if undisturbed at time of Substantial Completion.",
  "Fire-Resistance Ratings: Where plaster is part of a fire-resistance-rated assembly, provide materials and construction identical to those tested per ASTM E119.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver manufactured materials in original unopened packages with labels intact; store cementitious materials off the ground, under cover, and in a dry location.",
  "Store lath and accessories to prevent damage, corrosion, and deformation.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Cold Weather: Do not apply plaster when ambient temperature is below 40 deg F, or to frozen surfaces; maintain temperatures of not less than 40 deg F for 48 hours after application.",
  "Hot and Dry Weather: Protect plaster from uneven and excessive evaporation during hot, dry, or windy weather by shading, fog-spraying, or other means.",
  "Protect adjacent work and finished surfaces from staining and damage during plastering.",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Special Warranty: Installer agrees to repair or replace plaster that cracks beyond hairline, delaminates, or allows water penetration within two years from date of Substantial Completion.",
]

[[section.part2]]
title = "WATER-RESISTIVE BARRIER AND LATH"
items = [
  "Water-Resistive Barrier: Two layers of Grade D building paper complying with ASTM E2556, Type II, or one layer of Grade D paper over a drainage mat, meeting {building_code} requirements for stucco over wood-based sheathing.",
  "Drainage Mat: Three-dimensional polymer mesh, 1/4 inch thick, laminated or loose-laid, providing a continuous drainage plane behind plaster.",
  "Manufacturers: Subject to compliance with requirements, provide lath and accessories by one of the following:",
  ">ClarkDietrich Building Systems.",
  ">Amico (Alabama Metal Industries).",
  ">CEMCO.",
  ">Plastic Components, Inc.",
  "Expanded-Metal Lath: ASTM C847, self-furring diamond-mesh lath, galvanized, 3.4 lb/sq. yd., with paper backing where applied over framing.",
  "Wire Lath: ASTM C1032, self-furring woven wire lath, 17 gauge, 1-1/2 inch hexagonal mesh, galvanized.",
]

[[section.part2]]
title = "ACCESSORIES"
items = [
  "General: Comply with ASTM C1063 and with requirements indicated for materials and shapes; zinc alloy or PVC in exterior applications.",
  "Weep Screed: Foundation-type with vertical attachment flange not less than 3-1/2 inches, located not less than 4 inches above grade and 2 inches above paved surfaces.",
  "Casing Beads: Square-edged, with expanded flanges, sized for plaster thickness indicated.",
  "External Corner Reinforcement: Fabricated from expanded metal lath with ground edge.",
  "Control Joints: One-piece or two-piece, formed with V-shaped slot, with perforated or expanded flanges.",
  "Expansion Joints: Two-piece, with telescoping or slip-joint design, at building expansion joints and floor lines of framed construction.",
  "Reveals and Drip Screeds: Profiles as indicated, of same material as other accessories.",
]

[[section.part2]]
title = "PLASTER MATERIALS"
items = [
  "Portland Cement: ASTM C150, Type I or II, or ASTM C1157.",
  "Masonry Cement: ASTM C91, Type N; or Plastic Cement: ASTM C1328.",
  "Lime: ASTM C206, Type S; or ASTM C207, Type S.",
  "Sand Aggregate: ASTM C897.",
  "Fiber for Base Coat: Alkali-resistant glass or polypropylene fibers, 1/2 inch long, free of contaminants.",
  "Water: Potable.",
  "Bonding Compound: ASTM C932, for application to concrete and masonry.",
  "Factory-Prepared Finish Coat: Manufacturer's standard acrylic-modified or cementitious finish complying with ASTM C926.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Omega Products International.",
  ">>La Habra (Parex USA).",
  ">>Merlex Stucco.",
  ">>Sto Corp.",
  ">Texture: [Sand float] [Fine lace] [Smooth trowel], as selected by Architect.",
  ">Color: As selected by Architect from manufacturer's full range.",
]

[[section.part2]]
title = "PLASTER MIXES"
items = [
  "General: Comply with ASTM C926 for applications indicated.",
  "Base-Coat Mixes: Scratch and brown coats for three-coat plaster over metal lath, proportioned per ASTM C926 Table 2, with fiber added at manufacturer's recommended rate.",
  "Base Coat for Concrete and Masonry: Two-coat plaster, proportioned per ASTM C926.",
  "Job-Mixed Finish Coat: 1 part portland cement, 3/4 to 1-1/2 parts lime, and 1-1/2 to 3 parts sand, by volume.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, framing, sheathing, and openings for compliance with requirements and for conditions affecting performance.",
  "Verify that flashings at openings, roof-to-wall intersections, and penetrations are installed and integrated with the water-resistive barrier.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Concrete and Masonry: Clean surfaces of dirt, efflorescence, form oil, and other substances that impair bond; dampen surfaces before application; apply bonding compound where required.",
  "Protect adjacent surfaces, windows, doors, and finished work from plaster.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Water-Resistive Barrier: Install shingle-fashion with horizontal laps of 2 inches and vertical laps of 6 inches minimum; lap over weep screed flanges and integrate with window and door flashings.",
  "Lath: Install per ASTM C1063, with sides lapped not less than 1/2 inch and ends lapped not less than 1 inch; attach to framing at 7 inches o.c. maximum with corrosion-resistant fasteners penetrating framing not less than 3/4 inch.",
  "Accessories: Install per ASTM C1063, plumb, level, and true to line, with ends butted and aligned.",
  ">Locate control joints so panels do not exceed 144 sq. ft. for walls and have a length-to-width ratio of not more than 2-1/2 to 1; limit distance between joints to 18 feet.",
  ">Install control joints at each side of openings and at changes in substrate.",
  ">Do not continue lath through control and expansion joints.",
  "Plaster Application: Comply with ASTM C926.",
  ">Three-Coat Work over Lath: Scratch coat 3/8 inch, brown coat 3/8 inch, finish coat 1/8 inch, for a total thickness of 7/8 inch.",
  ">Two-Coat Work over Concrete and Masonry: Base coat 3/8 inch and finish coat 1/8 inch.",
  ">Moist cure scratch and brown coats for not less than 48 hours; allow brown coat to cure not less than 7 days before applying finish coat unless using an accelerated method approved by the finish manufacturer.",
  "Finish: Apply finish coat to produce texture and color matching approved mockup, uniform across each wall surface without cold joints; terminate work at control joints or architectural breaks.",
  "Tolerance: Do not deviate more than 1/4 inch in 10 feet from a true plane in finished plaster surfaces.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Remove temporary protection and plaster from surfaces not scheduled to receive plaster; repair floors, walls, and other surfaces stained or damaged by plastering.",
  "Protect plaster from damage and deterioration until Substantial Completion; repair cracked, damaged, or discolored plaster to match adjacent work.",
]

