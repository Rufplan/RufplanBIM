  "Section Includes:",
  ">Resilient base.",
  ">Resilient stair accessories.",
  ">Resilient molding accessories and transition strips.",
  "Related Requirements:",
  ">Section 09 65 19 \"Resilient Tile Flooring\" for resilient floor tile and luxury vinyl tile.",
  ">Section 09 68 13 \"Tile Carpeting\" for carpet tile.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product.",
  "Samples: For each type of product, in manufacturer's standard-size Samples but not less than 12 inches long, of each resilient product color and pattern specified.",
]

[[section.part1]]
title = "MAINTENANCE MATERIAL SUBMITTALS"
