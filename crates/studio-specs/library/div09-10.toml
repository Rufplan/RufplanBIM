[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates and conditions, with Applicator present, for compliance with requirements for maximum moisture content and other conditions affecting performance of the Work.",
  "Maximum Moisture Content of Substrates: When measured with an electronic moisture meter as follows:",
  ">Concrete: 12 percent.",
  ">Masonry (Clay and CMU): 12 percent.",
  ">Wood: 15 percent.",
  ">Portland Cement Plaster: 12 percent, and cured not less than 28 days.",
  "Verify suitability of substrates, including surface conditions and compatibility, with existing finishes and primers.",
  "Proceed with coating application only after unsatisfactory conditions have been corrected; application of coating indicates acceptance of surfaces and conditions.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Comply with manufacturer's written instructions and recommendations in MPI Architectural Painting Specification Manual applicable to substrates and paint systems indicated.",
  "Remove hardware, covers, plates, and similar items already in place that are removable and are not to be painted. If removal is impractical or impossible because of size or weight of item, provide surface-applied protection before surface preparation and painting.",
  "Clean substrates of substances that could impair bond of paints, including dust, dirt, oil, grease, and incompatible paints and encapsulants.",
  "Concrete, Masonry, and Plaster Substrates: Remove efflorescence, chalk, dust, dirt, grease, oils, and release agents; roughen as required to remove glaze; neutralize alkali as recommended by manufacturer.",
  "Steel Substrates: Remove rust, loose mill scale, and shop primer, if any; clean using methods recommended in writing by paint manufacturer but not less than SSPC-SP 2 (hand tool) or SSPC-SP 3 (power tool) cleaning; touch up shop-primed surfaces.",
  "Galvanized-Metal Substrates: Remove grease and oil residue from galvanized sheet metal by mechanical methods to produce clean, lightly etched surfaces that promote adhesion of subsequently applied paints, per SSPC-SP 1.",
  "Wood Substrates: Scrape and clean knots; apply coat of knot sealer before applying primer. Sand surfaces that will be exposed to view, and dust off. Prime edges, ends, faces, undersides, and backsides of wood. After priming, fill holes and imperfections in the finish surfaces with putty or plastic wood filler; sand smooth when dried.",
]

[[section.part3]]
title = "APPLICATION"
items = [
  "Apply paints according to manufacturer's written instructions and recommendations in MPI Architectural Painting Specification Manual.",
  ">Use applicators and techniques suited for paint and substrate indicated.",
  ">Paint surfaces behind movable items same as similar exposed surfaces. Before final installation, paint surfaces behind permanently fixed items with prime coat only.",
  ">Paint both sides and edges of exterior doors and entire exposed surface of exterior door frames.",
  ">Paint entire exposed surface of window frames and sashes.",
  ">Do not paint over labels of independent testing agencies or equipment name, identification, performance rating, or nomenclature plates.",
  "Tint undercoats same color as topcoat, but tint each undercoat a lighter shade to facilitate identification of each coat if multiple coats of same material are to be applied. Provide sufficient difference in shade of undercoats to distinguish each separate coat.",
  "If undercoats or other conditions show through topcoat, apply additional coats until cured film has a uniform paint finish, color, and appearance.",
  "Apply each coat at the dry film thickness recommended by manufacturer; allow each coat to dry before applying the next coat.",
  "Apply paints to produce surface films without cloudiness, spotting, holidays, laps, brush marks, roller tracking, runs, sags, ropiness, or other surface imperfections. Cut in sharp lines and color breaks.",
  "Painting Exterior Mechanical and Electrical Work: Paint exposed conduit, piping, ducts, and equipment on building surfaces to match adjacent surfaces unless otherwise indicated.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Dry Film Thickness Testing: Owner may engage the services of a qualified testing and inspecting agency to inspect and test paint for dry film thickness per SSPC-PA 2.",
  ">Contractor shall touch up and restore painted surfaces damaged by testing.",
  ">If test results show that dry film thickness of applied paint does not comply with paint manufacturer's written recommendations, Contractor shall pay for testing and apply additional coats as needed to provide dry film thickness that complies with paint manufacturer's written recommendations.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "At end of each workday, remove rubbish, empty cans, rags, and other discarded materials from Project site.",
  "After completing paint application, clean spattered surfaces. Remove spattered paints by washing, scraping, or other methods. Do not scratch or damage adjacent finished surfaces.",
  "Protect work of other trades against damage from paint application. Correct damage to work of other trades by cleaning, repairing, replacing, and refinishing, as approved by Architect, and leave in an undamaged condition.",
  "At completion of construction activities of other trades, touch up and restore damaged or defaced painted surfaces.",
]

