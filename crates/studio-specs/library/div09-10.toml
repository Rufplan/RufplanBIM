  "Adhesives: Water-resistant, pressure-sensitive or high-moisture-resistant type recommended by floor tile manufacturer to suit floor tile and substrate conditions indicated, with VOC content of not more than 50 g/L.",
  "Moisture Mitigation System: Where concrete moisture exceeds adhesive manufacturer's limits, provide a two-component epoxy moisture vapor reduction system complying with ASTM F3010.",
