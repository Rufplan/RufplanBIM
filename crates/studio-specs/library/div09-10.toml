[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Applicator Qualifications: Firm with not less than five years of experience applying high-performance coatings of types specified, and acceptable to coating manufacturer.",
  "MPI Standards: Provide products listed in the MPI Approved Products List for the category and system indicated.",
  "Mockups: Apply mockups of each coating system on 100 sq. ft. of representative substrate to demonstrate surface preparation, film build, color, and gloss.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver materials in manufacturer's original, unopened containers labeled with product name, batch number, and mixing instructions; store at temperatures recommended by manufacturer and protect multi-component products from freezing.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Apply coatings only when surface and ambient temperatures are within manufacturer's recommended range and surfaces are at least 5 deg F above the dew point; do not apply when relative humidity exceeds 85 percent.",
  "Provide ventilation during application and curing as recommended by coating manufacturer; protect occupied areas from fumes.",
]

[[section.part2]]
title = "MANUFACTURERS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Tnemec Company, Inc.",
  ">Carboline Company.",
  ">PPG Protective and Marine Coatings.",
  ">Sherwin-Williams Protective and Marine Coatings.",
  "Source Limitations: Obtain each coating system from single manufacturer.",
  "VOC Content: Comply with limits of the authority having jurisdiction for industrial maintenance coatings.",
]

[[section.part2]]
title = "HIGH-PERFORMANCE COATING SYSTEMS"
items = [
  "Epoxy System for Interior Concrete Masonry and Gypsum Board in Wet Areas:",
  ">Block Filler: Epoxy block filler, MPI #116, on concrete masonry units.",
  ">Prime Coat: Epoxy primer or sealer as recommended by manufacturer, on gypsum board.",
  ">Topcoats: Two coats of epoxy, high build, low gloss or semigloss, MPI #98 or #108, at 4 to 6 mils dry film thickness each.",
  "Epoxy/Polyurethane System for Exterior Steel and Galvanized Steel:",
  ">Surface Preparation: SSPC-SP 6 (commercial blast) on steel; SSPC-SP 16 (brush-off blast) on galvanized steel.",
  ">Prime Coat: Zinc-rich primer, MPI #18 or #19, at 3 to 4 mils dry film thickness, on steel; epoxy primer on galvanized steel.",
  ">Intermediate Coat: Epoxy, high build, MPI #108, at 4 to 6 mils dry film thickness.",
  ">Topcoat: Aliphatic polyurethane, two component, semigloss or gloss, MPI #72, at 2 to 3 mils dry film thickness.",
  "Epoxy System for Interior Steel in Corrosive Areas:",
  ">Prime Coat: Epoxy primer, MPI #101.",
  ">Topcoat: Epoxy, high build, MPI #108, at 4 to 6 mils dry film thickness.",
  "Polyaspartic or Epoxy Floor Coating System for Concrete Floors, where indicated:",
  ">Surface Preparation: Shot blast or diamond grind to ICRI CSP 2 to 3 profile.",
  ">Prime Coat: 100 percent solids epoxy primer.",
  ">Body Coat: Epoxy or polyaspartic with broadcast aggregate for slip resistance, color as selected.",
  ">Topcoat: Aliphatic polyaspartic or polyurethane, satin.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates and conditions, with Applicator present, for compliance with requirements for moisture content, surface profile, and other conditions affecting performance.",
  "Concrete Substrates: Verify that concrete has cured not less than 28 days and that moisture vapor emission and relative humidity are within manufacturer's limits when tested per ASTM F1869 or ASTM F2170.",
  "Proceed with coating application only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Comply with coating manufacturer's written instructions and SSPC standards for surface preparation indicated.",
  "Steel Substrates: Remove oil and grease per SSPC-SP 1 before blast cleaning; blast clean to the profile recommended by manufacturer; prime the same day as cleaning.",
  "Concrete and Masonry Substrates: Remove efflorescence, laitance, form release agents, and curing compounds; fill voids and bugholes with manufacturer's recommended surfacer.",
  "Mask and protect adjacent surfaces, hardware, and equipment not to be coated.",
]

[[section.part3]]
title = "APPLICATION"
items = [
  "Mix and apply coatings according to manufacturer's written instructions, observing pot life and induction times for multi-component products.",
  "Apply each coat at the dry film thickness specified, uniformly, without runs, sags, holidays, or pinholes; stripe coat edges, welds, and corners on steel.",
  "Observe manufacturer's minimum and maximum recoat intervals; abrade and clean surfaces that exceed maximum recoat time.",
  "Tint intermediate coats to distinguish them from preceding coats.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Dry Film Thickness: Measure per SSPC-PA 2 at the frequency recommended; apply additional coats where thickness is less than specified.",
  "Holiday Testing: Where coatings are for immersion or severe chemical exposure, test per ASTM D5162 and repair holidays.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Remove spattered coatings from adjacent surfaces without damaging finishes.",
  "Protect coated surfaces from traffic and damage until fully cured; touch up and restore damaged coatings to match adjacent work.",
]

