  ">Edge moldings and trim.",
  "Related Requirements:",
  ">Section 09 22 16 \"Non-Structural Metal Framing\" for gypsum board soffits and bulkheads.",
  ">Section 09 29 00 \"Gypsum Board\" for gypsum board ceilings.",
  ">Divisions 23 and 26 for air diffusers, light fixtures, and devices in ceilings.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
