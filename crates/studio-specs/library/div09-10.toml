[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, with Installer present, for compliance with requirements for maximum moisture content and other conditions affecting performance.",
  "Verify that finishes of substrates comply with tolerances and other requirements specified in other Sections and that substrates are free of cracks, ridges, depressions, scale, and foreign deposits that might interfere with adhesion.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Prepare substrates according to floor tile manufacturer's written instructions to ensure adhesion of resilient products.",
  "Concrete Substrates: Prepare according to ASTM F710.",
  ">Verify that substrates are dry and free of curing compounds, sealers, and hardeners.",
  ">Remove substrate coatings and other substances that are incompatible with adhesives and that contain soap, wax, oil, or silicone, using mechanical methods recommended by floor tile manufacturer.",
  ">Alkalinity and Adhesion Testing: Perform tests recommended by manufacturer. Proceed with installation only after substrate pH is within manufacturer's limits.",
  ">Moisture Testing: Perform in-situ relative humidity testing per ASTM F2170. Proceed with installation only after substrates do not exceed 85 percent relative humidity, or the maximum recommended by manufacturer and adhesive manufacturer.",
  "Fill cracks, holes, and depressions in substrates with trowelable leveling and patching compound; remove bumps and ridges to produce a uniform and smooth substrate, flat to within 3/16 inch in 10 feet.",
  "Do not install floor tiles until materials are the same temperature as space where they are to be installed; move materials into spaces not less than 48 hours in advance of installation.",
  "Sweep and vacuum clean substrates to be covered by resilient products immediately before installation.",
]

[[section.part3]]
title = "FLOOR TILE INSTALLATION"
items = [
  "Comply with manufacturer's written instructions for installing floor tile.",
  "Lay out floor tiles from center marks established with principal walls, discounting minor offsets, so tiles at opposite edges of room are of equal width. Adjust as necessary to avoid using cut widths that equal less than one-half tile at perimeter.",
  ">Lay tiles square with room axis unless otherwise indicated.",
  "Match floor tiles for color and pattern by selecting tiles from cartons in the same sequence as manufactured and packaged, if so numbered. Discard broken, cracked, chipped, or deformed tiles.",
  ">Lay VCT tiles with grain direction alternating in adjacent tiles (basket-weave pattern) unless otherwise indicated.",
  ">Lay LVT planks in random ashlar pattern with end joints offset not less than 8 inches.",
  "Scribe, cut, and fit floor tiles to butt neatly and tightly to vertical surfaces and permanent fixtures including built-in furniture, cabinets, pipes, outlets, and door frames.",
  "Extend floor tiles into toe spaces, door reveals, closets, and similar openings. Extend floor tiles to center of door openings.",
  "Maintain reference markers, holes, and openings that are in place or marked for future cutting by repeating on floor tiles as marked on substrates. Use chalk or other nonpermanent marking device.",
  "Install floor tiles on covers for telephone and electrical ducts, building expansion-joint covers, and similar items in installation areas. Maintain overall continuity of color and pattern between pieces of tile installed on covers and adjoining tiles. Tightly adhere tile edges to substrates that abut covers and to cover perimeters.",
  "Adhere floor tiles to substrates using a full spread of adhesive applied to substrate to produce a completed installation without open cracks, voids, raising and puckering at joints, telegraphing of adhesive spreader marks, and other surface imperfections.",
  "Roll floor tiles with a 100 lb roller in both directions as recommended by manufacturer.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Comply with manufacturer's written instructions for cleaning and protecting floor tile.",
  "Perform the following operations immediately after completing floor tile installation:",
  ">Remove adhesive and other blemishes from exposed surfaces.",
  ">Sweep and vacuum surfaces thoroughly.",
  ">Damp-mop surfaces to remove marks and soil.",
  "Protect floor tile products from mars, marks, indentations, and other damage from construction operations and placement of equipment and fixtures during remainder of construction period.",
  "Floor Polish: For VCT, remove soil, visible adhesive, and surface blemishes from floor tile surfaces before applying liquid floor polish; apply three coats.",
  "Cover floor tile until Substantial Completion.",
]

