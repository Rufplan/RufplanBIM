  "Face Weight: 18 oz./sq. yd. minimum.",
  "Primary Backing: Synthetic, manufacturer's standard.",
  "Secondary Backing: Manufacturer's standard PVC-free or closed-loop recycled backing, dimensionally stable.",
  "Size: 24 by 24 inches, or 9.8 by 39.4 inch planks, as selected.",
  "Traffic Classification: Heavy (Severe) per ASTM D5252 or ASTM D7330 rating of not less than 3.0.",
  "Floor Types: {floor_types}, as indicated on Drawings.",
]

[[section.part2]]
title = "INSTALLATION ACCESSORIES"
items = [
  "Trowelable Leveling and Patching Compounds: Latex-modified, hydraulic-cement-based formulation provided or recommended by carpet tile manufacturer.",
  "Adhesives: Water-resistant, mildew-resistant, nonstaining, pressure-sensitive type to suit products and subfloor conditions indicated, that comply with flammability requirements for installed carpet tile, and are recommended by carpet tile manufacturer for releasable installation; or manufacturer's adhesive-free connector system.",
  "Metal Edge and Transition Strips: Extruded aluminum with mill finish or satin anodized finish, of profile and dimensions required to protect exposed carpet edges and comply with ICC A117.1 changes in level.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, areas, and conditions, with Installer present, for compliance with requirements for maximum moisture content, alkalinity range, installation tolerances, and other conditions affecting carpet tile performance.",
  "Concrete Slabs: Verify that finishes comply with requirements specified in Section 03 30 00 \"Cast-in-Place Concrete\" and that surfaces are free of cracks, ridges, depressions, scale, and foreign deposits; perform relative humidity testing per ASTM F2170 and verify results are within carpet tile and adhesive manufacturer's limits.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "General: Comply with CRI 104, Section 6.2, Site Conditions; Floor Preparation, and with carpet tile manufacturer's written installation instructions for preparing substrates indicated to receive carpet tile.",
  "Use trowelable leveling and patching compounds, according to manufacturer's written instructions, to fill cracks, holes, depressions, and protrusions in substrates.",
  "Remove coatings, including curing compounds, and other substances that are incompatible with adhesives and that contain soap, wax, oil, or silicone, without using solvents.",
  "Broom and vacuum clean substrates to be covered immediately before installing carpet tile.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "General: Comply with CRI 104, Section 13, Carpet Modules, and with carpet tile manufacturer's written installation instructions.",
  "Installation Method: [Monolithic] [Quarter-turn] [Ashlar] [Random], as selected by Architect, with full-spread releasable adhesive or connector system as recommended by manufacturer.",
  "Maintain dye lot integrity. Do not mix dye lots in same area.",
  "Maintain pile-direction patterns indicated on Drawings.",
  "Cut and fit carpet tile to butt tightly to vertical surfaces, permanent fixtures, and built-in furniture including cabinets, pipes, outlets, edgings, thresholds, and nosings. Bind or seal cut edges as recommended by carpet tile manufacturer.",
  "Extend carpet tile into toe spaces, door reveals, closets, open-bottomed obstructions, removable flanges, alcoves, and similar openings.",
  "Maintain reference markers, holes, and openings that are in place or marked for future cutting by repeating on finish flooring as marked on subfloor. Use nonpermanent, nonstaining marking device.",
  "Install pattern parallel to walls and borders.",
  "Install edge and transition strips at exposed edges and at changes in flooring material.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Perform the following operations immediately after installing carpet tile:",
  ">Remove excess adhesive and other surface blemishes using cleaner recommended by carpet tile manufacturer.",
  ">Remove yarns that protrude from carpet tile surface.",
  ">Vacuum carpet tile using commercial machine with face-beater element.",
  "Protect installed carpet tile to comply with CRI 104, Section 15, Protection of Indoor Installations.",
  "Protect carpet tile against damage from construction operations and placement of equipment and fixtures during the remainder of construction period. Use protection methods indicated or recommended in writing by carpet tile manufacturer.",
]

[[section]]
