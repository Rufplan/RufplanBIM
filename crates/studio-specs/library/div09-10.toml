[[section.part2]]
title = "ACOUSTICAL PANELS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Armstrong World Industries.",
  ">USG Corporation.",
  ">CertainTeed Ceilings.",
  ">Rockfon (ROCKWOOL).",
  "Acoustical Panel Standard: Provide manufacturer's standard panels of configuration indicated that comply with ASTM E1264 classifications as designated by types, patterns, acoustical ratings, and light reflectances unless otherwise indicated.",
  "Acoustical Panel, Type ACT-1:",
  ">Classification: ASTM E1264, Type III, Form 2, Pattern CE (fine-textured).",
  ">Color: White.",
  ">Light Reflectance (LR): Not less than 0.85.",
  ">Ceiling Attenuation Class (CAC): Not less than 35.",
  ">Noise Reduction Coefficient (NRC): Not less than 0.70.",
  ">Edge Detail: [Square lay-in for 15/16 inch grid] [Tegular for 9/16 inch grid].",
  ">Thickness: 3/4 inch.",
  ">Modular Size: 24 by 24 inches.",
  ">Antimicrobial Treatment: Manufacturer's standard broad-spectrum treatment.",
  "Acoustical Panel, Type ACT-2 (Wet Areas and Kitchens): Scrubbable, washable, humidity-resistant panels, ASTM E1264 Type IV, Form 2, with vinyl or membrane face, NRC 0.55 minimum.",
