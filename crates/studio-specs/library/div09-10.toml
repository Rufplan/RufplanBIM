  "Product Test Reports: For tile-setting and -grouting products and for dynamic coefficient of friction of floor tile.",
  "Qualification Data: For Installer.",
]

[[section.part1]]
title = "MAINTENANCE MATERIAL SUBMITTALS"
items = [
  "Extra Stock: Furnish tile and trim units that match products installed, packaged with protective covering and labeled, equal to 3 percent of amount installed for each type, color, pattern, and size.",
  "Grout: Furnish one unopened container of each grout color installed.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: Installer employs Certified Tile Installers (CTI) or installers recognized by the Advanced Certifications for Tile Installers (ACT) program, or is a Tile Contractors' Association of America Five-Star Contractor.",
  "Source Limitations: Obtain each type, color, and finish of tile from single source or producer, and setting and grouting materials from single manufacturer.",
  "Mockups: Build a mockup of each type of floor and wall installation, 48 inches square, showing pattern, joint widths, trim, and grout color.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver and store packaged materials in original containers with seals unbroken and labels intact until time of use. Comply with ANSI A137.1 for labeling tile packages.",
  "Store tile and cementitious materials on elevated platforms, under cover, and in a dry location.",
  "Store liquid materials in unopened containers and protected from freezing.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Environmental Limitations: Do not install tile until construction in spaces is complete and ambient conditions are maintained per referenced standards and manufacturer's written instructions; maintain not less than 50 deg F during installation and for 7 days after completion.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Dynamic Coefficient of Friction: For tile installed on walkway surfaces, provide products with the following values as determined by testing identical products per ANSI A326.3:",
  ">Level Interior Surfaces Expected to Be Walked on When Wet: Minimum 0.42.",
  ">Exterior Surfaces and Commercial Kitchens: As recommended by manufacturer for the use, and not less than 0.42.",
]

[[section.part2]]
title = "TILE PRODUCTS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Dal-Tile Corporation.",
  ">Crossville, Inc.",
  ">American Olean.",
  ">Florida Tile, Inc.",
  "ANSI Ceramic Tile Standard: Provide tile that complies with ANSI A137.1 for types, compositions, and other characteristics indicated.",
  "Porcelain Floor Tile, Type CT-1:",
  ">Composition: Porcelain, water absorption of 0.5 percent or less per ASTM C373.",
  ">Face Size: 12 by 24 inches, rectified edges.",
  ">Thickness: 3/8 inch.",
  ">Finish: Matte, unglazed or glazed as selected.",
  ">Tile Color and Pattern: As selected by Architect from manufacturer's full range.",
  ">Grout Color: As selected by Architect.",
  ">Trim Units: Matching cove base, 6 by 12 inches.",
  "Glazed Wall Tile, Type CT-2:",
  ">Composition: Nonvitreous ceramic, glazed.",
  ">Face Size: 3 by 6 inches, or as indicated.",
  ">Thickness: 5/16 inch.",
  ">Finish: Bright glossy or matte glaze, as selected.",
  ">Trim Units: Matching bullnose, cove, and outside corners.",
  "Floor Types: {floor_types}, as indicated on Drawings.",
]

[[section.part2]]
title = "WATERPROOFING AND CRACK ISOLATION MEMBRANES"
items = [
  "Waterproofing Membrane: Liquid-applied or fabric-reinforced sheet membrane complying with ANSI A118.10.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Custom Building Products; RedGard.",
  ">>LATICRETE International; HYDRO BAN.",
  ">>MAPEI Corporation; Mapelastic AquaDefense.",
  ">>Schluter Systems; KERDI.",
  "Crack Isolation Membrane: Complying with ANSI A118.12 for standard performance, over concrete slabs where indicated and at shrinkage cracks.",
]

[[section.part2]]
title = "SETTING MATERIALS"
items = [
  "Manufacturers: Provide setting and grouting materials from one of the following: LATICRETE International; MAPEI Corporation; Custom Building Products; TEC (H.B. Fuller).",
  "Improved Modified Dry-Set Mortar (Thinset): ANSI A118.15, for porcelain tile.",
  ">Large and Heavy Tile Mortar: Where any edge of tile exceeds 15 inches, provide mortar formulated for large and heavy tile.",
  "Latex-Portland Cement Mortar: ANSI A118.4, for glazed wall tile and other applications.",
  "Mortar Bed: ANSI A108.1A, factory-prepared, for sloped mortar beds at showers and where indicated.",
]

[[section.part2]]
title = "GROUT MATERIALS"
items = [
  "High-Performance Tile Grout: ANSI A118.7, sanded for joints 1/8 inch and wider, unsanded for joints narrower than 1/8 inch.",
  "Water-Cleanable Epoxy Grout: ANSI A118.3, chemical-resistant, at commercial kitchens, restroom floors, and where indicated.",
]

[[section.part2]]
title = "MISCELLANEOUS MATERIALS"
items = [
  "Metal Edge Strips: Stainless steel, Type 304, or satin anodized aluminum L-angle or transition profiles, height to match tile and setting-bed thickness, at exposed edges and transitions to other floor finishes.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Schluter Systems.",
  ">>Blanke Corporation.",
  ">>Ceramic Tool Company.",
  "Movement Joints: Preformed or sealant-filled joints per TCNA EJ171; sealant as specified in Section 07 92 00 \"Joint Sealants,\" color to match grout.",
  "Grout Sealer: Manufacturer's standard product for sealing grout joints, which does not change color or appearance of grout.",
  "Tile Cleaner: A neutral cleaner capable of removing soil and residue without harming tile and grout surfaces.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, areas, and conditions where tile will be installed, with Installer present, for compliance with requirements for installation tolerances and other conditions affecting performance.",
  ">Verify that substrates for setting tile are firm, dry, clean, free of coatings incompatible with setting materials, and within flatness tolerances required by ANSI A108.02: 1/4 inch in 10 feet and 1/16 inch in 12 inches for tile with all edges shorter than 15 inches; 1/8 inch in 10 feet and 1/16 inch in 24 inches for tile with any edge 15 inches or longer.",
  ">Verify that concrete substrates are cured not less than 28 days and are free of curing compounds.",
  ">Verify that installation of grounds, anchors, recessed frames, electrical and mechanical units of work, and similar items located in or behind tile has been completed.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Fill cracks, holes, and depressions in concrete substrates with trowelable leveling and patching compound specifically recommended by tile-setting material manufacturer.",
  "Remove protrusions, bumps, and ridges by sanding or grinding.",
  "Blending: For tile exhibiting color variations, verify that tile has been factory blended and packaged so tile units taken from one package show same range of colors as those taken from other packages; if not, blend tile at Project site before installing.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Comply with TCNA Handbook for Ceramic, Glass, and Stone Tile Installation for installation methods specified, and ANSI A108 series of tile installation standards for application of setting and grouting materials.",
  "TCNA Installation Methods:",
  ">Interior Floors on Concrete, Thinset: TCNA F113.",
  ">Interior Floors over Crack Isolation Membrane: TCNA F125.",
  ">Shower Receptors, Bonded Waterproof Membrane: TCNA B421.",
  ">Interior Walls on Metal Studs, Cementitious Backer Units: TCNA W244C.",
  ">Wet Area Walls with Bonded Waterproof Membrane: TCNA B412.",
  "Extend tile work into recesses and under or behind equipment and fixtures to form complete covering without interruptions unless otherwise indicated. Terminate work neatly at obstructions, edges, and corners without disrupting pattern or joint alignments.",
  "Accurately form intersections and returns. Perform cutting and drilling of tile without marring visible surfaces. Grind cut edges of tile abutting trim, finish, or built-in items for straight aligned joints.",
  "Mortar Coverage: Provide not less than 80 percent coverage in dry areas and 95 percent coverage in wet areas and exterior applications; back-butter large-format tile.",
  "Lippage: Limit lippage to that permitted by ANSI A108.02 for the tile size and joint width; for large-format rectified tile, use leveling systems and offset running-bond patterns not more than 33 percent.",
  "Jointing Pattern: Lay tile in grid pattern unless otherwise indicated. Lay out tile work and center tile fields in both directions in each space or on each wall area; adjust to minimize tile cutting.",
  "Joint Widths: Unless otherwise indicated, install tile with 3/16 inch joints for porcelain floor tile and 1/16 inch joints for glazed wall tile.",
  "Movement Joints: Locate and install per TCNA EJ171, at perimeters, at changes of plane, over structural joints, and in the field at 20 to 25 feet each way interior and 8 to 12 feet each way where exposed to direct sunlight or moisture.",
  "Metal Edge Strips: Install where exposed edge of tile flooring meets carpet, wood, or other flooring that finishes flush with or below top of tile.",
  "Waterproofing and Crack Isolation: Install membranes per ANSI A108.13 and manufacturer's written instructions to produce continuous, watertight coverage; flood test shower receptors for 24 hours per ASTM D5957 before installing tile.",
  "Grout: Grout tile per ANSI A108.10 for cement grouts and ANSI A108.6 for epoxy grouts.",
]

[[section.part3]]
title = "CLEANING AND PROTECTING"
items = [
  "Cleaning: On completion of placement and grouting, clean all tile surfaces so they are free of foreign matter.",
  ">Remove grout residue from tile as soon as possible.",
  ">Clean grout smears and haze from tile according to tile and grout manufacturer's written instructions, but no sooner than 10 days after installation; use only cleaners recommended by manufacturers.",
  "Apply grout sealer to cementitious grout joints according to grout-sealer manufacturer's written instructions.",
  "Protect installed tile work with kraft paper or other heavy covering during construction period to prevent staining, damage, and wear; prohibit foot and wheel traffic from tiled floors for at least seven days after grouting is completed.",
]

[[section]]
