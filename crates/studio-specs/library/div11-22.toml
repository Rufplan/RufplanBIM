  "Maximum Protection Area per Sprinkler: As permitted by NFPA 13 and the sprinkler listing.",
  "Velocity: Not more than 20 fps in any pipe section.",
  "Seismic Performance: Where required by ASCE/SEI 7, brace piping according to NFPA 13.",
