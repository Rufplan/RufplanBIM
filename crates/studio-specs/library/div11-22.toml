  "Install shutoff valves at each branch serving a fixture group, at each dwelling unit, and at equipment connections.",
  "Install drain valves at low points and at base of risers.",
  "Install underground copper tube without joints below slabs where practical; protect piping passing through or under concrete with sleeves or wrapping.",
  "PEX Tubing: Install with allowance for thermal expansion; do not expose to direct sunlight; maintain clearance of 18 inches from water heater flue, or as required by manufacturer.",
  "Joints: Make soldered joints with lead-free solder; ream tube ends; make press and expansion joints with tools recommended by fitting manufacturer.",
  "Install water hammer arresters at quick-closing valves, including clothes washers and dishwashers.",
  "Install hot-water recirculation piping with balancing valves at each branch and a check valve at the connection to the water heater.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Pressure Test: Test domestic water piping hydrostatically at 1.5 times working pressure, but not less than 100 psig, for not less than two hours without loss of pressure, or as required by the plumbing code, before concealing.",
  "Backflow Preventers: Test by a certified backflow tester after installation and submit reports.",
  "Repair leaks and retest until no leaks exist.",
]

[[section.part3]]
title = "CLEANING AND DISINFECTION"
items = [
  "Flush piping to remove debris before placing in service.",
  "Disinfect water piping according to AWWA C651 or the procedure required by the plumbing code and authorities having jurisdiction.",
  "Submit water samples to an approved laboratory for bacteriological testing; repeat disinfection until tests show no contamination.",
]

