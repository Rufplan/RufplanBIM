# Rufplan Studio spec library: Divisions 11, 12, 14, 21 and 22.

[[section]]
number = "11 31 00"
title = "RESIDENTIAL APPLIANCES"
when = ["appliances"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Cooking appliances: ranges, cooktops, wall ovens, and microwave ovens.",
  ">Range hoods and ventilation hoods.",
  ">Refrigerators, freezers, and wine and beverage coolers.",
  ">Dishwashers.",
  ">Clothes washers and dryers.",
  ">Garbage disposers.",
  "Related Requirements:",
  ">Section 06 41 16 \"Plastic-Laminate-Clad Architectural Cabinets\" for cabinet openings receiving appliances.",
  ">Section 12 36 61 \"Simulated Stone Countertops\" for countertop cutouts for cooktops and sinks.",
  ">Section 22 40 00 \"Plumbing Fixtures\" for sinks and water supplies to appliances.",
  ">Division 23 for duct connections to range hoods and dryer exhaust ducts.",
  ">Division 26 for electrical circuits, receptacles, and disconnects serving appliances.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each appliance, including dimensions, rough-in and utility requirements, capacities, electrical ratings, and finish.",
  "Appliance Schedule: List each appliance by room, with manufacturer, model number, finish, and required accessories.",
  "Shop Drawings: For built-in and panel-ready appliances, show cabinet cutouts, trim kits, custom panel dimensions, and clearances.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Product Certificates: For each appliance, showing ENERGY STAR qualification where specified.",
  "Sample Warranties: For manufacturer's standard and special warranties.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Operation and Maintenance Data: Manufacturer's use and care guides and installation instructions for each appliance, bound in a single binder, for inclusion in operation and maintenance manuals.",
  "Warranty Documents: Completed registration cards or online registration confirmation in the Owner's name.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Electrical Components: Listed and labeled as defined in NFPA 70, by a qualified testing agency, and marked for intended location and application.",
  "Gas-Fired Appliances: Design certified to ANSI Z21.1 Household Cooking Gas Appliances, as applicable.",
  "Accessibility: Where appliances are indicated as accessible, comply with ICC A117.1 for controls, reach ranges, and clear floor space.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver appliances in manufacturer's original, unopened cartons with labels intact.",
  "Store in a clean, dry, enclosed area protected from construction traffic. Do not deliver until spaces are enclosed and wet work is complete.",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Manufacturer's Warranty: Manufacturer agrees to repair or replace appliances that fail in materials or workmanship within the specified warranty period.",
  ">Warranty Period: One year from date of Substantial Completion for complete appliance, parts and labor.",
  ">Extended Warranty: Manufacturer's standard extended warranty for sealed refrigeration systems, compressors, and magnetrons, typically five years.",
]

[[section.part2]]
title = "MANUFACTURERS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Whirlpool Corporation (Whirlpool, KitchenAid, Maytag, JennAir).",
  ">GE Appliances, a Haier company (GE, GE Profile, Cafe, Monogram).",
  ">BSH Home Appliances Corporation (Bosch, Thermador).",
  ">Sub-Zero Group, Inc. (Sub-Zero, Wolf, Cove).",
  "Source Limitations: Obtain each type of appliance from a single manufacturer; provide matching finish for all appliances in the same room.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Energy Performance: Refrigerators, freezers, dishwashers, clothes washers, and clothes dryers shall be ENERGY STAR qualified.",
  "Water Use: Dishwashers and clothes washers shall comply with water factors required by the ENERGY STAR program and {building_code}.",
  "Sound: Dishwashers shall have a manufacturer-rated sound level of 44 dBA or less.",
]

[[section.part2]]
title = "COOKING APPLIANCES"
items = [
  "Freestanding or Slide-In Range: 30 inches wide, [electric with smooth-top radiant or induction cooktop] [gas with sealed burners], with self-cleaning convection oven.",
  ">Oven Capacity: Not less than 5.0 cu. ft.",
  ">Anti-Tip Device: Manufacturer's anti-tip bracket, installed and anchored to floor or wall framing.",
  ">Controls: Front-mounted electronic controls with digital display and timer.",
  "Cooktop: 30 or 36 inches wide as indicated, [induction] [radiant electric] [gas with sealed burners and continuous cast-iron grates].",
  "Wall Oven: Single or double as indicated, 30 inches wide, electric convection, self-cleaning, with hidden bake element.",
  "Microwave Oven: [Built-in drawer type] [Over-the-range with integral exhaust] [Countertop with trim kit], not less than 1.2 cu. ft. capacity and 1000 W cooking power.",
]

[[section.part2]]
title = "RANGE HOODS"
items = [
  "Range Hood: [Under-cabinet] [Wall-mounted chimney] [Insert] type, width not less than width of cooking appliance served, stainless steel.",
  ">Airflow: Not less than 250 cfm and not more than 400 cfm unless makeup air is provided as required by {building_code}.",
  ">Discharge: Ducted to exterior; recirculating hoods only where indicated.",
  ">Lighting: Integral LED lighting.",
  ">Filters: Removable, dishwasher-safe stainless-steel baffle or mesh filters.",
  ">Sound: Not more than 3 sones at the lowest speed setting.",
]

[[section.part2]]
title = "REFRIGERATION APPLIANCES"
items = [
  "Refrigerator/Freezer: [French-door] [Side-by-side] [Top-freezer] [Built-in panel-ready] configuration, 36 inches wide unless otherwise indicated, frost-free.",
  ">Total Capacity: Not less than 20 cu. ft.",
  ">Ice Maker: Automatic ice maker with water filter; provide water supply connection kit.",
  ">Door Swing: As indicated on Drawings; field-reversible where available.",
  "Undercounter Beverage Center: 24 inches wide, front-vented for built-in installation, glass door, where indicated.",
]

[[section.part2]]
title = "DISHWASHERS"
items = [
  "Dishwasher: Built-in undercounter, 24 inches wide, stainless-steel tub, [stainless-steel front] [panel-ready], with concealed top controls.",
  ">Capacity: Not less than 12 place settings.",
  ">Features: Third rack, soil sensor, and sanitize cycle certified to NSF/ANSI 184.",
  ">Installation Accessories: Mounting brackets, side-mount kit for stone countertops, and drain hose with high-loop or air-gap connection as required by plumbing code.",
]

[[section.part2]]
title = "LAUNDRY APPLIANCES"
items = [
  "Clothes Washer: Front-load, high-efficiency, not less than 4.5 cu. ft. capacity, stackable where indicated.",
  "Clothes Dryer: [Electric] [Gas] [Electric heat pump, ventless] type, matching washer, not less than 7.0 cu. ft. capacity, with moisture sensor.",
  "Accessories: Stacking kit where indicated, new supply hoses with braided stainless-steel jackets, and dryer transition duct of rigid or semi-rigid metal complying with UL 2158A.",
]

[[section.part2]]
title = "GARBAGE DISPOSERS"
items = [
  "Garbage Disposer: Continuous-feed, 3/4 hp minimum, with stainless-steel grinding components, sound insulation, and dishwasher drain connection; UL 430 listed.",
  ">Control: Wall switch or air switch as indicated.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine cabinet openings, rough-in utilities, and ventilation provisions for compliance with manufacturer's requirements and for conditions affecting installation.",
  "Verify that electrical, gas, water, drain, and duct connections are in place and correctly located before installing appliances.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install appliances according to manufacturer's written instructions, level and plumb, and securely anchored.",
  "Built-In Appliances: Install trim kits and custom panels to align with adjacent casework; maintain manufacturer's required clearances and ventilation openings.",
  "Ranges: Install anti-tip devices and verify engagement.",
  "Range Hoods: Mount at height recommended by manufacturer above cooking surface; connect to exhaust duct with airtight joints and backdraft damper.",
  "Dishwashers: Secure to countertop underside or cabinet sides; connect drain with high loop or air gap.",
  "Clothes Dryers: Connect to exhaust duct with shortest practical transition duct; do not use plastic or foil transition ducts.",
  "Utility Connections: Make final connections to plumbing, gas, and electrical services provided under other Sections; comply with applicable codes.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Test each appliance for proper operation through all cycles and functions. Check gas connections for leaks.",
  "Replace appliances that are damaged or do not operate properly.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Remove packing materials, protective films, and labels other than required listing labels. Clean exposed surfaces according to manufacturer's instructions.",
  "Protect installed appliances from damage until Substantial Completion.",
  "Demonstration: Train Owner's personnel in operation and maintenance of appliances.",
]

