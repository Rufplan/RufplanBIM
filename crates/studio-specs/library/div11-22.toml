[[section.part3]]
title = "EXCAVATION AND BEDDING"
items = [
  "Excavate, bed, and backfill underground piping as specified in Division 31; provide uniform bearing on compacted granular bedding for full length of pipe.",
]

[[section.part3]]
title = "PIPING INSTALLATION"
items = [
  "Install sanitary waste and vent piping according to the plumbing code and pipe manufacturer's written instructions.",
  "Install drainage piping at uniform slope; do not reduce pipe size in the direction of flow.",
  "Make changes in direction with long-sweep fittings, wyes, and eighth bends as required by code; do not use sanitary tees for horizontal-to-horizontal changes.",
  "Install cleanouts at base of each stack, at each change in direction greater than 45 degrees, at intervals not exceeding 100 feet in horizontal runs, and where required by code; locate accessible.",
  "Extend vents through roof not less than 12 inches above roof surface, or higher where required by code; locate not less than 10 feet from air intakes, operable windows, and doors unless 3 feet above them.",
  "Plastic Piping: Do not install in return-air plenums or exposed where prohibited; provide firestopping listed for plastic pipe at rated penetrations.",
  "Support cast-iron hubless piping at each joint and at each change in direction; brace horizontal piping 4 inches and larger at changes in direction.",
  "Install floor drains with top of strainer 1/4 inch below finished floor, and slope floors to drains where indicated.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Rough-In Test: Test drainage and vent piping before concealing by filling with water to not less than 10 feet of head above the highest joint, held for 15 minutes without leakage, or by air test where permitted. Do not air test plastic piping unless permitted by pipe manufacturer.",
  "Final Test: After fixtures are set and traps filled, perform smoke or peppermint test where required by authorities having jurisdiction.",
  "Repair leaks and retest until no leaks exist.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Clean interior of piping; remove debris and flush the system. Keep open ends of piping capped during construction.",
]

