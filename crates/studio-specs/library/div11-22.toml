  ">Watts Water Technologies (Watts Drainage).",
  ">Josam Company.",
  "Cleanouts: Complying with ASME A112.36.2M, with threaded plugs; floor cleanouts with adjustable nickel-bronze tops matching floor finish; wall cleanouts with stainless-steel covers.",
  "Floor Drains: Complying with ASME A112.6.3, cast-iron body with flashing collar, adjustable nickel-bronze strainer, and trap primer connection where required by code.",
