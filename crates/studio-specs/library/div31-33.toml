  ">Do not enclose, cover or put into service before inspection and approval.",
  ">Test PVC gravity piping by air test according to ASTM F1417 where required.",
  "Flow Test: Before Substantial Completion, flood each catch basin, drain and downspout connection with water and verify free flow to the point of discharge.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
