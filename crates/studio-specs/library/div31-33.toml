  "Handle precast concrete structures according to manufacturer's written rigging instructions.",
]

[[section.part2]]
title = "PIPING MATERIALS"
items = [
  "Comply with requirements in Part 3 piping schedule for applications of pipe, fitting and joining materials.",
  "PVC Sewer Pipe and Fittings: ASTM D3034, SDR 35, for 4- through 15-inch sizes, with bell-and-spigot ends for gasketed joints and ASTM F477 elastomeric seals.",
  "Corrugated Polyethylene Pipe: AASHTO M 294, Type S, dual-wall with smooth interior, for 12- through 60-inch sizes, with watertight bell-and-spigot joints and ASTM F477 gaskets; or ASTM F2648 for dual-wall pipe.",
  "Reinforced-Concrete Sewer Pipe: ASTM C76, Class III, Wall B, with bell-and-spigot or tongue-and-groove ends and ASTM C443 rubber gasket joints, where indicated.",
  "Perforated Drainage Pipe: AASHTO M 252, Type SP, corrugated polyethylene with smooth interior, 4- and 6-inch sizes; or ASTM D2729 perforated PVC, for foundation and subsurface drains.",
  "Downspout Connection Pipe: ASTM D2729 or ASTM D3034 PVC, solid wall, 4-inch minimum, with adapters to downspouts.",
  "Manufacturers: Subject to compliance with requirements, provide polyethylene pipe by one of the following:",
  ">Advanced Drainage Systems, Inc. (ADS).",
  ">Prinsco, Inc.",
  ">JM Eagle.",
]

[[section.part2]]
title = "CATCH BASINS AND DRAINS"
items = [
  "Standard Precast Concrete Catch Basins: ASTM C478, precast, reinforced concrete, of depth indicated, with provision for sealant joints, and 12-inch minimum sump below the outlet invert.",
  ">Base Section: 6-inch minimum thickness for floor slab and 4-inch minimum thickness for walls.",
  ">Joint Sealant: ASTM C990, bitumen or butyl rubber.",
  ">Resilient Pipe Connectors: ASTM C923, cast or fitted into walls, for each pipe connection.",
  "Frames and Grates: ASTM A536, Grade 60-40-18 ductile iron, or ASTM A48, Class 30 gray iron, designed for AASHTO H-20 heavy-duty traffic loading in paved areas. Provide heel-proof, ADA-compliant grates with openings not exceeding 1/2 inch in the direction of travel where in pedestrian routes.",
  "Plastic Area Drains and Inlets: Polyethylene or PVC drain basins with ductile-iron or polyolefin grates, sized as indicated, for landscape and light-duty areas.",
  "Manufacturers: Subject to compliance with requirements, provide frames, grates and drain basins by one of the following:",
  ">EJ (East Jordan Iron Works).",
  ">Neenah Enterprises, Inc.",
  ">NDS, Inc.",
  ">Nyloplast (Advanced Drainage Systems, Inc.).",
  "Trench Drains, where indicated: Precast polymer concrete channels with ductile-iron grates, load class according to EN 1433 suited to the traffic indicated.",
]

[[section.part2]]
title = "MANHOLES AND CLEANOUTS"
items = [
  "Manholes: Precast concrete complying with requirements of Section 33 31 00 \"Sanitary Utility Sewerage Piping,\" except with covers lettered STORM SEWER.",
  "Cleanouts: PVC or cast-iron cleanouts as specified in Section 33 31 00 \"Sanitary Utility Sewerage Piping.\"",
]

[[section.part2]]
title = "OUTFALLS AND ACCESSORIES"
items = [
  "Flared End Sections: Precast concrete, corrugated polyethylene or galvanized steel, matching pipe size and material.",
  "Headwalls: Cast-in-place or precast concrete, with 28-day compressive strength of 4000 psi, of shape and size indicated.",
  "Riprap: Broken, irregularly sized and shaped graded stone, of size and thickness indicated, over filter geotextile.",
  "Splash Blocks: Precast concrete, 24 by 16 inches minimum, where downspouts discharge to grade.",
  "Drainage Geotextile and Aggregate: As specified in Section 31 20 00 \"Earth Moving.\"",
]

[[section.part3]]
title = "EARTHWORK"
items = [
  "Excavation, trenching and backfilling are specified in Section 31 20 00 \"Earth Moving.\"",
  "Provide minimum cover of 24 inches over storm piping in landscape areas and 36 inches under paving, or as required by pipe manufacturer for traffic loads, unless otherwise indicated.",
]

[[section.part3]]
title = "PIPING INSTALLATION"
items = [
  "General Locations and Arrangements: Drawing plans and details indicate general location and arrangement of underground storm drainage piping. Install piping as indicated, to extent practical.",
  "Install piping beginning at low point, true to grades and alignment indicated with unbroken continuity of invert. Place bell ends of piping facing upstream.",
  "Install manholes or catch basins for changes in direction unless fittings are indicated. Use fittings for branch connections unless direct tap into existing sewer is indicated.",
  "Install gravity-flow, nonpressure drainage piping according to the following:",
  ">Install piping pitched down in direction of flow at a minimum slope of 1 percent unless otherwise indicated.",
  ">Install PVC sewer piping according to ASTM D2321 and ASTM F1668.",
  ">Install corrugated polyethylene piping according to ASTM D2321 and manufacturer's written instructions.",
  ">Install reinforced-concrete sewer piping according to ASTM C1479 and ACPA Concrete Pipe Installation Manual.",
  "Downspout Connections: Connect downspouts to storm piping with adapters and cleanouts at grade where indicated. Where downspouts discharge to grade, install splash blocks sloped away from the building.",
  "Clear interior of piping and structures of dirt and superfluous material as work progresses. Place plug in end of incomplete piping at end of day and when work stops.",
]

[[section.part3]]
title = "SUBSURFACE DRAINAGE INSTALLATION"
items = [
  "Foundation Drains: Place drainage geotextile and a 4-inch-thick layer of drainage aggregate on the footing or subgrade, lay perforated pipe with perforations down, sloped 1/8 inch per foot minimum to outlet, and cover with drainage aggregate to a height of 6 inches above the top of the pipe. Wrap aggregate with geotextile.",
  "Connect foundation drains to storm drainage system, sump or daylight outlet as indicated. Install cleanouts at upstream ends and at changes in direction greater than 45 degrees.",
  "Do not connect foundation drains to sanitary sewers.",
]

[[section.part3]]
title = "STRUCTURE INSTALLATION"
items = [
  "Install precast concrete catch basins and manholes on 6-inch compacted bed of bedding course, with sealants according to ASTM C891.",
  "Set frames and grates to elevations indicated. In paving, set grates 1/4 inch below finished pavement surface and slope paving to grates. In turf and planted areas, set grates 1 inch below finished grade.",
  "Install plastic area drains and inlets according to manufacturer's written instructions, with concrete collars in paved areas.",
  "Form continuous concrete channels and benches between inlets and outlet in manholes.",
  "Construct headwalls and install flared end sections at outfalls as indicated, and place riprap over filter geotextile to dimensions indicated.",
]

[[section.part3]]
title = "CONNECTIONS"
items = [
  "Connect nonpressure, gravity-flow drainage piping to building's storm building drains specified in Division 22.",
  "Connect to the public storm sewer or discharge point according to requirements of authorities having jurisdiction.",
  "Make connections to existing piping and structures by core drilling and installing resilient pipe connectors, and reconstruct channels as required. Protect existing piping and structures to prevent debris from entering.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Inspect interior of piping to determine whether line displacement or other damage has occurred. Inspect after approximately 24 inches of backfill is in place, and again at completion of Project.",
  ">Defects requiring correction include misalignment, deflection of flexible piping greater than 5 percent, damaged piping, infiltration and loose joints.",
