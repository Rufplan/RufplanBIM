  ">Listed ceramic glazing, 5 mm nominal, rated for the fire-protection rating of the door or opening, impact-safety rated to CPSC 16 CFR 1201, Category II.",
  "Glass Type GL-5 - Obscure Tempered Glass:",
  ">Thickness: 6 mm, fully tempered patterned or acid-etched glass, at bathroom windows and where indicated; within insulating glass units at exterior locations.",
