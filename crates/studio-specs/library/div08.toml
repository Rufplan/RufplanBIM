# Division 08 - Openings

[[section]]
number = "08 11 13"
title = "HOLLOW METAL DOORS AND FRAMES"
when = ["doors_hollow_metal"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Standard hollow metal doors, interior and exterior.",
  ">Standard hollow metal frames, knocked-down and welded.",
  ">Fire-rated hollow metal door and frame assemblies.",
  ">Borrowed-light and sidelight frames.",
  "Door types: {door_types}, as scheduled on Drawings.",
  "Related Requirements:",
  ">Section 04 20 00 \"Unit Masonry\" for grouting and building in frames set in masonry.",
  ">Section 08 71 00 \"Door Hardware\" for door hardware for hollow metal doors.",
  ">Section 08 80 00 \"Glazing\" for glass in hollow metal doors and frames.",
  ">Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting\" for field painting of primed doors and frames.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Minimum Thickness: Minimum thickness of base metal without coatings according to NAAMM-HMMA 803 or SDI A250.8.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of door and frame, including construction details, material descriptions, core descriptions, fire-resistance ratings, and finishes.",
  "Shop Drawings: Include the following:",
  ">Elevations of each door type and frame type.",
  ">Details of doors, including vertical and horizontal edge details and metal thicknesses.",
  ">Frame details for each frame type, including dimensioned profiles and metal thicknesses.",
  ">Locations of reinforcement and preparations for hardware.",
  ">Details of anchorages, joints, field splices, and connections.",
  ">Details of accessories, moldings, and glazing stops.",
  "Schedule: Door and frame schedule prepared by or under the supervision of the supplier, using the same reference numbers as the Drawings, coordinated with the door hardware schedule.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Product Test Reports: For each type of exterior door assembly, showing compliance with thermal performance requirements, by a qualified testing agency.",
  "Certificates: Labeling agency certification for oversize fire-rated assemblies that cannot bear a label.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Fire-Rated Assemblies: Complying with NFPA 80 and listed and labeled by a qualified testing agency for the fire-protection rating indicated, based on testing at positive pressure according to UL 10C.",
  "Smoke- and Draft-Control Assemblies: Where indicated, provide assemblies tested according to UL 1784 and installed in compliance with NFPA 105.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver doors and frames palletized, packaged, or crated to provide protection during transit and Project-site storage. Do not use nonvented plastic.",
  "Deliver welded frames with two removable spreader bars across the bottom of each frame, tack welded or mechanically attached.",
  "Store doors and frames under cover on platforms or blocking at least 4 inches above grade, in a vertical position with 1/4-inch space between each stacked door to permit air circulation.",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Special Warranty: Manufacturer agrees to repair or replace doors that fail in materials or workmanship, including delamination of face sheets and failure of welds, within one year from date of Substantial Completion.",
]

[[section.part2]]
title = "MANUFACTURERS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Ceco Door; ASSA ABLOY.",
  ">Curries Company; ASSA ABLOY.",
  ">Steelcraft; Allegion plc.",
  ">Republic Doors and Frames.",
  "Source Limitations: Obtain hollow metal work from single source from single manufacturer.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Fire-Rated Assemblies: Provide door and frame assemblies with fire-protection ratings indicated, with temperature-rise ratings where required by the building code at exit enclosure and exit passageway doors.",
  "Thermal Performance of Exterior Doors: U-factor not more than 0.37 Btu/sq. ft. x h x deg F when tested according to ASTM C1363.",
  "Windborne-Debris Impact Resistance: Where required by the building code, provide exterior assemblies tested according to ASTM E1886 and ASTM E1996.",
]

[[section.part2]]
title = "INTERIOR DOORS AND FRAMES"
items = [
  "Standard-Duty Doors and Frames: SDI A250.8, Level 1; at closets and low-use spaces where indicated.",
  ">Physical Performance: Level C according to SDI A250.4.",
  ">Doors: Full flush, 1-3/4 inches thick, face sheets of uncoated cold-rolled steel sheet, minimum thickness 0.032 inch (20 gauge).",
  ">Core: Manufacturer's standard kraft-paper honeycomb, polystyrene, or polyurethane.",
  ">Frames: Minimum thickness 0.053 inch (16 gauge), knocked-down or face-welded as indicated.",
  "Heavy-Duty Doors and Frames: SDI A250.8, Level 2; unless otherwise indicated.",
  ">Physical Performance: Level B according to SDI A250.4.",
  ">Doors: Full flush, 1-3/4 inches thick, face sheets minimum thickness 0.042 inch (18 gauge).",
  ">Edge Construction: Model 2, seamless.",
  ">Core: Manufacturer's standard; mineral board or vertical steel stiffener core at fire-rated doors as required by listing.",
  ">Frames: Minimum thickness 0.053 inch (16 gauge), full profile welded.",
]

[[section.part2]]
title = "EXTERIOR DOORS AND FRAMES"
items = [
  "Extra-Heavy-Duty Doors and Frames: SDI A250.8, Level 3.",
  ">Physical Performance: Level A according to SDI A250.4.",
  ">Doors: Full flush, 1-3/4 inches thick, face sheets of metallic-coated steel sheet, minimum thickness 0.053 inch (16 gauge), with minimum A60 zinc-iron-alloy (galvannealed) coating according to ASTM A653/A653M.",
  ">Edge Construction: Model 2, seamless, with top and bottom channels closed with flush steel caps.",
  ">Core: Polyurethane or polyisocyanurate foam insulation, with thermal performance as specified.",
  ">Frames: Metallic-coated steel sheet, minimum thickness 0.067 inch (14 gauge), full profile welded, with thermal break where indicated.",
]

[[section.part2]]
title = "FRAME ANCHORS"
items = [
  "Jamb Anchors:",
  ">Masonry Type: Adjustable strap-and-stirrup or T-shaped anchors, not less than 0.042 inch thick, to suit frame size, with corrugated or perforated straps not less than 2 inches wide by 10 inches long.",
  ">Stud-Wall Type: Designed to engage stud, welded to back of frames; not less than 0.042 inch thick.",
  ">Postinstalled Expansion Type for In-Place Concrete or Masonry: Minimum 3/8-inch-diameter bolts with expansion shields or inserts.",
  "Floor Anchors: Formed from same material as frames, minimum thickness 0.042 inch, and as follows:",
  ">Monolithic Concrete Slabs: Clip-type anchors, with two holes to receive fasteners.",
  ">Separate Topping Concrete Slabs: Adjustable-type anchors with extension clips, allowing not less than 2-inch height adjustment.",
]

[[section.part2]]
title = "ACCESSORIES AND FABRICATION"
items = [
  "Hardware Reinforcement: Fabricate according to SDI A250.6 with reinforcing plates from same material as door face sheets and frames.",
  "Hardware Preparation: Factory prepare doors and frames to receive templated mortised hardware according to SDI A250.6, BHMA A156.115, and the door hardware schedule. Locate hardware as indicated or, if not indicated, according to SDI A250.8.",
  "Glazing Stops: Minimum 0.032-inch-thick steel, formed square, with countersunk flat- or oval-head machine screws spaced uniformly not more than 9 inches on center. Provide fixed stops on outside of exterior and secure side of interior openings.",
  "Door Silencers: Except on weather-stripped frames, drill stops to receive three silencers on strike jambs of single-door frames and two silencers on heads of double-door frames.",
  "Plaster Guards: Steel sheet, minimum thickness 0.016 inch, welded to frame at back of hardware cutouts to close off interior of openings.",
  "Grout Guards: Provide at back of hardware mortises in frames to be grouted.",
  "Fabricate exterior doors with top edge closed flush and sealed watertight.",
]

[[section.part2]]
title = "FINISHES"
items = [
  "Prime Finish: Clean, pretreat, and apply manufacturer's standard primer complying with SDI A250.10, compatible with finish paint specified in Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting\".",
  "Factory-Applied Paint Finish, where indicated: Manufacturer's standard, complying with SDI A250.3, color as selected by Architect from manufacturer's full range.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine substrates, areas, and conditions, with Installer present, for compliance with requirements for installation tolerances and other conditions affecting performance.",
  "Examine roughing-in for embedded and built-in anchors to verify actual locations before frame installation.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Remove welded-in shipping spreaders installed at factory. Restore exposed finish by grinding, filling, and dressing.",
  "Drill and tap doors and frames to receive non-templated mortised and surface-mounted door hardware.",
  "Prior to installation, adjust and securely brace welded frames for squareness, alignment, twist, and plumbness to the following tolerances:",
  ">Squareness: Plus or minus 1/16 inch, measured at door rabbet on a line 90 degrees from jamb perpendicular to frame head.",
  ">Alignment: Plus or minus 1/16 inch, measured at jambs on a horizontal line parallel to plane of wall.",
  ">Twist: Plus or minus 1/16 inch, measured at opposite face corners of jambs on parallel lines.",
  ">Plumbness: Plus or minus 1/16 inch, measured at jambs at floor.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "General: Install hollow metal work plumb, rigid, properly aligned, and securely fastened in place according to SDI A250.11 and manufacturer's written instructions.",
  "Fire-Rated Openings: Install according to NFPA 80.",
  "Frames: Set frames accurately in position; plumb, align, and brace securely until permanent anchors are set.",
  ">Floor Anchors: Secure with postinstalled expansion anchors.",
  ">Masonry Walls: Coordinate installation with masonry construction. Fill frames with grout where indicated; take precautions to prevent bowing of frame jambs.",
  ">Metal-Stud Partitions: Install at least three wall anchors per jamb up to 7 feet 6 inches high, and one additional anchor for each additional 24 inches.",
  ">In-Place Concrete or Masonry: Secure frames in place with postinstalled expansion anchors, countersunk and concealed with filler, dressed smooth.",
  "Doors: Fit hollow metal doors accurately in frames within the following clearances:",
  ">Jambs and Head: 1/8 inch plus or minus 1/16 inch.",
  ">Between Edges of Pairs of Doors: 1/8 inch plus or minus 1/16 inch.",
  ">At Bottom of Door: 3/4 inch plus or minus 1/16 inch, or as required by threshold, and as permitted by NFPA 80 at fire-rated doors.",
  "Glazing: Comply with Section 08 80 00 \"Glazing\" and manufacturer's written instructions. Secure stops with countersunk screws spaced not more than 9 inches on center and not more than 2 inches from each corner.",
]

[[section.part3]]
title = "ADJUSTING AND CLEANING"
items = [
  "Final Adjustments: Check and readjust operating hardware items immediately before final inspection. Leave work in complete and proper operating condition. Remove and replace defective work, including doors or frames that are warped, bowed, or otherwise unacceptable.",
  "Remove grout and other bonding material from hollow metal work immediately after installation.",
  "Prime-Coat Touchup: Immediately after erection, sand smooth rusted or damaged areas of prime coat and apply touchup of compatible air-drying, rust-inhibitive primer.",
  "Metallic-Coated Surfaces: Clean abraded areas and repair with galvanizing repair paint according to manufacturer's written instructions.",
]

