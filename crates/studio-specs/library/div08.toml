[[section]]
number = "08 80 00"
title = "GLAZING"
when = ["windows"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes: Glass and glazing for the following products and applications, including those specified in other Sections where glazing requirements are specified by reference to this Section:",
  ">Windows.",
  ">Doors, including vision lites and sidelites.",
  ">Storefront framing and entrances.",
  ">Interior borrowed lites and glazed partitions.",
  ">Skylights, where not factory glazed.",
  "Window types: {window_types}, as indicated on Drawings.",
  "Related Requirements:",
  ">Section 07 92 00 \"Joint Sealants\" for sealants not used in glazing.",
  ">Section 08 41 13 \"Aluminum-Framed Entrances and Storefronts\" for storefront framing.",
  ">Division 08 window Sections for factory-glazed window units.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Glass Manufacturers: Firms that produce primary glass, fabricated glass, or both, as defined in referenced glazing publications.",
  "Glass Thicknesses: Indicated by thickness designations in millimeters according to ASTM C1036.",
  "Interspace: Space between lites of an insulating glass unit.",
  "Surfaces: Numbered from exterior to interior; surface 1 is the exterior face of the outboard lite.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including performance data (U-factor, SHGC, VT, and reflectance) for each glass type.",
  "Glass Samples: For each type of tinted, coated, and patterned glass, 12 inches square.",
  "Glazing Accessory Samples: For gaskets, sealants, and colored spacers, in 12-inch lengths.",
  "Glazing Schedule: List glass types and thicknesses for each size opening and location. Use same designations indicated on Drawings.",
  "Delegated-Design Submittal: For glass indicated to comply with performance requirements, including analysis data signed and sealed by the qualified professional engineer responsible for their preparation.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Product Certificates: For glass.",
  "Product Test Reports: For coated glass and insulating glass, by a qualified testing agency.",
  "Preconstruction Adhesion and Compatibility Test Report: For glazing sealants, from sealant manufacturer.",
  "Sample Warranties: For special warranties.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Manufacturer Qualifications for Insulating Glass Units with Sputter-Coated, Low-E Coatings: A qualified insulating glass manufacturer who is approved and certified by coated-glass manufacturer.",
  "Installer Qualifications: A qualified installer who employs glass installers for this Project who are certified under the North American Contractor Certification Program (NACC) for Architectural Glass and Metal (AGMT) Technicians, or who have equivalent experience.",
  "Insulating Glass Certification: Certified by IGCC or IGMA as complying with ASTM E2190.",
  "Safety Glazing Labeling: Where safety glazing is indicated, permanently mark glazing with certification label of the Safety Glazing Certification Council (SGCC) or another certification agency acceptable to authorities having jurisdiction.",
  "Glazing Publications: Comply with published recommendations of glass product manufacturers and organizations below unless more stringent requirements are indicated:",
  ">GANA Publications: \"Glazing Manual\" and \"Laminated Glazing Reference Manual\".",
  ">IGMA Publication for Insulating Glass: IGMA TM-3000, \"North American Glazing Guidelines for Sealed Insulating Glass Units for Commercial and Residential Use\".",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Protect glazing materials according to manufacturer's written instructions. Prevent damage to glass and glazing materials from condensation, temperature changes, direct exposure to sun, and other causes.",
  "Comply with insulating glass manufacturer's written instructions for venting and sealing units to avoid hermetic seal ruptures due to altitude change.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Environmental Limitations: Do not proceed with glazing when ambient and substrate temperature conditions are outside limits permitted by glazing material manufacturers and when glazing channel substrates are wet from rain, frost, condensation, or other causes.",
  ">Do not install liquid glazing sealants when ambient and substrate temperatures are outside limits permitted by sealant manufacturer or are below 40 deg F.",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Manufacturer's Special Warranty for Coated-Glass Products: Manufacturer agrees to replace coated-glass units that deteriorate within 10 years from date of Substantial Completion.",
  "Manufacturer's Special Warranty on Laminated Glass: Manufacturer agrees to replace laminated-glass units that deteriorate, including edge separation and delamination materially obstructing vision, within five years from date of Substantial Completion.",
  "Manufacturer's Special Warranty on Insulating Glass: Manufacturer agrees to replace insulating glass units that deteriorate, including failure of hermetic seal and resulting intrusion of dirt or moisture on interior surfaces, within 10 years from date of Substantial Completion.",
]

[[section.part2]]
title = "MANUFACTURERS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Guardian Glass.",
  ">Vitro Architectural Glass.",
  ">AGC Glass North America.",
  ">Pilkington North America; NSG Group.",
  "Source Limitations for Glass: Obtain each type of coated, tinted, and laminated glass from single source from single manufacturer for each product and installation method.",
]

[[section.part2]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "General: Installed glazing systems shall withstand normal thermal movement and wind and impact loads, where applicable, without failure, including loss or glass breakage attributable to defective manufacture, fabrication, or installation; failure of sealants or gaskets to remain watertight and airtight; deterioration of glazing materials; or other defects in construction.",
  "Delegated Design: Engage a qualified professional engineer to design glazing.",
  "Structural Performance: Glazing shall withstand the design wind pressures indicated, based on ASTM E1300, with a probability of breakage not greater than 8 lites per 1000 for vertical glazing and 1 lite per 1000 for sloped glazing.",
  ">Maximum Lateral Deflection: For glass supported on four sides, limit center deflection at design wind pressure to not more than 1/50 times the short-side length or 1 inch, whichever is less.",
  "Safety Glazing: Where safety glazing is indicated or required by the building code, including in hazardous locations, provide glazing that complies with CPSC 16 CFR 1201, Category II, or ANSI Z97.1 as permitted by the building code.",
  "Thermal and Optical Performance Properties: Provide glass with performance properties specified, as indicated in manufacturer's published test data, based on procedures indicated below:",
  ">U-Factors: Center-of-glazing values, according to NFRC 100 and based on LBL's WINDOW computer program, expressed as Btu/sq. ft. x h x deg F.",
  ">Solar Heat-Gain Coefficient and Visible Transmittance: Center-of-glazing values, according to NFRC 200 and based on LBL's WINDOW computer program.",
  "Windborne-Debris Impact Resistance: Where required by the building code, provide laminated glazing tested to comply with ASTM E1886 and ASTM E1996.",
]

[[section.part2]]
title = "GLASS PRODUCTS"
items = [
  "Annealed Float Glass: ASTM C1036, Type I (transparent flat glass), Quality-Q3; of class indicated.",
  "Fully Tempered Float Glass: ASTM C1048, Kind FT (fully tempered), Condition A (uncoated) unless otherwise indicated, Type I, Class 1 (clear) or Class 2 (tinted) as indicated, Quality-Q3.",
  ">Fabrication Process: By horizontal (roller-hearth) process with roll-wave distortion parallel to bottom edge of glass as installed unless otherwise indicated.",
  "Heat-Strengthened Float Glass: ASTM C1048, Kind HS (heat strengthened), Type I, Quality-Q3; at locations where required for thermal stress.",
  "Laminated Glass: ASTM C1172, with two plies of float glass and polyvinyl butyral interlayer, minimum 0.030 inch thick; complying with testing requirements in CPSC 16 CFR 1201 for Category II materials.",
  "Low-Emissivity Coated Glass: Float glass with pyrolytic or sputtered metallic-oxide coating complying with ASTM C1376, coating on surface indicated.",
  "Fire-Protection-Rated Glazing: Where required at fire-rated doors and sidelites, provide ceramic or specialty glazing listed for the fire-protection rating indicated, tested according to NFPA 257 or UL 9, and marked according to the building code; meeting impact-safety requirements of CPSC 16 CFR 1201.",
]

[[section.part2]]
title = "INSULATING GLASS UNITS"
items = [
  "Insulating Glass Units: Factory-assembled units consisting of sealed lites of glass separated by a dehydrated interspace, qualified according to ASTM E2190.",
  ">Sealing System: Dual seal, with primary seal of polyisobutylene and secondary seal of silicone or polysulfide.",
  ">Spacer: Warm-edge spacer of stainless steel or thermoplastic, black finish.",
  ">Desiccant: Molecular sieve or silica gel, or a blend of both.",
  ">Interspace Content: Argon, minimum 90 percent fill.",
  ">Overall Unit Thickness: 1 inch for commercial units, 3/4 inch or manufacturer's standard for residential units.",
  ">Heat-Strengthen or Temper: As required by structural analysis, thermal stress analysis, and safety glazing requirements.",
]

[[section.part2]]
title = "GLAZING SEALANTS, TAPES, AND ACCESSORIES"
items = [
  "Glazing Sealants: Compatible with one another and with other materials they contact, including glass products, seals of insulating glass units, and glazing channel substrates, under conditions of service and application, as demonstrated by sealant manufacturer based on testing and field experience.",
  ">Neutral-Curing Silicone Glazing Sealant: ASTM C920, Type S, Grade NS, Class 50, Use NT.",
  "Glazing Tapes: Back-bedding mastic glazing tape, preformed, butyl-based, 100 percent solids elastomeric tape, complying with ASTM C1281 and AAMA 800.",
  "Glazing Gaskets: Dense compression gaskets of EPDM or silicone complying with ASTM C864 or ASTM C1115.",
  "Setting Blocks: Elastomeric material with a Shore, Type A durometer hardness of 85, plus or minus 5, sized according to GANA recommendations.",
  "Spacers: Elastomeric blocks or continuous extrusions of hardness required by glass manufacturer to maintain glass lites in place for installation indicated.",
  "Edge Blocks: Elastomeric material of hardness needed to limit glass lateral movement (side walking).",
]

[[section.part2]]
title = "FABRICATION OF GLAZING UNITS"
items = [
  "Fabricate glazing units in sizes required to fit openings indicated for Project, with edge and face clearances, edge and surface conditions, and bite complying with written instructions of product manufacturer and referenced glazing publications, to comply with system performance requirements.",
  "Clean-cut or flat-grind vertical edges of butt-glazed monolithic lites to produce square edges with slight chamfers at junctions of edges and faces.",
  "Grind smooth and polish exposed glass edges and corners.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine framing, glazing channels, and stops, with Installer present, for compliance with the following:",
  ">Manufacturing and installation tolerances, including those for size, squareness, and offsets at corners.",
  ">Presence and functioning of weep systems.",
  ">Minimum required face and edge clearances.",
  ">Effective sealing between joints of glass-framing members.",
  "Proceed with installation only after unsatisfactory conditions have been corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Clean glazing channels and other framing members receiving glass immediately before glazing. Remove coatings not firmly bonded to substrates.",
  "Examine glazing units to locate exterior and interior surfaces. Label or mark units as needed so that exterior and interior surfaces are readily identifiable. Do not use materials that leave visible marks in the completed Work.",
]

[[section.part3]]
title = "GLAZING, GENERAL"
items = [
  "Comply with combined written instructions of manufacturers of glass, sealants, gaskets, and other glazing materials, unless more stringent requirements are indicated, including those in referenced glazing publications.",
  "Protect glass edges from damage during handling and installation. Remove damaged glass from Project site and legally dispose of off Project site. Damaged glass includes glass with edge damage or other imperfections that, when installed, could weaken glass, impair performance, or impair appearance.",
  "Apply primers to joint surfaces where recommended by sealant manufacturer.",
  "Install setting blocks in sill rabbets, sized and located to comply with referenced glazing publications. Set blocks in thin course of compatible sealant suitable for heel bead.",
  "Do not exceed edge pressures stipulated by glass manufacturers for installing glass lites.",
  "Provide spacers for glass lites where length plus width is larger than 50 inches.",
  "Provide edge blocking where indicated or needed to prevent glass lites from moving sideways in glazing channel.",
  "Set glass lites with proper orientation so that coatings face exterior or interior as specified.",
  "Place safety glazing labels so they remain visible after installation, or etch permanently where labels would be removed.",
]

[[section.part3]]
title = "TAPE AND GASKET GLAZING"
items = [
  "Tape Glazing: Position tapes on fixed stops so that, when compressed by glass, their exposed edges are flush with or protrude slightly above sightline of stops. Do not remove release paper from tape until right before each glazing unit is installed.",
  "Gasket Glazing (Dry): Cut compression gaskets to lengths recommended by gasket manufacturer to fit openings exactly, with allowance for stretch during installation.",
  ">Install gaskets so they protrude past face of glazing stops.",
  ">Seal gasket joints with sealant recommended by gasket manufacturer.",
]

[[section.part3]]
title = "SEALANT GLAZING (WET)"
items = [
  "Install continuous spacers, or spacers combined with cylindrical sealant backing, between glass lites and glazing stops to maintain glass face clearances and to prevent sealant from extruding into glass channel.",
  "Install sealant to provide complete bond of sealant to glass and channel surfaces, with full contact, and tool exposed surfaces with slight bevel to shed water.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Immediately after installation, remove nonpermanent labels and clean surfaces.",
  "Protect glass from contact with contaminating substances resulting from construction operations. If, despite such protection, contaminating substances do come into contact with glass, remove substances immediately as recommended in writing by glass manufacturer.",
  "Remove and replace glass that is damaged during construction period.",
  "Wash glass on both exposed surfaces not more than four days before date scheduled for inspections that establish date of Substantial Completion. Wash glass as recommended in writing by glass manufacturer.",
]

