[[section.part3]]
title = "INSTALLATION"
items = [
  "Hardware: For installation, see Section 08 71 00 \"Door Hardware\".",
  "Installation Instructions: Install doors to comply with manufacturer's written instructions and referenced quality standard, and as indicated.",
  ">Install fire-rated doors according to NFPA 80.",
  ">Install smoke- and draft-control doors according to NFPA 105.",
  "Job-Fitted Doors: Align and fit doors in frames with uniform clearances and bevels as indicated below; do not trim stiles and rails in excess of limits set by manufacturer or permitted for fire-rated doors. Machine doors for hardware. Seal edges of doors, edges of cutouts, and mortises after fitting and machining.",
  ">Clearances: Provide 1/8 inch at heads, jambs, and between pairs of doors. Provide 1/8 inch from bottom of door to top of decorative floor finish or covering unless otherwise indicated. Where threshold is shown or scheduled, provide 1/4 inch from bottom of door to top of threshold.",
  ">Bevel non-fire-rated doors 1/8 inch in 2 inches at lock and hinge edges.",
  ">Bevel fire-rated doors 1/8 inch in 2 inches on lock edge; trim stiles and rails only to extent permitted by labeling agency.",
  "Factory-Fitted Doors: Align in frames for uniform clearance at each edge.",
  "Factory-Finished Doors: Restore finish before installation if fitting or machining is required at Project site.",
]

[[section.part3]]
title = "ADJUSTING AND PROTECTION"
items = [
  "Operation: Rehang or replace doors that do not swing or operate freely.",
  "Finished Doors: Replace doors that are damaged or that do not comply with requirements. Doors may be repaired or refinished if work complies with requirements and shows no evidence of repair or refinishing.",
  "Protect doors from damage and soiling during remainder of construction period.",
]

