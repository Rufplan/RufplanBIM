# Division 00 - Procurement and Contracting Requirements
# Division 01 - General Requirements

[[section]]
number = "00 11 16"
title = "INVITATION TO BID"
when = ["bidding"]
kind = "document"

[[section.articles]]
title = "PROJECT INFORMATION"
items = [
  "Notice to Bidders: Qualified bidders are invited to submit bids for the Project described in this Invitation.",
  "Project Identification:",
  ">Project: {project_name}.",
  ">Project Number: {project_number}.",
  ">Project Location: {project_address}.",
  "Owner: {owner}.",
  "Architect: {architect}.",
  "Project Description: The Project consists of the construction of the building and associated site work indicated on the Drawings and specified in the Project Manual.",
  "Construction Contract: Bids will be received for a single prime contract on a stipulated-sum basis.",
]

[[section.articles]]
title = "BID SUBMITTAL AND OPENING"
items = [
  "Owner will receive sealed bids until the bid time and date stated below, at the location indicated. Bids received after the stated time will be returned unopened.",
  ">Bid Date: [date].",
  ">Bid Time: [time], local time.",
  ">Location: [address], or by electronic submittal as described in the Instructions to Bidders.",
  "Bids will be opened privately and are not subject to public reading. Owner will notify all bidders of the outcome.",
]

[[section.articles]]
title = "BID SECURITY"
items = [
  "Bid security in the amount of 5 percent of the Bid amount is [required] [not required]. When required, provide a bid bond on AIA Document A310 or a certified check made payable to Owner.",
]

[[section.articles]]
title = "PREBID MEETING"
items = [
  "A prebid meeting for all bidders will be held at the Project site at [time] on [date]. Attendance is [strongly recommended] [mandatory].",
]

[[section.articles]]
title = "DOCUMENTS"
items = [
  "Procurement and Contracting Documents: Obtain after [date] from Architect by electronic download. Printed sets are available at the bidder's cost.",
  "Examination: Procurement and Contracting Documents may be examined at the office of Architect and through the Owner's online project listing.",
]

[[section.articles]]
title = "TIME OF COMPLETION"
items = [
  "Successful bidder shall begin the Work on receipt of the Notice to Proceed and shall achieve Substantial Completion within the number of calendar days stated in the Bid Form.",
]

[[section.articles]]
title = "BIDDER'S QUALIFICATIONS"
items = [
  "Bidders shall be licensed as general contractors in {jurisdiction} and shall submit AIA Document A305 Contractor's Qualification Statement with their bids when requested.",
  "Owner reserves the right to reject any or all bids and to waive informalities and irregularities.",
]

[[section]]
number = "00 21 13"
title = "INSTRUCTIONS TO BIDDERS"
when = ["bidding"]
kind = "document"

[[section.articles]]
title = "INSTRUCTIONS TO BIDDERS"
items = [
  "AIA Document A701, Instructions to Bidders, is hereby incorporated by reference into the Procurement and Contracting Requirements for {project_name}. A copy is available for review at the office of Architect.",
  "The following supplements modify AIA Document A701. Where a portion of A701 is modified or deleted by these supplements, the unaltered portions remain in effect.",
]

[[section.articles]]
title = "BIDDER'S REPRESENTATIONS"
items = [
  "Add the following to Section 2.1 of A701:",
  ">The Bidder has visited the site, become familiar with local conditions under which the Work is to be performed, and correlated personal observations with requirements of the proposed Contract Documents.",
  ">The Bidder has reviewed the geotechnical data made available and understands that such data is for information only and is not a Contract Document.",
]

[[section.articles]]
title = "BIDDING DOCUMENTS"
items = [
  "Interpretation or Correction: Submit requests for clarification in writing to Architect no fewer than seven days before the bid date. Architect will issue responses as Addenda only.",
  "Substitutions: Requests for substitution before bid shall be submitted on the form in Document 00 43 25 \"Substitution Request Form\" no fewer than ten days before the bid date. Approved substitutions will be listed in an Addendum.",
  "Addenda: Addenda will be issued to all registered holders of Bidding Documents no later than four days before the bid date, except an Addendum withdrawing the request for bids or postponing the bid date.",
]

[[section.articles]]
title = "BIDDING PROCEDURES"
items = [
  "Form of Bid: Submit bids on Document 00 41 13 \"Bid Form - Stipulated Sum (Single-Prime Contract)\" with all blanks filled in and all Addenda acknowledged.",
  "Bid Security: Where required by the Invitation to Bid, bid security shall accompany the bid.",
  "Submission: Submit bids in a sealed opaque envelope marked with the Project name and the Bidder's name, or by the electronic method identified in the Invitation to Bid.",
  "Modification or Withdrawal: A bid may be modified or withdrawn in writing before the bid time. No bid may be withdrawn for 60 days after the bid date.",
]

[[section.articles]]
title = "CONSIDERATION OF BIDS"
items = [
  "Owner may accept or reject any bid, accept alternates in any order or combination, and negotiate with the lowest responsible bidder whose bid is within the Owner's budget.",
  "Owner's selection will be based on price, qualifications, schedule and any other factors Owner considers to be in its interest.",
]

[[section.articles]]
title = "POST-BID INFORMATION"
items = [
  "Within seven days of notification of selection, the apparent successful bidder shall submit the following:",
  ">A list of proposed subcontractors and principal suppliers for each major portion of the Work.",
  ">A preliminary construction schedule.",
  ">A schedule of values.",
  ">Certificates of insurance as required by Document 00 73 00 \"Supplementary Conditions.\"",
]

[[section.articles]]
title = "PERFORMANCE AND PAYMENT BONDS"
items = [
  "Performance and payment bonds, each in the amount of 100 percent of the Contract Sum, are [required] [not required]. When required, provide bonds on AIA Document A312 from a surety licensed in {jurisdiction}. The cost of bonds shall be [included in the Bid] [listed separately on the Bid Form].",
]

[[section]]
number = "00 31 32"
title = "GEOTECHNICAL DATA"
when = ["optional"]
kind = "document"

[[section.articles]]
title = "GEOTECHNICAL DATA"
items = [
  "This Document identifies and describes geotechnical data made available to bidders for {project_name} at {project_address}.",
  "A geotechnical report for the Project, prepared by [geotechnical engineer] and dated [date], is available for viewing at the office of Architect and is included as an attachment to this Document.",
  "The report was obtained for Owner's use in the design of the Project and is not part of the Contract Documents.",
  "The report is made available for information only. Owner and Architect do not warrant the accuracy of subsurface information, soil interpretation, or conclusions contained in the report.",
  "Bidders may conduct their own subsurface investigations at no cost to Owner, subject to Owner's approval of the time and method of access to the site. Restore the site to its original condition after investigation.",
  "Recommendations in the report are incorporated into the Contract Documents only to the extent they are specifically included in the Drawings and Specifications.",
  "Related Requirements:",
  ">Document 00 21 13 \"Instructions to Bidders\" for the Bidder's representations regarding site and subsurface conditions.",
]

[[section]]
number = "00 41 13"
title = "BID FORM - STIPULATED SUM (SINGLE-PRIME CONTRACT)"
when = ["bidding"]
kind = "document"

[[section.articles]]
title = "BID INFORMATION"
items = [
  "Bidder: [company name].",
  "Project: {project_name}, {project_address}.",
  "Project Number: {project_number}.",
  "Owner: {owner}.",
  "Architect: {architect}.",
]

[[section.articles]]
title = "CERTIFICATIONS AND BASE BID"
items = [
  "The undersigned Bidder, having carefully examined the Procurement and Contracting Requirements, Conditions of the Contract, Drawings, Specifications and all subsequent Addenda, and having visited the site, hereby proposes to furnish all labor, materials, equipment and services required to complete the Work for the stipulated sum of:",
  ">[amount in words] Dollars ($[amount in figures]).",
  "The stipulated sum includes all allowances described in Section 01 21 00 \"Allowances\" and all applicable taxes.",
]

[[section.articles]]
title = "ALTERNATES"
items = [
  "The Bidder proposes the following adjustments to the Base Bid for each alternate described in Section 01 23 00 \"Alternates\":",
  ">Alternate No. 1: [Add] [Deduct] $[amount].",
  ">Alternate No. 2: [Add] [Deduct] $[amount].",
]

[[section.articles]]
title = "BID GUARANTEE"
items = [
  "The Bidder agrees to hold this bid open for 60 days after the bid date and to accept the Owner's selection of alternates in any combination.",
  "Where bid security is required, it is attached in the amount of 5 percent of the Base Bid.",
]

[[section.articles]]
title = "TIME OF COMPLETION"
items = [
  "The Bidder agrees to begin the Work on receipt of the Notice to Proceed and to achieve Substantial Completion within [number] calendar days.",
]

[[section.articles]]
title = "ACKNOWLEDGEMENT OF ADDENDA"
items = [
  "The Bidder acknowledges receipt of the following Addenda:",
  ">Addendum No. [__], dated [date].",
  ">Addendum No. [__], dated [date].",
]

[[section.articles]]
title = "BIDDER'S LICENSE AND SUBMISSION"
items = [
  "Contractor's license number in {jurisdiction}: [number].",
  "Submitted on [date] by [authorized signatory, name and title], who certifies authority to bind the Bidder.",
  "Signature: ____________________.",
]

[[section]]
number = "00 43 25"
title = "SUBSTITUTION REQUEST FORM"
when = ["bidding"]
kind = "document"

[[section.articles]]
title = "REQUEST INFORMATION"
items = [
  "Project: {project_name}, Project Number {project_number}.",
  "To: {architect}.",
  "From: [bidder or Contractor].",
  "Specification Section, Article and Paragraph: [reference].",
  "Specified Product: [manufacturer, product name, model number].",
  "Proposed Substitution: [manufacturer, product name, model number].",
]

[[section.articles]]
title = "SUPPORTING DATA"
items = [
  "Attach the following:",
  ">Product data, drawings and samples as applicable.",
  ">A point-by-point comparison of the proposed substitution with the specified product, listing all differences.",
  ">Changes required in other work to accommodate the substitution.",
  ">Effect on the construction schedule and the Contract Sum.",
  ">Reference projects where the product has been used, with contact information.",
  ">Warranty and availability of maintenance service and replacement parts.",
]

[[section.articles]]
title = "CERTIFICATION"
items = [
  "The undersigned certifies that the proposed substitution has been fully investigated and is equal or superior in all respects to the specified product, will perform the same function, will not affect dimensions or functional clearances, and that the undersigned will pay for changes to the design and to other work that result from its acceptance.",
  "Submitted by: [name, firm, signature, date].",
]

[[section.articles]]
title = "ARCHITECT'S REVIEW"
items = [
  "Action:",
  ">Substitution accepted.",
  ">Substitution accepted as noted.",
  ">Substitution not accepted.",
  ">Received too late; use specified product.",
  "Reviewed by: [name, date].",
]

[[section]]
number = "00 52 13"
title = "AGREEMENT FORM - STIPULATED SUM"
when = ["always"]
kind = "document"

[[section.articles]]
title = "AGREEMENT"
items = [
  "The Agreement for {project_name} shall be AIA Document A101, Standard Form of Agreement Between Owner and Contractor where the basis of payment is a Stipulated Sum, as modified for this Project.",
  "A copy of the proposed Agreement is available for review at the office of Architect. The executed Agreement will be incorporated into the Contract Documents.",
]

[[section.articles]]
title = "PROJECT-SPECIFIC INFORMATION"
items = [
  "Owner: {owner}.",
  "Contractor: [to be determined by bidding].",
  "Project: {project_name}, {project_address}.",
  "Architect: {architect}.",
  "Contract Sum: The Base Bid plus accepted alternates, as stated in the successful bidder's Bid Form.",
  "Contract Time: As stated in the successful bidder's Bid Form, measured from the date of commencement stated in the Notice to Proceed.",
  "Liquidated Damages: [$__ per calendar day] [Not applicable] for each day Substantial Completion is delayed beyond the Contract Time.",
  "Retainage: As stated in Document 00 73 00 \"Supplementary Conditions.\"",
]

[[section.articles]]
title = "GENERAL CONDITIONS"
items = [
  "The General Conditions of the Contract are AIA Document A201, General Conditions of the Contract for Construction, as referenced in Document 00 72 13 \"General Conditions\" and modified by Document 00 73 00 \"Supplementary Conditions.\"",
]

[[section]]
number = "00 72 13"
title = "GENERAL CONDITIONS"
when = ["always"]
kind = "document"

[[section.articles]]
title = "GENERAL CONDITIONS"
items = [
  "AIA Document A201, General Conditions of the Contract for Construction, is hereby incorporated by reference into the Contract Documents for {project_name}.",
  "A copy of AIA Document A201 is available for review at the office of Architect and will be bound with the executed Agreement.",
  "The General Conditions are modified by Document 00 73 00 \"Supplementary Conditions.\" Where a provision of A201 is modified or deleted, the unaltered portions remain in effect.",
  "The General Conditions apply to all Sections of the Specifications and to all work performed under the Contract, including work by subcontractors of every tier.",
]

[[section.articles]]
title = "RELATED DOCUMENTS"
items = [
  "The General Conditions are to be read together with the following:",
  ">Document 00 52 13 \"Agreement Form - Stipulated Sum\" (AIA Document A101).",
  ">Document 00 73 00 \"Supplementary Conditions.\"",
  ">Division 01 General Requirements, which expand on the administrative and procedural provisions of A201.",
  "Where Division 01 and A201 address the same subject, the Division 01 requirement governs to the extent it is more specific, provided it does not conflict with the Supplementary Conditions.",
]

[[section.articles]]
title = "DEFINITIONS"
items = [
  "Terms defined in A201, including Contract Documents, Work, Project, Substantial Completion, Change Order and Construction Change Directive, have the meanings given in A201 wherever used in the Project Manual.",
  "Owner, Contractor and Architect are as identified in the Agreement: Owner is {owner}; Architect is {architect}.",
]

[[section]]
number = "00 73 00"
title = "SUPPLEMENTARY CONDITIONS"
when = ["always"]
kind = "document"

[[section.articles]]
title = "GENERAL"
items = [
  "The following supplements modify AIA Document A201, General Conditions of the Contract for Construction, for {project_name}. Article and paragraph numbers refer to A201. Where a portion of A201 is modified or deleted, the unaltered portions remain in effect.",
]

[[section.articles]]
title = "ARTICLE 1 - GENERAL PROVISIONS"
items = [
  "Add to Section 1.2.1: In case of conflict within the Contract Documents, the more stringent requirement or the greater quantity shall govern, unless Architect directs otherwise in writing.",
  "Add to Section 1.5: Electronic model files furnished by Architect are for the Contractor's convenience only and are not Contract Documents unless expressly stated.",
]

[[section.articles]]
title = "ARTICLE 3 - CONTRACTOR"
items = [
  "Add to Section 3.4: Contractor shall obtain and pay for all permits and fees required for the Work other than the building permit, which is [obtained by Owner] [obtained by Contractor], and shall comply with the requirements of {jurisdiction}.",
  "Add to Section 3.5: The warranty period for the Work shall be one year from the date of Substantial Completion, unless a longer period is specified in the Specifications.",
  "Add to Section 3.10: Submit the construction schedule within 14 days after the date of the Agreement, in the format specified in Section 01 32 00 \"Construction Progress Documentation.\"",
]

[[section.articles]]
title = "ARTICLE 7 - CHANGES IN THE WORK"
items = [
  "Add to Section 7.3.4: Overhead and profit on changes shall not exceed the following:",
  ">For work performed by the Contractor's own forces: 10 percent of cost.",
  ">For work performed by a subcontractor: 5 percent of the subcontractor's cost to the Contractor.",
  ">For work performed by a subcontractor's own forces: 10 percent of cost.",
]

[[section.articles]]
title = "ARTICLE 8 - TIME"
items = [
  "Add to Section 8.3.1: Extensions of time for weather shall be granted only for days of adverse weather in excess of the average for the month, as recorded by the nearest National Weather Service station, that prevent work on the critical path.",
]

[[section.articles]]
title = "ARTICLE 9 - PAYMENTS AND COMPLETION"
items = [
  "Add to Section 9.3.1: Submit Applications for Payment on AIA Documents G702 and G703 on or about the 25th day of each month.",
  "Retainage: Owner will retain 10 percent of each progress payment until the Work is 50 percent complete, after which no further retainage will be withheld on the remaining work, provided progress is satisfactory. Retainage shall be released with final payment.",
  "Add to Section 9.8: Request for inspection for Substantial Completion shall be accompanied by the Contractor's list of incomplete items.",
]

[[section.articles]]
title = "ARTICLE 11 - INSURANCE AND BONDS"
items = [
  "Add to Section 11.1: Contractor shall purchase and maintain the following insurance, with insurers licensed in {jurisdiction} and rated A- VII or better by A.M. Best:",
  ">Commercial General Liability: $1,000,000 each occurrence; $2,000,000 general aggregate; $2,000,000 products-completed operations aggregate.",
  ">Automobile Liability: $1,000,000 combined single limit.",
  ">Umbrella Excess Liability: $2,000,000 each occurrence and aggregate.",
  ">Workers' Compensation: Statutory limits.",
  ">Employer's Liability: $500,000 each accident; $500,000 disease each employee; $500,000 disease policy limit.",
  "Name Owner and Architect as additional insureds on the Commercial General Liability, Automobile and Umbrella policies, on a primary and noncontributory basis.",
  "Property Insurance: [Owner] [Contractor] shall purchase builder's risk insurance on an all-risk basis for the full replacement value of the Work.",
  "Deliver certificates of insurance before commencing the Work.",
]

[[section.articles]]
title = "ARTICLE 15 - CLAIMS AND DISPUTES"
items = [
  "Add to Section 15.4: Arbitration, if selected in the Agreement, shall take place in {jurisdiction}.",
]

[[section]]
number = "01 10 00"
title = "SUMMARY"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "PROJECT INFORMATION"
items = [
  "Project Identification: {project_name}.",
  ">Project Number: {project_number}.",
  ">Project Location: {project_address}.",
  "Owner: {owner}.",
  ">Owner's Representative: [name], who is authorized to act on Owner's behalf for the Project.",
  "Architect: {architect}.",
  "Authority Having Jurisdiction: {jurisdiction}. Applicable building code: {building_code}.",
]

[[section.part1]]
title = "WORK COVERED BY CONTRACT DOCUMENTS"
items = [
  "The Work of the Project is defined by the Contract Documents and consists of the following:",
  ">Construction of the building indicated on the Drawings, including foundations, structure, enclosure, interior construction, and mechanical, plumbing and electrical systems.",
  ">Site work within the limits of construction indicated, including grading, utilities, paving and landscaping.",
  "Type of Contract: The Project will be constructed under a single prime contract on a stipulated-sum basis.",
]

[[section.part1]]
title = "WORK UNDER SEPARATE CONTRACTS"
items = [
  "Owner may award separate contracts for the following, which will be performed concurrently with the Work:",
  ">Telecommunications and security systems beyond the rough-in indicated.",
  ">Furniture, furnishings and movable equipment.",
  "Cooperate with separate contractors so that work under those contracts can be carried out without interference or delay.",
]

[[section.part1]]
title = "OWNER-FURNISHED PRODUCTS"
items = [
  "Owner will furnish products indicated as Owner-furnished, Contractor-installed (OFCI). Contractor shall:",
  ">Designate delivery dates in the construction schedule.",
  ">Receive, unload, inspect and store Owner-furnished products, and report damaged or defective items.",
  ">Install, connect and protect Owner-furnished products as if furnished by the Contractor.",
]

[[section.part1]]
title = "PHASED CONSTRUCTION"
items = [
  "Conduct the Work in phases where indicated on the Drawings. Obtain Architect's acceptance of each phase before starting the next.",
  "Coordinate the schedule of each phase with Owner's requirements for access and occupancy.",
]

[[section.part1]]
title = "OWNER OCCUPANCY"
items = [
  "Owner reserves the right to occupy and use completed portions of the Work before Substantial Completion of the entire Work, provided such occupancy does not interfere with completion of the Work.",
  "Before partial occupancy, obtain a temporary certificate of occupancy from {jurisdiction} for the area to be occupied, and complete life-safety systems serving that area.",
  "Owner will assume responsibility for utilities, maintenance and insurance of occupied areas from the date of partial occupancy.",
]

[[section.part1]]
title = "WORK RESTRICTIONS"
items = [
  "Use of Site: Limit use of the premises to the areas within the limits of construction indicated. Do not disturb portions of the site beyond those areas.",
  ">Keep driveways and entrances serving adjacent properties clear and available at all times.",
  ">Schedule deliveries to minimize space and time requirements for storage on site.",
  "Hours of Work: Limit work to between 7:00 a.m. and 6:00 p.m., Monday through Friday, except as otherwise permitted by {jurisdiction} and approved by Owner.",
  "Noise, Vibration and Odors: Coordinate operations that may cause noise, vibration or odors with Owner not less than two days in advance.",
  "Utility Interruptions: Do not interrupt utilities serving occupied facilities except with Owner's written permission and after arranging temporary service.",
  "Smoking and Controlled Substances: Smoking, vaping and use of controlled substances are not permitted on the site.",
]

[[section.part1]]
title = "SPECIFICATION AND DRAWING CONVENTIONS"
items = [
  "Specifications are written in imperative mood and abbreviated form. Words such as shall, shall be and the Contractor shall are implied.",
  "Division 01 General Requirements apply to all Sections of the Specifications.",
  "Requirements for materials and products shown on Drawings are specified in the Sections that cover those products.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "EXECUTION"
items = ["Not Used."]

[[section]]
number = "01 21 00"
title = "ALLOWANCES"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for handling and processing allowances.",
  "Types of allowances include the following:",
  ">Lump-sum allowances.",
  ">Unit-cost allowances.",
  ">Contingency allowance.",
  "Related Requirements:",
  ">Section 01 23 00 \"Alternates\" for procedures for alternates.",
  ">Section 01 26 00 \"Contract Modification Procedures\" for procedures for submitting and handling Change Orders for allowances.",
]

[[section.part1]]
title = "SELECTION AND PURCHASE"
items = [
  "At the earliest practical date after award of the Contract, advise Architect of the date when final selection and purchase of each product or system described by an allowance must be completed to avoid delaying the Work.",
  "At Architect's request, obtain proposals for each allowance for use in making final selections. Include recommendations that are relevant to performing the Work.",
  "Purchase products and systems selected by Architect from the designated supplier.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Submit proposals for purchase of products or systems included in allowances, in the form specified for Change Orders.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Submit invoices or delivery slips to show actual quantities of materials delivered to the site for use in fulfillment of each allowance.",
  "Submit time sheets and other documentation to show labor time and cost for installation of allowance items that include installation as part of the allowance.",
  "Coordinate and process submittals for allowance items in the same manner as for other portions of the Work.",
]

[[section.part1]]
title = "COORDINATION"
items = [
  "Coordinate allowance items with other portions of the Work. Furnish templates as required to coordinate installation.",
]

[[section.part1]]
title = "LUMP-SUM AND UNIT-COST ALLOWANCES"
items = [
  "Allowance shall include cost to Contractor of specific products and materials ordered by Owner or selected by Architect under the allowance and shall include taxes, freight and delivery to the Project site.",
  "Unless otherwise indicated, Contractor's costs for receiving and handling at the Project site, labor, installation, overhead and profit, and similar costs related to products and materials selected under the allowance shall be included as part of the Contract Sum and not part of the allowance.",
  "Unused Materials: Return unused materials purchased under an allowance to the manufacturer or supplier for credit to Owner, after installation has been completed and accepted.",
]

[[section.part1]]
title = "CONTINGENCY ALLOWANCES"
items = [
  "Use the contingency allowance only as directed by Architect for Owner's purposes and only by Change Orders that indicate amounts to be charged to the allowance.",
  "Contractor's overhead, profit and related costs for products and equipment ordered by Owner under the contingency allowance are included in the allowance and are not part of the Contract Sum.",
  "At Project closeout, credit unused amounts remaining in the contingency allowance to Owner by Change Order.",
]

[[section.part1]]
title = "ADJUSTMENT OF COSTS"
items = [
  "Adjust the Contract Sum for each allowance by Change Order, as follows:",
  ">Lump-sum allowance: The difference between the actual cost of the selected items and the allowance amount.",
  ">Unit-cost allowance: The actual quantity installed multiplied by the unit cost, compared to the allowance amount.",
  "Submit claims for increased costs because of a change in the scope or nature of the allowance within 21 days of receipt of the Change Order authorizing work to proceed.",
  "No change to Contractor's indirect expense is permitted for selection of higher- or lower-priced materials within the allowance.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine products covered by an allowance promptly on delivery for damage or defects. Return damaged or defective products to the manufacturer for replacement.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Coordinate materials and their installation for each allowance with related materials and installations to ensure that each allowance item is completely integrated and interfaced with related work.",
]

[[section.part3]]
title = "SCHEDULE OF ALLOWANCES"
items = [
  "Allowance No. 1: Lump-Sum Allowance: Include the sum of $[amount] for [description], as selected by Architect.",
  "Allowance No. 2: Unit-Cost Allowance: Include the sum of $[amount] per [unit] for [description], based on a quantity of [quantity].",
  "Allowance No. 3: Contingency Allowance: Include a contingency allowance of $[amount] for use according to Owner's instructions.",
]

[[section]]
number = "01 23 00"
title = "ALTERNATES"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for alternates.",
  "Related Requirements:",
  ">Document 00 41 13 \"Bid Form - Stipulated Sum (Single-Prime Contract)\" for the form on which alternate prices are submitted.",
  ">Section 01 21 00 \"Allowances\" for allowances.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Alternate: An amount proposed by bidders and stated on the Bid Form for work defined in the Bidding Requirements that may be added to or deducted from the Base Bid if Owner decides to accept a corresponding change in the amount of construction to be completed or in the products, materials, equipment, systems or installation methods described in the Contract Documents.",
  "The cost or credit for each alternate is the net addition to or deduction from the Contract Sum to incorporate the alternate into the Work. No other adjustments are made to the Contract Sum.",
]

[[section.part1]]
title = "PROCEDURES"
items = [
  "Coordination: Revise or adjust affected adjacent work as necessary to completely integrate work of the alternate into the Project.",
  ">Include as part of each alternate the miscellaneous devices, accessories and similar items incidental to or required for a complete installation, whether or not indicated as part of the alternate.",
  "Notification: Immediately following award of the Contract, notify each party involved, in writing, of the status of each alternate. Indicate whether alternates have been accepted, rejected or deferred for later consideration.",
  "Owner may accept alternates in any order or combination within the period stated on the Bid Form.",
  "Execute accepted alternates under the same conditions as other work of the Contract.",
  "Schedule: A schedule of alternates is included at the end of this Section. Specification Sections referenced in the schedule contain requirements for materials necessary to achieve the work described under each alternate.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "SCHEDULE OF ALTERNATES"
items = [
  "Alternate No. 1: [Description of alternate].",
  ">Base Bid: [Description of work included in the Base Bid].",
  ">Alternate: [Description of work to be added, deducted or substituted].",
