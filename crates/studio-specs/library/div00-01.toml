title = "EXECUTION"
items = ["Not Used."]

[[section]]
number = "01 50 00"
title = "TEMPORARY FACILITIES AND CONTROLS"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes requirements for temporary utilities, support facilities, and security and protection facilities.",
  "Related Requirements:",
  ">Section 01 10 00 \"Summary\" for work restrictions and limitations on utility interruptions.",
  ">Section 01 74 19 \"Construction Waste Management and Disposal\" for handling of waste and recycling.",
]

[[section.part1]]
title = "USE CHARGES"
items = [
  "Installation, removal and use charges for temporary facilities shall be included in the Contract Sum unless otherwise indicated. Allow other entities to use temporary services and facilities without cost, including Owner, Architect, testing agencies and authorities having jurisdiction.",
  "Water and Sewer Service: Pay water and sewer service use charges for water used by all entities for construction operations.",
  "Electric Power Service: Pay electric power service use charges for electricity used by all entities for construction operations.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Site Plan: Show temporary facilities, utility hookups, staging areas and parking areas for construction personnel.",
  "Erosion- and Sedimentation-Control Plan: Show compliance with requirements of EPA Construction General Permit or authorities having jurisdiction, whichever is more stringent.",
  "Moisture-Protection Plan: Describe procedures and controls for protecting materials and construction from water absorption and damage, including delivery, storage and handling of materials, and indicate how wet materials will be dried or replaced.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Electric Service: Comply with NECA, NEMA and UL standards and regulations for temporary electric service. Install service to comply with NFPA 70.",
  "Tests and Inspections: Arrange for authorities having jurisdiction to test and inspect each temporary utility before use. Obtain required certifications and permits.",
  "Accessible Temporary Egress: Comply with applicable provisions in the ICC A117.1 and the ADA Standards for Accessible Design.",
]

[[section.part1]]
title = "PROJECT CONDITIONS"
items = [
  "Temporary Use of Permanent Facilities: Engage installer of each permanent service to assume responsibility for operation, maintenance and protection of each permanent service during its use as a construction facility before Owner's acceptance, regardless of previously assigned responsibilities.",
]

[[section.part2]]
title = "MATERIALS"
items = [
  "Chain-Link Fencing: Minimum 2-inch, 0.148-inch- thick, galvanized-steel, chain-link fabric fencing; minimum 6 feet high with galvanized-steel pipe posts; minimum 2-3/8-inch- OD line posts and 2-7/8-inch- OD corner and pull posts. Provide portable fence panels with concrete or steel bases where fence cannot be anchored in the ground.",
  "Wood Enclosure Fence: Plywood, 6 feet high, framed with four 2-by-4-inch rails, with preservative-treated wood posts spaced not more than 8 feet apart.",
  "Dust-Control Barriers: Fire-retardant polyethylene sheet, minimum 6 mils thick, complying with NFPA 701, supported by framing or a proprietary telescoping pole system.",
]

[[section.part2]]
title = "TEMPORARY FACILITIES"
items = [
  "Field Offices, General: Prefabricated or mobile units with serviceable finishes, temperature controls and foundations adequate for normal loading.",
  "Common-Use Field Office: Of sufficient size to accommodate needs of Owner, Architect and construction personnel office activities and to accommodate Project meetings specified in other Sections. Keep office clean and orderly. Furnish and equip offices as follows:",
  ">Furniture required for Project-site documents, including file cabinets, plan tables, plan racks and bookcases.",
  ">Conference room of sufficient size to accommodate meetings of ten individuals, with a large-format display for review of drawings and the model.",
  ">Drinking water and private toilet.",
  ">Heating and cooling equipment necessary to maintain a uniform indoor temperature of 68 to 72 deg F.",
  ">Internet service with a minimum download speed of 50 Mbps.",
  "Storage and Fabrication Sheds: Provide sheds sized, furnished and equipped to accommodate materials and equipment for construction operations.",
]

[[section.part2]]
title = "EQUIPMENT"
items = [
  "Fire Extinguishers: Portable, UL rated; with class and extinguishing agent as required by locations and classes of fire exposures, complying with NFPA 10.",
  "HVAC Equipment: Unless Owner authorizes use of permanent HVAC system, provide vented, self-contained, liquid-propane-gas or fuel-oil heaters with individual space thermostatic control. Do not use gasoline-burning space heaters, open-flame heaters or salamander-type heating units.",
  "Permanent HVAC System: If Owner authorizes use of permanent HVAC system for temporary use during construction, provide filter with MERV of 8 at each return-air grille in system and remove at end of construction. Clean HVAC system as required in Section 01 77 00 \"Closeout Procedures.\"",
]

[[section.part3]]
title = "TEMPORARY UTILITY INSTALLATION"
items = [
  "General: Install temporary service or connect to existing service. Arrange with utility company, Owner and existing users for time when service can be interrupted, if necessary, to make connections for temporary services.",
  "Sewers and Drainage: Provide temporary connections to remove effluent that can be discharged lawfully. Filter out excessive soil, construction debris, chemicals, oils and similar contaminants that might clog sewers or pollute waterways before discharge.",
  "Water Service: Install water service and distribution piping in sizes and pressures adequate for construction.",
  "Sanitary Facilities: Provide temporary toilets, wash facilities and drinking water for use of construction personnel. Comply with requirements of authorities having jurisdiction for type, number, location, operation and maintenance of fixtures and facilities.",
  "Heating and Cooling: Provide temporary heating and cooling required by construction activities for curing or drying of completed installations or for protecting installed construction from adverse effects of low temperatures or high humidity.",
  "Ventilation and Humidity Control: Provide temporary ventilation required by construction activities for curing or drying of completed installations or for protecting installed construction from adverse effects of high humidity. Select equipment that will not have a harmful effect on completed installations or elements being installed.",
  "Electric Power Service: Provide electric power service and distribution system of sufficient size, capacity and power characteristics required for construction operations. Provide ground-fault protection on all temporary circuits.",
  "Lighting: Provide temporary lighting with local switching that provides adequate illumination for construction operations, observations, inspections and traffic conditions.",
  "Telephone and Data Service: Provide temporary telephone and internet service in common-use facilities for use by all construction personnel.",
]

[[section.part3]]
title = "SUPPORT FACILITIES INSTALLATION"
items = [
  "Temporary Roads and Paved Areas: Construct and maintain temporary roads and paved areas adequate for construction operations. Locate temporary roads and paved areas within construction limits indicated on Drawings.",
  "Traffic Controls: Comply with requirements of authorities having jurisdiction. Protect existing site improvements to remain, and maintain access for fire-fighting equipment and emergency vehicles.",
  "Parking: Provide temporary parking areas for construction personnel.",
  "Project Signs: Provide Project signs as indicated. Unauthorized signs are not permitted.",
  ">Identification Sign: Provide one sign identifying {project_name}, {owner}, {architect} and Contractor, in the location and of the design approved by Architect.",
  ">Temporary Signs: Provide signs for construction personnel, visitors, deliveries and safety.",
  "Waste Disposal Facilities: Comply with requirements specified in Section 01 74 19 \"Construction Waste Management and Disposal.\"",
  "Lifts and Hoists: Provide facilities necessary for hoisting materials and personnel. Truck cranes and similar devices used for hoisting materials are considered tools and equipment and not temporary facilities.",
  "Temporary Stairs: Until permanent stairs are available, provide temporary stairs where ladders are not adequate.",
]

[[section.part3]]
title = "SECURITY AND PROTECTION FACILITIES INSTALLATION"
items = [
  "Protection of Existing Facilities: Protect existing vegetation, equipment, structures, utilities and other improvements at Project site and on adjacent properties, except those indicated to be removed or altered. Repair damage to existing facilities.",
  "Environmental Protection: Provide protection, operate temporary facilities and conduct construction as required to comply with environmental regulations and that minimize possible air, waterway and subsoil contamination or pollution or other undesirable effects.",
  "Stormwater Control: Comply with requirements of authorities having jurisdiction. Provide barriers in and around excavations and subgrade construction to prevent flooding by runoff of stormwater from heavy rains.",
  "Tree and Plant Protection: Install temporary fencing located outside the drip line of trees to remain, to protect vegetation from damage from construction operations.",
  "Site Enclosure Fence: Before construction operations begin, furnish and install site enclosure fence in a manner that will prevent people and animals from easily entering site except by entrance gates. Provide lockable gates and furnish one set of keys to Owner.",
  "Barricades, Warning Signs and Lights: Comply with requirements of authorities having jurisdiction for erecting structurally adequate barricades, including warning signs and lighting.",
  "Temporary Enclosures: Provide temporary enclosures for protection of construction, in progress and completed, from exposure, foul weather, other construction operations and similar activities. Provide temporary weathertight enclosure for building exterior.",
  "Temporary Fire Protection: Install and maintain temporary fire-protection facilities of types needed to protect against reasonably predictable and controllable fire losses. Comply with NFPA 241.",
  ">Prohibit smoking in construction areas.",
  ">Supervise welding operations, combustion-type temporary heating units and similar sources of fire ignition according to requirements of authorities having jurisdiction.",
  ">Develop and supervise an overall fire-prevention and -protection program for personnel at Project site.",
]

[[section.part3]]
title = "MOISTURE AND MOLD CONTROL"
items = [
  "Contractor's Moisture-Protection Plan: Avoid trapping water in finished work. Document visible signs of mold that may appear during construction.",
  "Exposed Construction Period: Before installation of weather barriers, protect materials from water damage and keep porous and organic materials from coming into prolonged contact with concrete.",
  "Partially Enclosed Construction Period: Keep interior spaces reasonably clean and protected from water damage. Discard or replace water-damaged and wet material.",
  "Controlled Construction Period: After completing and sealing of the building enclosure but before HVAC system is operating, maintain relative humidity below 60 percent in spaces containing materials susceptible to mold. Remove materials that cannot be completely restored to their manufactured moisture level within 48 hours.",
]

[[section.part3]]
title = "OPERATION, TERMINATION AND REMOVAL"
items = [
  "Supervision: Enforce strict discipline in use of temporary facilities. To minimize waste and abuse, limit availability of temporary facilities to essential and intended uses.",
  "Maintenance: Maintain facilities in good operating condition until removal.",
  "Temporary Facility Changeover: Do not change over from using temporary security and protection facilities to permanent facilities until Substantial Completion.",
  "Termination and Removal: Remove each temporary facility when need for its service has ended, when it has been replaced by authorized use of a permanent facility, or no later than Substantial Completion. Complete or, if necessary, restore permanent construction that may have been delayed because of interference with temporary facility. Repair damaged work, clean exposed surfaces and replace construction that cannot be satisfactorily repaired.",
  ">Materials and facilities that constitute temporary facilities are property of Contractor. Owner reserves right to take possession of Project identification signs.",
  ">At Substantial Completion, repair, renovate and clean permanent facilities used during construction period.",
]

[[section]]
number = "01 60 00"
title = "PRODUCT REQUIREMENTS"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for selection of products for use in Project; product delivery, storage and handling; manufacturers' standard warranties on products; special warranties; and comparable products.",
  "Related Requirements:",
  ">Section 01 23 00 \"Alternates\" for products selected under an alternate.",
  ">Section 01 25 00 \"Substitution Procedures\" for requests for substitutions.",
  ">Section 01 42 00 \"References\" for applicable industry standards for products specified.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Products: Items obtained for incorporating into the Work, whether purchased for Project or taken from previously purchased stock. The term product includes the terms material, equipment, system and terms of similar intent.",
  ">Named Products: Items identified by manufacturer's product name, including make or model number or other designation shown or listed in manufacturer's published product literature, that is current as of date of the Contract Documents.",
  ">New Products: Items that have not previously been incorporated into another project or facility. Salvaged items or items reused from other projects are not considered new products.",
  ">Comparable Product: Product that is demonstrated and approved through submittal process to have the indicated qualities related to type, function, dimension, in-service performance, physical properties, appearance and other characteristics that equal or exceed those of specified product.",
  "Basis-of-Design Product Specification: A specification in which a specific manufacturer's product is named and accompanied by the words basis-of-design product, including make or model number or other designation, to establish the significant qualities related to type, function, dimension, in-service performance, physical properties, appearance and other characteristics for purposes of evaluating comparable products of additional manufacturers named in the specification.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Comparable Product Requests: Submit request for consideration of each comparable product. Identify product or fabrication or installation method to be replaced. Include Specification Section number and title and Drawing numbers and titles.",
  ">Include data to indicate compliance with the requirements specified in Comparable Products article.",
  ">Architect's Action: Architect will notify Contractor of approval or rejection of proposed comparable product request within 15 days of receipt of request, or seven days of receipt of additional information or documentation, whichever is later.",
  "Basis-of-Design Product Specification Submittal: Comply with requirements in Section 01 33 00 \"Submittal Procedures.\" Show compliance with requirements.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Compatibility of Options: If Contractor is given option of selecting between two or more products for use on Project, select product compatible with products previously selected, even if previously selected products were also options.",
  "Identification of Products: Except for required labels and operating data, do not attach manufacturer's logos, trademarks or other markings on surfaces exposed to view in occupied spaces or on the exterior.",
]

[[section.part1]]
title = "PRODUCT DELIVERY, STORAGE AND HANDLING"
items = [
  "Deliver, store and handle products using means and methods that will prevent damage, deterioration and loss, including theft and vandalism. Comply with manufacturer's written instructions.",
  "Delivery and Handling:",
  ">Schedule delivery to minimize long-term storage at Project site and to prevent overcrowding of construction spaces.",
  ">Coordinate delivery with installation time to ensure minimum holding time for items that are flammable, hazardous, easily damaged or sensitive to deterioration, theft and other losses.",
  ">Deliver products to Project site in an undamaged condition in manufacturer's original sealed container or other packaging system, complete with labels and instructions for handling, storing, unpacking, protecting and installing.",
  ">Inspect products on delivery to determine compliance with the Contract Documents and to determine that products are undamaged and properly protected.",
  "Storage:",
  ">Store products to allow for inspection and measurement of quantity or counting of units.",
  ">Store materials in a manner that will not endanger Project structure.",
  ">Store products that are subject to damage by the elements under cover in a weathertight enclosure above ground, with ventilation adequate to prevent condensation.",
  ">Store foam plastic from exposure to sunlight, except to extent necessary for period of installation and concealment.",
  ">Comply with product manufacturer's written instructions for temperature, humidity, ventilation and weather-protection requirements for storage.",
  ">Protect stored products from damage and liquids from freezing.",
]

[[section.part1]]
title = "PRODUCT WARRANTIES"
items = [
  "Warranties specified in other Sections shall be in addition to, and run concurrent with, other warranties required by the Contract Documents. Manufacturer's disclaimers and limitations on product warranties do not relieve Contractor of obligations under requirements of the Contract Documents.",
  ">Manufacturer's Warranty: Written warranty furnished by individual manufacturer for a particular product and specifically endorsed by manufacturer to Owner.",
  ">Special Warranty: Written warranty required by the Contract Documents to provide specific rights for Owner.",
  "Special Warranties: Prepare a written document that contains appropriate terms and identification, ready for execution.",
  ">Refer to other Sections for specific content requirements and particular requirements for submitting special warranties.",
  "Submittal Time: Comply with requirements in Section 01 77 00 \"Closeout Procedures.\"",
]

[[section.part2]]
title = "PRODUCT SELECTION PROCEDURES"
items = [
  "General Product Requirements: Provide products that comply with the Contract Documents, are undamaged and, unless otherwise indicated, are new at time of installation.",
  ">Provide products complete with accessories, trim, finish, fasteners and other items needed for a complete installation and indicated use and effect.",
  ">Standard Products: If available and not otherwise indicated, provide standard products of types that have been produced and used successfully in similar situations on other projects.",
  ">Owner reserves the right to limit selection to products with warranties meeting requirements of the Contract Documents.",
  ">Where products are accompanied by the term as selected, Architect will make selection.",
  ">Descriptive, performance and reference standard requirements in the Specifications establish salient characteristics of products.",
  "Product Selection Procedures:",
  ">Sole Product: Where Specifications name a single manufacturer and product, provide the named product that complies with requirements. Comparable products or substitutions for Contractor's convenience will not be considered.",
  ">Limited List of Products: Where Specifications include a list of names of both manufacturers and products, provide one of the products listed that complies with requirements. Comparable products or substitutions for Contractor's convenience will be considered unless otherwise indicated.",
  ">Non-Limited List of Manufacturers: Where Specifications include a list of manufacturers' names, provide a product by one of the manufacturers listed, or another manufacturer, that complies with requirements.",
  ">Basis-of-Design Product: Where Specifications name a product, or refer to a product indicated on Drawings, and include a list of manufacturers, provide the specified or indicated product or a comparable product by one of the other named manufacturers.",
  "Visual Matching Specification: Where Specifications require matching an established Sample, select a product that complies with requirements and matches Architect's sample. Architect's decision will be final on whether a proposed product matches.",
  "Visual Selection Specification: Where Specifications include the phrase as selected by Architect from manufacturer's full range, select a product that complies with requirements. Architect will select color, gloss, pattern, density or texture from manufacturer's product line that includes both standard and premium items.",
]

[[section.part2]]
title = "COMPARABLE PRODUCTS"
items = [
  "Conditions for Consideration of Comparable Products: Architect will consider Contractor's request for comparable product when the following conditions are satisfied. If the following conditions are not satisfied, Architect may return requests without action, except to record noncompliance with these requirements:",
  ">Evidence that proposed product does not require revisions to the Contract Documents, is consistent with the Contract Documents, will produce the indicated results, and is compatible with other portions of the Work.",
  ">Detailed comparison of significant qualities of proposed product with those named in the Specifications.",
  ">Evidence that proposed product provides specified warranty.",
  ">List of similar installations for completed projects with project names and addresses and names and addresses of architects and owners, if requested.",
  ">Samples, if requested.",
]

[[section.part3]]
title = "EXECUTION"
items = ["Not Used."]

[[section]]
number = "01 73 00"
title = "EXECUTION"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes general administrative and procedural requirements governing execution of the Work, including the following:",
  ">Construction layout.",
  ">Field engineering and surveying.",
  ">Installation of the Work.",
  ">Cutting and patching.",
  ">Coordination of Owner-installed products.",
  ">Progress cleaning.",
  ">Starting and adjusting.",
  ">Protection of installed construction.",
  "Related Requirements:",
  ">Section 01 10 00 \"Summary\" for limits on use of Project site.",
  ">Section 01 77 00 \"Closeout Procedures\" for submitting final property survey with Project record documents, recording of Owner-accepted deviations from indicated lines and levels, and final cleaning.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Cutting: Removal of in-place construction necessary to permit installation or performance of subsequent work.",
  "Patching: Fitting and repair work required to restore construction to original conditions after installation of other work.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For land surveyor.",
  "Certificates: Submit certificate signed by land surveyor certifying that location and elevation of improvements comply with requirements.",
  "Cutting and Patching Plan: Submit plan describing procedures at least ten days prior to the time cutting and patching will be performed. Include a description of affected work, products to be used, methods, and an explanation of why cutting and patching is necessary and its effect on structural elements, weather protection, operational elements and visual qualities.",
  "Landfill Receipts: Submit copy of receipts issued by a landfill facility, licensed to accept hazardous materials, for hazardous waste disposal.",
  "Final Property Survey: Submit a PDF of final property survey.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Land Surveyor Qualifications: A professional land surveyor who is legally qualified to practice in {jurisdiction} and who is experienced in providing land-surveying services of the kind indicated.",
  "Cutting and Patching: Comply with requirements for and limitations on cutting and patching of construction elements.",
  ">Structural Elements: When cutting and patching structural elements, notify Architect of locations and details of cutting and await directions from Architect before proceeding.",
  ">Operational Elements: Do not cut and patch operating elements and related components in a manner that results in reducing their capacity to perform as intended or that result in increased maintenance or decreased operational life or safety.",
  ">Other Construction Elements: Do not cut and patch other construction elements or components in a manner that could change their load-carrying capacity, increase deflection or result in reduced capacity to perform as intended.",
  ">Visual Elements: Do not cut and patch construction in a manner that results in visual evidence of cutting and patching. Do not cut and patch exposed construction in a manner that would, in Architect's opinion, reduce the building's aesthetic qualities.",
]

[[section.part2]]
title = "MATERIALS"
items = [
  "General: Comply with requirements specified in other Sections.",
  ">For projects requiring compliance with sustainable design and construction practices and procedures, use products for patching that comply with sustainable design requirements.",
  "In-Place Materials: Use materials for patching identical to in-place materials. For exposed surfaces, use materials that visually match in-place adjacent surfaces to the fullest extent possible.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Existing Conditions: The existence and location of underground and other utilities and construction indicated as existing are not guaranteed. Before beginning sitework, investigate and verify the existence and location of underground utilities, mechanical and electrical systems, and other construction affecting the Work. Contact the local utility locator service before excavating.",
  "Examination and Acceptance of Conditions: Before proceeding with each component of the Work, examine substrates, areas and conditions, with Installer or Applicator present where indicated, for compliance with requirements for installation tolerances and other conditions affecting performance.",
  ">Examine roughing-in for mechanical and electrical systems to verify actual locations of connections before equipment and fixture installation.",
  ">Examine walls, floors and roofs for suitable conditions where products and systems are to be installed.",
  ">Proceed with installation only after unsatisfactory conditions have been corrected. Proceeding with the Work indicates acceptance of surfaces and conditions.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Existing Utility Information: Furnish information to local utility and Owner that is necessary to adjust, move or relocate existing utility structures, utility poles, lines, services or other utility appurtenances located in or affected by construction.",
  "Field Measurements: Take field measurements as required to fit the Work properly. Recheck measurements before installing each product. Where portions of the Work are indicated to fit to other construction, verify dimensions of other construction by field measurements before fabrication.",
  "Space Requirements: Verify space requirements and dimensions of items shown diagrammatically on Drawings.",
  "Review of Contract Documents and Field Conditions: Immediately on discovery of the need for clarification of the Contract Documents caused by differing field conditions outside the control of Contractor, submit an RFI to Architect according to requirements in Section 01 31 00 \"Project Management and Coordination.\"",
]

[[section.part3]]
title = "CONSTRUCTION LAYOUT"
items = [
  "Verification: Before proceeding to lay out the Work, verify layout information shown on Drawings, in relation to the property survey and existing benchmarks. If discrepancies are discovered, notify Architect promptly.",
  "General: Engage a land surveyor to lay out the Work using accepted surveying practices.",
  ">Establish benchmarks and control points to set lines and levels at each story of construction and elsewhere as needed to locate each element of Project.",
  ">Establish limits on use of Project site.",
  ">Establish dimensions within tolerances indicated. Do not scale Drawings to obtain required dimensions.",
  ">Inform installers of lines and levels to which they must comply.",
  ">Check the location, level and plumb, of every major element as the Work progresses.",
  ">Notify Architect when deviations from required lines and levels exceed allowable tolerances.",
  "Building Lines and Levels: Locate and lay out control lines and levels for structures, building foundations, column grids and floor levels, including those required for mechanical and electrical work. Transfer survey markings and elevations for use with control lines and levels. Level foundations and piers from two or more locations.",
  "Record Log: Maintain a log of layout control work. Record deviations from required lines and levels. Include beginning and ending dates and times of surveys, weather conditions, name and duty of each survey party member, and types of instruments and tapes used.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "General: Locate the Work and components of the Work accurately, in correct alignment and elevation, as indicated.",
  ">Make vertical work plumb and make horizontal work level.",
  ">Where space is limited, install components to maximize space available for maintenance and ease of removal for replacement.",
  ">Conceal pipes, ducts and wiring in finished areas unless otherwise indicated.",
  ">Maintain minimum headroom clearance of 96 inches in occupied spaces and 90 inches in unoccupied spaces, unless otherwise indicated.",
  "Comply with manufacturer's written instructions and recommendations for installing products in applications indicated.",
  "Install products at the time and under conditions that will ensure the best possible results. Maintain conditions required for product performance until Substantial Completion.",
  "Conduct construction operations so no part of the Work is subjected to damaging operations or loading in excess of that expected during normal conditions of occupancy.",
  "Sequence the Work and allow adequate clearances to accommodate movement of construction items on site and placement in permanent locations.",
  "Tools and Equipment: Select tools or equipment that minimize production of excessive noise levels.",
  "Anchors and Fasteners: Provide anchors and fasteners as required to anchor each component securely in place, accurately located and aligned with other portions of the Work. Where size and type of attachments are not indicated, verify size and type required for load conditions.",
  ">Allow for building movement, including thermal expansion and contraction.",
  ">Coordinate installation of anchorages. Furnish setting drawings, templates and directions for installing anchorages, including sleeves, concrete inserts, anchor bolts and items with integral anchors, that are to be embedded in concrete or masonry.",
  ">Use not less than two anchors or fasteners for each component unless one is specifically indicated.",
  "Joints: Make joints of uniform width. Where joint locations in exposed work are not indicated, arrange joints for the best visual effect, as judged by Architect. Fit exposed connections together to form hairline joints.",
  "Hazardous Materials: Use products, cleaners and installation materials that are not considered hazardous.",
]

[[section.part3]]
title = "CUTTING AND PATCHING"
items = [
  "Cutting and Patching, General: Employ skilled workers to perform cutting and patching. Proceed with cutting and patching at the earliest feasible time, and complete without delay.",
  ">Cut in-place construction to provide for installation of other components or performance of other construction, and subsequently patch as required to restore surfaces to their original condition.",
  "Temporary Support: Provide temporary support of work to be cut.",
  "Protection: Protect in-place construction during cutting and patching to prevent damage. Provide protection from adverse weather conditions for portions of Project that might be exposed during cutting and patching operations.",
  "Cutting: Cut in-place construction by sawing, drilling, breaking, chipping, grinding and similar operations, including excavation, using methods least likely to damage elements retained or adjoining construction.",
  ">Cut masonry and concrete using a cutting machine, such as an abrasive saw or a diamond-core drill.",
  ">Proceed with patching after construction operations requiring cutting are complete.",
  "Patching: Patch construction by filling, repairing, refinishing, closing up and similar operations following performance of other work. Patch with durable seams that are as invisible as practicable.",
  ">Inspect and test patched areas after completion to demonstrate physical integrity of installation.",
  ">Restore exposed finishes of patched areas and extend finish restoration into retained adjacent construction in a manner that will minimize evidence of patching and refinishing.",
  ">Where patching occurs in a fire-rated assembly, restore the assembly to its original rating using a listed firestop system.",
  ">Where removing walls or partitions extends one finished area into another, patch and repair floor and wall surfaces in the new space. Provide an even surface of uniform finish, color, texture and appearance.",
]

[[section.part3]]
title = "PROGRESS CLEANING"
items = [
  "General: Clean Project site and work areas daily, including common areas. Enforce requirements strictly. Dispose of materials lawfully.",
  ">Comply with requirements in NFPA 241 for removal of combustible waste materials and debris.",
  ">Do not hold waste materials more than seven days during normal weather or three days if the temperature is expected to rise above 80 deg F.",
  "Site: Maintain Project site free of waste materials and debris.",
  "Work Areas: Clean areas where work is in progress to the level of cleanliness necessary for proper execution of the Work.",
  "Installed Work: Keep installed work clean. Clean installed surfaces according to written instructions of manufacturer or fabricator of product installed, using only cleaning materials specifically recommended.",
  "Concealed Spaces: Remove debris from concealed spaces before enclosing the space.",
  "Waste Disposal: Do not bury or burn waste materials on-site. Do not wash waste materials down sewers or into waterways. Comply with waste disposal requirements in Section 01 74 19 \"Construction Waste Management and Disposal.\"",
]

[[section.part3]]
title = "STARTING AND ADJUSTING"
items = [
  "Coordinate startup and adjusting of equipment and operating components with requirements in Section 01 91 13 \"General Commissioning Requirements,\" where included.",
  "Start equipment and operating components to confirm proper operation. Remove malfunctioning units, replace with new units and retest.",
  "Adjust equipment for proper operation. Adjust operating components for proper operation without binding.",
  "Test each piece of equipment to verify proper operation. Test and adjust controls and safeties. Replace damaged and malfunctioning controls and equipment.",
  "Manufacturer's Field Service: Comply with qualification requirements in Section 01 40 00 \"Quality Requirements.\"",
]

[[section.part3]]
title = "PROTECTION OF INSTALLED CONSTRUCTION"
items = [
  "Provide final protection and maintain conditions that ensure installed Work is without damage or deterioration at time of Substantial Completion.",
  "Comply with manufacturer's written instructions for temperature and relative humidity.",
  "Protect finished floors from traffic with durable, nonstaining coverings. Protect installed doors, frames, windows and hardware from damage by subsequent operations.",
]

[[section]]
number = "01 74 19"
title = "CONSTRUCTION WASTE MANAGEMENT AND DISPOSAL"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for the following:",
  ">Salvaging nonhazardous construction waste.",
  ">Recycling nonhazardous construction waste.",
  ">Disposing of nonhazardous construction waste.",
  "Related Requirements:",
  ">Section 01 50 00 \"Temporary Facilities and Controls\" for environmental-protection measures during construction.",
  ">Section 01 81 13 \"Sustainable Design Requirements\" for documentation of waste diversion, where included.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Construction Waste: Building, structure and site improvement materials and other solid waste resulting from construction, remodeling, renovation or repair operations. Construction waste includes packaging.",
  "Disposal: Removal off-site of demolition and construction waste and subsequent sale, recycling, reuse or deposit in landfill or incinerator acceptable to authorities having jurisdiction.",
  "Recycle: Recovery of construction waste for subsequent processing in preparation for reuse.",
  "Salvage: Recovery of construction waste and subsequent sale or reuse in another facility.",
]

[[section.part1]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "General: Achieve end-of-Project rates for salvage and recycling of 75 percent by weight of total non-hazardous solid waste generated by the Work. Facilitate recycling and salvage of materials, including the following:",
  ">Clean dimensional lumber, engineered wood products and wood sheet materials.",
  ">Metals, including metal studs, reinforcing steel, piping and wiring.",
  ">Gypsum board scrap, where accepted by a local recycler.",
  ">Concrete, masonry and asphalt paving.",
  ">Cardboard, paper, plastic film and pallets from packaging.",
  ">Beverage containers.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Waste Management Plan: Submit plan within 30 days of date established for the Notice to Proceed.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Waste Reduction Progress Reports: Concurrent with each Application for Payment, submit report. Include the following information:",
  ">Material category and generation point of waste.",
  ">Total quantity of waste in tons.",
  ">Quantity of waste salvaged, both estimated and actual, in tons.",
  ">Quantity of waste recycled, both estimated and actual, in tons.",
  ">Total quantity of waste recovered (salvaged plus recycled) in tons, and as a percentage of total waste.",
  "Waste Reduction Calculations: Before request for Substantial Completion, submit calculated end-of-Project rates for salvage, recycling and disposal as a percentage of total waste generated by the Work.",
  "Records of Donations, Sales and Disposal: Indicate receipt and acceptance of salvageable waste donated to individuals and organizations, of recyclable waste by recycling facilities, and of waste by landfill and incinerator facilities licensed to accept them.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Waste Management Coordinator Qualifications: Contractor's employee experienced in the management of construction waste, designated to implement the waste management plan.",
  "Refrigerant Recovery Technician Qualifications: Certified by EPA-approved certification program.",
  "Waste Management Conference: Conduct conference at Project site to comply with requirements in Section 01 31 00 \"Project Management and Coordination.\" Review methods and procedures related to waste management, including reporting, recycling facilities, and handling and separation of materials.",
]

[[section.part1]]
title = "WASTE MANAGEMENT PLAN"
items = [
  "General: Develop a waste management plan according to ASTM E1609 and requirements in this Section. Plan shall consist of waste identification, waste reduction work plan and cost/revenue analysis. Indicate quantities by weight or volume, but use same units of measure throughout waste management plan.",
  "Waste Identification: Indicate anticipated types and quantities of construction waste generated by the Work. Include estimated quantities and assumptions for estimates.",
  "Waste Reduction Work Plan: List each type of waste and whether it will be salvaged, recycled or disposed of in landfill or incinerator. Include points of waste generation, total quantity of each type of waste, quantity for each means of recovery, and handling and transportation procedures.",
  ">Salvaged Materials for Reuse: For materials that will be salvaged and reused in this Project, describe methods for preparing salvaged materials before incorporation into the Work.",
  ">Recycled Materials: Include list of local receivers and processors and type of recycled materials each will accept. Include names, addresses and telephone numbers.",
  ">Disposed Materials: Indicate how and where materials will be disposed of. Include name, address and telephone number of each landfill and incinerator facility.",
  ">Handling and Transportation Procedures: Include method that will be used for separating recyclable waste, including sizes of containers, container labeling, and designated location where materials separation will be performed.",
  "Cost/Revenue Analysis: Indicate total cost of waste disposal as if there were no salvage or recycling, and the net additional cost or net savings resulting from the waste management plan.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "PLAN IMPLEMENTATION"
items = [
  "General: Implement approved waste management plan. Provide handling, containers, storage, signage, transportation and other items as required to implement waste management plan during the entire duration of the Contract.",
  "Waste Management Coordinator: Engage a waste management coordinator to be responsible for implementing, monitoring and reporting status of the waste management plan.",
  "Training: Train workers, subcontractors and suppliers on proper waste management procedures, as appropriate for the Work.",
  "Site Access and Temporary Controls: Conduct waste management operations to ensure minimum interference with roads, streets, walks, walkways and other adjacent occupied and used facilities.",
  ">Designate and label specific areas on Project site necessary for separating materials that are to be salvaged, recycled, reused, donated and sold.",
  ">Comply with Section 01 50 00 \"Temporary Facilities and Controls\" for controlling dust and dirt, environmental protection and noise control.",
]

[[section.part3]]
title = "RECYCLING CONSTRUCTION WASTE"
items = [
  "General: Separate recyclable waste from other waste materials, trash and debris. Separate recyclable waste by type at Project site to the maximum extent practical, according to approved construction waste management plan.",
  ">Provide appropriately marked containers or bins for controlling recyclable waste until they are removed from Project site. Include list of acceptable and unacceptable materials at each container and bin.",
  ">Inspect containers and bins for contamination and remove contaminated materials if found.",
  ">Stockpile processed materials on-site without intermixing with other materials. Place, grade and shape stockpiles to drain surface water. Cover to prevent windblown dust.",
  ">Stockpile materials away from construction area. Do not store within drip line of remaining trees.",
  ">Store components off the ground and protect from the weather.",
  "Packaging: Break down cardboard packaging and place in designated areas for recycling. Return pallets to suppliers where possible.",
  "Wood Materials: Clean cut-offs of lumber may be ground or chipped for use as mulch or erosion control. Do not recycle preservative-treated or painted wood as mulch.",
  "Gypsum Board: Stack large clean pieces on wood pallets or in container and store in a dry location. Remove edge trim and sort with other metals.",
]

[[section.part3]]
title = "DISPOSAL OF WASTE"
items = [
  "General: Except for items or materials to be salvaged, recycled or otherwise reused, remove waste materials from Project site and legally dispose of them in a landfill or incinerator acceptable to authorities having jurisdiction.",
  ">Except as otherwise specified, do not allow waste materials that are to be disposed of to accumulate on-site.",
  ">Remove and transport debris in a manner that will prevent spillage on adjacent surfaces and areas.",
  "Burning: Do not burn waste materials.",
  "Disposal: Remove waste materials from Owner's property and legally dispose of them.",
]

[[section]]
number = "01 77 00"
title = "CLOSEOUT PROCEDURES"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for Contract closeout, including the following:",
  ">Substantial Completion procedures.",
  ">Final completion procedures.",
  ">Warranties.",
  ">Final cleaning.",
  ">Repair of the Work.",
  "Related Requirements:",
  ">Section 01 78 23 \"Operation and Maintenance Data\" for operation and maintenance manual requirements.",
  ">Section 01 78 39 \"Project Record Documents\" for submitting record Drawings, record Specifications and record Product Data.",
  ">Section 01 79 00 \"Demonstration and Training\" for requirements for instructing Owner's personnel, where included.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For cleaning agents.",
  "Contractor's List of Incomplete Items: Initial submittal at Substantial Completion.",
  "Certified List of Incomplete Items: Final submittal at final completion.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Certificates of Release: From authorities having jurisdiction.",
  "Certificate of Insurance: For continuing coverage.",
  "Field Report: For termite and pest control treatment, where required by other Sections.",
]

[[section.part1]]
title = "MAINTENANCE MATERIAL SUBMITTALS"
items = [
  "Schedule of Maintenance Material Items: For maintenance material submittal items specified in other Sections.",
]

[[section.part1]]
title = "SUBSTANTIAL COMPLETION PROCEDURES"
items = [
  "Contractor's List of Incomplete Items: Prepare and submit a list of items to be completed and corrected (Contractor's punch list), indicating the value of each item on the list and reasons why the Work is incomplete.",
  "Submittals Prior to Substantial Completion: Complete the following a minimum of ten days prior to requesting inspection for determining date of Substantial Completion. List items below that are incomplete at time of request.",
  ">Certificates of Release: Obtain and submit releases from authorities having jurisdiction permitting Owner unrestricted use of the Work and access to services and utilities. Include occupancy permits, operating certificates and similar releases.",
  ">Submit closeout submittals specified in other Sections, including Project record documents, operation and maintenance manuals, final completion construction photographic documentation, damage or settlement surveys, property surveys and similar final record information.",
  ">Submit closeout submittals specified in individual Sections, including specific warranties, workmanship bonds, maintenance service agreements, final certifications and similar documents.",
  ">Submit maintenance material submittals specified in individual Sections, including tools, spare parts, extra materials and similar items, and deliver to location designated by Architect. Label with manufacturer's name and model number.",
  "Procedures Prior to Substantial Completion: Complete the following a minimum of ten days prior to requesting inspection for determining date of Substantial Completion:",
  ">Advise Owner of pending insurance changeover requirements.",
  ">Make final changeover of permanent locks and deliver keys to Owner. Advise Owner's personnel of changeover in security provisions.",
  ">Complete startup and testing of systems and equipment.",
  ">Perform preventive maintenance on equipment used prior to Substantial Completion.",
  ">Instruct Owner's personnel in operation, adjustment and maintenance of products, equipment and systems.",
  ">Terminate and remove temporary facilities from Project site, along with mockups, construction tools and similar elements.",
  ">Complete final cleaning requirements.",
  ">Touch up paint and otherwise repair and restore marred exposed finishes to eliminate visual defects.",
  "Inspection: Submit a written request for inspection to determine Substantial Completion a minimum of ten days prior to date the Work will be completed and ready for final inspection and tests. On receipt of request, Architect will either proceed with inspection or notify Contractor of unfulfilled requirements. Architect will prepare the Certificate of Substantial Completion after inspection or will notify Contractor of items, either on Contractor's list or additional items identified by Architect, that must be completed or corrected before certificate will be issued.",
  ">Reinspection: Request reinspection when the Work identified in previous inspections as incomplete is completed or corrected.",
]

[[section.part1]]
title = "FINAL COMPLETION PROCEDURES"
items = [
  "Preliminary Procedures: Before requesting final inspection for determining final completion, complete the following:",
  ">Submit a final Application for Payment according to Section 01 29 00 \"Payment Procedures.\"",
  ">Certified List of Incomplete Items: Submit certified copy of Architect's Substantial Completion inspection list of items to be completed or corrected, endorsed and dated by Architect. Certified copy of the list shall state that each item has been completed or otherwise resolved for acceptance.",
  ">Certificate of Insurance: Submit evidence of final, continuing insurance coverage complying with insurance requirements.",
  ">Instruct Owner's personnel in operation, adjustment and maintenance of products, equipment and systems.",
  "Inspection: Submit a written request for final inspection to determine acceptance. On receipt of request, Architect will either proceed with inspection or notify Contractor of unfulfilled requirements. Architect will prepare a final Certificate for Payment after inspection or will notify Contractor of construction that must be completed or corrected before certificate will be issued.",
]

[[section.part1]]
title = "LIST OF INCOMPLETE ITEMS (PUNCH LIST)"
items = [
  "Organization of List: Include name and identification of each space and area affected by construction operations for incomplete items and items needing correction.",
  ">Organize list of spaces in sequential order, starting with exterior areas first and proceeding from lowest floor to highest floor, listed by room or space number.",
  ">Organize items applying to each space by major element, including categories for ceiling, individual walls, floors, equipment and building systems.",
  ">Submit list of incomplete items in PDF electronic format, or as an issue list on the Project management platform.",
]

[[section.part1]]
title = "SUBMITTAL OF PROJECT WARRANTIES"
items = [
  "Time of Submittal: Submit written warranties on request of Architect for designated portions of the Work where warranties are indicated to commence on dates other than date of Substantial Completion, or when delay in submittal of warranties might limit Owner's rights under warranty.",
  "Organize warranty documents into an orderly sequence based on the table of contents of Project Manual.",
  ">Bind warranties and bonds in heavy-duty, three-ring, vinyl-covered, loose-leaf binders, thickness as necessary to accommodate contents, and sized to receive 8-1/2-by-11-inch paper.",
  ">Provide heavy paper dividers with plastic-covered tabs for each separate warranty. Mark tab to identify the product or installation. Provide a typed description of the product or installation, including the name of the product and the name, address and telephone number of Installer.",
  ">Identify each binder on the front and spine with the typed or printed title WARRANTIES, {project_name}, name of Contractor.",
  "Provide an electronic copy of each warranty in a single indexed PDF file with bookmarks for each Specification Section.",
  "Provide additional copies of each warranty to include in operation and maintenance manuals.",
]

[[section.part2]]
title = "MATERIALS"
items = [
  "Cleaning Agents: Use cleaning materials and agents recommended by manufacturer or fabricator of the surface to be cleaned. Do not use cleaning agents that are potentially hazardous to health or property or that might damage finished surfaces.",
  ">Use cleaning products that comply with Green Seal GS-37 or that comply with EPA Safer Choice criteria.",
]

[[section.part3]]
title = "FINAL CLEANING"
items = [
  "General: Perform final cleaning. Conduct cleaning and waste-removal operations to comply with local laws and ordinances and federal and local environmental and antipollution regulations.",
  "Cleaning: Employ experienced workers or professional cleaners for final cleaning. Clean each surface or unit to condition expected in an average commercial building cleaning and maintenance program. Comply with manufacturer's written instructions.",
  ">Complete the following cleaning operations before requesting inspection for certification of Substantial Completion for entire Project or for a designated portion of Project:",
  ">>Clean Project site, yard and grounds, in areas disturbed by construction activities, including landscape development areas, of rubbish, waste material, litter and other foreign substances.",
  ">>Sweep paved areas broom clean. Remove petrochemical spills, stains and other foreign deposits.",
  ">>Remove tools, construction equipment, machinery and surplus material from Project site.",
  ">>Clean exposed exterior and interior hard-surfaced finishes to a dirt-free condition, free of stains, films and similar foreign substances. Avoid disturbing natural weathering of exterior surfaces. Restore reflective surfaces to their original condition.",
  ">>Remove debris and surface dust from limited access spaces, including roofs, plenums, shafts, trenches, equipment vaults, manholes, attics and similar spaces.",
  ">>Clean flooring, removing debris, dirt and staining; clean according to manufacturer's recommendations.",
  ">>Vacuum and mop concrete.",
  ">>Vacuum carpet and similar soft surfaces, removing debris and excess nap; clean according to manufacturer's recommendations if visible soil or stains remain.",
  ">>Clean transparent materials, including mirrors and glass in doors and windows. Remove glazing compounds and other noticeable, vision-obscuring materials. Polish mirrors and glass, taking care not to scratch surfaces.",
  ">>Remove labels that are not permanent.",
  ">>Wipe surfaces of mechanical and electrical equipment, elevator equipment and similar equipment. Remove excess lubrication, paint and mortar droppings, and other foreign substances.",
  ">>Clean plumbing fixtures to a sanitary condition, free of stains, including stains resulting from water exposure.",
  ">>Replace disposable air filters and clean permanent air filters. Clean exposed surfaces of diffusers, registers and grills.",
  ">>Clean light fixtures, lamps, globes and reflectors to function with full efficiency.",
  ">>Leave Project clean and ready for occupancy.",
  "Construction Waste Disposal: Comply with waste disposal requirements in Section 01 74 19 \"Construction Waste Management and Disposal.\"",
]

[[section.part3]]
title = "REPAIR OF THE WORK"
items = [
  "Complete repair and restoration operations before requesting inspection for determination of Substantial Completion.",
  "Repair or remove and replace defective construction. Repairing includes replacing defective parts, refinishing damaged surfaces, touching up with matching materials, and properly adjusting operating equipment. Where damaged or worn items cannot be repaired or restored, provide replacements.",
  ">Remove and replace chipped, scratched and broken glass, reflective surfaces and other damaged transparent materials.",
  ">Touch up and otherwise repair and restore marred or exposed finishes and surfaces. Replace finishes and surfaces that cannot be satisfactorily repaired or restored or that already show evidence of repair or restoration.",
  ">Replace parts subject to operating conditions during construction that may impede operation or reduce longevity.",
  ">Replace failed or flickering lamps and LED modules, and defective drivers and ballasts, to comply with requirements for new fixtures.",
]

[[section]]
number = "01 78 23"
title = "OPERATION AND MAINTENANCE DATA"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for preparing operation and maintenance manuals, including the following:",
  ">Operation and maintenance documentation directory.",
  ">Emergency manuals.",
  ">Systems and equipment operation manuals.",
  ">Systems and equipment maintenance manuals.",
  ">Product maintenance manuals.",
  "Related Requirements:",
  ">Section 01 33 00 \"Submittal Procedures\" for submitting copies of submittals for operation and maintenance manuals.",
  ">Section 01 77 00 \"Closeout Procedures\" for submitting warranties.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "System: An organized collection of parts, equipment or subsystems united by regular interaction.",
  "Subsystem: A portion of a system with characteristics similar to a system.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Submit operation and maintenance manuals indicated. Provide content for each manual as specified in individual Specification Sections, and as reviewed and approved at the time of Section submittals. Submit reviewed manual content formatted and organized as required by this Section.",
  ">Architect will comment on whether content of operation and maintenance submittals is acceptable.",
  ">Where applicable, clarify and update reviewed manual content to correspond to revisions and field conditions.",
  "Format: Submit operation and maintenance manuals in the following format:",
  ">Submit by uploading to the Project management platform or by email to Architect. Enable reviewer comments on draft submittals.",
  ">Submit two paper copies in addition to the electronic copy, where requested by Owner. Architect will return one copy.",
  "Manual Submittal: Submit each manual in final form prior to requesting inspection for Substantial Completion and at least 15 days before commencing demonstration and training. Architect will return copy with comments.",
  ">Correct or revise each manual to comply with Architect's comments. Submit copies of each corrected manual within 15 days of receipt of Architect's comments and prior to commencing demonstration and training.",
]

[[section.part1]]
title = "FORMAT OF OPERATION AND MAINTENANCE MANUALS"
items = [
  "Manuals, Electronic Files: Submit manuals in the form of a multiple file composite electronic PDF file for each manual type required.",
  ">Electronic Files: Use electronic files prepared by manufacturer where available. Where scanning of paper documents is required, configure scanned file for minimum readable file size.",
  ">File Names and Bookmarks: Bookmark individual documents based on file names. Name document files to correspond to system, subsystem and equipment names used in manual directory and table of contents. Group documents for each system and subsystem into individual composite bookmarked files, then create composite manual, so that resulting bookmarks reflect the system, subsystem and equipment names in a readily navigated file tree.",
  "Manuals, Paper Copy: Submit manuals in the form of hard-copy, bound and labeled volumes.",
  ">Binders: Heavy-duty, three-ring, vinyl-covered, locking and nonlocking, loose-leaf binders, in thickness necessary to accommodate contents, sized to hold 8-1/2-by-11-inch paper; with clear plastic sleeve on spine to hold label describing contents and with pockets inside covers to hold folded oversize sheets.",
  ">Dividers: Heavy-paper dividers with plastic-covered tabs for each section of the manual. Mark each tab to indicate contents.",
  ">Drawings: Attach reinforced, punched binder tabs on drawings and bind with text. If oversize drawings are necessary, fold drawings to same size as text pages and use as foldouts.",
]

[[section.part1]]
title = "OPERATION AND MAINTENANCE DOCUMENTATION DIRECTORY"
items = [
  "Directory: Prepare a single, comprehensive directory of emergency, operation and maintenance data and materials, listing items and their location to facilitate ready access to desired information.",
  "Include a section in the directory for each of the following:",
  ">List of documents.",
  ">List of systems.",
  ">List of equipment.",
  ">Table of contents.",
]

[[section.part1]]
title = "EMERGENCY MANUALS"
items = [
  "Emergency Manual: Assemble a complete set of emergency information indicating procedures for use by emergency personnel and by Owner's operating personnel for types of emergencies indicated.",
  "Type of Emergencies: Where applicable for each type of emergency indicated, include instructions and procedures for each system, subsystem, piece of equipment and component:",
  ">Fire, flood, gas leak, water leak, power failure, water outage, equipment failure and chemical release or spill.",
  "Emergency Procedures: Include instructions on stopping, shutdown, disconnecting and shutting off utilities, and instructions on contacting service personnel and equipment manufacturers.",
]

[[section.part1]]
title = "OPERATION MANUALS"
items = [
  "Content: In addition to requirements in this Section, include operation data required in individual Specification Sections and the following information:",
  ">System, subsystem and equipment descriptions. Use designations for systems and equipment indicated on Contract Documents.",
  ">Performance and design criteria if Contractor is delegated design responsibility.",
  ">Operating standards, and operating procedures including startup, routine and normal operating instructions, regulation and control procedures, seasonal and weekend operating instructions, and shutdown instructions.",
  ">Operating logs, wiring diagrams, control diagrams and piped system diagrams.",
  ">Precautions against improper use, and license requirements including inspection and renewal dates.",
]

[[section.part1]]
title = "PRODUCT MAINTENANCE MANUALS"
items = [
  "Content: Organize manual into a separate section for each product, material and finish. Include source information, product information, maintenance procedures, repair materials and sources, and warranties and bonds.",
  "Source Information: List each product included in manual, identified by product name and arranged to match manual's table of contents. For each product, list name, address and telephone number of Installer or supplier and maintenance service agent, and cross-reference Specification Section number and title in Project Manual.",
  "Product Information: Include the following, as applicable: product name and model number, manufacturer's name, color, pattern and texture, material and chemical composition, and reordering information for specially manufactured products.",
  "Maintenance Procedures: Include manufacturer's written recommendations for inspection procedures, types of cleaning agents to be used and methods of cleaning, list of cleaning agents and methods of cleaning detrimental to product, schedule for routine cleaning and maintenance, and repair instructions.",
  "Repair Materials and Sources: Include lists of materials and local sources of materials and related services.",
  "Warranties and Bonds: Include copies of warranties and bonds and lists of circumstances and conditions that would affect validity of warranties or bonds.",
]

[[section.part1]]
title = "SYSTEMS AND EQUIPMENT MAINTENANCE MANUALS"
items = [
  "Content: For each system, subsystem and piece of equipment not part of a system, include source information, manufacturers' maintenance documentation, maintenance procedures, maintenance and service schedules, spare parts list and source information, maintenance service contracts, and warranty and bond information.",
  "Manufacturers' Maintenance Documentation: Include manufacturers' maintenance documentation including standard printed maintenance instructions and bulletins, drawings, diagrams and instructions required for maintenance, including disassembly and component removal, replacement and assembly, and identification and nomenclature of parts and components.",
  "Maintenance and Service Schedules: Include service and lubrication requirements, list of required lubricants for equipment, and separate schedules for preventive and routine maintenance and service with standard time allotment.",
  "Spare Parts List and Source Information: Include lists of replacement and repair parts, with parts identified and cross-referenced to manufacturers' maintenance documentation and local sources of maintenance materials and related services.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "MANUAL PREPARATION"
items = [
  "Operation and Maintenance Documentation Directory: Prepare a separate manual that provides an organized reference to emergency, operation and maintenance manuals.",
  "Emergency Manual: Assemble a complete set of emergency information indicating procedures for use by emergency personnel and by Owner's operating personnel for types of emergencies indicated.",
  "Product Maintenance Manual: Assemble a complete set of maintenance data indicating care and maintenance of each product, material and finish incorporated into the Work.",
  "Operation and Maintenance Manuals: Assemble a complete set of operation and maintenance data indicating operation and maintenance of each system, subsystem and piece of equipment not part of a system.",
  "Manufacturers' Data: Where manuals contain manufacturers' standard printed data, include only sheets pertinent to product or component installed. Mark each sheet to identify each product or component incorporated into the Work. If data include more than one item in a tabular format, identify each item using appropriate references from the Contract Documents. Identify data applicable to the Work and delete references to information not applicable.",
  "Drawings: Prepare drawings supplementing manufacturers' printed data to illustrate the relationship of component parts of equipment and systems and to illustrate control sequence and flow diagrams. Coordinate these drawings with information contained in record Drawings to ensure correct illustration of completed installation.",
  "Comply with Section 01 77 00 \"Closeout Procedures\" for schedule for submitting operation and maintenance documentation.",
]

[[section]]
number = "01 78 39"
title = "PROJECT RECORD DOCUMENTS"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for Project record documents, including the following:",
  ">Record Drawings.",
  ">Record Specifications.",
  ">Record Product Data.",
  ">Record digital model, where furnished.",
  "Related Requirements:",
  ">Section 01 73 00 \"Execution\" for final property survey.",
  ">Section 01 77 00 \"Closeout Procedures\" for general closeout procedures.",
  ">Section 01 78 23 \"Operation and Maintenance Data\" for operation and maintenance manual requirements.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Record Drawings: Comply with the following:",
  ">Number of Copies: Submit one set of marked-up record prints and one PDF file of each drawing sheet, with markups incorporated.",
  "Record Specifications: Submit one paper copy and one annotated PDF electronic file of Project's Specifications, including addenda and contract modifications.",
  "Record Product Data: Submit one paper copy and one annotated PDF electronic file and directories of each submittal.",
  ">Where record Product Data are required as part of operation and maintenance manuals, submit duplicate marked-up Product Data as a component of manual.",
  "Record Model: Where Architect's building information model is furnished to Contractor, submit an updated model reflecting as-built conditions, in the native format of the model received, together with an IFC4 export.",
]

[[section.part1]]
title = "RECORD DRAWINGS"
items = [
  "Record Prints: Maintain one set of marked-up paper copies of the Contract Drawings and Shop Drawings, incorporating new and revised drawings as modifications are issued.",
  ">Preparation: Mark record prints to show the actual installation where installation varies from that shown originally. Require individual or entity who obtained record data, whether individual or entity is Installer, subcontractor or similar entity, to provide information for preparation of corresponding marked-up record prints.",
  ">>Give particular attention to information on concealed elements that would be difficult to identify or measure and record later.",
  ">>Accurately record information in an acceptable drawing technique.",
  ">>Record data as soon as possible after obtaining it.",
  ">>Record and check the markup before enclosing concealed installations.",
  ">Content: Types of items requiring marking include, but are not limited to, the following:",
  ">>Dimensional changes to Drawings.",
  ">>Revisions to details shown on Drawings.",
  ">>Depths of foundations and elevations below first floor.",
  ">>Locations and depths of underground utilities.",
  ">>Revisions to routing of piping and conduits.",
  ">>Revisions to electrical circuitry.",
  ">>Actual equipment locations.",
  ">>Locations of concealed internal utilities.",
  ">>Changes made by Change Order or Construction Change Directive.",
  ">>Changes made following Architect's written orders.",
  ">>Details not on the original Contract Drawings.",
  ">>Field records for variable and concealed conditions.",
  ">>Record information on the Work that is shown only schematically.",
  ">Mark the Contract Drawings and Shop Drawings completely and accurately. Use personnel proficient at recording graphic information in production of marked-up record prints.",
  ">Mark record sets with erasable, red-colored pencil. Use other colors to distinguish between changes for different categories of the Work at same location.",
  ">Note Construction Change Directive numbers, alternate numbers, Change Order numbers and similar identification, where applicable.",
  "Format: Identify and date each record Drawing; include the designation PROJECT RECORD DRAWING in a prominent location.",
]

[[section.part1]]
title = "RECORD SPECIFICATIONS"
items = [
  "Preparation: Mark Specifications to indicate the actual product installation where installation varies from that indicated in Specifications, addenda and contract modifications.",
  ">Give particular attention to information on concealed products and installations that cannot be readily identified and recorded later.",
  ">Mark copy with the proprietary name and model number of products, materials and equipment furnished, including substitutions and product options selected.",
  ">Record the name of manufacturer, supplier, Installer and other information necessary to provide a record of selections made.",
  ">For each principal product, indicate whether record Product Data has been submitted in operation and maintenance manuals instead of submitted as record Product Data.",
  ">Note related Change Orders, record Product Data and record Drawings where applicable.",
]

[[section.part1]]
title = "RECORD PRODUCT DATA"
items = [
  "Recording: Maintain one copy of each submittal during the construction period for Project record document purposes. Post changes and revisions to Project record documents as they occur; do not wait until end of Project.",
  "Preparation: Mark Product Data to indicate the actual product installation where installation varies substantially from that indicated in Product Data submittal.",
  ">Give particular attention to information on concealed products and installations that cannot be readily identified and recorded later.",
  ">Include significant changes in the product delivered to Project site and changes in manufacturer's written instructions for installation.",
  ">Note related Change Orders, record Specifications and record Drawings where applicable.",
]

[[section.part1]]
title = "MAINTENANCE OF RECORD DOCUMENTS"
items = [
  "Maintenance of Record Documents: Store record documents in the field office apart from the Contract Documents used for construction. Do not use Project record documents for construction purposes. Maintain record documents in good order and in a clean, dry, legible condition, protected from deterioration and loss. Provide access to Project record documents for Architect's reference during normal working hours.",
  "Architect will review record documents monthly as a condition of approval of each Application for Payment.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "EXECUTION"
items = ["Not Used."]

[[section]]
number = "01 79 00"
title = "DEMONSTRATION AND TRAINING"
when = ["commercial"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for instructing Owner's personnel, including the following:",
  ">Demonstration of operation of systems, subsystems and equipment.",
  ">Training in operation and maintenance of systems, subsystems and equipment.",
  ">Demonstration and training video recordings.",
  "Related Requirements:",
  ">Section 01 78 23 \"Operation and Maintenance Data\" for operation and maintenance manuals used in training.",
  ">Divisions 02 through 49 Sections for specific requirements for demonstration and training for products in those Sections.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Instruction Program: Submit outline of instructional program for demonstration and training, including a list of training modules and a schedule of proposed dates, times, length of instruction time and instructors' names for each training module. Include learning objective and outline for each training module.",
  ">Indicate proposed training modules using manufacturer-produced demonstration and training video recordings for systems, equipment and products in lieu of video recording of live instructional module.",
  "Qualification Data: For instructor.",
  "Attendance Record: For each training module, submit list of participants and length of instruction time.",
  "Evaluations: For each participant and for each training module, submit results and documentation of performance-based test.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Demonstration and Training Video Recordings: Submit video recordings within seven days of end of each training module.",
  ">Identification: On each file, label with Project title, Project number, name of Contractor, date of video recording and training module title.",
  ">Transcript: Prepared in PDF electronic format. Include a cover sheet with same label information as the corresponding video recording and a table of contents with a list of time-coded segments.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Facilitator Qualifications: A firm or individual experienced in training or educating maintenance personnel in a training program similar in content and extent to that indicated for this Project, and whose work has resulted in training or education with a record of successful learning performance.",
  "Instructor Qualifications: A factory-authorized service representative, complying with requirements in Section 01 40 00 \"Quality Requirements,\" experienced in operation and maintenance procedures and training.",
  "Preinstruction Conference: Conduct conference at Project site to review methods and procedures related to demonstration and training, including schedule, facilities, and equipment and materials to be used.",
]

[[section.part1]]
title = "COORDINATION"
items = [
  "Coordinate instruction schedule with Owner's operations. Adjust schedule as required to minimize disrupting Owner's operations and to ensure availability of Owner's personnel.",
  "Coordinate content of training modules with content of approved emergency, operation and maintenance manuals. Do not submit instruction program until operation and maintenance data has been reviewed and approved by Architect.",
]

[[section.part1]]
title = "INSTRUCTION PROGRAM"
items = [
  "Program Structure: Develop an instruction program that includes individual training modules for each system and for equipment not part of a system, as required by individual Specification Sections, including the following as applicable:",
  ">Motorized doors, including overhead coiling doors and automatic entrance doors.",
  ">Heat generation, refrigeration, HVAC air distribution and HVAC controls.",
  ">Plumbing equipment, including water heaters and pumps.",
  ">Electrical service and distribution, lighting controls and emergency generators.",
  ">Fire-alarm, fire-suppression, intrusion detection and access-control systems.",
  ">Conveying systems, including elevators.",
  "Training Modules: Develop a learning objective and teaching outline for each module. Include a description of specific skills and knowledge that participant is expected to master. For each module, include instruction for the following as applicable to the system, equipment or component:",
  ">Basis of System Design, Operational Requirements and Criteria: Include system, subsystem and equipment descriptions, performance and design criteria, operating standards, sequences of operation, and warranties.",
  ">Documentation: Review the following items in detail: emergency manuals, operations manuals, maintenance manuals, Project record documents, identification systems and warranties.",
  ">Emergencies: Include alarms, troubleshooting, instructions on meaning of warnings and trouble indications, emergency shutdown and bypass instructions.",
  ">Operations: Include startup, equipment or system break-in, routine and normal operating procedures, regulation and control, seasonal and weekend operations, and shutdown procedures.",
  ">Adjustments: Include alignments, checking adjustments, noise and vibration adjustments, and economy and efficiency adjustments.",
  ">Maintenance: Include inspection procedures, types of cleaning agents to be used and methods of cleaning, procedures for routine cleaning, procedures for preventive maintenance, and procedures for routine maintenance.",
  ">Repairs: Include diagnosis, disassembly, component removal, repair and replacement, and reassembly instructions.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "PREPARATION"
items = [
  "Assemble educational materials necessary for instruction, including documentation and training module. Assemble training modules into a training manual organized in coordination with requirements in Section 01 78 23 \"Operation and Maintenance Data.\"",
  "Set up instructional equipment at instruction location.",
]

[[section.part3]]
title = "INSTRUCTION"
items = [
  "Engage qualified instructors to instruct Owner's personnel to adjust, operate and maintain systems, subsystems and equipment not part of a system.",
  "Scheduling: Provide instruction at mutually agreed-on times. For equipment that requires seasonal operation, provide similar instruction at start of each season.",
  ">Schedule training with Owner with at least seven days' advance notice.",
  "Training Location and Reference Material: Conduct training on-site in the completed and fully operational facility using the actual equipment in-place. Conduct training using final operation and maintenance data submittals.",
  "Evaluation: At conclusion of each training module, assess and document each participant's mastery of module by use of a demonstration performance-based test.",
  "Cleanup: Collect used and leftover educational materials and remove from Project site. Remove instructional equipment. Restore systems and equipment to condition existing before initial training use.",
]

[[section.part3]]
title = "DEMONSTRATION AND TRAINING VIDEO RECORDINGS"
items = [
  "General: Engage a qualified commercial videographer to record demonstration and training video recordings. Record each training module separately. Include classroom instructions and demonstrations, board diagrams and other visual aids, but not student practice.",
  "Digital Video Recordings: Provide high-definition video in MP4 format, minimum 1920 by 1080 pixels.",
  "Narration: Describe scenes on video recording by audio narration by microphone while video recording is recorded. Include description of items being viewed.",
]

[[section]]
number = "01 81 13"
title = "SUSTAINABLE DESIGN REQUIREMENTS"
when = ["optional"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes general requirements and procedures for compliance with sustainable design requirements needed for Project to obtain the certification or rating targeted by Owner, and for compliance with the energy and green building provisions adopted by {jurisdiction}.",
  ">Owner's target: [LEED v4.1 BD+C, Certified level] [LEED v4.1 Residential] [ENERGY STAR Certified Homes] [compliance with the adopted energy code only].",
  ">Some sustainable design requirements depend on product selections and may not be specifically identified as sustainable design requirements. Compliance with requirements needed to obtain sustainable design credits may impose additional requirements than may otherwise be required by the Contract Documents.",
  "Related Requirements:",
  ">Section 01 33 00 \"Submittal Procedures\" for submittal procedures.",
  ">Section 01 74 19 \"Construction Waste Management and Disposal\" for construction waste diversion.",
  ">Divisions 02 through 49 Sections for sustainable design requirements specific to the work of each of those Sections.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Recycled Content: The recycled content value of a material assembly shall be determined by weight, calculated according to ISO 14021 as postconsumer content plus one-half of preconsumer content.",
  "Regional Materials: Materials that are extracted, harvested or recovered, as well as manufactured, within 100 miles of Project site.",
  "Environmental Product Declaration (EPD): A product-specific or industry-wide Type III declaration conforming to ISO 14025 and ISO 21930, verified by an independent third party.",
  "Low-Emitting Material: A product tested and determined compliant with CDPH Standard Method v1.2 for volatile organic compound (VOC) emissions.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "General: Submit additional sustainable design submittals required by other Specification Sections.",
  "Sustainable Design Submittals:",
  ">Product Data for products having recycled content, indicating percentages by weight of postconsumer and preconsumer recycled content. Include statement indicating cost for each product having recycled content.",
  ">Product data for regional materials indicating location and distance from Project of material manufacturer and point of extraction, harvest or recovery for each raw material.",
  ">Chain-of-custody certificates for certified wood products, certifying that products comply with Forest Stewardship Council (FSC) requirements. Include evidence that manufacturer is certified for chain of custody by an FSC-accredited certification body.",
  ">Environmental Product Declarations for products where available.",
  ">Product data for adhesives, sealants, paints and coatings used inside the weatherproofing system, indicating VOC content and emissions test results.",
  ">Laboratory test reports for composite wood products used inside the weatherproofing system, indicating compliance with the CARB ATCM for formaldehyde, or showing no added urea-formaldehyde resins.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Construction Indoor-Air-Quality (IAQ) Management Plan: Within 30 days after the Notice to Proceed, submit a plan that follows the recommended control measures of the SMACNA IAQ Guidelines for Occupied Buildings under Construction.",
  ">Include monthly photographic documentation of IAQ measures in place.",
  "Construction Waste Management: Comply with Section 01 74 19 \"Construction Waste Management and Disposal.\"",
  "Commissioning and Performance Testing: Where required by the adopted energy code, submit documentation of commissioning of HVAC, lighting controls and service water heating systems, and results of building envelope air-leakage testing.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Sustainable Design Coordinator: Engage an experienced sustainable design coordinator to coordinate sustainable design requirements. Coordinator shall be a LEED Accredited Professional or have equivalent experience with the targeted rating system.",
  "Sustainable Design Meetings: Review sustainable design requirements at the preconstruction conference and at progress meetings.",
]

[[section.part2]]
title = "MATERIALS, GENERAL"
items = [
  "Provide products and procedures necessary to obtain sustainable design credits targeted by Owner. Although other Sections may specify some requirements that contribute to sustainable design credits, the Contractor shall determine additional materials and procedures necessary to obtain the credits indicated.",
  "Recycled Content of Materials: Provide building materials with recycled content such that postconsumer recycled content plus one-half of preconsumer recycled content constitutes a minimum of 20 percent of cost of materials used for Project.",
  "Certified Wood: Provide a minimum of 50 percent of wood-based materials, by cost, that are produced from wood obtained from forests certified by an FSC-accredited certification body.",
]

[[section.part2]]
title = "LOW-EMITTING MATERIALS"
items = [
  "Adhesives and Sealants: For field applications that are inside the weatherproofing system, comply with VOC limits of SCAQMD Rule 1168 and with CDPH Standard Method v1.2 emissions requirements.",
  "Paints and Coatings: For field applications that are inside the weatherproofing system, comply with VOC limits of CARB Suggested Control Measure for Architectural Coatings or SCAQMD Rule 1113, and with CDPH Standard Method v1.2 emissions requirements.",
  "Flooring: Provide flooring products that comply with CDPH Standard Method v1.2 emissions requirements. Carpet shall bear the CRI Green Label Plus mark.",
  "Composite Wood and Agrifiber Products: Products shall contain no added urea formaldehyde or shall comply with the CARB ATCM for formaldehyde emissions, Phase 2.",
  "Insulation: Provide insulation that complies with CDPH Standard Method v1.2 emissions requirements; do not use insulation containing added formaldehyde.",
]

[[section.part3]]
title = "REFRIGERANT REMOVAL"
items = [
  "Remove chlorofluorocarbon (CFC) refrigerants from existing HVAC and refrigeration equipment indicated to be removed, according to Section 01 74 19 \"Construction Waste Management and Disposal.\"",
]

[[section.part3]]
title = "CONSTRUCTION WASTE MANAGEMENT"
items = [
  "Comply with Section 01 74 19 \"Construction Waste Management and Disposal.\"",
]

[[section.part3]]
title = "CONSTRUCTION INDOOR-AIR-QUALITY MANAGEMENT"
items = [
  "Comply with SMACNA IAQ Guidelines for Occupied Buildings under Construction.",
  ">If Owner authorizes use of permanent heating, cooling and ventilating systems during construction period as specified in Section 01 50 00 \"Temporary Facilities and Controls,\" install filter media having a MERV 8 rating according to ASHRAE 52.2 at each return-air inlet for the air-handling system used during construction.",
  ">Replace all air filters immediately prior to occupancy with filters having a minimum MERV 13 rating.",
  "Protect stored on-site and installed absorptive materials from moisture damage.",
  "Flush-Out or Air Testing: After construction ends and before occupancy, with all interior finishes installed, perform a building flush-out by supplying outdoor air to maintain an internal temperature of at least 60 deg F and relative humidity no higher than 60 percent, or conduct baseline indoor air quality testing, as required by the targeted rating system.",
]

[[section.part3]]
title = "ENVELOPE AIR-LEAKAGE TESTING"
items = [
  "Test building envelope air leakage according to ASTM E779 or ASTM E3158, as applicable, and as required by the energy code adopted by {jurisdiction}.",
  "Correct air-leakage paths identified by testing and retest until results comply with requirements.",
]
