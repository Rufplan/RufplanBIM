[[section]]
number = "01 25 00"
title = "SUBSTITUTION PROCEDURES"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for substitutions made after award of the Contract.",
  "Related Requirements:",
  ">Document 00 21 13 \"Instructions to Bidders\" for substitutions requested during the bidding period.",
  ">Section 01 60 00 \"Product Requirements\" for requirements for submitting comparable product submittals for products by listed manufacturers.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Substitutions: Changes in products, materials, equipment and methods of construction from those required by the Contract Documents and proposed by Contractor.",
  ">Substitutions for Cause: Changes proposed by Contractor that are required because of unavailability of a specified product, regulatory changes or other circumstances beyond Contractor's control.",
  ">Substitutions for Convenience: Changes proposed by Contractor or Owner that are not required to meet other Project requirements but may offer an advantage to Contractor or Owner.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Substitution Requests: Submit one electronic copy of each request for consideration, using Document 00 43 25 \"Substitution Request Form.\" Identify the product or fabrication or installation method to be replaced. Include Specification Section number and title and Drawing numbers and titles.",
  "Documentation: Show compliance with requirements for substitutions and the following, as applicable:",
  ">Statement indicating why the specified product or method cannot be provided, if applicable.",
  ">Coordination of information, including a list of changes needed to other parts of the Work and to construction performed by Owner and separate contractors.",
  ">Detailed comparison of significant qualities of the proposed substitution with those of the specified product, including performance, weight, size, durability, visual effect and sustainable design characteristics.",
  ">Product data, including drawings and descriptions of products and fabrication and installation procedures.",
  ">Samples, where applicable or requested.",
  ">Certificates and qualification data, where applicable or requested.",
  ">List of similar installations for completed projects, with project names and addresses and names and addresses of architects and owners.",
  ">Material test reports from a qualified testing agency indicating and interpreting test results for compliance with requirements.",
  ">Research reports evidencing compliance with the building code in effect for the Project, from ICC-ES.",
  ">Detailed comparison of Contractor's construction schedule using the proposed substitution with products specified, indicating the effect on Substantial Completion.",
  ">Cost information, including a proposal of change, if any, in the Contract Sum.",
  ">Contractor's certification that the proposed substitution complies with requirements in the Contract Documents except as indicated, and is appropriate for the applications indicated.",
  ">Contractor's waiver of rights to additional payment or time that may subsequently become necessary because of failure of the proposed substitution to produce indicated results.",
  "Architect's Action: If necessary, Architect will request additional information within seven days of receipt of a request. Architect will notify Contractor of acceptance or rejection of the proposed substitution within 15 days of receipt of the request, or seven days of receipt of additional information, whichever is later.",
  ">Forms of Acceptance: Change Order, Construction Change Directive or Architect's Supplemental Instructions for minor changes in the Work.",
  ">Use the specified product if Architect does not issue a decision on use of a proposed substitution within the time allocated.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Compatibility of Substitutions: Investigate and document compatibility of the proposed substitution with related products and materials. Engage a qualified testing agency to perform compatibility tests recommended by manufacturers.",
]

[[section.part1]]
title = "PROCEDURES"
items = [
  "Coordination: Revise or adjust affected work as necessary to integrate work of the approved substitutions.",
]

[[section.part2]]
title = "SUBSTITUTIONS"
items = [
  "Substitutions for Cause: Submit requests for substitution immediately on discovery of need for change, but not later than 15 days prior to the time required for preparation and review of related submittals.",
  ">Architect will consider Contractor's request for substitution when the following conditions are satisfied:",
  ">>Requested substitution is consistent with the Contract Documents and will produce indicated results.",
  ">>Requested substitution provides sustainable design characteristics that equal or exceed those specified.",
  ">>Substitution request is fully documented and properly submitted.",
  ">>Requested substitution will not adversely affect Contractor's construction schedule.",
  ">>Requested substitution has received necessary approvals of authorities having jurisdiction.",
  ">>Requested substitution is compatible with other portions of the Work and has been coordinated with other portions of the Work.",
  ">>Requested substitution provides specified warranty.",
  "Substitutions for Convenience: Architect will consider requests for substitution only if submitted within 60 days after the Notice to Proceed, and only when the conditions above are satisfied and the substitution offers Owner a substantial advantage in cost, time, energy conservation or other considerations, after deducting additional responsibilities Owner must assume.",
]

[[section.part3]]
title = "EXECUTION"
items = ["Not Used."]

[[section]]
number = "01 26 00"
title = "CONTRACT MODIFICATION PROCEDURES"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for handling and processing Contract modifications.",
  "Related Requirements:",
  ">Section 01 21 00 \"Allowances\" for procedural requirements for handling and processing allowances.",
  ">Section 01 25 00 \"Substitution Procedures\" for administrative procedures for handling requests for substitutions made after award of the Contract.",
]

[[section.part1]]
title = "MINOR CHANGES IN THE WORK"
items = [
  "Architect will issue supplemental instructions authorizing minor changes in the Work, not involving adjustment to the Contract Sum or the Contract Time, on AIA Document G710, Architect's Supplemental Instructions.",
]

[[section.part1]]
title = "PROPOSAL REQUESTS"
items = [
  "Owner-Initiated Proposal Requests: Architect will issue a detailed description of proposed changes in the Work that may require adjustment to the Contract Sum or the Contract Time. If necessary, the description will include supplemental or revised Drawings and Specifications.",
  ">Work Change Proposal Requests issued by Architect are not instructions either to stop work in progress or to execute the proposed change.",
  ">Within 20 days after receipt of a Proposal Request, submit a quotation estimating cost adjustments to the Contract Sum and the Contract Time necessary to execute the change.",
  ">>Include a list of quantities of products required or eliminated and unit costs, with total amount of purchases and credits to be made.",
  ">>Indicate applicable taxes, delivery charges, equipment rental and amounts of trade discounts.",
  ">>Include costs of labor and supervision directly attributable to the change.",
  ">>Include an updated construction schedule that indicates the effect of the change, including changes in activity duration, start and finish times, and activity relationship.",
  "Contractor-Initiated Proposals: If latent or changed conditions require modifications to the Contract, Contractor may initiate a claim by submitting a request for a change to Architect.",
  ">Include a statement outlining reasons for the change and the effect of the change on the Work. Provide a complete description of the proposed change. Indicate the effect of the proposed change on the Contract Sum and the Contract Time.",
  ">Include costs of labor, materials and supervision, with the same breakdown required for Owner-initiated proposals.",
  ">Comply with requirements in Section 01 25 00 \"Substitution Procedures\" if the proposed change requires substitution of one product or system for another.",
]

[[section.part1]]
title = "ADMINISTRATIVE CHANGE ORDERS"
items = [
  "Allowance Adjustment: See Section 01 21 00 \"Allowances\" for administrative procedures for preparation of Change Order Proposals for adjusting the Contract Sum to reflect actual costs of allowances.",
]

[[section.part1]]
title = "CHANGE ORDER PROCEDURES"
items = [
  "On Owner's approval of a Work Change Proposal, Architect will issue a Change Order for signatures of Owner and Contractor on AIA Document G701.",
]

[[section.part1]]
title = "CONSTRUCTION CHANGE DIRECTIVE"
items = [
  "Construction Change Directive: Architect may issue a Construction Change Directive on AIA Document G714. Construction Change Directive instructs Contractor to proceed with a change in the Work, for subsequent inclusion in a Change Order.",
  ">Construction Change Directive contains a complete description of change in the Work. It also designates method to be followed to determine change in the Contract Sum or the Contract Time.",
  "Documentation: Maintain detailed records on a time and material basis of work required by the Construction Change Directive.",
  ">After completion of change, submit an itemized account and supporting data necessary to substantiate cost and time adjustments to the Contract.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "EXECUTION"
items = ["Not Used."]

[[section]]
number = "01 29 00"
title = "PAYMENT PROCEDURES"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements necessary to prepare and process Applications for Payment.",
  "Related Requirements:",
  ">Section 01 26 00 \"Contract Modification Procedures\" for administrative procedures for handling changes to the Contract.",
  ">Section 01 32 00 \"Construction Progress Documentation\" for administrative requirements governing the preparation and submittal of the Contractor's construction schedule.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Schedule of Values: A statement furnished by Contractor allocating portions of the Contract Sum to various portions of the Work and used as the basis for reviewing Contractor's Applications for Payment.",
]

[[section.part1]]
title = "SCHEDULE OF VALUES"
items = [
  "Coordination: Coordinate preparation of the schedule of values with preparation of Contractor's construction schedule.",
  ">Correlate line items in the schedule of values with other required administrative forms and schedules, including the Application for Payment forms, the list of subcontractors and the submittal schedule.",
  ">Submit the schedule of values to Architect at earliest possible date, but no later than seven days before the date scheduled for submittal of initial Applications for Payment.",
  "Format and Content: Use Project Manual table of contents as a guide to establish line items for the schedule of values. Provide at least one line item for each Specification Section.",
  ">Arrange schedule of values consistent with format of AIA Document G703.",
  ">Provide a breakdown of the Contract Sum in enough detail to facilitate continued evaluation of Applications for Payment and progress reports. Break principal subcontract amounts down into several line items.",
  ">Include separate line items under Contractor and principal subcontracts for Project closeout requirements, in an amount totaling 5 percent of the Contract Sum.",
  ">Show line-item value of each allowance as a separate line item.",
  ">Round amounts to nearest whole dollar; total shall equal the Contract Sum.",
  ">Update and resubmit the schedule of values before the next Application for Payment when Change Orders or Construction Change Directives result in a change in the Contract Sum.",
]

[[section.part1]]
title = "APPLICATIONS FOR PAYMENT"
items = [
  "Each Application for Payment following the initial Application for Payment shall be consistent with previous applications and payments as certified by Architect and paid for by Owner.",
  ">Initial Application for Payment, Application for Payment at time of Substantial Completion, and final Application for Payment involve additional requirements.",
  "Payment Application Times: Submit Application for Payment to Architect by the 25th of the month. The period covered by each Application for Payment is one month, ending on the last day of the month.",
  "Application for Payment Forms: Use AIA Document G702 and AIA Document G703 as the form for Applications for Payment.",
  "Application Preparation: Complete every entry on form. Notarize and execute by a person authorized to sign legal documents on behalf of Contractor. Architect will return incomplete applications without action.",
  ">Entries shall match data on the schedule of values and Contractor's construction schedule. Use updated schedules if revisions were made.",
  ">Include amounts for work completed following previous Application for Payment, whether or not payment has been received. Include only amounts for work completed at time of Application for Payment.",
  ">Include amounts of Change Orders and Construction Change Directives issued before last day of construction period covered by application.",
  "Stored Materials: Include in Application for Payment amounts applied for materials or equipment purchased or fabricated and stored, but not yet installed. Provide certificate of insurance, evidence of transfer of title to Owner and consent of surety to payment for stored materials stored off site.",
  "Waivers of Mechanic's Lien: With each Application for Payment, submit waivers of mechanic's lien from entities lawfully entitled to file a mechanic's lien arising out of the Contract and related to the Work covered by the payment, in a form acceptable to Owner and required by the laws of {jurisdiction}.",
  "Initial Application for Payment: Administrative actions and submittals that must precede or coincide with submittal of first Application for Payment include the following:",
  ">List of subcontractors and principal suppliers.",
  ">Schedule of values.",
  ">Contractor's construction schedule (preliminary if not final).",
  ">Submittal schedule (preliminary if not final).",
  ">Copies of building permits and certificates of insurance.",
  ">Performance and payment bonds, where required.",
  "Application for Payment at Substantial Completion: After Architect issues the Certificate of Substantial Completion, submit an Application for Payment showing 100 percent completion for portion of the Work claimed as substantially complete, including a reduction of retainage as provided in the Contract.",
  "Final Payment Application: After completing Project closeout requirements, submit final Application for Payment with releases and supporting documentation not previously submitted and accepted, including the following:",
  ">Evidence of completion of Project closeout requirements.",
  ">Insurance certificates for products and completed operations where required and proof that taxes, fees and similar obligations were paid.",
  ">Updated final statement, accounting for final changes to the Contract Sum.",
  ">AIA Document G706, Contractor's Affidavit of Payment of Debts and Claims.",
  ">AIA Document G706A, Contractor's Affidavit of Release of Liens.",
  ">AIA Document G707, Consent of Surety to Final Payment, where bonds are required.",
  ">Evidence that claims have been settled.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "EXECUTION"
items = ["Not Used."]

[[section]]
number = "01 31 00"
title = "PROJECT MANAGEMENT AND COORDINATION"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative provisions for coordinating construction operations on the Project, including the following:",
  ">General coordination procedures.",
  ">Coordination drawings and building information modeling.",
  ">Requests for Information (RFIs).",
  ">Digital project management procedures.",
  ">Project meetings.",
  "Related Requirements:",
  ">Section 01 32 00 \"Construction Progress Documentation\" for preparing and submitting the construction schedule.",
  ">Section 01 73 00 \"Execution\" for procedures for coordinating field engineering with other construction activities.",
  ">Section 01 77 00 \"Closeout Procedures\" for coordinating closeout of the Contract.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Subcontract List: Prepare a written summary identifying individuals or firms proposed for each portion of the Work, including those who are to furnish products or equipment fabricated to a special design. Include name, address, telephone number and email address of the entity performing the subcontract or supplying products, and the number and title of the related Specification Section.",
  "Key Personnel Names: Within 15 days of starting construction operations, submit a list of key personnel assignments, including superintendent and other personnel in attendance at the Project site. Identify individuals and their duties and responsibilities; list addresses, cellular telephone numbers and email addresses.",
]

[[section.part1]]
title = "GENERAL COORDINATION PROCEDURES"
items = [
  "Coordination: Coordinate construction operations included in different Sections of the Specifications to ensure efficient and orderly installation of each part of the Work. Coordinate construction operations that depend on each other for proper installation, connection and operation.",
  ">Schedule construction operations in sequence required to obtain the best results, where installation of one part of the Work depends on installation of other components.",
  ">Coordinate installation of different components to ensure maximum performance and efficient installation.",
  ">Make adequate provisions to accommodate items scheduled for later installation.",
  "Prepare memoranda for distribution to each party involved, outlining special procedures required for coordination. Include such items as required notices, reports and list of attendees at meetings.",
  "Conservation: Coordinate construction activities to ensure that operations are carried out with consideration given to conservation of energy, water and materials, and to salvage of materials and equipment involved in performance of, but not actually incorporated into, the Work.",
]

[[section.part1]]
title = "COORDINATION DRAWINGS"
items = [
  "Coordination Drawings: Prepare coordination drawings where careful coordination is needed for installation of products and materials fabricated by separate entities, and where limited space availability requires maximum utilization of space for efficient installation of different components.",
  ">Content: Project-specific information, drawn accurately to a scale not less than 1/4 inch per foot. Include plans, sections and elevations showing the following:",
  ">>Structural members, ductwork, piping, conduit and equipment above ceilings, with required clearances and access.",
  ">>Locations of ceiling-mounted items, including lighting fixtures, diffusers, sprinkler heads and access panels.",
  ">>Penetrations of fire-rated assemblies.",
  "Building Information Model: Contractor may use the Architect's model, where furnished, as the basis for a coordination model. Perform clash detection among trades and resolve conflicts before fabrication. The model remains a reference and does not modify the Contract Documents.",
]

[[section.part1]]
title = "REQUESTS FOR INFORMATION (RFIS)"
items = [
  "General: Immediately on discovery of the need for additional information, clarification or interpretation of the Contract Documents, Contractor shall prepare and submit an RFI in the form specified.",
  ">Architect will return without response those RFIs submitted to Architect by other entities controlled by Contractor.",
  ">Coordinate and submit RFIs in a prompt manner so as to avoid delays in Contractor's work or work of subcontractors.",
  "Content of the RFI: Include a detailed, legible description of item needing information or interpretation and the following:",
  ">Project name and number, date, and name of Contractor.",
  ">RFI number, numbered sequentially.",
  ">RFI subject, and Specification Section number, title and related paragraphs, as appropriate.",
  ">Drawing number and detail references, as appropriate.",
  ">Field dimensions and conditions, as appropriate.",
  ">Contractor's suggested resolution. If Contractor's suggested resolution impacts the Contract Time or the Contract Sum, Contractor shall state impact in the RFI.",
  "Architect's Action: Architect will review each RFI, determine action required, and respond. Allow seven working days for Architect's response for each RFI. RFIs received by Architect after 1:00 p.m. will be considered as received the following working day.",
  ">If Contractor believes the RFI response warrants change in the Contract Time or the Contract Sum, notify Architect in writing within ten days of receipt of the RFI response.",
  "RFI Log: Prepare, maintain and submit a tabular log of RFIs organized by the RFI number. Submit log weekly.",
]

[[section.part1]]
title = "DIGITAL PROJECT MANAGEMENT PROCEDURES"
items = [
  "Use of Architect's Digital Data Files: Digital data files of Architect's model and drawings will be provided by Architect for Contractor's use during construction, subject to execution of Architect's standard form of data licensing agreement.",
  ">Digital data files may be used by Contractor in preparing coordination drawings, Shop Drawings and Project record drawings.",
  ">Architect makes no representations as to the accuracy or completeness of digital data files as they relate to Contract Drawings.",
  "Web-Based Project Management: Use a web-based project management platform accessible to Owner, Architect and Contractor for exchange of RFIs, submittals, meeting minutes and other Project documents. At closeout, provide Owner with a complete archive in a portable format.",
]

[[section.part1]]
title = "PROJECT MEETINGS"
items = [
  "General: Schedule and conduct meetings and conferences at Project site unless otherwise indicated. Inform participants and others involved of the date and time of each meeting. Record minutes and distribute them within three days of the meeting.",
  "Preconstruction Conference: Architect will schedule and conduct a preconstruction conference before starting construction, at a time convenient to Owner and Architect, but no later than 15 days after execution of the Agreement.",
  ">Attendees: Authorized representatives of Owner, Architect and their consultants; Contractor and its superintendent; major subcontractors; and other concerned parties.",
  ">Agenda: Discuss tentative construction schedule, critical work sequencing, designation of key personnel, procedures for RFIs and submittals, preparation of record documents, use of the premises, work restrictions, safety and security, and responsibility for temporary facilities and controls.",
  "Preinstallation Conferences: Conduct a preinstallation conference at the Project site before each construction activity when required by other Sections and when required for coordination with other construction.",
  "Progress Meetings: Conduct progress meetings at weekly intervals. Review items of significance that could affect progress, including status of the construction schedule, submittals, RFIs, deliveries, off-site fabrication, site use, temporary facilities, quality and safety, and changes in the Work.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "EXECUTION"
items = ["Not Used."]

[[section]]
number = "01 32 00"
title = "CONSTRUCTION PROGRESS DOCUMENTATION"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for documenting the progress of construction during performance of the Work, including the following:",
  ">Contractor's construction schedule.",
  ">Construction schedule updating reports.",
  ">Daily construction reports.",
  ">Material location reports.",
  ">Site condition reports.",
  ">Construction photographs.",
  "Related Requirements:",
  ">Section 01 33 00 \"Submittal Procedures\" for submitting schedules and reports.",
  ">Section 01 40 00 \"Quality Requirements\" for submitting a schedule of tests and inspections.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Activity: A discrete part of a project that can be identified for planning, scheduling, monitoring and controlling the construction project. Activities included in a construction schedule consume time and resources.",
  "Critical Path: The longest connected chain of interdependent activities through the network schedule that establishes the minimum overall Project duration.",
  "Float: The measure of leeway in starting and completing an activity. Float time is not for exclusive use or benefit of either Owner or Contractor, but is a jointly owned, expiring Project resource available to both parties as needed to meet schedule milestones and Contract completion date.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Format for Submittals: Submit required submittals in PDF format, and in the native format of the scheduling software.",
  "Startup construction schedule: Submit within seven days of the Notice to Proceed.",
  "Contractor's Construction Schedule: Submit initial schedule, large enough to show entire schedule for entire construction period, within 30 days of the Notice to Proceed.",
  "Daily Construction Reports: Submit weekly, compiled for the preceding week.",
  "Site Condition Reports: Submit at time of discovery of differing conditions.",
  "Construction Photographs: Submit monthly with each Application for Payment.",
]

[[section.part1]]
title = "CONTRACTOR'S CONSTRUCTION SCHEDULE, GENERAL"
items = [
  "Time Frame: Extend schedule from date established for the Notice to Proceed to date of final completion.",
  ">Contract completion date shall not be changed by submission of a schedule that shows an early completion date, unless specifically authorized by Change Order.",
  "Activities: Treat each story or separate area as a separate numbered activity for each main element of the Work. Comply with the following:",
  ">Activity Duration: Define activities so no activity is longer than 20 days, unless specifically allowed by Architect.",
  ">Procurement Activities: Include procurement process activities for long lead items and major items requiring a cycle of more than 60 days, as separate activities in the schedule.",
  ">Submittal Review Time: Include review and resubmittal times indicated in Section 01 33 00 \"Submittal Procedures\" in schedule. Coordinate submittal review times in Contractor's construction schedule with submittal schedule.",
  ">Startup and Testing Time: Include no fewer than 15 days for startup and testing.",
  ">Substantial Completion: Indicate completion in advance of date established for Substantial Completion, and allow time for Architect's administrative procedures necessary for certification of Substantial Completion.",
  "Constraints: Include constraints and work restrictions indicated in the Contract Documents and as follows in schedule, and show how the sequence of the Work is affected:",
  ">Phasing and work stages, and Owner occupancy of completed portions of the Work.",
  ">Owner-furnished products, and work by separate contractors.",
  "Milestones: Include milestones indicated in the Contract Documents in schedule, including Notice to Proceed, Substantial Completion and final completion.",
  "Recovery Schedule: When periodic update indicates the Work is 14 or more calendar days behind the current approved schedule, submit a separate recovery schedule indicating means by which Contractor intends to regain compliance with the schedule.",
  "Computer Scheduling Software: Prepare schedules using current version of a program that has been developed specifically to manage construction schedules and can produce a critical path method (CPM) Gantt-chart schedule.",
]

[[section.part1]]
title = "REPORTS"
items = [
  "Daily Construction Reports: Prepare a daily construction report recording the following information concerning events at Project site:",
  ">List of subcontractors at Project site, and approximate count of personnel.",
  ">High and low temperatures and general weather conditions, including presence of rain or snow.",
  ">Accidents and emergency procedures.",
  ">Meetings and significant decisions, and stoppages, delays, shortages and losses.",
  ">Orders and requests of authorities having jurisdiction.",
  ">Services connected and disconnected, and equipment or system tests and startups.",
  ">Partial completions and occupancies, and Substantial Completions authorized.",
  "Site Condition Reports: Immediately on discovery of a difference between site conditions and the Contract Documents, prepare and submit a detailed report. Submit with an RFI. Include a detailed description of the differing conditions, together with recommendations for changing the Contract Documents.",
]

[[section.part1]]
title = "CONSTRUCTION PHOTOGRAPHS"
items = [
  "Digital Images: Provide digital images in JPG format, with minimum sensor size of 12 megapixels, and date and time stamped. Identify each image with Project name, location, orientation and date.",
  "Preconstruction Photographs: Before starting construction, take photographs of Project site and surrounding properties, including existing items to remain during construction, from different vantage points.",
  "Periodic Construction Photographs: Take 20 photographs monthly, coordinated with the cutoff date associated with each Application for Payment. Select vantage points to show status of construction and progress since last photographs were taken.",
  "Concealed Work Photographs: Before concealing work in walls, floors and ceilings, take photographs of framing, insulation, piping, ductwork, conduit and other concealed work.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "EXECUTION"
items = ["Not Used."]

[[section]]
number = "01 33 00"
title = "SUBMITTAL PROCEDURES"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes requirements for the submittal schedule and administrative and procedural requirements for submitting Shop Drawings, Product Data, Samples and other submittals.",
  "Related Requirements:",
  ">Section 01 29 00 \"Payment Procedures\" for submitting Applications for Payment and the schedule of values.",
  ">Section 01 32 00 \"Construction Progress Documentation\" for submitting schedules and reports, including Contractor's construction schedule.",
  ">Section 01 78 23 \"Operation and Maintenance Data\" for submitting operation and maintenance manuals.",
  ">Section 01 78 39 \"Project Record Documents\" for submitting record Drawings, record Specifications and record Product Data.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Action Submittals: Written and graphic information and physical samples that require Architect's responsive action. Action submittals are those submittals indicated in individual Specification Sections as action submittals.",
  "Informational Submittals: Written and graphic information and physical samples that do not require Architect's responsive action. Submittals may be rejected for not complying with requirements. Informational submittals are those submittals indicated in individual Specification Sections as informational submittals.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Submittal Schedule: Submit a schedule of submittals, arranged in chronological order by dates required by construction schedule. Include time required for review, ordering, manufacturing, fabrication and delivery when establishing dates.",
  ">Coordinate submittal schedule with list of subcontracts, the schedule of values and Contractor's construction schedule.",
  ">Initial Submittal: Submit concurrently with startup construction schedule.",
  ">Final Submittal: Submit concurrently with the first complete submittal of Contractor's construction schedule.",
]

[[section.part1]]
title = "SUBMITTAL ADMINISTRATIVE REQUIREMENTS"
items = [
  "Architect's Digital Data Files: Electronic copies of digital data files of the Contract Drawings will be provided by Architect for Contractor's use in preparing submittals, subject to Section 01 31 00 \"Project Management and Coordination.\"",
  "Coordination: Coordinate preparation and processing of submittals with performance of construction activities.",
  ">Coordinate each submittal with fabrication, purchasing, testing, delivery, other submittals and related activities that require sequential activity.",
  ">Submit all submittal items required for each Specification Section concurrently unless partial submittals for portions of the Work are indicated on approved submittal schedule.",
  ">Architect reserves the right to withhold action on a submittal requiring coordination with other submittals until related submittals are received.",
  "Processing Time: Allow time for submittal review, including time for resubmittals, as follows. Time for review shall commence on Architect's receipt of submittal. No extension of the Contract Time will be authorized because of failure to transmit submittals enough in advance of the Work to permit processing, including resubmittals.",
  ">Initial Review: Allow 15 days for initial review of each submittal. Allow additional time if coordination with subsequent submittals is required.",
  ">Concurrent Consultant Review: Allow 21 days for review of each submittal where the Architect's consultants must also review.",
  ">Resubmittal Review: Allow 15 days for review of each resubmittal.",
  "Electronic Submittals: Identify and incorporate information in each electronic submittal file as follows:",
  ">Assemble complete submittal package into a single indexed file incorporating submittal requirements of a single Specification Section and transmittal form with links enabling navigation to each item.",
  ">Name file with submittal number or other unique identifier, including revision identifier, such as 061000.01.A.",
  ">Provide means for insertion to permanently record Contractor's review and approval markings and action taken by Architect.",
  "Resubmittals: Make resubmittals in same form and number of copies as initial submittal. Note date and content of previous submittal, and identify changes made since previous submittal.",
  "Distribution: Furnish copies of final submittals to manufacturers, subcontractors, suppliers, fabricators, installers, authorities having jurisdiction and others as necessary for performance of construction activities.",
  "Use for Construction: Retain complete copies of submittals on Project site. Use only final action submittals that are marked with approval notation from Architect's action stamp.",
]

[[section.part2]]
title = "SUBMITTAL PROCEDURES"
items = [
  "General Submittal Procedure Requirements: Prepare and submit submittals required by individual Specification Sections.",
  ">Submit electronic submittals via email or the Project management platform as PDF electronic files.",
  ">Certificates and Certifications Submittals: Provide a statement that includes signature of entity responsible for preparing certification. Certificates and certifications shall be signed by an officer or other individual authorized to sign documents on behalf of that entity.",
  "Product Data: Collect information into a single submittal for each element of construction and type of product or equipment.",
  ">If information must be specially prepared for submittal because standard published data are unsuitable for use, submit as Shop Drawings, not as Product Data.",
  ">Mark each copy of each submittal to show which products and options are applicable.",
  ">Include manufacturer's written recommendations, product specifications, installation instructions and compliance with specified referenced standards.",
  "Shop Drawings: Prepare Project-specific information, drawn accurately to scale. Do not base Shop Drawings on reproductions of the Contract Documents or standard printed data, unless submittal based on Architect's digital data drawing files is otherwise permitted.",
  ">Include fabrication and installation drawings, dimensions, identification of products, compliance with specified standards, notation of coordination requirements and notation of dimensions established by field measurement.",
  ">Sheet Size: Except for templates, patterns and similar full-size drawings, submit Shop Drawings on sheets at least 8-1/2 by 11 inches, but no larger than 30 by 42 inches.",
  "Samples: Submit Samples for review of kind, color, pattern and texture for a check of these characteristics with other elements and for a comparison of these characteristics between submittal and actual component as delivered and installed.",
  ">Transmit Samples that contain multiple, related components such as accessories together in one submittal package.",
  ">Samples for Initial Selection: Submit manufacturer's color charts consisting of units or sections of units showing the full range of colors, textures and patterns available.",
  ">Samples for Verification: Submit full-size units or Samples of size indicated, prepared from same material to be used for the Work, cured and finished in manner specified. Submit three sets; Architect will retain two.",
  "Delegated-Design Services: Where performance and design criteria are specified for a system, provide calculations and drawings signed and sealed by a professional engineer licensed in {jurisdiction}, responsible for their preparation.",
]

[[section.part3]]
title = "CONTRACTOR'S REVIEW"
items = [
  "Action and Informational Submittals: Review each submittal and check for coordination with other Work of the Contract and for compliance with the Contract Documents. Note corrections and field dimensions. Mark with approval stamp before submitting to Architect.",
  "Project Closeout and Maintenance Material Submittals: See requirements in Section 01 77 00 \"Closeout Procedures.\"",
  "Approval Stamp: Stamp each submittal with a uniform, approval stamp. Include Project name and location, submittal number, Specification Section title and number, name of reviewer, date of Contractor's approval, and statement certifying that submittal has been reviewed, checked and approved for compliance with the Contract Documents.",
]

[[section.part3]]
title = "ARCHITECT'S ACTION"
items = [
  "Action Submittals: Architect will review each submittal, make marks to indicate corrections or revisions required, and return it. Architect will stamp each submittal with an action stamp and will mark stamp appropriately to indicate action, as follows:",
  ">No Exceptions Taken.",
  ">Exceptions Noted; Resubmittal Not Required.",
  ">Revise and Resubmit.",
  ">Rejected.",
  "Informational Submittals: Architect will review each submittal and will not return it, or will return it if it does not comply with requirements. Architect will forward each submittal to appropriate party.",
  "Incomplete submittals are unacceptable, will be considered nonresponsive, and will be returned for resubmittal without review.",
  "Submittals not required by the Contract Documents may be returned by the Architect without action.",
]

[[section]]
number = "01 40 00"
title = "QUALITY REQUIREMENTS"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section includes administrative and procedural requirements for quality assurance and quality control.",
  "Testing and inspecting services are required to verify compliance with requirements specified or indicated. These services do not relieve Contractor of responsibility for compliance with the Contract Document requirements.",
  ">Specified tests, inspections and related actions do not limit Contractor's other quality-assurance and -control procedures that facilitate compliance with the Contract Document requirements.",
  ">Requirements for Contractor to provide quality-assurance and -control services required by Architect, Owner or authorities having jurisdiction are not limited by provisions of this Section.",
  "Related Requirements:",
  ">Divisions 02 through 49 Sections for specific test and inspection requirements.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Quality-Assurance Services: Activities, actions and procedures performed before and during execution of the Work, to guard against defects and deficiencies and substantiate that proposed construction will comply with requirements.",
  "Quality-Control Services: Tests, inspections, procedures and related actions during and after execution of the Work, to evaluate that actual products incorporated into the Work and completed construction comply with requirements.",
  "Mockups: Full-size physical assemblies that are constructed on-site. Mockups are constructed to verify selections made under Sample submittals; to demonstrate aesthetic effects and qualities of materials and execution; to review coordination, testing or operation; to show interface between dissimilar materials; and to demonstrate compliance with specified installation tolerances. Mockups are not Samples. Unless otherwise indicated, approved mockups establish the standard by which the Work will be judged.",
  "Testing Agency: An entity engaged to perform specific tests, inspections or both. The term testing laboratory shall have the same meaning as the term testing agency.",
]

[[section.part1]]
title = "CONFLICTING REQUIREMENTS"
items = [
  "Referenced Standards: If compliance with two or more standards is specified and the standards establish different or conflicting requirements for minimum quantities or quality levels, comply with the most stringent requirement. Refer conflicting requirements that are different, but apparently equal, to Architect for a decision before proceeding.",
  "Minimum Quantity or Quality Levels: The quantity or quality level shown or specified shall be the minimum provided or performed. The actual installation may comply exactly with the minimum quantity or quality specified, or it may exceed the minimum within reasonable limits.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Contractor's Quality-Control Plan: For quality-assurance and quality-control activities and responsibilities.",
  "Qualification Data: For testing agencies specified in Quality Assurance article to demonstrate their capabilities and experience. Include proof of qualifications in the form of a recent report on the inspection of the testing agency by a recognized authority.",
  "Schedule of Tests and Inspections: Prepare in tabular form and include the Specification Section number and title, entity responsible for performing tests and inspections, description of test and inspection, identification of applicable standards and test method, and requirements for obtaining samples.",
]

[[section.part1]]
title = "REPORTS AND DOCUMENTS"
items = [
  "Test and Inspection Reports: Prepare and submit certified written reports specified in other Sections. Include the following:",
  ">Date of issue, Project title and number, and name, address and telephone number of testing agency.",
  ">Dates and locations of samples and tests or inspections.",
  ">Names of individuals making tests and inspections.",
  ">Description of the Work and test and inspection method, and identification of product and Specification Section.",
  ">Complete test or inspection data, test and inspection results, and interpretations of test results.",
  ">Comments or professional opinion on whether tested or inspected Work complies with the Contract Document requirements.",
  ">Name and signature of laboratory inspector, and recommendations on retesting and reinspecting.",
  "Permits, Licenses and Certificates: For Owner's records, submit copies of permits, licenses, certifications, inspection reports, releases, jurisdictional settlements, notices, receipts for fee payments, judgments and correspondence.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Manufacturer Qualifications: A firm experienced in manufacturing products or systems similar to those indicated for this Project and with a record of successful in-service performance.",
  "Fabricator and Installer Qualifications: A firm experienced in producing and installing products similar to those indicated for this Project, whose work has resulted in construction with a record of successful in-service performance.",
  "Testing Agency Qualifications: An NRTL, an NVLAP-accredited agency, or an independent agency with the experience and capability to conduct testing and inspecting indicated, as documented according to ASTM E329, and with additional qualifications specified in individual Sections.",
  "Mockups: Before installing portions of the Work requiring mockups, build mockups for each form of construction and finish required to comply with the following requirements, using materials indicated for the completed Work:",
  ">Build mockups in location and of size indicated or, if not indicated, as directed by Architect.",
  ">Notify Architect seven days in advance of dates and times when mockups will be constructed.",
  ">Obtain Architect's approval of mockups before starting corresponding work, fabrication or construction.",
  ">Maintain mockups during construction in an undisturbed condition as a standard for judging the completed Work.",
  ">Demolish and remove mockups when directed unless otherwise indicated.",
]

[[section.part1]]
title = "QUALITY CONTROL"
items = [
  "Owner Responsibilities: Where quality-control services are indicated as Owner's responsibility, Owner will engage a qualified testing agency to perform these services.",
  ">Costs for retesting and reinspecting construction that replaces or is necessitated by work that failed to comply with the Contract Documents will be charged to Contractor.",
  "Contractor Responsibilities: Tests and inspections not explicitly assigned to Owner are Contractor's responsibility. Perform additional quality-control activities required to verify that the Work complies with requirements, whether specified or not.",
  "Manufacturer's Field Services: Where indicated, engage a manufacturer's representative to observe and inspect the Work. Manufacturer's representative's services include examination of substrates and conditions, verification of materials, observation of the Work in progress, and reporting.",
  "Retesting and Reinspecting: Regardless of whether original tests or inspections were Contractor's responsibility, provide quality-control services, including retesting and reinspecting, for construction that replaced Work that failed to comply with the Contract Documents.",
  "Associated Services: Cooperate with agencies performing required tests, inspections and similar quality-control services, and provide reasonable auxiliary services as requested. Notify agency sufficiently in advance of operations to permit assignment of personnel.",
]

[[section.part1]]
title = "SPECIAL TESTS AND INSPECTIONS"
items = [
  "Special Tests and Inspections: Owner will engage a qualified special inspector to conduct special tests and inspections required by {building_code} Chapter 17 and by authorities having jurisdiction, as indicated in the Statement of Special Inspections.",
  "Contractor shall notify the special inspector and Architect not less than 48 hours before work requiring special inspection, and shall cooperate with the special inspector.",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

[[section.part3]]
title = "TEST AND INSPECTION LOG"
items = [
  "Test and Inspection Log: Prepare a record of tests and inspections. Include the date test or inspection was conducted, description of the Work tested or inspected, date test or inspection results were transmitted to Architect, and identification of testing agency or special inspector conducting test or inspection.",
  ">Maintain log at Project site. Post changes and revisions as they occur. Provide access to test and inspection log for Architect's reference during normal working hours.",
]

[[section.part3]]
title = "REPAIR AND PROTECTION"
items = [
  "General: On completion of testing, inspecting, sample taking and similar services, repair damaged construction and restore substrates and finishes.",
  ">Provide materials and comply with installation requirements specified in other Specification Sections or matching existing substrates and finishes.",
  "Protect construction exposed by or for quality-control service activities.",
  "Repair and protection are Contractor's responsibility, regardless of the assignment of responsibility for quality-control services.",
]

[[section]]
number = "01 42 00"
title = "REFERENCES"
when = ["always"]
kind = "three-part"

[[section.part1]]
title = "DEFINITIONS"
items = [
  "General: Basic Contract definitions are included in the Conditions of the Contract.",
  "Approved: When used to convey Architect's action on Contractor's submittals, applications and requests, approved is limited to Architect's duties and responsibilities as stated in the Conditions of the Contract.",
  "Directed: A command or instruction by Architect. Other terms including requested, authorized, selected, required and permitted have the same meaning as directed.",
  "Indicated: Requirements expressed by graphic representations or in written form on Drawings, in Specifications and in other Contract Documents. Other terms including shown, noted, scheduled and specified have the same meaning as indicated.",
  "Regulations: Laws, ordinances, statutes and lawful orders issued by authorities having jurisdiction, and rules, conventions and agreements within the construction industry that control performance of the Work.",
  "Furnish: Supply and deliver to Project site, ready for unloading, unpacking, assembly, installation and similar operations.",
  "Install: Operations at Project site including unloading, temporarily storing, unpacking, assembling, erecting, placing, anchoring, applying, working to dimension, finishing, curing, protecting, cleaning and similar operations.",
  "Provide: Furnish and install, complete and ready for the intended use.",
  "Project Site: Space available for performing construction activities. The extent of Project site is shown on Drawings and may or may not be identical with the description of the land on which Project is to be built.",
]

[[section.part1]]
title = "INDUSTRY STANDARDS"
items = [
  "Applicability of Standards: Unless the Contract Documents include more stringent requirements, applicable construction industry standards have the same force and effect as if bound or copied directly into the Contract Documents to the extent referenced. Such standards are made a part of the Contract Documents by reference.",
  "Publication Dates: Comply with standards in effect as of date of the Contract Documents unless otherwise indicated.",
  ">For standards referenced by applicable building codes, comply with the dates of the standards as listed in the building codes adopted by {jurisdiction}.",
  "Copies of Standards: Each entity engaged in construction on Project should be familiar with industry standards applicable to its construction activity. Copies of applicable standards are not bound with the Contract Documents.",
  ">Where copies of standards are needed to perform a required construction activity, obtain copies directly from publication source.",
]

[[section.part1]]
title = "ABBREVIATIONS AND ACRONYMS"
items = [
  "Industry Organizations: Where abbreviations and acronyms are used in Specifications or other Contract Documents, they shall mean the recognized name of the entities indicated, including the following:",
  ">AAMA: American Architectural Manufacturers Association (now part of FGIA, Fenestration and Glazing Industry Alliance).",
  ">ACI: American Concrete Institute.",
  ">AISC: American Institute of Steel Construction.",
  ">ANSI: American National Standards Institute.",
  ">ASHRAE: American Society of Heating, Refrigerating and Air-Conditioning Engineers.",
  ">ASTM: ASTM International.",
  ">AWI: Architectural Woodwork Institute.",
  ">AWS: American Welding Society.",
  ">BHMA: Builders Hardware Manufacturers Association.",
  ">GA: Gypsum Association.",
  ">ICC: International Code Council.",
  ">ICC-ES: ICC Evaluation Service.",
  ">NFPA: National Fire Protection Association.",
  ">NRCA: National Roofing Contractors Association.",
  ">SDI: Steel Door Institute.",
  ">SMACNA: Sheet Metal and Air Conditioning Contractors' National Association.",
  ">TCNA: Tile Council of North America.",
  ">UL: UL Solutions.",
  ">WDMA: Window and Door Manufacturers Association.",
  "Code Agencies: The building code for the Project is {building_code}, as adopted and amended by {jurisdiction}.",
  "Federal Government Agencies: Where abbreviations and acronyms are used, they shall mean the recognized name of the agency, including EPA (Environmental Protection Agency), OSHA (Occupational Safety and Health Administration) and DOJ (Department of Justice, for the ADA Standards for Accessible Design).",
]

[[section.part2]]
title = "PRODUCTS"
items = ["Not Used."]

