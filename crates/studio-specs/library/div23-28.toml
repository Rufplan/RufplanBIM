  "Dimmers: UL 1472, slide or paddle type, compatible with the LED drivers of the controlled fixtures, sized for the connected load; listed for the specific fixture where available.",
  "Occupancy and Vacancy Sensor Switches: Dual technology or passive infrared, wall-box type, with manual-on or auto-on to 50 percent operation as required by the energy code.",
]

[[section.part2]]
title = "WALL PLATES"
items = [
  "Finished Spaces: Smooth, high-impact nylon or polycarbonate, color to match device; stainless steel, Type 302, where indicated.",
  "Unfinished Spaces: Galvanized steel.",
  "Wet Locations: Die-cast metal, weatherproof in-use cover, listed for wet locations while in use.",
]

[[section.part2]]
title = "FINISHES"
items = [
  "Device Color: White, unless otherwise selected by the Architect; red for devices on emergency circuits; orange for isolated-ground receptacles.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Verify that boxes are installed at correct heights and are flush with finished surfaces before installing devices.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install devices plumb and level, with plates in full contact with the wall surface.",
  "Install receptacles with the grounding terminal up, unless otherwise indicated, and switches with the off position down.",
  "Install devices at mounting heights indicated or specified in Section 26 05 00 \"Common Work Results for Electrical.\"",
  "Provide dwelling-unit receptacle spacing so that no point along a wall line is more than 6 feet from a receptacle, and so that countertop spaces comply with NFPA 70.",
  "Group adjacent switches under a common multigang plate.",
  "Tighten terminals to manufacturer's torque values; do not use push-in back-wire terminals.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Test each receptacle for correct polarity, grounding, and wiring using a receptacle tester.",
  "Test GFCI and AFCI devices for proper tripping.",
  "Test dimmers and sensors through their full range; adjust sensor sensitivity and time delay.",
]

[[section.part3]]
title = "CLEANING"
items = [
