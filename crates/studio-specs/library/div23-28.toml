items = [
  "Horns and Horn/Strobes: UL 464 and UL 1971, selectable candela, synchronized, white housing with red FIRE lettering, or as required by the authority having jurisdiction.",
  "Speakers and Speaker/Strobes: UL 1480, for voice evacuation systems, with selectable taps.",
  "Exterior Alarm Bell or Horn/Strobe: Weatherproof, at the fire department connection.",
]

[[section.part2]]
title = "WIRING"
items = [
  "Fire-Alarm Cable: Type FPL, FPLR, or FPLP as appropriate to location, NFPA 70 Article 760, solid copper, red jacket, in raceway where required by the authority having jurisdiction or where exposed.",
  "Circuit Integrity Cable: CI-rated or 2-hour protected pathways where survivability is required.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Verify that approved Shop Drawings are on site and that building conditions are ready for device installation.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install system according to approved Shop Drawings, NFPA 72, and manufacturer's written instructions.",
  "Locate smoke detectors 36 inches minimum from supply air outlets and away from ceiling fans.",
  "Install visible appliances with the bottom of the lens between 80 and 96 inches above the floor, or as required by NFPA 72 for ceiling-mounted units.",
  "Coordinate device locations in finished ceilings with the Architect's reflected ceiling plans.",
  "Connect sprinkler water-flow and tamper switches, elevator recall, HVAC shutdown, smoke dampers, and door releases as indicated in the sequence of operations.",
  "Install dedicated branch circuit to the FACU with a red-marked, lockable breaker identified FIRE ALARM CIRCUIT CONTROL.",
  "Where dwelling units are included, provide smoke and carbon monoxide alarms as required by the {building_code}, interconnected and with battery backup, coordinated with the fire-alarm system where required.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Pretest the complete system and correct deficiencies before scheduling acceptance testing.",
  "Acceptance Testing: Test the system according to NFPA 72 in the presence of the authority having jurisdiction and the Owner's representative, including 100 percent of initiating devices, notification appliances, and interfaces.",
  "Measure sound pressure levels and verify intelligibility for voice systems.",
  "Submit completed Record of Completion and inspection and testing forms.",
]

[[section.part3]]
title = "DEMONSTRATION"
items = [
  "Train the Owner's personnel in operation, alarm response, and routine testing of the system, for 4 hours minimum.",
]
