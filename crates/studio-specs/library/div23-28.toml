]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install luminaires level, plumb, and aligned, according to the Architect's reflected ceiling plans and manufacturer's written instructions.",
  "Lay-In Luminaires: Support independently from structure with two wires at opposite corners minimum, and secure to ceiling grid with clips.",
  "Pendant Luminaires: Support from structure with aircraft cable or stems rated for the load; align rows.",
  "Recessed Luminaires in Fire-Rated Ceilings: Provide listed enclosures or luminaires listed for the assembly.",
