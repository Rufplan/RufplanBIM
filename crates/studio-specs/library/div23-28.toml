  ">Metal conduits, tubing, and fittings.",
  ">Nonmetallic conduits and fittings.",
  ">Surface raceways.",
  ">Outlet boxes, pull boxes, and junction boxes.",
  "Coordination with Engineer of Record: Raceway sizes and routing are indicated on the electrical Drawings prepared by the engineer of record, or, for design-build or delegated-design electrical work, by the Contractor's engineer.",
  "Related Requirements:",
  ">Section 07 84 13 \"Penetration Firestopping\" for firestopping.",
  ">Section 26 05 19 \"Low-Voltage Electrical Power Conductors and Cables\" for conductors.",
  ">Section 27 15 13 \"Communications Copper Horizontal Cabling\" for communications pathways.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For surface raceways, wireways, floor boxes, and special fittings.",
  "Shop Drawings: Layout of underground and in-slab raceways, where requested by the engineer of record.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Comply with NFPA 70 and listed and labeled products for the intended application.",
]

[[section.part2]]
title = "METAL CONDUITS AND FITTINGS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Allied Tube and Conduit; Atkore International.",
  ">Wheatland Tube; a division of Zekelman Industries.",
  ">Republic Conduit.",
  "Rigid Metal Conduit (RMC): ANSI C80.1 and UL 6, galvanized steel.",
  "Intermediate Metal Conduit (IMC): ANSI C80.6 and UL 1242.",
  "Electrical Metallic Tubing (EMT): ANSI C80.3 and UL 797, with steel set-screw or compression fittings; compression fittings in damp locations.",
  "Flexible Metal Conduit (FMC): UL 1, zinc-coated steel.",
  "Liquidtight Flexible Metal Conduit (LFMC): UL 360, with PVC jacket.",
]

[[section.part2]]
title = "NONMETALLIC CONDUITS AND FITTINGS"
items = [
  "Rigid Nonmetallic Conduit: NEMA TC 2 and UL 651, Schedule 40 PVC, and Schedule 80 PVC where exposed to physical damage.",
  "Fittings: NEMA TC 3, solvent-weld type, same manufacturer as conduit.",
  "Electrical Nonmetallic Tubing (ENT): NEMA TC 13 and UL 1653, where permitted by NFPA 70 and concealed in walls or slabs.",
]

[[section.part2]]
title = "SURFACE RACEWAYS"
items = [
  "Surface Metal Raceways: Galvanized steel with snap-on covers, factory-primed or finish selected by the Architect.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Legrand (Wiremold).",
  ">>Panduit Corp.",
  ">>Hubbell Wiring Device-Kellems.",
]

[[section.part2]]
title = "BOXES AND ENCLOSURES"
items = [
  "Outlet and Device Boxes: UL 514A, galvanized steel, 4 inches square by 2-1/8 inches deep minimum, with device rings; nonmetallic boxes (UL 514C) where permitted in wood-frame construction.",
  "Fire-Rated Walls: Listed putty pads or box inserts at boxes in rated assemblies, and 24 inches minimum horizontal separation between boxes on opposite sides of the wall.",
  "Floor Boxes: Cast-metal or stamped-steel, fully adjustable, with combination power and data compartments and finish flange as selected by the Architect.",
  "Pull and Junction Boxes: NEMA 250, Type 1 indoors, Type 3R or 4X outdoors and in wet locations, with screw covers.",
  "Exterior Boxes: Weatherproof cast-metal with in-use covers at receptacles.",
]

[[section.part3]]
title = "RACEWAY APPLICATIONS"
items = [
  "Exterior, Exposed: RMC or IMC.",
  "Underground and Below Slab: Schedule 40 PVC, transitioning to RMC or PVC-coated RMC at elbows and where emerging from grade.",
  "Interior, Concealed in Walls and Ceilings: EMT.",
  "Interior, Exposed and Subject to Damage (below 8 feet in mechanical rooms and garages): RMC or IMC.",
  "Connections to Vibrating Equipment: FMC in dry locations and LFMC in damp or wet locations, 6 feet maximum length.",
  "Minimum Raceway Size: 3/4 inch trade size, except 1/2 inch for switch legs and fixture whips where permitted.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install raceways concealed in finished spaces unless otherwise indicated, parallel and perpendicular to building lines when exposed.",
  "Keep raceways 6 inches minimum from hot-water pipes and flues, and do not route raceways in contact with ductwork.",
  "Support raceways from structure at intervals required by NFPA 70, using listed hangers and clips. Do not support from ceiling suspension wires unless separate support wires are provided and listed for the purpose.",
  "Provide pull boxes so that no run exceeds 100 feet or contains more than the equivalent of four 90-degree bends.",
  "Install a pull string in each empty raceway, with tag at each end identifying destination.",
  "Install expansion fittings at building expansion joints and in long exposed exterior runs.",
  "Seal raceways entering buildings from underground or passing between spaces of different temperature, to prevent condensation and gas migration.",
  "Install boxes plumb and flush with finished surfaces; set boxes on opposite sides of walls in separate stud cavities to limit sound transmission.",
]

[[section.part3]]
title = "PROTECTION"
items = [
  "Protect raceway openings during construction and remove debris before pulling conductors.",
]

