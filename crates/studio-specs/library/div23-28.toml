title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: Electrical contractor licensed in the Project jurisdiction, with work performed by licensed electricians or apprentices under direct supervision.",
  "Comply with NFPA 70 and with the requirements of the serving utility.",
  "Electrical Components, Devices, and Accessories: Listed and labeled for their intended location and application.",
  "Comply with NECA 1, Standard for Good Workmanship in Electrical Construction.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Store electrical equipment indoors in clean, dry spaces with uniform temperature; protect from dust, moisture, and physical damage. Energize space heaters in stored equipment where provided.",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Provide a one-year warranty on electrical workmanship and materials from the date of Substantial Completion, in addition to manufacturers' warranties specified in other Sections.",
]

[[section.part2]]
title = "SLEEVES AND SLEEVE SEALS"
items = [
  "Sleeves: Galvanized-steel pipe, Schedule 40, for penetrations of concrete and masonry; galvanized-steel sheet for penetrations of gypsum board assemblies.",
  "Sleeve Seals: Modular mechanical type with synthetic-rubber links, for penetrations of exterior and below-grade walls.",
  "Firestop Systems: Listed according to ASTM E814 or UL 1479 for the rating of the penetrated assembly.",
]

[[section.part2]]
title = "SUPPORTS AND ANCHORAGE"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Eaton (B-Line).",
  ">nVent CADDY.",
  ">Unistrut; Atkore International.",
  "Support Channel: MFMA-4, galvanized or painted steel; stainless steel in wet or corrosive locations.",
  "Anchors: Post-installed concrete anchors with ICC-ES evaluation reports for the application; do not attach to roof deck or ceiling support wires unless listed for that use.",
]

[[section.part2]]
title = "IDENTIFICATION"
items = [
  "Equipment Nameplates: Engraved laminated plastic, white letters on black background (red background for emergency systems), 3/8 inch high letters, indicating equipment designation, voltage, and source.",
  "Arc-Flash Warning Labels: Complying with NFPA 70E and ANSI Z535.4, indicating incident energy and required PPE where a study is provided.",
  "Raceway and Cable Labels: Color-coded bands or self-adhesive labels for medium-voltage, emergency, fire alarm, and communications raceways.",
  "Conductor Identification: Color coding as specified in Section 26 05 19 \"Low-Voltage Electrical Power Conductors and Cables.\"",
  "Device Labels: Machine-printed labels on device plates indicating panel and circuit number, where indicated.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine areas and conditions for compliance with requirements for installation clearances and structural support before starting work.",
  "Coordinate the service entrance, meter location, and transformer pad with the serving utility before rough-in.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Install electrical work according to NFPA 70, NECA 1, manufacturers' written instructions, and the approved coordination drawings.",
  "Maintain working space in front of and around electrical equipment as required by NFPA 70, and keep dedicated equipment space above panelboards and switchboards free of piping and ducts.",
  "Coordinate device mounting heights with architectural elevations and casework; where not indicated, mount as follows:",
  ">Receptacles: 18 inches above finished floor to center, and 6 inches above countertops and backsplashes.",
  ">Wall Switches: 48 inches above finished floor to center.",
  ">Accessible controls and outlets: Within reach ranges of ICC A117.1.",
  "Do not cut or notch structural members without written approval from the structural engineer.",
  "Install sleeves at penetrations of walls, floors, and roofs; seal with sleeve seals at exterior walls and firestop at rated assemblies.",
]

[[section.part3]]
title = "EQUIPMENT CONNECTIONS"
items = [
  "Provide power wiring, disconnects, and final connections to equipment furnished under other Sections and by the Owner, verifying nameplate ratings before connection.",
  "Install control wiring for HVAC equipment where indicated on the electrical Drawings; coordinate responsibility with Division 23.",
]

[[section.part3]]
title = "IDENTIFICATION"
items = [
  "Install nameplates on switchboards, panelboards, transformers, disconnect switches, and motor controllers.",
  "Install typed panel directories identifying each circuit by load and room, using final room names and numbers.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Test electrical systems according to NETA ATS where required by the engineer of record, and as required in individual Division 26 Sections.",
  "Correct deficiencies and retest. Obtain final inspection approval from the authority having jurisdiction.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Clean interiors of electrical equipment of dust, debris, and paint before energizing; touch up damaged factory finishes.",
]

[[section]]
number = "26 05 19"
title = "LOW-VOLTAGE ELECTRICAL POWER CONDUCTORS AND CABLES"
when = ["electrical"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Building wire and cable rated 600 V and less.",
  ">Metal-clad cable (Type MC) and nonmetallic-sheathed cable (Type NM), where permitted.",
  ">Connectors, splices, and terminations.",
  "Coordination with Engineer of Record: Conductor sizes, circuiting, and feeder routing are indicated on the electrical Drawings prepared by the engineer of record, or, for design-build or delegated-design electrical work, by the Contractor's engineer.",
  "Related Requirements:",
  ">Section 26 05 26 \"Grounding and Bonding for Electrical Systems\" for grounding conductors.",
  ">Section 26 05 33 \"Raceways and Boxes for Electrical Systems\" for raceways.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of conductor, cable, and connector.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Field Quality-Control Reports: Insulation-resistance test results for feeders.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Conductors and cables shall be listed and labeled according to UL 83, UL 44, UL 1569 (Type MC), or UL 719 (Type NM), as applicable.",
  "Comply with NFPA 70 for ampacity, derating, and permitted uses.",
]

[[section.part2]]
title = "CONDUCTORS AND CABLES"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Southwire Company, LLC.",
  ">Encore Wire Corporation.",
  ">Cerro Wire LLC.",
  ">AFC Cable Systems; Atkore International (Type MC).",
  "Conductor Material: Copper, complying with ASTM B3 and ASTM B8; solid for No. 10 AWG and smaller, stranded for No. 8 AWG and larger. Aluminum feeders, where permitted by the engineer of record, shall be AA-8000 series alloy, No. 1/0 AWG and larger only.",
  "Insulation: Type THHN/THWN-2 in raceways; Type XHHW-2 for feeders and service entrance conductors where indicated.",
  "Minimum Size: No. 12 AWG for branch circuits; No. 14 AWG for control circuits.",
  "Type MC Cable: Copper conductors with insulated grounding conductor, interlocking aluminum armor.",
  "Type NM Cable: Copper, where permitted by NFPA 70 and the authority having jurisdiction, generally limited to one- and two-family dwellings and wood-frame construction.",
]

[[section.part2]]
title = "CONNECTORS AND SPLICES"
items = [
  "Connectors: UL 486A-486B, copper compression or mechanical type rated for the conductor material and temperature.",
  "Twist-On Connectors: UL 486C, for No. 10 AWG and smaller.",
  "Push-in and lever connectors: Listed for the application, where acceptable to the authority having jurisdiction.",
]

[[section.part2]]
title = "COLOR CODING"
items = [
  "208Y/120 V and 120/240 V systems: Phase A black, Phase B red, Phase C blue, neutral white, ground green.",
  "480Y/277 V systems: Phase A brown, Phase B orange, Phase C yellow, neutral gray, ground green.",
  "Use colored insulation for No. 10 AWG and smaller; colored tape at terminations for larger conductors.",
]

[[section.part3]]
title = "CONDUCTOR AND CABLE APPLICATIONS"
items = [
  "Service Entrance and Feeders: Single conductors in raceway.",
  "Branch Circuits Concealed in Walls and Ceilings: Single conductors in raceway or Type MC cable where permitted.",
  "Exposed Branch Circuits and Circuits in Mechanical and Electrical Rooms: Single conductors in raceway.",
  "Branch Circuits in Wood-Frame Dwellings: Type NM cable where permitted.",
  "Underground and in Slab: Single conductors in raceway, Type THWN-2 or XHHW-2.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install conductors according to NECA 1 and manufacturer's written instructions; do not exceed manufacturer's pulling tension and bending-radius limits.",
  "Pull conductors into raceways simultaneously where more than one is in the same raceway, using listed pulling lubricant.",
  "Provide a dedicated neutral for each branch circuit where required by NFPA 70 or indicated; do not share neutrals on AFCI- or GFCI-protected circuits.",
  "Support cables at intervals required by NFPA 70; do not support from ceiling grid wires or ductwork.",
  "Increase conductor size for voltage drop where branch circuits exceed 100 feet at 120 V, to limit voltage drop to 3 percent on branch circuits and 5 percent total.",
]

[[section.part3]]
title = "CONNECTIONS"
items = [
  "Tighten connectors and terminals to manufacturer's torque values using a calibrated torque tool.",
  "Leave 6 inches minimum of free conductor at each outlet and junction box.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Test feeders and service conductors for insulation resistance using a 1000 V dc megohmmeter; minimum acceptable reading 100 megohms.",
  "Verify continuity and correct phasing of each circuit; replace failed conductors and retest.",
]

[[section]]
number = "26 05 26"
title = "GROUNDING AND BONDING FOR ELECTRICAL SYSTEMS"
when = ["electrical"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Grounding electrode system, including concrete-encased electrodes, ground rods, and water-pipe connections.",
  ">Equipment grounding and bonding conductors.",
  ">Bonding of metallic piping, structural steel, and communications systems.",
  "Coordination with Engineer of Record: Grounding system requirements are indicated on the electrical Drawings prepared by the engineer of record, or, for design-build or delegated-design electrical work, by the Contractor's engineer.",
  "Related Requirements:",
  ">Section 03 30 00 \"Cast-in-Place Concrete\" for coordination of concrete-encased electrodes in footings.",
  ">Section 26 05 19 \"Low-Voltage Electrical Power Conductors and Cables\" for conductors.",
  ">Section 27 15 13 \"Communications Copper Horizontal Cabling\" for the telecommunications bonding backbone.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of grounding product.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Field Quality-Control Reports: Ground resistance test results.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Comply with NFPA 70, Article 250, and with UL 467 for grounding and bonding equipment.",
  "Telecommunications Bonding: Comply with TIA-607 where communications systems are included.",
]

[[section.part2]]
title = "MANUFACTURERS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">ERICO; a brand of nVent.",
  ">Burndy LLC; a Hubbell company.",
  ">Harger, Inc.",
  ">Thomas and Betts; ABB.",
]

[[section.part2]]
title = "CONDUCTORS"
items = [
  "Equipment Grounding Conductors: Insulated copper, green, sized according to NFPA 70 unless larger sizes are indicated.",
  "Grounding Electrode Conductors: Bare or insulated stranded copper, sized according to NFPA 70.",
  "Bonding Jumpers: Copper, flexible where connecting to equipment subject to vibration.",
]

[[section.part2]]
title = "CONNECTORS AND ELECTRODES"
items = [
  "Connectors: Listed according to UL 467; exothermic-welded connections for below-grade and concealed connections to electrodes and structural steel, and irreversible compression connectors where exothermic welding is impractical.",
  "Ground Rods: Copper-clad steel, 3/4 inch diameter by 10 feet long.",
  "Ground Bars: Copper, 1/4 by 4 inches minimum, with insulated standoffs, in electrical and telecommunications rooms.",
  "Water-Pipe Clamps: Bronze, listed for direct burial where applicable.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Grounding Electrode System: Bond together all electrodes present at the building, including metal underground water pipe, concrete-encased electrode (not less than 20 feet of bare copper conductor or footing reinforcing), ground rods, and structural steel, according to NFPA 70.",
  "Concrete-Encased Electrode: Coordinate with the concrete installer; install before concrete placement and extend conductor to accessible point.",
  "Ground Rods: Drive to full depth with top 6 inches below finished grade; where supplemental rods are required, space not less than 6 feet apart.",
  "Service Bonding: Install main bonding jumper at service equipment only; isolate neutrals from ground at downstream panelboards.",
  "Equipment Grounding: Install an insulated equipment grounding conductor in every feeder and branch-circuit raceway; do not rely on raceway alone.",
  "Piping Bonding: Bond interior metal water piping, gas piping, and other metal piping systems as required by NFPA 70.",
  "Telecommunications: Provide a primary bonding busbar at the entrance facility, bonded to the service ground with a conductor sized according to TIA-607.",
  "Separately Derived Systems: Ground transformers and generators as separately derived systems where indicated.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Test the grounding electrode system using the fall-of-potential method according to IEEE 81 before connecting to the service.",
  "Maximum Resistance: 25 ohms for a single rod electrode; 5 ohms where indicated for commercial service or telecommunications. Where values are exceeded, install additional electrodes and notify the Architect.",
  "Inspect connections and verify tightness before concealment.",
]

