  ">Lutron Electronics Co., Inc.",
  ">Legrand (Wattstopper).",
  ">Leviton Manufacturing Co., Inc.",
  "Occupancy and Vacancy Sensors: Passive infrared, ultrasonic, or dual technology, ceiling or wall mounted, with coverage patterns suited to the space.",
  "Daylight Sensors: Closed-loop photosensors with continuous dimming in daylight zones.",
  "Networked Controls: Where indicated, a networked lighting control system with luminaire-level or zone-level control, time scheduling, and BACnet interface.",
  "Emergency Bypass: UL 924 emergency lighting control relays where emergency luminaires are on controlled circuits.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
