# Division 23 - HVAC, Division 26 - Electrical, Division 27 - Communications,
# Division 28 - Electronic Safety and Security. Outline-level engineering sections issued by
# the Architect; coordinate with the engineer of record's drawings and specifications.

[[section]]
number = "23 05 00"
title = "COMMON WORK RESULTS FOR HVAC"
when = ["hvac"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">General requirements common to HVAC work.",
  ">Pipe and duct sleeves, escutcheons, and sleeve seals.",
  ">Equipment supports, hangers, and bases.",
  ">Vibration isolation for rotating equipment.",
  ">Identification of HVAC piping, ductwork, valves, and equipment.",
  ">Access doors for concealed HVAC components.",
  "Coordination with Engineer of Record: This Section is an outline-level requirement issued with the architectural documents. HVAC systems are indicated on the mechanical Drawings prepared by the engineer of record, whose drawings, schedules, and notes govern system layout, capacities, and sizes. Where the mechanical work is procured as design-build or delegated design, the Contractor's mechanical engineer shall prepare and seal the design documents in compliance with these requirements and the {building_code} as adopted by {jurisdiction}.",
  "Related Requirements:",
  ">Section 07 84 13 \"Penetration Firestopping\" for firestopping at rated assemblies.",
  ">Section 09 91 13 \"Exterior Painting\" and Section 09 91 23 \"Interior Painting\" for field painting of exposed piping, ductwork, and supports.",
  ">Section 23 05 93 \"Testing, Adjusting, and Balancing for HVAC\" for system balancing.",
  ">Division 26 Sections for power wiring to HVAC equipment.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "Exposed: Visible from occupied spaces, including mechanical rooms and garages, or exposed to weather.",
  "Concealed: Located in shafts, above ceilings, in chases, or within construction and not visible from occupied spaces.",
  "Engineer of Record: The registered professional engineer responsible for the design of the HVAC systems indicated on the Drawings or, for delegated design, the Contractor's engineer.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of product, including hangers, sleeves, sleeve seals, vibration isolators, identification products, and access doors.",
  "Shop Drawings: Coordinated HVAC layout drawings at 1/4 inch = 1 foot scale showing ductwork, piping, equipment, and clearances, coordinated with structure, plumbing, fire protection, electrical, and ceiling systems.",
  "Delegated-Design Submittal: Where HVAC design is delegated, submit drawings, calculations, and equipment schedules signed and sealed by a professional engineer licensed in the state of the Project.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Seismic and Wind Restraint Calculations: Where required by the {building_code}, signed and sealed by a qualified professional engineer.",
  "Heating and cooling load calculations and equipment selections, where HVAC design is delegated.",
  "Energy code compliance documentation for HVAC systems, in the format required by the authority having jurisdiction.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Operation and Maintenance Data: For HVAC equipment and controls, organized by system, including filter sizes, lubrication schedules, and parts lists.",
  "Record Drawings: Mechanical Drawings marked to show actual routing and locations of concealed ductwork, piping, dampers, valves, and access doors.",
  "Warranty documentation for all HVAC equipment.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: A licensed mechanical contractor experienced in installing HVAC systems of the type and scale indicated.",
  "Comply with the International Mechanical Code and International Energy Conservation Code as adopted by {jurisdiction}, and with NFPA 90A or NFPA 90B as applicable to the occupancy.",
  "Electrical Components: Listed and labeled as defined in NFPA 70 by a qualified testing agency, and marked for intended location and application.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver equipment with factory protection in place. Store indoors or on raised supports under weathertight covering.",
  "Protect duct and pipe openings with caps or plastic sheeting to exclude dust and debris during construction.",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Provide a one-year warranty on HVAC workmanship and materials from the date of Substantial Completion, in addition to manufacturers' equipment warranties specified in other Sections.",
]

[[section.part2]]
title = "SLEEVES, ESCUTCHEONS, AND SLEEVE SEALS"
items = [
  "Sleeves: Galvanized-steel pipe, Schedule 40, for penetrations of concrete and masonry; galvanized-steel sheet, 0.0239 inch minimum thickness, for gypsum board assemblies.",
  "Sleeve Seals: Modular mechanical type with interlocking synthetic-rubber links shaped to fill the annular space between pipe and sleeve.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Advance Products and Systems, LLC.",
  ">>GPT; a division of EnPro Industries (Link-Seal).",
  ">>Metraflex Company (The).",
  "Escutcheons: One-piece, chrome-plated or stainless-steel type with setscrew, sized to cover sleeve and opening at exposed penetrations.",
]

[[section.part2]]
title = "HANGERS AND SUPPORTS"
items = [
  "Pipe Hangers and Supports: MSS SP-58, factory-fabricated, galvanized or with manufacturer's standard corrosion-resistant finish.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Eaton (B-Line).",
  ">>Anvil International.",
  ">>nVent CADDY.",
  ">>Unistrut; Atkore International.",
  "Metal Framing Systems: MFMA-4, cold-formed steel channels with galvanized finish.",
  "Fasteners: Post-installed concrete anchors with ICC-ES evaluation reports for the application; do not use powder-actuated fasteners in lightweight concrete or for seismic restraints unless approved by the structural engineer.",
  "Equipment Supports: Structural-steel stands or curbs, designed for equipment weight and operating loads, hot-dip galvanized where exposed to weather.",
]

[[section.part2]]
title = "VIBRATION ISOLATION"
items = [
  "Isolators: Spring isolators, elastomeric pads, or hangers as scheduled, selected for 90 percent minimum isolation efficiency at the lowest operating speed of supported equipment.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Kinetics Noise Control, Inc.",
  ">>Mason Industries, Inc.",
  ">>Vibration Mountings and Controls, Inc.",
  "Flexible Connectors: At duct connections to fans and air-handling equipment, UL 214 listed fabric, 3 to 4 inches wide.",
]

[[section.part2]]
title = "IDENTIFICATION"
items = [
  "Equipment Labels: Engraved plastic laminate, 1/8 inch thick, with 1/2 inch high letters, indicating equipment tag, service, and area served.",
  "Pipe Markers: ASME A13.1, preprinted, color-coded, with flow arrows and service lettering.",
  "Duct Labels: Stenciled or self-adhesive, indicating service (supply, return, exhaust, outdoor air) and flow direction.",
  "Valve Tags: Brass, 1-1/2 inch diameter, stamped with valve number, with valve schedule mounted in the mechanical room.",
  "Ceiling Tacks: Color-coded, at lay-in ceilings below dampers, valves, and equipment requiring service.",
]

[[section.part2]]
title = "ACCESS DOORS"
items = [
  "Access Doors: Steel, flush, with concealed hinges and cam latch, sized for service of concealed equipment, minimum 12 by 12 inches for hand access and 24 by 24 inches for body access.",
  "Fire-Rated Access Doors: Listed and labeled for the rating of the assembly in which installed.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine structure, shafts, ceiling spaces, and roof openings for conditions affecting HVAC installation. Report conflicts with other trades to the Architect before proceeding.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Install HVAC work according to the approved coordination drawings, manufacturers' written instructions, and the engineer of record's details.",
  "Route ductwork and piping parallel and perpendicular to building lines; conceal in finished spaces unless indicated as exposed.",
  "Maintain manufacturers' recommended service clearances and clearances required by NFPA 70 at electrical components.",
  "Do not cut or notch structural members without written approval from the structural engineer.",
  "Install sleeves at penetrations of walls, floors, and roofs; seal with sleeve seals at exterior and below-grade walls and firestop at rated assemblies.",
  "Install access doors at concealed dampers, valves, controls, and equipment requiring service. Coordinate locations with the Architect in finished spaces.",
]

[[section.part3]]
title = "EQUIPMENT SUPPORT AND ISOLATION"
items = [
  "Support equipment level and plumb on bases, stands, or hangers. Install concrete housekeeping pads 4 inches high, extending 6 inches beyond equipment on all sides, at floor-mounted equipment in mechanical rooms.",
  "Install vibration isolators and flexible connectors so that no rigid contact exists between equipment and structure.",
  "Install seismic and wind restraints where required by the {building_code}.",
]

[[section.part3]]
title = "IDENTIFICATION"
items = [
  "Label equipment, piping, and ductwork after painting. Install pipe markers at 25 feet on center maximum, at each branch, and at each side of wall penetrations.",
]

[[section.part3]]
title = "CLEANING AND PROTECTION"
items = [
  "Do not operate air-handling equipment during construction without temporary filters at returns; replace filters with clean filters before testing and balancing and again at Substantial Completion.",
  "Clean equipment, exposed piping, and ductwork of dirt, labels, and construction residue.",
]

[[section]]
number = "23 05 93"
title = "TESTING, ADJUSTING, AND BALANCING FOR HVAC"
when = ["hvac+commercial"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Testing, adjusting, and balancing (TAB) of air systems.",
  ">Testing, adjusting, and balancing of hydronic systems, where indicated.",
  ">Verification of HVAC equipment performance.",
  ">Sound and vibration measurements, where indicated.",
  "Coordination with Engineer of Record: Design airflows, water flows, and equipment capacities are indicated on the mechanical Drawings prepared by the engineer of record, or, for design-build or delegated-design HVAC work, on the Contractor's engineer's sealed documents. Balance systems to those values.",
  "Related Requirements:",
  ">Section 23 05 00 \"Common Work Results for HVAC\" for general HVAC requirements.",
  ">Section 01 91 13 \"General Commissioning Requirements\" for commissioning, where required.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "TAB: Testing, adjusting, and balancing; the process of measuring and adjusting HVAC systems to deliver design quantities.",
  "TAB Specialist: An independent entity engaged to perform TAB work.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "TAB Strategies and Procedures Plan: Within 60 days of Notice to Proceed, submit the TAB plan, instrumentation list, and sample report forms.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For the TAB specialist and TAB technicians.",
  "Instrument Calibration Reports: Showing calibration within the past 12 months.",
  "System Readiness Checklists: Completed before starting TAB.",
  "Examination Report: Listing deficiencies found that prevent proper balancing.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Final TAB Report: Certified by the TAB supervisor, including system diagrams, design and measured values for each terminal, equipment test data, and a summary of deficiencies and corrective actions.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "TAB Specialist Qualifications: Independent of the mechanical installer, and certified by one of the following:",
  ">Associated Air Balance Council (AABC).",
  ">National Environmental Balancing Bureau (NEBB).",
  ">Testing, Adjusting and Balancing Bureau (TABB).",
  "Perform TAB according to the standards of the certifying agency and ASHRAE 111, Measurement, Testing, Adjusting, and Balancing of Building HVAC Systems.",
  "TAB Report Forms: Use standard forms of the certifying agency.",
]

[[section.part1]]
title = "FIELD CONDITIONS"
items = [
  "Perform TAB with the building enclosed, ceilings installed, doors hung, and systems operating in their normal mode, with clean filters in place.",
  "Coordinate with the controls contractor for access to building automation setpoints and damper positions.",
]

[[section.part2]]
title = "PRODUCTS (NOT USED)"
items = [
  "No products are specified in this Section. TAB specialist shall furnish balancing instruments and shall provide replacement sheaves and belts through the mechanical installer where required to achieve design airflows.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Examine Contract Documents, approved submittals, and installed systems to become familiar with the Project and identify conditions that will prevent balancing.",
  "Verify that the following are complete and operational before starting TAB:",
  ">Ductwork is sealed and leakage tested as required by Section 23 31 13 \"Metal Ducts.\"",
  ">Balancing dampers, fire dampers, and smoke dampers are installed, accessible, and open.",
  ">Fans rotate in the correct direction and motors are properly aligned and lubricated.",
  ">Automatic controls are installed and calibrated.",
  ">Clean filters are installed.",
  "Report deficiencies in writing to the Contractor and Architect. Do not proceed until deficiencies are corrected.",
]

[[section.part3]]
title = "PREPARATION"
items = [
  "Prepare a TAB plan identifying systems, measurement points, and the sequence of work.",
  "Mark duct test holes, and seal them with plugs after testing.",
]

[[section.part3]]
title = "AIR-SYSTEM BALANCING"
items = [
  "Measure and adjust total airflow at each fan to within plus or minus 10 percent of design.",
  "Adjust outdoor-air quantities to within plus 10 or minus 0 percent of the design minimum outdoor air required by ASHRAE 62.1 or the mechanical code.",
  "Balance supply, return, and exhaust terminals to within plus or minus 10 percent of design airflow.",
  "Measure static pressure across fans, coils, filters, and major components; record fan speed, motor current, and voltage.",
  "Adjust fan drives and variable-frequency drive settings to obtain design airflow with the least practical static pressure; mark final damper positions.",
  "Verify building pressurization relationships indicated on the Drawings, including negative pressure at restrooms and janitor rooms.",
]

[[section.part3]]
title = "HYDRONIC-SYSTEM BALANCING"
items = [
  "Where hydronic systems are indicated, balance water flow to coils and terminals to within plus or minus 10 percent of design.",
  "Record pump heads, flows, motor data, and final valve settings.",
]

[[section.part3]]
title = "EQUIPMENT PERFORMANCE VERIFICATION"
items = [
  "Record entering and leaving air temperatures at cooling and heating coils, refrigerant-system operating data from the equipment controller, and electrical data for each unit.",
  "Verify operation of economizers, energy recovery devices, and demand-controlled ventilation sequences where provided.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Architect or engineer of record may randomly select up to 10 percent of reported measurements for verification. If more than 10 percent of verified values differ from the report by more than the tolerances above, the report will be rejected and TAB repeated at no additional cost to the Owner.",
  "Seasonal Testing: Where indicated, perform opposite-season verification within 6 months of Substantial Completion.",
]

[[section]]
number = "23 07 13"
title = "DUCT INSULATION"
when = ["hvac"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Insulation for supply, return, outdoor-air, and exhaust ductwork.",
  ">Insulation jackets, accessories, and field-applied coverings.",
  "Coordination with Engineer of Record: Duct insulation types and thicknesses are indicated on the mechanical Drawings prepared by the engineer of record, or, for design-build or delegated-design HVAC work, by the Contractor's engineer. Where not indicated, provide insulation meeting the minimum R-values required by the energy code adopted by {jurisdiction}.",
  "Related Requirements:",
  ">Section 07 84 13 \"Penetration Firestopping\" for firestopping at rated assemblies.",
  ">Section 23 31 13 \"Metal Ducts\" for duct liner.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each type of insulation, jacket, adhesive, and sealant, indicating thermal conductivity, thickness, and installed R-value.",
  "Shop Drawings: Details of insulation application at fittings, hangers, and equipment connections, where requested.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Test reports showing that insulation materials, jackets, and adhesives comply with surface-burning characteristics required below.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Surface-Burning Characteristics: Flame-spread index of 25 or less and smoke-developed index of 50 or less when tested according to ASTM E84, applied to the composite of insulation, jacket, and adhesive.",
  "Installer Qualifications: Firm specializing in mechanical insulation with a minimum of three years of experience.",
  "Comply with the North American Commercial and Industrial Insulation Standards (MICA) for application details.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver materials in original packaging marked with product name, thickness, and density. Store indoors off the floor and protect from moisture and damage.",
]

[[section.part2]]
title = "INSULATION MATERIALS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">Johns Manville.",
  ">Knauf Insulation.",
  ">Owens Corning.",
  ">CertainTeed; Saint-Gobain.",
  "Flexible Glass-Fiber Blanket Insulation (Duct Wrap): ASTM C553, Type II, with factory-applied FSK (foil-scrim-kraft) vapor-retarder jacket complying with ASTM C1136, Type II; 0.75 pcf minimum density.",
  "Rigid Glass-Fiber Board Insulation: ASTM C612, Type IA or IB, 3 pcf nominal density, with factory-applied FSK or ASJ jacket, for exposed rectangular ductwork in mechanical rooms.",
  "Flexible Elastomeric Insulation: ASTM C534, Type II sheet, closed cell, for outdoor ductwork where indicated, with UV-protective coating.",
]

[[section.part2]]
title = "INSULATION SCHEDULE"
items = [
  "Provide the following minimum installed thermal resistance unless greater values are indicated on the Drawings or required by the energy code:",
  ">Supply and return ducts in unconditioned spaces, including attics and ventilated crawlspaces: R-6 minimum; R-8 where required by the energy code.",
  ">Supply and return ducts located outdoors: R-8 minimum, with weatherproof jacket.",
  ">Outdoor-air intake ducts within conditioned space: R-6, with vapor retarder.",
  ">Exhaust ducts from exhaust fan to exterior termination, within 3 feet of the exterior wall or roof: R-6.",
  ">Supply ducts in conditioned spaces: Not required unless indicated for condensation control.",
]

[[section.part2]]
title = "ACCESSORIES"
items = [
  "Adhesives: As recommended by the insulation manufacturer, with VOC content complying with applicable limits.",
  "Vapor-Retarder Tape: FSK tape matching the facing, 3 inches wide minimum.",
  "Mechanical Fasteners: Galvanized-steel pins with self-locking washers, or adhesive-attached weld pins, of length appropriate for insulation thickness.",
  "Outdoor Jackets: Aluminum, 0.016 inch thick, ASTM B209, with factory-applied moisture barrier, or manufacturer's field-applied weatherproof membrane jacket.",
  "Corner Angles: Galvanized steel or aluminum at exposed rigid insulation corners.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Verify that ductwork has been leak tested, sealed, and cleaned before applying insulation.",
]

[[section.part3]]
title = "INSTALLATION, GENERAL"
items = [
  "Install insulation continuously through hangers, sleeves, and wall penetrations except at fire-rated assemblies, where insulation shall be installed as required by the firestopping system listing.",
  "Install insulation with longitudinal seams at the top of ducts where possible, with facing overlapped and taped vapor tight.",
  "Seal vapor-retarder penetrations, tears, and staple holes with vapor-retarder tape or mastic.",
  "Do not compress duct wrap more than 25 percent of its nominal thickness; installed R-value shall be based on installed thickness.",
]

[[section.part3]]
title = "DUCT WRAP INSTALLATION"
items = [
  "Secure blanket insulation with adhesive applied in strips at 8 inches on center and with mechanical fasteners at 18 inches on center on bottom surfaces of ducts wider than 24 inches.",
  "Overlap facing at circumferential joints 2 inches minimum, and seal with tape.",
]

[[section.part3]]
title = "BOARD INSULATION INSTALLATION"
items = [
  "Secure board insulation with weld pins at 12 inches on center maximum, not less than 3 inches from edges and corners.",
  "Install corner angles at exposed outside corners, and seal all joints with vapor-retarder tape.",
]

[[section.part3]]
title = "OUTDOOR INSTALLATION"
items = [
  "Install weatherproof jacket over outdoor insulation with lapped seams shedding water, sealed watertight, and slope top surfaces of rectangular ducts to drain.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL AND PROTECTION"
items = [
  "Inspect insulation before concealment. Replace damaged, wet, or improperly installed insulation.",
  "Protect installed insulation from damage and moisture until Substantial Completion.",
]

[[section]]
number = "23 31 13"
title = "METAL DUCTS"
when = ["hvac"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Single-wall rectangular and round ducts and fittings.",
  ">Sheet-metal materials and duct sealants.",
  ">Hangers and supports.",
  ">Duct accessories, including volume dampers, fire dampers, flexible ducts, and turning vanes.",
  "Coordination with Engineer of Record: Duct sizes, routing, pressure classes, and accessory locations are indicated on the mechanical Drawings prepared by the engineer of record, or, for design-build or delegated-design HVAC work, on the Contractor's engineer's sealed documents.",
  "Related Requirements:",
  ">Section 23 07 13 \"Duct Insulation\" for external duct insulation.",
  ">Section 23 37 13 \"Diffusers, Registers, and Grilles\" for air outlets and inlets.",
  ">Section 23 05 93 \"Testing, Adjusting, and Balancing for HVAC\" for balancing.",
]

[[section.part1]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "Duct Construction: Comply with SMACNA HVAC Duct Construction Standards - Metal and Flexible for the pressure classes indicated.",
  "Static-Pressure Classes: Unless otherwise indicated on the Drawings:",
  ">Supply ducts upstream of terminal units and serving systems with fan static above 2 inches wg: 3 inch wg.",
  ">Supply ducts downstream of terminal units and in constant-volume systems: 2 inch wg.",
  ">Return and exhaust ducts: 2 inch wg, negative pressure.",
  "Seal Class: SMACNA Seal Class A for all ducts, regardless of pressure class.",
  "Leakage: Comply with the leakage class required by the energy code and SMACNA HVAC Air Duct Leakage Test Manual.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For sealants, dampers, flexible duct, and accessories.",
  "Shop Drawings: Duct layouts at 1/4 inch = 1 foot scale, indicating sizes, pressure classes, fittings, reinforcement, hangers, dampers, access doors, and coordination with other trades.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Field Quality-Control Reports: Duct leakage test reports.",
  "Welding certificates, where welded ducts are required.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Comply with NFPA 90A or NFPA 90B, as applicable, and the International Mechanical Code.",
  "Comply with ASHRAE 62.1 for duct materials and cleanliness, and ASHRAE/IES 90.1 or the IECC for duct sealing and insulation.",
  "Fire and Smoke Dampers: Labeled according to UL 555 and UL 555S.",
]

[[section.part1]]
title = "DELIVERY, STORAGE, AND HANDLING"
items = [
  "Deliver ducts with ends sealed and store on raised supports under cover. Protect interior surfaces from dirt and moisture; do not install ducts with visible contamination unless cleaned.",
]

[[section.part2]]
title = "MATERIALS"
items = [
  "Galvanized Sheet Steel: ASTM A653/A653M, G90 zinc coating, lock-forming quality, mill phosphatized where exposed and scheduled to be painted.",
  "Stainless Steel: ASTM A480/A480M, Type 304, for dishwasher exhaust and other moist exhaust where indicated.",
  "Aluminum: ASTM B209, alloy 3003, H14 temper, where indicated.",
  "Grease Duct: Carbon steel, 0.054 inch minimum (16 gauge), continuously welded, complying with NFPA 96, where commercial cooking is indicated.",
  "Reinforcement and Tie Rods: Galvanized steel complying with SMACNA standards.",
]

[[section.part2]]
title = "DUCT FABRICATION"
items = [
  "Fabricate rectangular and round ducts and fittings with gauges, joints, seams, and reinforcement complying with SMACNA HVAC Duct Construction Standards for the indicated pressure class.",
  "Elbows: Rectangular elbows with centerline radius of 1.5 times duct width; where square elbows are required, provide single-thickness turning vanes.",
  "Round Ducts: Spiral lockseam or longitudinal seam, with fittings of the same material.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>McGill AirFlow LLC.",
  ">>SEMCO LLC.",
  ">>Eastern Sheet Metal (ESM).",
  "Branch Connections: 45-degree entry or conical spin-in fittings with integral volume damper.",
]

[[section.part2]]
title = "SEALANTS"
items = [
  "Joint and Seam Sealants: Water-based, UL 723 surface-burning characteristics of 25 flame spread and 50 smoke developed maximum, listed for the pressure class, with VOC content complying with applicable limits.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Hardcast; a Carlisle company.",
  ">>Design Polymerics.",
  ">>Ductmate Industries, Inc.",
  "Tape Sealing Systems: UL 181B listed where permitted.",
]

[[section.part2]]
title = "HANGERS AND SUPPORTS"
items = [
  "Hanger Straps and Rods: Galvanized steel, sized according to SMACNA tables for duct size and weight.",
  "Upper Attachments: Concrete inserts, post-installed anchors with ICC-ES reports, or beam clamps; attach to structure, not to deck or other trades' supports.",
]

[[section.part2]]
title = "DUCT ACCESSORIES"
items = [
  "Manual Volume Dampers: Galvanized steel, opposed or single blade as appropriate to duct size, with locking quadrant and extended shaft for insulated ducts.",
  ">Manufacturers: Subject to compliance with requirements, provide products by one of the following:",
  ">>Ruskin Company.",
  ">>Greenheck Fan Corporation.",
  ">>Nailor Industries Inc.",
  ">>Pottorff.",
  "Fire Dampers: UL 555, curtain type, dynamic rated where systems operate during fire, with fusible link at 165 deg F, rated 1-1/2 hours for assemblies rated less than 3 hours.",
  "Smoke and Combination Fire/Smoke Dampers: UL 555S, Leakage Class I, where indicated or required by code, with actuators coordinated with the fire-alarm system.",
  "Flexible Ducts: UL 181, Class 1, insulated, R-6 minimum, with inner core and vapor-barrier jacket; maximum length 5 feet.",
  "Duct Access Doors: Double wall, insulated, with gaskets and cam latches; size to permit service of dampers and devices.",
  "Turning Vanes: Double-wall airfoil type in ducts over 2 inch wg; single-wall elsewhere.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Verify that spaces are ready for duct installation and that clearances and structural supports are adequate.",
]

[[section.part3]]
title = "DUCT INSTALLATION"
items = [
  "Install ducts according to SMACNA HVAC Duct Construction Standards and approved Shop Drawings, with the fewest practical joints.",
  "Install ducts with a clearance of 1 inch minimum plus insulation thickness from structure and other work.",
  "Seal all joints, seams, and penetrations to meet Seal Class A.",
  "Where ducts pass through fire-rated assemblies, install fire dampers according to the damper manufacturer's UL-listed installation instructions.",
  "Install volume dampers at each branch takeoff to diffusers, registers, and grilles, located as far upstream from the outlet as practical.",
  "Connect flexible ducts to metal ducts with draw bands and sealant; support at 5 feet on center maximum, without kinks or sags exceeding 1/2 inch per foot.",
  "Protect duct openings from construction debris until the system is operational.",
]

[[section.part3]]
title = "HANGER AND SUPPORT INSTALLATION"
items = [
  "Support ducts at intervals complying with SMACNA tables, and within 24 inches of each elbow and branch intersection.",
  "Support vertical ducts at each floor with steel angles.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Leakage Testing: Test not less than 25 percent of ducts rated 3 inch wg and higher, selected by the Architect, according to SMACNA HVAC Air Duct Leakage Test Manual. Test additional sections if the initial sample fails.",
