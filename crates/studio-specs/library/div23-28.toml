kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Category 6A unshielded twisted-pair (UTP) horizontal cabling.",
  ">Telecommunications outlets, jacks, and faceplates.",
  ">Patch panels, patch cords, and cable management.",
  ">Pathways and supports specific to communications cabling.",
  ">Labeling, testing, and documentation.",
  "Coordination with Engineer of Record: Outlet locations, telecommunications room locations, and backbone requirements are indicated on the technology Drawings prepared by the engineer of record or technology consultant, or, for design-build work, by the Contractor's RCDD-supervised designer. Active network equipment is furnished by the Owner unless otherwise indicated.",
  "Related Requirements:",
  ">Section 26 05 26 \"Grounding and Bonding for Electrical Systems\" for the telecommunications bonding backbone.",
  ">Section 26 05 33 \"Raceways and Boxes for Electrical Systems\" for conduits and boxes.",
]

[[section.part1]]
title = "DEFINITIONS"
items = [
  "TR: Telecommunications room or enclosure, where horizontal cabling terminates.",
  "RCDD: Registered Communications Distribution Designer, certified by BICSI.",
  "Permanent Link: The horizontal cabling from the TR patch panel to the work-area outlet, excluding patch cords.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For cable, connectors, patch panels, faceplates, and pathways.",
  "Shop Drawings: Outlet layout, TR rack elevations, and labeling scheme.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For the installer and RCDD.",
  "Manufacturer's extended warranty certification of the installer.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Test Reports: Electronic and printed permanent-link test results for every cable, in the tester's native format.",
  "Record Drawings: Outlet locations with labels, cable routes, and TR layouts.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Installer Qualifications: Certified by the cabling system manufacturer, with installation supervised by an RCDD or BICSI-certified technician.",
  "Comply with TIA-568 (commercial building cabling), TIA-569 (pathways and spaces), TIA-606 (administration), TIA-607 (bonding and grounding), and TIA-570 for residential cabling where applicable.",
  "Comply with NFPA 70, Article 800; cables shall be listed for the space in which installed (CMP in plenum spaces, CMR in risers, CM elsewhere).",
]

[[section.part1]]
title = "WARRANTY"
items = [
  "Manufacturer's extended system performance and applications warranty: 25 years minimum, covering the complete channel from a single manufacturer's end-to-end solution.",
]

[[section.part2]]
title = "MANUFACTURERS"
items = [
  "Manufacturers: Subject to compliance with requirements, provide end-to-end system components from one of the following:",
  ">CommScope (SYSTIMAX).",
  ">Panduit Corp. (with General Cable or Belden cable partner).",
  ">Belden Inc.",
  ">Leviton Network Solutions.",
]

[[section.part2]]
title = "HORIZONTAL CABLE"
items = [
  "Cable: Category 6A UTP, four-pair, 23 AWG solid copper, complying with TIA-568.2 transmission requirements to 500 MHz.",
  "Jacket Color: Blue for data, white for voice, or as directed by the Owner; plenum-rated where installed in air-handling spaces.",
  "Wireless Access Points: Two Category 6A cables to each access-point location.",
]

[[section.part2]]
title = "CONNECTING HARDWARE"
items = [
  "Jacks: Category 6A, eight-position modular, T568B wiring unless the Owner directs T568A.",
  "Faceplates: High-impact thermoplastic matching wiring-device color, with labels; stainless steel where indicated.",
  "Patch Panels: 24- or 48-port, Category 6A, 19 inch rack mounted, with rear cable management.",
  "Patch Cords: Factory-terminated Category 6A, provided for 100 percent of installed ports in lengths directed by the Owner.",
]

[[section.part2]]
title = "RACKS AND CABLE MANAGEMENT"
items = [
  "Equipment Racks: Two-post, 19 inch, 84 inches high, aluminum or steel, bolted to floor and braced to wall; or wall-mounted enclosures where indicated.",
  "Cable Management: Horizontal and vertical managers with bend-radius control; ladder rack above racks.",
  "Plywood Backboards: 3/4 inch fire-retardant-treated plywood, painted with two coats of fire-retardant paint, leaving the stamp visible.",
]

[[section.part2]]
title = "PATHWAYS"
items = [
  "J-Hooks: Listed, with 1-5/16 inch minimum bearing surface, spaced 48 to 60 inches on center.",
  "Cable Tray: Wire-mesh basket tray where indicated in corridors.",
  "Sleeves: Conduit sleeves with bushings and firestop at rated walls.",
]

[[section.part3]]
title = "EXAMINATION"
items = [
  "Verify pathways, boxes, and backboards are complete, and that the TR is clean and dry, before installing cable.",
]

[[section.part3]]
title = "INSTALLATION"
items = [
  "Install cabling according to TIA-568, BICSI TDMM, and manufacturer's written instructions.",
  "Limit horizontal cable length to 295 feet (90 m) permanent link.",
  "Do not exceed 25 lbf pulling tension or bend radius less than four times cable diameter; do not kink or crush cable.",
  "Maintain separation from power sources: 5 inches from fluorescent or LED drivers and 12 inches from motors and transformers.",
  "Support cabling from structure with J-hooks or tray; do not attach to ceiling grid, support wires, piping, or ductwork.",
  "Use hook-and-loop straps; do not use nylon cable ties on bundled cables.",
  "Leave a service loop of 10 feet in the TR and 12 inches at the outlet.",
  "Firestop all penetrations of rated assemblies with listed systems.",
]

[[section.part3]]
title = "IDENTIFICATION"
items = [
  "Label cables at both ends, faceplates, and patch panel ports with machine-printed labels according to TIA-606, using a scheme approved by the Owner.",
]

[[section.part3]]
title = "FIELD QUALITY CONTROL"
items = [
  "Test each permanent link with a Level IIIe or higher field tester according to TIA-568.2, for wire map, length, insertion loss, NEXT, PSNEXT, ACR-F, return loss, and delay skew.",
  "Replace cables that fail and retest; marginal passes are not acceptable.",
]

[[section]]
number = "28 46 21.11"
title = "ADDRESSABLE FIRE-ALARM SYSTEMS"
when = ["fire_alarm"]
kind = "three-part"

[[section.part1]]
title = "SUMMARY"
items = [
  "Section Includes:",
  ">Addressable fire-alarm control unit (FACU) and annunciators.",
  ">Initiating devices, including manual pull stations, smoke detectors, heat detectors, and duct smoke detectors.",
  ">Notification appliances, including horns, strobes, speakers, and combination units.",
  ">Monitoring and control modules for sprinkler, elevator, HVAC, and door-release interfaces.",
  ">Digital alarm communicator transmitter for off-site monitoring.",
  "Coordination with Engineer of Record and Delegated Design: The fire-alarm system is a delegated design. The Drawings, where prepared by the engineer of record, indicate performance intent, device locations where required for coordination, and interfaces. The Contractor shall engage a qualified fire-alarm designer to prepare complete system design documents, calculations, and shop drawings complying with NFPA 72, the {building_code}, and the International Fire Code as adopted by {jurisdiction}, for approval by the Architect, engineer of record, and authority having jurisdiction.",
  "Related Requirements:",
  ">Section 21 13 13 \"Wet-Pipe Sprinkler Systems\" for sprinkler flow and tamper switches.",
  ">Section 08 71 00 \"Door Hardware\" for magnetic hold-open and access control interfaces.",
  ">Section 23 31 13 \"Metal Ducts\" for smoke dampers.",
]

[[section.part1]]
title = "PERFORMANCE REQUIREMENTS"
items = [
  "System: Addressable, analog, with Class B initiating device circuits and signaling line circuits unless Class A is required by the authority having jurisdiction or indicated.",
  "Notification: Audible and visible notification throughout, complying with NFPA 72 and ICC A117.1; voice evacuation where required by the {building_code} for the occupancy.",
  "Survivability: Pathway survivability as required by NFPA 72 for the system type.",
  "Secondary Power: Batteries sized for 24 hours of standby followed by 5 minutes of alarm (15 minutes for voice evacuation), plus 20 percent spare capacity.",
  "Spare Capacity: 20 percent spare addressable points on each signaling line circuit and 20 percent spare notification appliance circuit capacity.",
]

[[section.part1]]
title = "ACTION SUBMITTALS"
items = [
  "Product Data: For each device and component, with listing information.",
  "Shop Drawings: Complete system design prepared by the fire-alarm designer, including floor plans with device locations, riser diagrams, wiring diagrams, sequence of operations matrix, battery and voltage-drop calculations, and candela ratings, sealed where required by the jurisdiction.",
  "Approval: Submit Shop Drawings to the authority having jurisdiction and obtain approval before installation.",
]

[[section.part1]]
title = "INFORMATIONAL SUBMITTALS"
items = [
  "Qualification Data: For the designer and installer.",
  "Record of Completion: NFPA 72 Record of Completion form, completed and signed.",
]

[[section.part1]]
title = "CLOSEOUT SUBMITTALS"
items = [
  "Operation and Maintenance Data: Including programming, device address list, and inspection, testing, and maintenance requirements of NFPA 72.",
  "Record Drawings: As-built device locations and addresses, in electronic format and one set in a document cabinet at the FACU.",
  "Software: Site-specific program on electronic media, and passwords delivered to the Owner.",
]

[[section.part1]]
title = "QUALITY ASSURANCE"
items = [
  "Designer Qualifications: NICET Level III or IV in Fire Alarm Systems, or a professional engineer licensed in the state of the Project experienced in fire-alarm design.",
  "Installer Qualifications: Authorized distributor of the equipment manufacturer, licensed in the jurisdiction, with a NICET Level II minimum technician on site.",
  "Components shall be listed according to UL 864 (control units) and the applicable UL standards for devices, and compatible as a system.",
