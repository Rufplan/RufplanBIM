  "Sound Rating: Class A.",
]

[[section.part2]]
title = "EMERGENCY LIGHTING"
items = [
  "Emergency Battery Units: Integral or remote, UL 924 listed, providing 90 minutes of illumination on loss of normal power, with self-testing and diagnostic indicator.",
  "Emergency Lighting Performance: Provide illumination along the means of egress complying with NFPA 101 and the {building_code}, average 1 footcandle initially.",
