name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: write sample IFC
        run: cargo test -p rufplan-studio write_sample_ifc -- --ignored

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: validate IFC with IfcOpenShell
        run: |
          pip install ifcopenshell
          python tools/validate_ifc.py target/sample-model.ifc

      - name: TypeScript bindings are up to date
        shell: bash
        run: git diff --exit-code -- app/src/bindings || (echo "::error::Run cargo test and commit app/src/bindings" && exit 1)

      - name: npm ci
        working-directory: app
        run: npm ci

      - name: lint and format
        working-directory: app
        run: |
          npm run lint
          npm run format:check

      - name: npm test
        working-directory: app
        run: npm test

      - name: tauri build
        working-directory: app
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: rufplan-studio-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
